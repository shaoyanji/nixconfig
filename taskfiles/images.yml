version: "3"

vars:
  # Originals live on the pool, never in the repo: an accepted plate is a 1.5 MB
  # PNG and a day of them is not a commit. `published/` is the accumulated tree
  # that gets deployed, so a gallery keeps its history instead of being replaced
  # by today's folder.
  IMAGES_ROOT: /Volumes/data/pics/generated
  # Assets are uploaded to Cloudinary, whose delivery URL carries the resize, so
  # there is no project to deploy and no gallery to keep in sync. The manifest of
  # path to delivery URL is published/urls.tsv.
  # Where the discretionary leftover goes. The printer is idempotent and stops
  # when the book has no spread left, so pointing it at a finished book is free.
  STORYBOOK_DIR: /Volumes/data/projects/storybook/lantern

tasks:
  images:plan:
    desc: What the image queue would spend today, lane by lane, and the leftover
    summary: >
      Reads the brief bank (`lib/image-daily/briefs.json`), the ledger at
      `{{.IMAGES_ROOT}}/ledger.jsonl` and `cpg usage`, and prints what is due.
      Spends nothing, needs no agent, and answers the one question a person asks
      before trusting a nightly job: is it going to do anything tonight.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh plan

  images:run:
    desc: Generate the due briefs, judge each with agy, and publish what the judge kept
    summary: >
      Spends the allowance in lane order (site, wall, blog, fleet), one plate per
      brief, each judged by `agy`; a named defect buys one re-roll and an unjudged
      plate never publishes. Leftover stays unspent unless `STORYBOOK=1`.

      Idempotent per pass: the same slot exits 0 unless FORCE=1. Env: `DRY=1` plans,
      `LANES="wall"` narrows, `CAP=<n>` caps this pass, `SLOT=<n>` gives it its own
      day marker, `PUBLISH=0` skips the deploy.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} STORYBOOK_DIR={{.STORYBOOK_DIR}} bash scripts/task/image-daily.sh run

  images:plates:
    desc: A requested round of photoreal character plates from the standing roster
    summary: >
      The go-to spend for "more wallpapers": `lib/image-daily/plates.txt` lists
      `<slug>|<prompt>|<expect>` rows, judged against `.intents.photoreal`. A kept
      row is skipped, so a resumed round costs nothing, and the four
      `image-daily-slot-*` timers spend the roster after the lane queue, so nobody
      starts or watches one.

      `DETACH=1` hands the whole round to a user unit and returns its JSON, which is
      what `images:queue` does; this task otherwise blocks for the length of the
      round. Env: `ONLY=`, `MAX_GEN=`, `FORCE=1`, `DRY=1`, `PUBLISH=0`,
      `APPROVE=0`, `XS_SUMMARY=0`.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} ONLY="{{if .ONLY}}{{.ONLY}}{{end}}" MAX_GEN="{{if .MAX_GEN}}{{.MAX_GEN}}{{end}}" bash scripts/task/image-daily.sh plates

  images:gen:
    desc: One image from a prompt — JSON with the Cloudinary delivery URL, optionally detached
    summary: >
      A prompt in, one JSON object out (`{id,url,…}`; `.url` is the delivery
      URL). The render is uploaded as `assets/wall/<day>/<slug>` first, because
      the CLI's URL is session-gated; `UPLOAD=0` keeps a throwaway local and
      returns `.session_url`. A failed upload is reported, not fatal — the next
      publish sends it. Auth refreshes once after a 401; a 429 waits the window.
      `DETACH=1` runs under `systemd-run --user` and prints `{unit,log,path}`;
      `OUT=` overrides `{{.IMAGES_ROOT}}/src/wall/<today>/`. Banked is not
      served: `images:ship` does both, `images:add` registers a rendered file.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} PROMPT="{{.PROMPT}}" OUT="{{if .OUT}}{{.OUT}}{{end}}" SIZE="{{if .SIZE}}{{.SIZE}}{{else}}1536x1024{{end}}" DETACH="{{if .DETACH}}{{.DETACH}}{{end}}" bash scripts/task/image-gen.sh

  images:ship:
    desc: One prompt all the way to the gallery — generate, upload, manifest, deploy, verify
    summary: >
      The ad-hoc path as one command: renders with `images:gen`, writes the
      `published/urls.tsv` row, rebuilds `manifest.json`, deploys the Pages
      frontend, then polls the live manifest and prints `served: true` only
      when the gallery actually carries the asset — what used to be
      `images:gen` plus a separate `images:adopt` to remember. `DETACH=1`
      hands it to a user unit; `PAGES=0` stops after the local rebuild.
      `SIZE=` and `OUT=` pass through to the generator.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} PROMPT="{{.PROMPT}}" OUT="{{if .OUT}}{{.OUT}}{{end}}" SIZE="{{if .SIZE}}{{.SIZE}}{{else}}1536x1024{{end}}" DETACH="{{if .DETACH}}{{.DETACH}}{{end}}" PAGES="{{if .PAGES}}{{.PAGES}}{{end}}" bash scripts/task/image-ship.sh

  images:add:
    desc: Put one local file into the gallery — manifest row, manifest rebuild, deploy
    summary: >
      The step `images:gen` deliberately does not take: `FILE=` names a PNG
      under `{{.IMAGES_ROOT}}/src/` or `published/` (anything else registers
      as `wall/<today>/<name>`), it is staged and uploaded unless `URL=` names
      the upload already done, then the manifest is rebuilt and deployed.
      Idempotent; `PAGES=0` writes the row and manifest without deploying.
      For uploads nobody wrote a row for, `images:adopt` sweeps the account.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh add "{{.FILE}}" "{{if .URL}}{{.URL}}{{end}}"

  images:gen:batch:
    desc: A file of prompts, one image each, uploaded, JSON lines appended to an index
    summary: >
      The batch form of `images:gen`: `PROMPTS=` names a file with one prompt per
      line (`#` skips), and each render is written to `OUTDIR=` (default
      `{{.IMAGES_ROOT}}/src/wall/<today>`) as `NNN-<slug>.png`, uploaded to
      Cloudinary, and described by one JSON line appended to `OUTDIR/index.jsonl`. A
      failing prompt is reported and skipped, so one bad row does not end the file.
      Detach the whole file with `DETACH=1` through `images:gen` when it should
      outlive the shell, or use `images:queue` for a roster round.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} PROMPTS="{{.PROMPTS}}" OUTDIR="{{if .OUTDIR}}{{.OUTDIR}}{{end}}" SIZE="{{if .SIZE}}{{.SIZE}}{{else}}1536x1024{{end}}" bash scripts/task/image-gen.sh --batch

  images:round:
    desc: "[menu] Round picker (gum) — take the next rows, pick characters, add a custom one"
    summary: >
      The roster's front door: it reads the allowance and the rows the judge has
      not kept, then spends them through the same `image-daily.sh plates` the
      nightly slots run. Nothing to remember — no roster path, no ledger, no
      publish step — and the round publishes once and posts its own xs turn when
      it ends.

      Three ways in: the next N rows in roster order, a hand-picked set (space to
      select), or a custom character, whose row is appended to
      `lib/image-daily/plates.txt` and left for you to commit. `ONLY=a,b` with no
      menu is the scripted form.
    interactive: true
    cmds:
      - ONLY="{{if .ONLY}}{{.ONLY}}{{end}}" MAX_GEN="{{if .MAX_GEN}}{{.MAX_GEN}}{{end}}" bash scripts/task/image-round.sh

  images:status:
    desc: "[gate] per-lane freshness from the ledger — exit 1 when a lane is stale"
    summary: >
      Answers whether the queue is keeping its promise, not whether a timer fired.
      A lane is stale when its newest accepted asset is older than the lane's
      `max_age_days`, or when it has never produced one. Exit 0 = fresh, 1 = stale
      (or no ledger yet), so a sentinel can page on it without reading prose.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh status

  images:today:
    desc: Today's allowance, what share the next slot takes, and how many roster rows wait
    summary: >
      The readout before asking for "more wallpapers": how much of the day is
      left, what share the next `image-daily-slot-*` timer will take (the same
      `share` arithmetic the slot wrapper runs, so the two cannot disagree), and
      how many roster rows the judge has not kept yet. Read-only — it asks the
      pool and the user timer table, and spends nothing.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh today

  images:judge:
    desc: Judge one image file with agy and print the verdict JSON
    summary: >
      The same judge the nightly run uses, on one file — for checking a prompt
      before it goes into the bank. Prints `{verdict, reason, defect, tags}`;
      `unjudged` means agy failed, which is not a rejection.
    cmds:
      - bash scripts/task/image-daily.sh judge {{.FILE}} {{.LANE}}

  images:blog:
    desc: Print the Chirpy front matter for each published banner (DIR=… also copies the JPEGs)
    summary: >
      The blog lane's consumer is the Chirpy checkout, not a gallery. Each banner
      is a 1200x630 JPEG under `{{.IMAGES_ROOT}}/published/blog/`, and ffmpeg makes
      that crop locally, so it costs no image. Prints the `image:` block Chirpy
      reads for the hero and og:image, pointing at the Cloudinary delivery URL the
      publish step recorded in `published/urls.tsv`.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh blog {{if .DIR}}--dir "{{.DIR}}"{{end}}

  images:publish:
    desc: Stage kept assets, upload them to Cloudinary, and rebuild the manifest from the account
    summary: >
      Copies every accepted `site`/`wall`/`blog` plate into
      `{{.IMAGES_ROOT}}/published/`, uploads each to Cloudinary, writes
      `published/urls.tsv` and rebuilds `manifest.json` for the Cloudflare Pages
      gallery (GitHub Pages is the docs site). The resize is in the URL:
      one upload serves card, thumbnail and retina hero.

      The bank is the account, not the disk: publish takes the served manifest
      as its prior and adds a row for every `assets/*` upload that has none, so
      a host holding a slice cannot lose the rest. `DRY=1` counts,
      `FORCE=1` skips both merges for a deliberate purge, `REUPLOAD=1` re-sends.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} REUPLOAD="{{if .REUPLOAD}}{{.REUPLOAD}}{{end}}" FORCE="{{if .FORCE}}{{.FORCE}}{{end}}" DRY="{{if .DRY}}{{.DRY}}{{end}}" bash scripts/task/images-publish.sh

  images:adopt:
    desc: Sweep the Cloudinary account for uploads with no manifest row, then rebuild and deploy
    summary: >
      The reconciliation sweep for uploads no local row names (a render from
      another host, a hand-run batch) — `images:add` covers one file you can
      name without listing the account. Reads the account and writes a row for
      every `assets/{wall,site,blog,fleet}` id `published/urls.tsv` does not
      name; `assets/repos/*` stays out of the gallery. Existing rows are never
      rewritten. Idempotent; `DRY=1` counts without writing or deploying.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} DRY="{{if .DRY}}{{.DRY}}{{end}}"{{if .PAGES}} PAGES="{{.PAGES}}"{{end}} bash scripts/task/image-daily.sh adopt

  images:queue:
    desc: Start a plate round as a background unit and print where it is running
    summary: >
      A plate costs about a minute and a closed burst window can add a quarter of an
      hour, so a round is not something to sit on. This runs the same
      `image-daily.sh plates` the slot timers run inside a `systemd-run --user` unit
      that outlives the shell, and prints `{state,unit,pending,left}`. Run it again
      and it reports the round already running instead of starting a second one;
      rows that already have a kept plate are skipped, so a stopped round resumes
      for free and a second round costs nothing. Env: `ROSTER=`, `ONLY=`,
      `MAX_GEN=`, `SIZE=`.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} ROSTER="{{if .ROSTER}}{{.ROSTER}}{{end}}" ONLY="{{if .ONLY}}{{.ONLY}}{{end}}" MAX_GEN="{{if .MAX_GEN}}{{.MAX_GEN}}{{end}}" SIZE="{{if .SIZE}}{{.SIZE}}{{else}}1536x1024{{end}}" bash scripts/task/image-daily.sh round

  images:queue:status:
    desc: Whether a round is running, its last journal lines, and how many rows still wait
    summary: >
      The only thing to poll after `images:queue`: the unit's state, the last six
      lines it wrote, how many roster rows have no kept plate yet and how much of
      the day's allowance is left. Read-only, spends nothing, exits 0 whatever it
      finds so it can be read in a loop.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} ROSTER="{{if .ROSTER}}{{.ROSTER}}{{end}}" bash scripts/task/image-daily.sh round status

  images:variants:
    desc: List the superseded renders kept under variants/, and put one back
    summary: >
      A re-render overwrites the plate it replaced, and the operator may prefer the
      earlier one. Every overwrite copies the file it is about to lose to
      `{{.IMAGES_ROOT}}/variants/<lane>/<day>/<slug>.<stamp>.png`, so the choice is
      between two files on disk.

      With no `VARIANT` this lists them. `VARIANT=<a path from that list>` puts one
      back over the gallery plate, archives the plate it replaces, drops the
      manifest row and republishes, because publish treats a carried row as already
      served. Run it again on the other file to flip the choice back. `PUBLISH=0`
      stops before the upload and the deploy.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} VARIANT="{{if .VARIANT}}{{.VARIANT}}{{end}}" bash scripts/task/image-daily.sh variants

  images:post:
    desc: One motion from a title to a post with its banner already on Cloudinary
    summary: >
      Generates a banner, has `agy` judge it (one defect buys one re-roll), crops
      1200x630, uploads it as `assets/blog/<slug>` and adds it to the manifest, then
      writes `_posts/<day>-<slug>.md` with that URL in `image:`. The banner exists
      before the file does, so a post cannot carry a hero that 404s. `SLUG=` and
      `TITLE=` are required; `DRAFT=1` promotes an existing `_posts/*-<slug>.md` —
      body, description, toc flags — removes the draft and lands both in one commit;
      `PUSH=1` pushes and `FORCE=1` rewrites an existing post.
    cmds:
      - SLUG="{{.SLUG}}"{{if .DRAFT}} DRAFT="{{.DRAFT}}"{{end}} TITLE="{{.TITLE}}" PROMPT="{{if .PROMPT}}{{.PROMPT}}{{end}}" TAGS="{{if .TAGS}}{{.TAGS}}{{end}}" PUSH="{{if .PUSH}}{{.PUSH}}{{end}}" IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh post

  images:gc:
    desc: Destroy Cloudinary public ids that nothing references (orphans of old conventions)
    summary: >
      Cloudinary keeps every upload forever, so a superseded convention leaves an id
      nothing serves that every listing still shows. The references are the manifest
      and the blog checkout; everything under `GC_PREFIX` that neither names is
      destroyed, and `DRY=1` prints the list instead.
    cmds:
      - GC_PREFIX="{{if .GC_PREFIX}}{{.GC_PREFIX}}{{end}}" IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh gc

  images:approve:
    desc: Put a day's kept plates into the wallpaper rotation, newest first
    summary: >
      The judgement is the keep, so approval is the one step between a plate and
      a wallpaper. Idempotent: an id already listed is skipped, an id rejected in
      `wall.out` stays rejected, and a plate whose file is gone is skipped rather
      than added to break `images:wallpaper` later. `DAY=2026-11-18` picks another
      day, `DRY=1` prints what would be added. A round approves its own keeps, so
      the nightly slots keep the rotation current unless `APPROVE=0`.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} DAY="{{if .DAY}}{{.DAY}}{{end}}" DRY="{{if .DRY}}{{.DRY}}{{end}}" bash scripts/task/image-daily.sh approve

  images:wallpaper:
    desc: Set the first in-rotation wallpaper with swaybg (a dwl session's rotation)
    summary: >
      Picks the first plate approved in `lib/image-daily/rotation.json` — the list
      is priority, not freshness, so the head of it is what the screen shows —
      skipping everything that file rejects, restarts swaybg on it, and prints the
      file name. `DRY=1` prints the path instead, which is how a config can ask
      what it would use. A `taste/<day>/<name>.png` id reads the palette-test
      folder beside the bank.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh wallpaper

  images:rotation:
    desc: Show the wallpapers in rotation and the rejected ones, with reasons
    summary: >
      Reads `lib/image-daily/rotation.json`. `in` is approval and priority:
      `images:wallpaper` installs the first id named there. `out` is a rejection
      and wins over `in`, carrying the reason it was rejected. A plate in neither
      list is unjudged — not rejected, just not in rotation yet.
    cmds:
      - >-
        jq -r '"in rotation:", (.wall.in[] | "  " + .), "", "out of rotation:", (.wall.out | to_entries[] | "  " + .key + "  -  " + .value)' lib/image-daily/rotation.json
