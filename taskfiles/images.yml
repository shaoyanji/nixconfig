version: "3"

vars:
  # Originals live on the pool, never in the repo: an accepted plate is a 1.5 MB
  # PNG and a day of them is not a commit. `published/` is the accumulated tree
  # that gets deployed, so a gallery keeps its history instead of being replaced
  # by today's folder.
  IMAGES_ROOT: /Volumes/data/pics/generated
  # Assets are uploaded to Cloudinary, whose delivery URL carries the resize, so
  # there is no project to deploy and no gallery to keep in sync. The manifest of
  # path to delivery URL is published/urls.tsv.
  # Where the discretionary leftover goes. The printer is idempotent and stops
  # when the book has no spread left, so pointing it at a finished book is free.
  STORYBOOK_DIR: /Volumes/data/projects/storybook/lantern

tasks:
  images:plan:
    desc: What the image queue would spend today, lane by lane, and the leftover
    summary: >
      Reads the brief bank (`lib/image-daily/briefs.json`), the ledger at
      `{{.IMAGES_ROOT}}/ledger.jsonl` and `cpg usage`, and prints what is due.
      Spends nothing, needs no agent, and answers the one question a person asks
      before trusting a nightly job: is it going to do anything tonight.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh plan

  images:run:
    desc: Generate the due briefs, judge each with agy, and publish what the judge kept
    summary: >
      The nightly entry point: spends the allowance in lane order (site, wall,
      blog, fleet), one plate per brief, each judged by `agy`. A named defect
      buys one re-roll; an unjudged plate stays on disk and never publishes.
      Leftover stays unspent unless `STORYBOOK=1`, since uniform spreads were the
      same style on every page.

      Idempotent per day: a second run exits 0 unless FORCE=1. Env: `DRY=1` plans
      without spending, `LANES="wall"` narrows, `CAP=<n>` caps the total,
      `PUBLISH=0` skips the deploy.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} STORYBOOK_DIR={{.STORYBOOK_DIR}} bash scripts/task/image-daily.sh run

  images:status:
    desc: "[gate] per-lane freshness from the ledger — exit 1 when a lane is stale"
    summary: >
      Answers whether the queue is keeping its promise, not whether a timer fired.
      A lane is stale when its newest accepted asset is older than the lane's
      `max_age_days`, or when it has never produced one. Exit 0 = fresh, 1 = stale
      (or no ledger yet), so a sentinel can page on it without reading prose.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh status

  images:judge:
    desc: Judge one image file with agy and print the verdict JSON
    summary: >
      The same judge the nightly run uses, on one file — for checking a prompt
      before it goes into the bank. Prints `{verdict, reason, defect, tags}`;
      `unjudged` means agy failed, which is not a rejection.
    cmds:
      - bash scripts/task/image-daily.sh judge {{.FILE}} {{.LANE}}

  images:blog:
    desc: Print the Chirpy front matter for each published banner (DIR=… also copies the JPEGs)
    summary: >
      The blog lane's consumer is the Chirpy checkout, not a gallery. Each banner
      is a 1200x630 JPEG under `{{.IMAGES_ROOT}}/published/blog/`, and ffmpeg makes
      that crop locally, so it costs no image. Prints the `image:` block Chirpy
      reads for the hero and og:image, pointing at the Cloudinary delivery URL the
      publish step recorded in `published/urls.tsv`.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh blog {{if .DIR}}--dir "{{.DIR}}"{{end}}

  images:publish:
    desc: Stage kept assets and upload them to Cloudinary, recording delivery URLs
    summary: >
      Copies every accepted `site`, `wall` and `blog` plate out of the ledger into
      `{{.IMAGES_ROOT}}/published/`, uploads each to Cloudinary and writes
      `published/urls.tsv`, the manifest of path to delivery URL, and rebuilds
      `manifest.json` for the search frontend that Pages serves. The resize is in the
      URL, so one upload serves the card, the thumbnail and the retina hero, and the
      deploy carries no images at all. Re-running re-uploads; a versioned URL is
      immutable.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh publish

  images:wallpaper:
    desc: Set the newest accepted wallpaper with swaybg (a dwl session's rotation)
    summary: >
      Picks the newest accepted plate under `published/wall` (falling back to the
      originals), restarts swaybg on it, and prints the file name. `DRY=1` prints
      the path instead, which is how a config can ask what it would use.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh wallpaper
