version: "3"

vars:
  BURGERNAS_ALIAS: "burgernas"
  BURGERNAS_IP: "192.168.3.92"
  BURGERNAS_MAC: "90:09:D0:06:C1:EE"
  BURGERNAS_RESTIC_REPO: "sftp:devji@192.168.3.92:/volume1/backup/frieren/restic"
  BURGERNAS_TX_SETTINGS: "/volume1/@appdata/transmission/settings.json"
  # The fleet's aarch64 builder. `ssh delphi` is a host-local alias; this name
  # resolves from every host, which is what the toolbox tasks need.
  DELPHI_SSH: "delphi.bountystash.com"

tasks:
  burgernas:ssh:
    desc: Open an interactive SSH shell on BurgerNAS (DS220j cold vault)
    cmds:
      - ssh {{.BURGERNAS_ALIAS}}

  burgernas:exec:
    desc: Run a command on BurgerNAS over SSH (agent-friendly)
    cmds:
      - ssh {{.BURGERNAS_ALIAS}} -- {{.CLI_ARGS}}

  burgernas:push:
    desc: Copy a local file/folder to BurgerNAS (defaults to home tmp)
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=$(echo "$ARGS" | awk '{print $1}')
        DEST=$(echo "$ARGS" | awk '{print $2}')
        [ -n "$SRC" ] || { echo "Usage: task burgernas:push -- <local> [remote_dest]"; exit 1; }
        [ -n "$DEST" ] || DEST="tmp/"
        scp -r "$SRC" "{{.BURGERNAS_ALIAS}}:$DEST"

  burgernas:pull:
    desc: Copy a remote file/folder from BurgerNAS to local (defaults to .)
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=$(echo "$ARGS" | awk '{print $1}')
        DEST=$(echo "$ARGS" | awk '{print $2}')
        [ -n "$SRC" ] || { echo "Usage: task burgernas:pull -- <remote> [local_dest]"; exit 1; }
        [ -n "$DEST" ] || DEST="."
        scp -r "{{.BURGERNAS_ALIAS}}:$SRC" "$DEST"

  burgernas:wol:
    desc: Wake BurgerNAS via Wake-on-LAN (magic packet to its eth0 MAC)
    cmds:
      - wakeonlan -i 192.168.3.255 {{.BURGERNAS_MAC}} || wakeonlan {{.BURGERNAS_MAC}}

  burgernas:online:
    desc: Wait for BurgerNAS SSH to come up after a WoL wake (timeout 120s)
    cmds:
      - |
        for i in $(seq 1 60); do
          if timeout 2 bash -c 'cat < /dev/null > /dev/tcp/{{.BURGERNAS_IP}}/22' 2>/dev/null; then
            echo "BurgerNAS SSH up after $((i * 2))s"; exit 0
          fi
          sleep 2
        done
        echo "ERROR: BurgerNAS did not come online within 120s" >&2; exit 1

  burgernas:poweroff:
    desc: Cleanly power off BurgerNAS (via synopoweroff)
    cmds:
      - |
        ssh {{.BURGERNAS_ALIAS}} 'sudo /usr/syno/sbin/synopoweroff || sudo /sbin/poweroff'

  burgernas:status:
    desc: BurgerNAS health — system, memory, storage, WoL and Transmission
    cmds:
      - |
        echo "=== System ==="
        ssh {{.BURGERNAS_ALIAS}} 'uname -a; uptime'
        echo; echo "=== Memory / Swap ==="
        ssh {{.BURGERNAS_ALIAS}} 'free -m'
        echo; echo "=== Storage (/volume1) ==="
        ssh {{.BURGERNAS_ALIAS}} 'df -h /volume1'
        echo; echo "=== Wake-on-LAN ==="
        ssh {{.BURGERNAS_ALIAS}} 'sudo -n /bin/ethtool eth0 | grep -i wake'
        echo; echo "=== Transmission ==="
        ssh {{.BURGERNAS_ALIAS}} 'sudo -n /bin/systemctl is-active pkgctl-transmission.service'

  burgernas:info:
    desc: BurgerNAS DSM build, shared folders and the restic repo target
    cmds:
      - |
        echo "=== DSM ==="
        ssh {{.BURGERNAS_ALIAS}} 'head -6 /etc/VERSION'
        echo; echo "=== Shared folders ==="
        ssh {{.BURGERNAS_ALIAS}} 'ls /volume1'
        echo; echo "=== restic repo ==="
        ssh {{.BURGERNAS_ALIAS}} 'ls -la /volume1/backup/frieren/restic'

  burgernas:transmission:status:
    desc: Show BurgerNAS Transmission state and the leech-only settings keys
    cmds:
      - |
        ssh {{.BURGERNAS_ALIAS}} 'echo unit=$(sudo -n /bin/systemctl is-active pkgctl-transmission.service)'
        ssh {{.BURGERNAS_ALIAS}} 'grep -E "\"(ratio-limit|ratio-limit-enabled|idle-seeding-limit|speed-limit-up|upload-slots-per-torrent|dht-enabled|pex-enabled|lpd-enabled|port-forwarding-enabled|encryption)\"" {{.BURGERNAS_TX_SETTINGS}}'

  burgernas:transmission:leech:
    desc: Apply the shared leech-only Transmission policy (needs the /run/secrets/nas credential)
    cmds:
      - bash scripts/task/burgernas-transmission-leech.sh

  burgernas:backup:seed:
    desc: "[frieren root] Wake BurgerNAS and run the restic seed via the systemd unit"
    cmds:
      - |
        sudo systemctl start restic-backups-frieren-burgernas.service
        echo "Started. Tail with: sudo journalctl -u restic-backups-frieren-burgernas.service -f"

  burgernas:snapshot:
    desc: "[frieren root] List snapshots in the BurgerNAS restic repository"
    cmds:
      - |
        sudo RESTIC_PASSWORD_FILE=/run/secrets/restic-password restic \
          -r {{.BURGERNAS_RESTIC_REPO}} \
          -o sftp.command="ssh {{.BURGERNAS_ALIAS}} /usr/local/bin/sftp-server" \
          snapshots

  burgernas:bin:lock:
    desc: Resolve the aarch64 static toolbox on delphi (farm.sh lock)
    summary: >
      tools/bin-farm is content-addressed: farm.toml names the tools, `farm.sh lock`
      resolves each into a local store keyed by sha256, and farm.lock.json is the
      record of what was resolved. It runs on delphi because the nixpkgs provider
      needs a native aarch64 builder, and the NAS has 512 MiB and cannot compile
      anything. Runtime state (store, lock, downloads) lives in
      ~/.local/share/bin-farm there, so a reboot does not re-download.
    cmds:
      - |
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'mkdir -p ~/.local/share/bin-farm'
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'cat > ~/.local/share/bin-farm/farm.toml' < tools/bin-farm/farm.toml
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'cat > ~/.local/share/bin-farm/farm.sh' < tools/bin-farm/farm.sh
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'chmod +x ~/.local/share/bin-farm/farm.sh && ~/.local/share/bin-farm/farm.sh lock'

  burgernas:bin:deploy:
    desc: Push the resolved toolbox to BurgerNAS and verify every file on arrival
    summary: >
      Each upload is followed by sha256sum on the receiver and discarded if it does
      not match the lock; a real file where a farm symlink belongs is refused, never
      overwritten. Lands in /volume1/Shared Library/toolbox (bin/<name> ->
      store/<sha256>/<name>) because /volume1 itself is root-owned on DSM.
    cmds:
      - ssh -o BatchMode=yes {{.DELPHI_SSH}} '~/.local/share/bin-farm/farm.sh deploy burgernas'

  burgernas:bin:eget:
    desc: Update the flat aarch64 tool dir from GitHub releases (runs on delphi)
    summary: >
      tools/eget.nix is the list — one row per project, rendered to a TOML here
      so nothing has to be kept in sync by hand. It runs on delphi because eget
      follows the running system (`--system linux/arm64` on an x86 host is
      ignored, measured), then pushes the result to the copy the NAS shell reads.
    cmds:
      - |
        nix eval --raw --impure --expr '(import {{.ROOT_DIR}}/tools/eget.nix).aarch64' > /tmp/eget-aarch64.toml
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'mkdir -p ~/.local/share/bin-aarch64'
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'cat > ~/.local/share/bin-aarch64/eget.toml' < /tmp/eget-aarch64.toml
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'cd ~/.local/share/bin-aarch64 && EGET_CONFIG=$PWD/eget.toml EGET_GITHUB_TOKEN=$(gh auth token 2>/dev/null) nix run nixpkgs#eget -- --download-all --to $PWD'
        ssh -o BatchMode=yes {{.DELPHI_SSH}} 'rsync -az --rsync-path=/usr/bin/rsync --exclude "eget.toml" -e "ssh -o BatchMode=yes" ~/.local/share/bin-aarch64/ burgernas:"/volume1/peachcable/bin-aarch64/"'

  burgernas:bin:eget:x86:
    desc: Update the flat x86_64 tool dir from GitHub releases (run from frieren)
    summary: >
      The x86 twin, for /srv/data/bin-x86. Run it on an x86_64 host for the same
      reason: eget 1.3.4 picks assets for the machine it is on.
    cmds:
      - |
        nix eval --raw --impure --expr '(import {{.ROOT_DIR}}/tools/eget.nix).amd64' > /tmp/eget-amd64.toml
        mkdir -p /srv/data/bin-x86
        EGET_CONFIG=/tmp/eget-amd64.toml EGET_GITHUB_TOKEN=$(gh auth token 2>/dev/null) \
          nix run nixpkgs#eget -- --download-all --to /srv/data/bin-x86

  burgernas:bin:eget:appimages:
    desc: Update the AppImage dir from GitHub releases (run from frieren)
    summary: >
      Same table, rows whose `dirs` include "appimages": one file per asset, no
      archive, and the arch in the asset name comes from the running host.
    cmds:
      - |
        nix eval --raw --impure --expr '(import {{.ROOT_DIR}}/tools/eget.nix).appimages' > /tmp/eget-appimages.toml
        mkdir -p /srv/data/appimages
        EGET_CONFIG=/tmp/eget-appimages.toml EGET_GITHUB_TOKEN=$(gh auth token 2>/dev/null) \
          nix run nixpkgs#eget -- --download-all --to /srv/data/appimages

  burgernas:menu:
    desc: Interactive menu for BurgerNAS operations (gum)
    cmds:
      - |
        action=$(printf '%s\n' \
          "status" \
          "info" \
          "wake (WoL)" \
          "poweroff" \
          "transmission status" \
          "transmission apply leech-only" \
          "bin sync (static aarch64)" \
          "restic seed (frieren root)" \
          "restic snapshots (frieren root)" \
          "ssh" \
          | gum filter --header "BurgerNAS ❯")
        case "$action" in
          "status") task burgernas:status ;;
          "info") task burgernas:info ;;
          "wake (WoL)") task burgernas:wol ;;
          "poweroff") task burgernas:poweroff ;;
          "transmission status") task burgernas:transmission:status ;;
          "transmission apply leech-only") task burgernas:transmission:leech ;;
          "tools: update aarch64 set (eget)") task burgernas:bin:eget ;;
          "restic seed (frieren root)") task burgernas:backup:seed ;;
          "restic snapshots (frieren root)") task burgernas:snapshot ;;
          "ssh") task burgernas:ssh ;;
        esac
