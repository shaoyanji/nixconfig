version: "3"

tasks:
  # HONEST SCOPE. This task used to end with four
  # `nix eval .#nixosConfigurations.<h>.config.networking.hostName` lines. Those
  # forced ONE option and type-checked nothing else, so they could not fail on
  # the class of error that actually happens (EXP-114: an invalid
  # `networkmanager.dispatcherScripts.*.type = "up"` "passed" that smoke test on
  # four hosts and only surfaced in a build). Four nix processes, zero proof —
  # removed rather than replaced with whole-toplevel forces, which on this 11 GiB
  # host were measured at >120 s with swap and are O(hosts) in memory. The config
  # gate is `checks:host` (all assertions, one host, ~13 s / 720 MiB).
  # REBUILD RULE: never run this (or any checks task) as a pre-flight for a
  # local rebuild. `nixos-rebuild switch` evaluates and builds the host; a check
  # first is a second evaluation for no extra proof. This task is repo hygiene,
  # not a config gate. `checks:build:route` is the one that forces a whole
  # toplevel and is CI/operator-only — it is no longer wired into any switch.
  checks:quick:
    desc: Run narrow repo checks (repo HYGIENE — evaluates no host config)
    aliases: [check]
    summary: >
      Bounded by construction: the inventory checks read the compiled registry and
      flake attr NAMES (~50 MiB), then task-graph integrity, the knowledge-graph
      gate, the sidecar's native-parity gate, nix lint, sops drift and
      modules.toml validation run locally. NO
      nixosConfiguration is forced, by design — this task answers "is the repo
      internally consistent", NOT "does host X evaluate". The graph gate
      (`checks:kg`) evaluates the projection, not a host config: one nix eval
      (~1 s warm) plus jq.
      For config: `task checks:host HOST=<h>` (module system + every assertion,
      ~13 s / 720 MiB). For a named set: `task checks:hosts HOSTS="a b"`.
      Do NOT "improve" this into `nix flake check`: that evaluates every flake
      output, including all 23 nixosConfigurations, in a single process — measured
      2026-10-15 at 339.78 s / 6078.5 MiB peak / SIGKILL exit 137, leaving this
      11 GiB host at 62 % IO-stall with 5.4 GiB swapped. `task checks:flake`
      refuses it on machines this small, and there is deliberately no task in this
      repo whose default is every host.
    cmds:
      - nix build --no-link --builders "" .#checks.x86_64-linux.inventory-schema .#checks.x86_64-linux.inventory-hosts .#checks.x86_64-linux.inventory-modules .#checks.x86_64-linux.site-assets
      - task checks:tasks
      - task checks:kg
      - task checks:kg:native
      - task checks:nix:lint
      - task checks:sops:drift
      - task checks:modules:validate

  checks:tasks:
    desc: "[gate] Task graph integrity: duplicate task keys and dangling `task X` references"
    summary: >
      Static contract check over Taskfile.yml + taskfiles/*.yml, covering the two
      failure classes `task --list-all` cannot report:

      1. DUPLICATE task keys. YAML keeps the LAST definition and silently discards
         the first, so a whole edit can vanish while every command still exits 0.
         (Found on 2026-10-17: dev:nixbuild:plan and dev:nixbuild:warm were each
         defined twice in taskfiles/dev.yml.)
      2. DANGLING references. A `task foo:bar` line whose target was renamed or
         never existed stays invisible until that line runs.

      Resolution is against `task --list-all --json` names AND aliases, with
      wildcard tasks (`infra:deploy:host:*`) expanded, so a concrete
      `task infra:deploy:host:fern` is valid. Cheap: yq + grep + jq, no nix
      evaluation, no network. Exit 0 = clean, 1 = duplicate or dangling.
    cmds:
      - |
        set -uo pipefail
        fail=0

        echo "== duplicate task keys (YAML keeps the last, drops the first) =="
        dupes=$(for f in Taskfile.yml taskfiles/*.yml; do
          awk '
            /^tasks:[[:space:]]*$/ { in_tasks = 1; base = -1; next }
            in_tasks && /^[^[:space:]]/ { in_tasks = 0 }
            in_tasks && /^[[:space:]]+[A-Za-z0-9:_*-]+:[[:space:]]*$/ {
              indent = index($0, $1) - 1
              if (base < 0) base = indent          # task keys sit at one indent
              if (indent != base) next             # skips cmds:/vars: and prose
              key = $1; sub(/:$/, "", key)
              print FILENAME "\t" key
            }
          ' "$f"
        done | sort | uniq -d)
        if [ -n "$dupes" ]; then
          printf '%s\n' "$dupes" | awk -F'\t' '{print "  DUPLICATE  " $1 "  " $2}'
          fail=1
        else
          echo "  ok"
        fi

        echo "== dangling task references (from cmds) =="
        work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
        task --list-all --json \
          | jq -r '.tasks[] | (.name), (.aliases[]?)' | sort -u > "$work/universe"
        # Only a command POSITION counts: line start, or after $( && || ; |.
        # Prose such as "duplicate task keys" inside an echo is not a reference.
        yq -r '.tasks[].cmds[]?' Taskfile.yml taskfiles/*.yml 2>/dev/null \
          | grep -oE '(^|&&|\|\||;|\$\()[[:space:]]*task [A-Za-z0-9:_*-]+' \
          | sed 's/.*task //' | sort -u > "$work/refs"
        # one ERE per wildcard task so a concrete invocation can match it
        alt=$(grep -F '*' "$work/universe" | sed 's/\*/.*/g' | paste -sd'|' - 2>/dev/null || true)
        missing=0
        while IFS= read -r ref; do
          [ -z "$ref" ] && continue
          case "$ref" in
            *[A-Z]*) continue ;;             # <PLACEHOLDER> in prose/echo
            *: ) continue ;;                 # templated, e.g. host:<h>
            -*) continue ;;                  # flags caught by the regex
          esac
          grep -qxF -- "$ref" "$work/universe" && continue
          if [ -n "$alt" ] && printf '%s\n' "$ref" | grep -qE "^($alt)$"; then continue; fi
          echo "  MISSING    $ref"
          missing=$((missing + 1))
        done < "$work/refs"
        if [ "$missing" -eq 0 ]; then echo "  ok"; else fail=1; fi

        exit "$fail"
    silent: true

  checks:kg:
    desc: "[gate] Knowledge-graph schema and all six query patterns still agree"
    summary: >
      scripts/task/kg-check.sh — the gate under the graph query surface.
      lib/knowledge-graph.nix (the projection) and scripts/task/kg-query.sh (the
      patterns) share a field contract that nothing enforces: rename `from` to
      `source`, emit `hosts` instead of `host`, or drop `label`, and every
      pattern still exits 0 with an EMPTY answer. That is the silent failure the
      0-vs-2 exit contract exists to prevent, one level down — and it would only
      be discovered when someone asked a question and believed the blank.
      Three layers: (1) schema — required fields, unique ids, endpoints resolve,
      edge shapes (mentions: doc|skill -> host|skill; tagged: skill -> tag), and
      stats equal to a recount; (2) patterns — all six return rows for anchors
      derived from the graph, result ids are the right node types, and answers
      are cross-checked in reverse (everything `doc AGENTS.md` returns must list
      that doc back), which is what catches a one-sided rename; (3) surface —
      the six ops:kg* tasks still exist and a typo still fails with exit 2 and
      `error:"no_such_node"`.
      Cost: one `nix eval` of the projection (~1 s warm) plus ~30 jq calls. It
      never runs `nix build`, so it cannot spend remote build budget. Test a
      schema change without touching the real graph by pointing KG_GRAPH at a
      mutated JSON copy — the gate then skips nix entirely. Exit 0 = clean,
      1 = drift (go-task reports that as 201).
    cmds:
      - bash scripts/task/kg-check.sh

  checks:blast:
    desc: "[report] Pre-flight blast radius for changed paths (FILES='a b' or STAGED=1)"
    summary: >
      scripts/task/kg-preflight.sh — maps each changed path to the graph anchor
      it is about (hosts/<h>/… -> host:<h>, .agents/skills/<s>/… -> skill:<s>,
      docs/*.md -> doc:<path>) and prints that anchor's transitive dependents.
      It is the file-shaped half of `ops:kg:blast`, for "what does this change
      reach?" before it is applied. Anything that is not a graph node (modules/,
      flake/, taskfiles/) is reported UNMAPPED on purpose: those have closures,
      not graph edges, and a confident zero would be a lie.
      Backend: the sidecar when it is already listening (0.2-0.9 ms per query),
      else the same reverse-edge closure in jq (~40 ms). Both are checked equal
      by `checks:kg:sidecar` / the anchors above. Measured: three paths, one host
      anchor, 460 ms total end-to-end (graph resolution dominates).
      Advisory by default; STAGED=1 reads `git diff --cached`. The pre-commit
      hook runs it in --advisory mode when staged paths map to anchors, so it
      informs a commit and never blocks one. Exit 0 = reported.
    # `{{if eq .STAGED "1"}}`, not `${STAGED:-0}`: go-task vars are templated,
    # not exported to the shell, so the env-var check silently took the else
    # branch and lost --staged.
    cmds:
      - bash scripts/task/kg-preflight.sh {{if eq .STAGED "1"}}--staged{{end}} {{.FILES | default ""}}

  checks:kg:sidecar:
    desc: "[gate] Sidecar parity: engine counts, answers, error codes, arg encoding, lifecycle"
    summary: >
      scripts/task/kg-sidecar-check.sh — boots the Elixir engine and proves it
      agrees with the SAME compiled graph the jq surface reads. Four layers:
      (1) parity — node/edge/type counts must equal the graph exactly, because a
      stale in-memory copy answers queries just as confidently as a fresh one;
      (2) answers — blast-radius equals the jq reverse-edge answer and neighbors
      keeps its centre; (3) interface — unknown id exits 1 (404, not 200 OK),
      missing argument exits 2, and a multi-word term arrives intact (it was
      truncated to its first word at two layers, both with exit 0);
      (4) six-pattern parity — `kg-query.sh` answers every pattern from this
      socket when it is live and from jq when KG_NO_SIDECAR=1 is set; the gate
      compares both, byte for byte, because a fast path that answers differently
      is a second source of truth with better latency; (5) lifecycle — start
      waits for readiness, stop removes the socket.
      Cost: 2-4 s, one boot. Deliberately NOT part of checks:quick or the
      pre-commit hook: checks:kg is ~1 s of jq, this starts a BEAM. Run it when
      tools/kg-engine/**, kg-query.sh or kg-sidecar.sh changes; KG_GRAPH skips
      the graph resolution. Exit 0 = clean, 1 = drift.
    cmds:
      - bash scripts/task/kg-sidecar-check.sh

  checks:kg:native:
    desc: "[gate] Cold native graph build: median under 20 ms, zero subprocess, parity"
    summary: >
      scripts/task/kg-native-check.sh — the number this project kept quoting as
      "~100 ms" now has a gate, and it is the gate that decides whether the
      sidecar may keep its own graph builder. Runs `--build-only` RUNS=7 times,
      takes the MEDIAN (a single sample on the NAS-mounted repo is dominated by
      read jitter — p90 is ~1.2x the median), and fails above BUDGET_MS (default
      20). Also asserts (a) KGEngine.Native contains no subprocess primitive,
      statically — a fallback that shells out to nix cannot pass, and (b) the
      native node/edge counts equal the compiled projection, so speed cannot be
      bought with a smaller graph.

      This is NOT decorative. The projection widened from 22 to 35 doc nodes and
      the native builder kept enumerating only `docs/*.md`: every sidecar query
      served 226/394 while the compiled graph said 239/539, and because the gate
      ran nowhere automatic the drift was invisible. It is part of checks:quick
      now, and the sidecar's DEFAULT graph source is the compiled projection —
      `--native` is the parity experiment, not the query path.
      Measured 2026-10-19 (this host): median 10.8 ms, p90 12.1 ms, max 12.7 ms
      for 239 nodes / 539 edges; whole gate ~1.2 s.
    cmds:
      - bash scripts/task/kg-native-check.sh

  checks:kg:canvas:
    desc: "[gate] Knowledge-graph canvas: slices resolve, and a real node click navigates"
    summary: >
      scripts/task/kg-canvas-check.sh — builds `.#fleet-docs-site` locally
      (`--builders ""`, so it can never dispatch to nixbuild.net) and proves the
      interactive canvas is not a picture: every node names a slice, every slice
      file exists, every neighbour button inside every slice resolves to another
      slice (no dead ends), index.html loads the canvas script and it parses,
      and — with `agent-browser` installed — headless Chrome clicks the
      Knowledge Graph tab, waits for 225 nodes, dispatches a click at
      `host:frieren`'s screen position and requires the breadcrumb to become
      `fleet / knowledge-graph / host:frieren`. That is the TODO exit criterion,
      tested through the interface an operator uses. It also drives the filters
      as a user would: typing `frieren` into the real search box must shrink the
      visible set, keep `host:frieren` visible and update the counter; toggling
      the `doc` chip off must hide exactly the doc count and leave hosts. A
      `qmd` search must DRAW the matches plus their neighbours (derived from the
      edge list) while lighting only the matches, and a cold load of
      `#kg?q=frieren&types=host,doc` must land on the graph, restore the box and
      chips, and draw exactly the filtered set. Every expected count comes from
      the data, never from a hardcoded number. Uses
      an ephemeral port and verifies the served page is this site (8787 was
      Readarr on frieren). SKIP_BROWSER=1 runs the static half only. Cost: ~15 s.
      Exit 0 = clean.
    cmds:
      - bash scripts/task/kg-canvas-check.sh

  checks:host:
    desc: "[gate] Evaluate ONE host: module system + assertions + compiled inventory (HOST=name)"
    summary: >
      Builds hostChecks.<arch>.<host> — exactly ONE host per attribute. Measured on
      frieren 2026-10-15: 13.16 s, 720 MiB peak (2035 assertions); mtfuji 11.42 s,
      646 MiB (1620 assertions). It forces the module system and every assertion
      condition — the same conditions nixpkgs' toplevel asserts — so it catches
      conflicting options, bad values, port collisions and repo policy violations
      without instantiating the system closure graph (which is what made the old
      host-eval-<host> checks slow, and all 23 of them in one process fatal: 6078.5
      MiB peak, SIGKILL 137). It also proves the host COMPILES inventory.toml —
      config.fleet.inventory resolves and the check prints the compiled record — and
      that services.go-backend is not enabled on the host.
      The exhaustive closure build is CI's job: `nix build .#nixosConfigurations.<host>`.
      Runs under scripts/task/oom-guard.sh, which watches /proc/vmstat oom_kill,
      memory/io PSI and MemAvailable at 10 s intervals and kills the run on pressure
      instead of letting it take the host down.
      MODE=eval swaps the build for an arch-independent EVALUATION of the host's own
      config (module system + every assertion + the registry read), which is how
      aarch64/darwin hosts are checked from this machine:
      `task checks:host HOST=penguin MODE=eval`. The kind is resolved from the flake's
      output names, so it does not need to be passed.
      ACTIVE hosts in practice: naming a preserved host (e.g. cassini) is you
      asking for it, so it IS evaluated — and a failure there is that host's
      dormant debt, not your change. The deploy/apply/warm gates warn instead and
      evaluate nothing.
      ONE host, name REQUIRED — no default, no fleet sweep. Peak memory is O(hosts
      forced in one process), and that is exactly what crashed this NAS.
      Vars: HOST= (required, exactly one), MODE= (build|eval, default build),
      ARCH= (default x86_64-linux), TIMEOUT=. Exit 1 = the host failed (assertion or
      eval error), 2 = watchdog abort.
    cmds:
      - bash scripts/task/host-check-sweep.sh --hosts "{{.HOST}}" --mode {{.MODE | default "build"}} --arch {{.ARCH | default "x86_64-linux"}} --timeout {{.TIMEOUT | default "120"}}

  checks:hosts:
    desc: "[gate] Evaluate a NAMED SET of hosts, ONE AT A TIME, under the OOM watchdog"
    summary: >
      HOSTS IS REQUIRED AND HAS NO DEFAULT. Nothing in this repo defaults to the
      fleet: a default set of 21-27 host evaluations is the exact footgun that was
      SIGKILLed at 6078.5 MiB / exit 137 on 2026-10-15 (`nix flake check` forces every
      flake output in one process), and a Taskfile default hands it to every agent
      that reads the contract. Name the hosts you mean:
        task checks:hosts HOSTS="frieren mtfuji"
      One host per process, watchdog every 10 s, so peak memory is one host. The fleet
      is CI's job: .github/workflows/nixcachix.yml fans one host out per runner.
      MODE=eval evaluates instead of building, so it is arch-independent and also
      covers aarch64/darwin hosts; build needs a local builder for ARCH.
      Exit 0 = every named host passed, 1 = a host failed (or HOSTS was not given),
      2 = watchdog abort. Vars: HOSTS= (REQUIRED, space separated), MODE= (build|eval,
      default build), ARCH= (default x86_64-linux), TIMEOUT=.
    cmds:
      - bash scripts/task/host-check-sweep.sh --hosts "{{.HOSTS}}" --mode {{.MODE | default "build"}} --arch {{.ARCH | default "x86_64-linux"}} --timeout {{.TIMEOUT | default "120"}}

  checks:flake:
    desc: "[gate] Run `nix flake check` only where the machine can hold it; refuse otherwise"
    summary: >
      `nix flake check` evaluates EVERY flake output, not just checks.<system> — its
      own progress output reads "checking flake output 'nixosConfigurations'" and
      then one line per NixOS configuration. On this 11 GiB NAS that is 23 NixOS
      evaluations in a single process: measured 2026-10-15 at 339.78 s, 6078.5 MiB
      peak, SIGKILL (exit 137), and a 62 % IO-stall that outlived it. This task
      therefore refuses below REQ_MB (default 16384) and points at the bounded gates
      instead of crashing the host; above it, and in CI, it runs the real thing.
      Exit 0 = ran (or would run), 2 = REFUSED (host too small), non-zero = real
      check failure. Vars: REQ_MB= to lower/raise the floor.
    cmds:
      - |
        req="{{.REQ_MB | default "16384"}}"
        total=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)
        echo "nix flake check: evaluating every flake output (all nixosConfigurations) in ONE process"
        if [ "$total" -lt "$req" ]; then
          echo "REFUSED: ${total} MiB RAM on this host, ${req} MiB required." >&2
          echo "Measured on frieren: 339.78 s, 6078.5 MiB peak, SIGKILL 137, 62% IO-stall." >&2
          echo "Run instead:  task checks:quick  |  task checks:host:HOST=<host>  |  task checks:hosts" >&2
          exit 2
        fi
        exec nix flake check

  checks:modules:validate:
    desc: Verify modules.toml syntax and valid module paths on disk
    cmds:
      - bash scripts/task/modules-menu.sh validate

  checks:build:route:
    desc: "[gate] This host must not compile its own closure — report derivations that would build locally (EXP-107)"
    summary: >
      Read-only build-routing gate. Counts the derivations of the local host's
      closure (HOSTS="a b" to check others) that no substituter can serve, i.e.
      the ones a `nixos-rebuild` would COMPILE on this machine. Exits 1 when the
      caller is not the fleet builder and gaps remain: burn CPU on the builder,
      then let harmonia serve the closure. On the builder itself gaps are
      reported but allowed (exit 0) — that host is where they are supposed to be
      built. Prints the exact fix (`task infra:warm:host:<h>`).
      COST WARNING: this forces the whole host toplevel (drvPath/outPath plus a
      `nix build --dry-run`) — the most expensive eval there is. It is a CI /
      operator gate, NOT a pre-switch hook: `infra:switch:*` no longer calls it.
      Run it deliberately when routing is in doubt, never as a rebuild ritual.
      Vars: HOSTS="a b" (default: the local hostname).
    cmds:
      - bash scripts/task/warm-host.sh --check {{.HOSTS | default ""}}

  checks:flake:transitive:
    desc: Sweep flake.lock transitive inputs against upstream heads (read-only; fails on drift)
    cmds:
      - bash scripts/task/flake-transitive-sweep.sh check

  checks:qmd:docs:
    desc: Check the nixconfig qmd docs collection exists and its index is fresh
    cmds:
      - bash scripts/task/qmd-docs-index.sh check nixconfig

  checks:inventory:sync:
    desc: Verify documentation and LLM spec cards match inventory.toml
    cmds:
      - nix-shell -p python3 --run "python3 scripts/task/compile-llm-specs.py --check"

  checks:inventory:compiled:
    desc: Fail if inventory.toml is inconsistent with itself or with the flake's host set
    summary: >
      Builds the automatic inventory checks. inventory-schema: the file is
      internally consistent — the derived counts match the declared copies and no
      declared field contradicts its kind (an `is_nix` that disagrees with `kind`, a
      non-Nix device marked `managed`, ...). inventory-hosts: bidirectional coverage —
      every host the flake builds is registered, and every registered flake host is
      actually built. inventory-modules: every registered host carries the
      compiled-inventory module, proven by inspecting the module lists in
      flake/host-inventory.nix rather than by evaluating hosts.

      All three read the registry compiled by lib/inventory.nix and the flake's attr
      NAMES, so they force no host configuration and are store-cached after the first
      run. The behavioural half — a host's module system really resolving
      config.fleet.inventory — is hostChecks.<arch>.<host>, one host per invocation:
      `task checks:host:HOST=<host>` or the sequential `task checks:hosts`.

      Exit 0 = clean. Non-zero names the offending hosts/counts. Also runs as part of
      `nix flake check` (checks.<system>.inventory-{schema,hosts,modules}).
    cmds:
      - nix build --no-link --builders "" .#checks.x86_64-linux.inventory-schema .#checks.x86_64-linux.inventory-hosts .#checks.x86_64-linux.inventory-modules

  checks:ports:
    desc: Diff frieren's declared firewall surface against its live listeners
    summary: >
      Reports the buckets — SERVED (declared and listening), DEAD-HOLE (declared with
      nothing behind it), REDUNDANT (declared but loopback-bound, so the hole is
      unusable), FIREWALL-ONLY (a fixed public port permitted nowhere, i.e. the firewall
      is the only control), ACCEPTED (a documented exception, reason recorded in the
      script), and DYNAMIC (a public listener on a port at/above the first
      `net.ipv4.ip_local_port_range` port, drawn at start-up, so there is no stable
      number to declare). The declared set comes from `nix eval` of the merged
      networking.firewall.interfaces.<iface> option, so it accounts for every module's
      contribution rather than a grep of the ones you remembered; the actual set comes
      from `ss` with bind addresses preserved.
      Prefer this over scanning the host from itself: traffic to a host's own address is
      accepted by the `-i lo` rule before the interface-scoped rules are reached, so a
      self-scan reports every local listener as LAN-reachable — exactly that error
      produced a wrong open-port finding on 2026-10-12.
      Vars: HOST= (default frieren), IFACE= (default enp1s0), STRICT=1 to exit 1 on
      DEAD-HOLE or FIREWALL-ONLY (default 0 = report only), VERBOSE=1 to print the
      ACCEPTED reasons. A config change that rebinds a listener only shows up here after
      it is switched, so run STRICT=1 against the running generation. Exits 2 when the
      host/interface cannot be evaluated, so a typo cannot pass as a clean audit.
    cmds:
      - HOST={{.HOST | default "frieren"}} IFACE={{.IFACE | default "enp1s0"}} STRICT={{.STRICT | default "0"}} bash scripts/task/port-audit.sh

  checks:ssh:bitwarden:
    desc: Log into a fleet host with the Bitwarden-vault SSH key and its CA certificate
    summary: >
      Unlocks the vault with bitwarden-cli, copies the SSH key to a 0600 temp file (removed on
      exit), checks it is the key the certificate was signed for, then performs two real
      handshakes: one with the certificate and one without it as a control, so a success cannot
      be the static authorized_keys entry quietly doing the work. The certificate at
      ~/.ssh/bitwarden-cert.pub is hand-signed and nothing renews it (`renew-ssh-cert` covers
      only ~/.ssh/id_ed25519) — re-sign it when it expires.
      NOT safe unattended: it prompts for the Bitwarden master password (or reuses BW_SESSION).
      Vars: HOST= (default frieren), ITEM= (vault item name or id, required when the vault
      holds more than one SSH key), PUBKEY=/CERT= (default ~/.ssh/bitwarden{,-cert.pub}),
      PRIVATE_KEY= to skip the vault and test the handshake half alone.
      Exits 1 when the certificate login fails, 2 when preflight fails (missing, expired or
      mismatched certificate, or a vault item whose key is not the one the cert covers).
    cmds:
      - HOST={{.HOST | default "frieren"}} ITEM="{{.ITEM | default ""}}" nix-shell -p bitwarden-cli jq --run "bash scripts/task/bitwarden-ssh-test.sh"

  checks:restic:drill:
    desc: Verify frieren's restic repository and restore a sample (HC-2)
    summary: >
      Starts restic-drill.service and surfaces its journal; exits non-zero if the
      drill did not complete. Proves the nightly backup is restorable, not just
      present. Run on frieren (the host that owns /srv/backup/restic). The same
      drill also runs unattended weekly via restic-drill.timer (Sun 06:30).
    cmds:
      - /run/wrappers/bin/sudo systemctl start restic-drill.service
      - /run/wrappers/bin/sudo journalctl -u restic-drill.service -n 50 --no-pager

  checks:ha:mqtt:
    desc: Report whether Home Assistant is actually subscribed to the MQTT broker (HC-5)
    summary: >
      Reads services.ha-stack from HOST (default frieren) and reports three facts from
      authoritative sources: the broker is listening; HA has an mqtt entry in
      <configDir>/.storage/core.config_entries; and the broker has an established client.
      Exits 1 while the broker is up but HA is NOT wired — that is the open HC-5 gap and
      the reason the check exists, so "MQTT stack declared but not wired" is a visible,
      tracked state rather than an assumption. Exit 0 = wired (entry + live connection),
      2 = not evaluable (stack disabled, broker down, nix eval failed). HA's MQTT
      integration is config-entry only: a YAML 'mqtt:' stanza would raise
      'yaml_setup_without_active_setup' and connect nothing.
    cmds:
      - HOST={{.HOST | default "frieren"}} bash scripts/task/ha-mqtt-check.sh

  checks:closure:budget:
    desc: Fail when a host's closure exceeds its dynamic budget (HC-4)
    summary: >
      Compares each host's measured closure size against its budget in
      closure-budgets.toml, where budget = baseline_bytes × (1 + headroom_pct/100)
      unless a host pins an absolute `bytes`. The basis is printed per row
      (`base+1.0%` or `pin`) so a passing check cannot hide which promise it
      measured against. Baselines are adopted, never typed:
      `task dev:closure:budget:adopt HOST=<h>` after an intentional cut.
      The measurement is the same store-DB sum dev:closure:size prints (nix
      path-info, no eval), so the budget and the size view cannot disagree.
      Exits non-zero when a host is over budget, so a closure that quietly grows back
      fails the gate — the guard the debloat work (docs/closure-reduction.md) lacked.
      Vars: HOST=<host> checks one host (default: the local machine); ALL=1 checks every
      host with an entry; TARGET=<store path> checks a built-but-undeployed closure
      against HOST's budget. A host with no entry is reported NOT BUDGETED and does not
      fail; an unreachable host is skipped with a notice. Exit 0 = within budget,
      1 = over budget, 2 = budgets file/tooling missing.
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} {{if eq (.ALL | default "0") "1"}}--all{{end}} budget {{if .TARGET}}{{.TARGET}}{{end}}

  checks:dns:failover:
    desc: Verify the DNS resolver group answers the wildcard zone and can fail over (HC-3)
    summary: >
      Reads profiles.dnsFailover from HOST (default frieren) — so the check cannot
      drift from the declaration — digs the wildcard zone at every resolver in the
      group, and probes a declared VRRP VIP for two answering MACs (split brain).
      Exits 2 while the group has fewer than 2 members: that state proves the primary
      answers but NOT that failover works, and is the current HC-3 gap until an
      always-on secondary is provisioned (see docs/dns-failover.md). Exit 1 is a real
      failure (a listed resolver did not answer, or the VIP answered from two MACs).
      Probes a subdomain (NAME=, default hc3-check.<zone>), not the apex — the apex
      can carry a local override, and a wildcard's job is subdomains.
      Vars: HOST= (default frieren); RESOLVERS= / NAME= / EXPECT= / VIP= override the
      declaration for ad-hoc runs; IFACE= scopes the arping probe.
    cmds:
      - HOST={{.HOST | default "frieren"}} RESOLVERS="{{.RESOLVERS | default ""}}" NAME="{{.NAME | default ""}}" IFACE={{.IFACE | default ""}} bash scripts/task/dns-failover-check.sh

