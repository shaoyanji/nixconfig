# eget-aarch64 — the flat aarch64 tool dir (/srv/data/bin-aarch64, mirrored to
# /volume1/peachcable/bin-aarch64 on BurgerNAS).
#
# Run this ON AN AARCH64 HOST (delphi). eget 1.3.4 follows the running system:
# `--system linux/amd64` on an aarch64 box still extracts arm64 assets — measured
# on all 13 entries below — so the architecture comes from where it runs, not
# from a flag. That is why there are two configs and not one with a variable.
#
# One section per upstream project, named "owner/repo", because eget reads GitHub
# release assets. Anything with no prebuilt release belongs in tools/bin-farm
# (pkgsStatic on delphi) — eget cannot compile, and farm must not download what
# eget already tracks.
#
# GitHub allows 60 unauthenticated API requests an hour, which a full run can
# approach; the task passes `gh auth token` when one exists.
#
# Adding a tool: run `eget owner/repo --download-only` once, see which asset it
# picks, then pin that preference here.

[global]
quiet = false

# age ships one tarball per platform carrying age and age-keygen; releases also
# publish `.proof`/`.sha256` sidecars, and two matches means a prompt, which is a
# failure in a non-interactive run.
["FiloSottile/age"]
asset_filters = [".tar.gz", "^proof", "^sha256"]
# The tarball carries age *and* age-keygen (plus plugin binaries that are noise
# here). eget extracts one executable per asset, so on a fresh dir run
# `eget FiloSottile/age --file age-keygen` once for the second.

["junegunn/fzf"]
asset_filters = [".tar.gz"]

["cli/cli"]
asset_filters = [".tar.gz"]

["muesli/duf"]
asset_filters = [".tar.gz"]

["ajeetdsouza/zoxide"]
asset_filters = [".tar.gz"]

["charmbracelet/glow"]
asset_filters = [".tar.gz", "^sbom"]

["charmbracelet/gum"]
asset_filters = [".tar.gz", "^sbom"]

["go-task/task"]
asset_filters = [".tar.gz"]

["jesseduffield/lazygit"]
asset_filters = [".tar.gz"]

# hugo publishes plain / extended / extended_withdeploy per platform; only the
# plain extended build is wanted.
["gohugoio/hugo"]
asset_filters = ["hugo_extended_", "^withdeploy", ".tar.gz"]

["getsops/sops"]
asset_filters = [".linux.", "^sbom"]

["pdfcpu/pdfcpu"]
asset_filters = [".tar.xz", "^sbom"]

["starship/starship"]
asset_filters = [".tar.gz"]

# yq publishes the bare binary *and* a tarball of it; the flat dir wants the bare
# one, so the archive is excluded.
["mikefarah/yq"]
asset_filters = ["^tar.gz"]
file = "yq"
