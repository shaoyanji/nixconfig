version: "3"

vars:
  ENVS_HOST: "envs.net"
  ENVS_USER: "jisifu"
  # ssh destination, not an ssh-config alias (Home Manager owns ~/.ssh/config).
  ENVS_TARGET: "{{.ENVS_USER}}@{{.ENVS_HOST}}"
  ENVS_DOMAIN: "jisifu.envs.net"
  ENVS_WEB: "/home/jisifu/public_html"
  ENVS_GEMINI: "/home/jisifu/public_gemini"
  ENVS_GOPHER: "/home/jisifu/public_gopher"

tasks:
  envs:ssh:
    desc: Open interactive SSH shell into Envs.net host
    cmds:
      - ssh {{.ENVS_TARGET}}

  envs:exec:
    desc: Run command on Envs.net via SSH (agent-friendly)
    cmds:
      - ssh {{.ENVS_TARGET}} -- {{.CLI_ARGS}}

  envs:status:
    desc: Health check on Envs.net website (https://jisifu.envs.net)
    cmds:
      - |
        echo "=== HTTP Health Check (https://{{.ENVS_DOMAIN}}) ==="
        curl -Is https://{{.ENVS_DOMAIN}} | head -n 8
        echo ""
        echo "=== Disk & Home Directory Usage ==="
        ssh {{.ENVS_TARGET}} "df -h /home/{{.ENVS_USER}}"

  envs:build:
    desc: Build all four transports from the site repo (markdown → HTML, gemtext, gopher, plan)
    summary: >
      The site is its own private repository, not a directory of this one:
      `~/Documents/envsdotnet`, overridable with ENVS_SITE_REPO. The PHP
      pipeline that used to run on the host is retired. This runs the builder
      locally, where the assertions and the 14 KiB page budget can fail before
      anything is uploaded. No ssh. Exit 2 = no site repo at that path.
    cmds:
      - |
        repo="${ENVS_SITE_REPO:-$HOME/Documents/envsdotnet}"
        if [ ! -x "$repo/build.sh" ]; then
          echo "envs:build: no site repo at $repo (set ENVS_SITE_REPO)" >&2
          exit 2
        fi
        cd "$repo"
        ./build.sh --strict

  envs:publish:
    desc: Build strict, then publish all four targets (web, Gemini, Gopher, finger)
    summary: >
      The release command. `build.sh --strict` writes public/ and public-text/,
      then `publish.sh` moves the web root aside to `public_html.bak-<stamp>`,
      syncs the new one, and rsyncs the capsule, the gopher hole and ~/.plan.
      Building and publishing stay separate so a build can be inspected first.
      Exit 2 = no site repo at ENVS_SITE_REPO.
    cmds:
      - |
        repo="${ENVS_SITE_REPO:-$HOME/Documents/envsdotnet}"
        if [ ! -x "$repo/publish.sh" ]; then
          echo "envs:publish: no site repo at $repo (set ENVS_SITE_REPO)" >&2
          exit 2
        fi
        cd "$repo"
        ./publish.sh

  envs:report:
    desc: Assertions and the heaviest pages from the last build (read-only)
    summary: >
      Reads `public/build-report.json`, which `envs:build` writes: every
      assertion with its verdict, then the ten heaviest pages against the
      budget. It answers "did the gates pass, and what is close to the edge"
      without rebuilding or touching the host.
    cmds:
      - |
        repo="${ENVS_SITE_REPO:-$HOME/Documents/envsdotnet}"
        report="$repo/public/build-report.json"
        if [ ! -f "$report" ]; then
          echo "envs:report: no build yet at $report — run task envs:build" >&2
          exit 1
        fi
        jq -r '.assertions[] |
          (if .ok then "ok   " else "FAIL " end) + .name +
          (if .ok then "" else ": " + .detail end)' "$report"
        echo
        jq -r '.pages[:10][] | "\(.bytes/1024|floor) KiB  \(.route)"' "$report"

  envs:push:
    desc: Upload file to Envs.net (defaults to ~/public_html/)
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=$(echo "$ARGS" | awk '{print $1}')
        DEST=$(echo "$ARGS" | awk '{print $2}')
        if [ -z "$SRC" ]; then
          echo "Usage: task envs:push -- <local_file> [remote_dest]"
          echo "Example: task envs:push -- index.md public_html/content/home/"
          exit 1
        fi
        if [ -z "$DEST" ]; then
          DEST="public_html/"
        fi
        echo "Pushing $SRC -> {{.ENVS_TARGET}}:$DEST ..."
        scp -r "$SRC" "{{.ENVS_TARGET}}:$DEST"
        echo "Transfer complete."

  envs:pull:
    desc: Download file from Envs.net (e.g. task envs:pull -- public_html/index.php [dest])
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=$(echo "$ARGS" | awk '{print $1}')
        DEST=$(echo "$ARGS" | awk '{print $2}')
        if [ -z "$SRC" ]; then
          echo "Usage: task envs:pull -- <remote_file> [local_dest]"
          exit 1
        fi
        if [ -z "$DEST" ]; then
          DEST="."
        fi
        echo "Pulling {{.ENVS_TARGET}}:$SRC -> $DEST ..."
        scp -r "{{.ENVS_TARGET}}:$SRC" "$DEST"
        echo "Transfer complete."

  envs:info:
    desc: Query Envs.net Debian system info, runtimes, and public_html git status
    cmds:
      - |
        echo "=== System & OS ==="
        ssh {{.ENVS_TARGET}} "uname -a; cat /etc/os-release | grep PRETTY_NAME"
        echo ""
        echo "=== Installed Runtimes ==="
        ssh {{.ENVS_TARGET}} "php -v | head -n 1; node -v; python3 --version; go version 2>/dev/null || true"
        echo ""
        echo "=== Public Roots ==="
        ssh {{.ENVS_TARGET}} "ls -ld ~/public_html ~/public_gemini ~/public_gopher 2>/dev/null"
        echo ""
        echo "=== Git Status (public_html) ==="
        ssh {{.ENVS_TARGET}} "cd ~/public_html && git status -s 2>/dev/null || echo 'Not a git repo'"

  envs:harden:
    desc: Enforce secure permissions on Envs.net (~/.ssh, authorized_keys, public_html)
    cmds:
      - |
        ssh {{.ENVS_TARGET}} "
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys 2>/dev/null || true
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/*.key 2>/dev/null || true
          chmod 644 ~/.ssh/*.pub 2>/dev/null || true
          chmod 750 ~/public_html 2>/dev/null || true
          echo '✅ Envs.net permissions hardened (SSH 700/600, public_html 750).'
        "

  envs:audit:
    desc: Comprehensive health and security audit of Envs.net pubnix environment
    cmds:
      - |
        echo "=== 1. System, Uptime & Active Users ==="
        ssh {{.ENVS_TARGET}} "uname -a; uptime; who | wc -l | sed 's/$/ active sessions/'"
        echo ""
        echo "=== 2. Disk Usage ==="
        ssh {{.ENVS_TARGET}} "df -h /home/{{.ENVS_USER}}"
        echo ""
        echo "=== 3. Web Service HTTP Status ==="
        curl -Is https://{{.ENVS_DOMAIN}} | head -n 8
        echo ""
        echo "=== 4. Permissions Audit ==="
        ssh {{.ENVS_TARGET}} "ls -ld ~/.ssh ~/.ssh/* ~/public_html ~/public_gemini 2>/dev/null"
        echo ""
        echo "=== 5. Content Git Status ==="
        ssh {{.ENVS_TARGET}} "cd ~/public_html && git status -s 2>/dev/null || echo 'Not a git repo'"

  envs:clean:
    desc: Clean stale vim undo files (.un~) and temporary caches from home
    cmds:
      - |
        ssh {{.ENVS_TARGET}} "
          echo 'Cleaning stale .un~ undo files...'
          find ~ -maxdepth 2 -name '*.un~' -delete 2>/dev/null || true
          echo 'Clean complete.'
        "

  envs:backup:
    desc: Download compressed backup of public_html content and public_gemini
    cmds:
      - |
        BACKUP_FILE="envs-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
        echo "Creating remote archive..."
        ssh {{.ENVS_TARGET}} "tar -czf ~/$BACKUP_FILE ~/public_html/content ~/public_gemini ~/public_gopher 2>/dev/null || true"
        echo "Downloading $BACKUP_FILE..."
        scp {{.ENVS_TARGET}}:~/$BACKUP_FILE ./
        ssh {{.ENVS_TARGET}} "rm -f ~/$BACKUP_FILE"
        echo "Backup saved locally to ./$BACKUP_FILE"

  envs:menu:
    desc: Interactive Charmbracelet Gum / Wish menu for Envs.net host
    cmds:
      - |
        action=$(printf '%s\n' \
          "ssh: Connect to Envs.net shell" \
          "status: Check https://{{.ENVS_DOMAIN}} health" \
          "audit: Security, quota & permissions audit" \
          "harden: Enforce 700/600 permissions" \
          "build: Build the four transports (strict)" \
          "publish: Build and publish to all four targets" \
          "report: Assertions and page weights from the last build" \
          "backup: Download content & gemini backup tarball" \
          "clean: Remove stale .un~ undo files" \
          "info: System info, runtimes & git status" \
          "push: Upload file to Envs.net (public_html/)" \
          "pull: Download file from Envs.net" \
          "wishlist: Open Wishlist SSH directory" \
          "exit: Quit" | gum choose --header "🌐 Envs.net Pubnix Menu")

        case "$action" in
          "ssh"*)
            task envs:ssh
            ;;
          "status"*)
            task envs:status
            ;;
          "audit"*)
            task envs:audit
            ;;
          "harden"*)
            task envs:harden
            ;;
          "backup"*)
            task envs:backup
            ;;
          "clean"*)
            task envs:clean
            ;;
          "build"*)
            task envs:build
            ;;
          "publish"*)
            task envs:publish
            ;;
          "report"*)
            task envs:report
            ;;
          "info"*)
            task envs:info
            ;;
          "push"*)
            filepath=$(gum input --placeholder "Path to local file to upload:")
            if [ -n "$filepath" ]; then
              task envs:push -- "$filepath"
            fi
            ;;
          "pull"*)
            remotepath=$(gum input --placeholder "Path to remote file on Envs.net:")
            if [ -n "$remotepath" ]; then
              task envs:pull -- "$remotepath"
            fi
            ;;
          "wishlist"*)
            nix-shell -p wishlist --run wishlist
            ;;
          *)
            echo "Exited."
            ;;
        esac
