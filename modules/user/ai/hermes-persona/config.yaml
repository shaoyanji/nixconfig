# Hermes Agent Configuration — Frieren persona
# Sensitive tokens (e.g. TELEGRAM_BOT_TOKEN) loaded from ~/.hermes/.env
#
# `_config_version` is written by hermes' own migrator. Keep it current: with
# v0 stamped, every `hermes doctor` reported "Config version outdated (v0 →
# v51)" and the retired `security.tirith_enabled` key sat in the file. Both
# were fixed on 2026-11-05 by migrating a copy under HERMES_HOME=/tmp/hh and
# taking the diff (nothing else changed). Next hermes that bumps the schema:
# `cp config.yaml /tmp/hh/config.yaml && HERMES_HOME=/tmp/hh hermes doctor
# --fix && diff -u config.yaml /tmp/hh/config.yaml`.
terminal:
  backend: local
  timeout: 180
telegram:
  reactions: false
# Infron (llm.onerouter.pro) holds a prepaid $5 and nothing tops it up, so the
# only models this file may name on a metered route are the `:free` ids — the
# suffix is what the route bills at zero. A paid id anywhere else spends the
# balance that keeps the free ones working.
#
# The key is never written in this file: the provider entry names the env var and
# INFRON_API_KEY comes from the shared sops blob (ai-services-shared-env), so a
# rotation reaches hermes through hermes-env-sync instead of a second copy here.
# Verified 2026-11-18: one `:free` completion returns `ok`, usage 12 tokens.
providers:
  infron:
    api: https://llm.onerouter.pro/v1
    key_env: INFRON_API_KEY
    api_mode: openai
    default_model: qwen/qwen3.8-27b:free
    # Picker pin, both halves needed: `models:` as a LIST is an allowlist (a
    # dict is per-model metadata, not a catalog narrow — hermes_cli's
    # `_models_config_is_allowlist`), and `discover_models: false` stops the
    # /models probe that otherwise offers every paid id on the route. The
    # probe is how a billed `nemotron-3.5-super` was one pick away (2026-11-19).
    discover_models: false
    models:
      - qwen/qwen3.8-27b:free
      # - deepseek/deepseek-v4-flash-0731:free
  tokenrouter:
    api: https://api.tokenrouter.com/v1
    key_env: TOKENROUTER_API_KEY
    api_mode: openai
    default_model: deepseek/deepseek-v4.1-flash-1017-free
    discover_models: false
    models:
      - deepseek/deepseek-v4.1-flash-1017-free
# Main model routes through Nous Portal OAuth, not a key_env: the credential is
# a device-code OAuth token in hermes' auth store (`hermes auth list` shows
# nous / device_code / oauth) and `hermes portal info` reports logged in. No
# `providers.nous` block is needed for an OAuth route — `model.provider: nous`
# is enough, and `tencent/hy4-flash:free` answers at cost 0 through
# inference-api.nousresearch.com (verified 2026-11-28: one-shot returns PONG).
# `nous` stays in model_catalog.excluded_providers so the picker never offers
# its billed ids; the free id is pinned here instead.
model:
  provider: nous
  default: tencent/hy4-flash:free
agent:
  max_turns: 150
  reasoning_effort: medium
  # Read from `agent.` — under `fallback:` this key is dead config: `fallback.`
  # surfaces only `min_switch_reset_seconds`. The floor is the fallback chain
  # length, not a retry preference: every failover hop consumes one
  # restart-count credit and the turn dies at `rebuilt_restart_limit_exceeded`
  # when they run out, so `1` (the value that sat dead under `fallback:`)
  # would have capped the chain at its first hop — measured 2026-11-19, when
  # the qwen failover worked and the turn died activating the next lane.
  api_max_retries: 11
  # A stop waits this long for a running cron job before tearing down. The
  # default (30 s) plus adapter teardown crossed the 60 s shutdown watchdog on
  # every stop here, because pane-idle-watch runs for most of its 2-minute
  # interval: 5 s keeps a shutdown under the leash and costs one idempotent
  # watch tick.
  cron_drain_timeout: 5
# Every provider holding a credential in ~/.hermes/.env or the shell env is a
# selectable row in `hermes model` / `/model`, and the expensive-model guard
# only warns on KNOWN pricing — silent on a custom route, and a billed pick is
# one keypress past a quiet row. The metered vendors are hidden here (slug or
# alias, case-insensitive; the CLI picker, the TUI and the gateway slash
# commands all read it). What stays visible cannot bill: lmstudio (local) and
# the pinned infron row — nous is excluded
# too, because a paid plan's portal models bill the same way a paid SKU does.
# The limit of the guard: this narrows pickers only — a typed
# `/model x --provider nvidia` still resolves — so billed provider keys stay
# out of every file hermes authors and this list stays the whole set.
model_catalog:
  excluded_providers:
    - nous
    - anthropic
    - openai-api
    - openai-codex
    - openai
    - fireworks
    - openrouter
    - moa
    - novita
    - alibaba
    - alibaba-coding-plan
    - xai
    - xai-oauth
    - xiaomi
    - tencent-tokenhub
    - tencent-tokenplan
    - nvidia
    - huggingface
    - gemini
    - vertex
    - deepseek
    - zai
    - kimi-coding
    - kimi-coding-cn
    - stepfun
    - minimax
    - minimax-oauth
    - minimax-cn
    - arcee
    - gmi
    - kilocode
    - opencode-zen
    - opencode-go
    - bedrock
    - azure-foundry
    - ai-gateway
    - qwen-oauth
    - groq
    - cerebras
    - aihubmix
    - cohere
    - tinker
    - mistral
    - together
    - perplexity
    - deepinfra
# Both capabilities are pinned. Unpinned, `hermes doctor` named firecrawl while
# the tool actually resolved to tavily (measured 2026-11-19), so the pin is the
# only thing that decides. Extraction goes to the firecrawl provider, and that
# provider reads FIRECRAWL_API_URL from ~/.hermes/.env.local to reach the
# loopback firecrawl-local server instead of the keyed cloud API. Keys still
# arrive from the one shared sops blob (`ai-services-shared-env`).
web:
  search_backend: tavily
  extract_backend: firecrawl
display:
  interface: cli
  tool_progress: all
# Fallback chain: NIM leads because it is near and unthrottled (measured
# 2026-11-22); the qwen lane mid-chain shares the Infron route's
# account-scoped daily quota with the main model, so it covers a per-model
# failure (limit, delisting) but dies with the main model on a quota outage —
# the keyless apisfreellm terminal behind it does not. Infron's daily
# allowance is account-scoped: a quota outage ended a turn instead of
# degrading it (2026-11-19).
# Each entry's free contract is structural, not a remembered price: `:free` is
# the suffix the Infron route bills at zero, `nvidia` is NIM's free dev tier
# on integrate.api.nvidia.com (a build.nvidia.com key, no wallet exists to
# bill), and apisfreellm takes no key at all. ollama-cloud was removed
# 2026-11-22: its nemotron-3-ultra lane answers 402 "Add usage credits" on
# every attempt — 71 in one boot, routed to 23 times with zero successes — so
# it is a payment wall, not a quota that resets. xpl (experientiallabs) went
# the same way 2026-11-26: its /models answers 200 with null cost fields —
# what the 2026-11-24 probe trusted — but a completion answers
# insufficient_credits with a $5 top-up wall, so a catalog probe proves
# nothing and a completion is the only proof. Nemotron's first failover is
# the NIM lane, not the custom endpoint: the billed pick that cost the Infron
# balance (2026-11-19) was this model resolved through a metered route.
fallback_providers:
  # NIM leads (2026-11-22), ahead of the two lanes that used to. Order is cost,
  # not preference: `GET <base>/models` measured 0.107 s for NIM (connect
  # 0.016 s, against a 0.066 s github baseline) where openrouter was 0.984 s and
  # onerouter 1.055 s, both with a 0.214 s connect. While those two are answering
  # 429 on completions, leading with them made every turn pay a distant
  # handshake plus a rejection before reaching the lane that actually answers —
  # a 3-hop failover for a one-word reply. The near, unthrottled lane belongs
  # where the throttle fires.
  # CrowLLM free lanes (probed 2026-11-24). The live /models catalog lists
  # only three surviving :free models: the 550b nemotron, crow-roleplay, and
  # laguna-xs-2.1-uncensored. deepseek-v4-flash / minimax-m3.1-flash were
  # decommissioned; qwen3-8-omni-flash no longer answers — all dropped.
  - provider: custom
    model: deepseek-ai/DeepSeek-V4.1-Flash
    base_url: https://api.runcrate.ai/v1
    key_env: RUNCRATE_API_KEY
  - provider: custom
    model: deepseek/deepseek-v4.1-flash
    base_url: https://api.cantrustai.xyz/v1
    key_env: CANTRUSTAI_API_KEY
  - provider: custom
    model: lebrel/deepseek-v4.1-flash-uncensored
    base_url: https://attested.lebrel.ai/v1
    key_env: LEBREL_API_KEY
  - provider: custom
    model: gpt-6-luna
    base_url: https://api.experientiallabs.ai/v1
    key_env: EXPLABS_API_KEY
  - provider: custom
    model: deepseek/deepseek-v4.1-flash-1017-free
    base_url: https://api.tokenrouter.com/v1
    key_env: TOKENROUTER_API_KEY
  - provider: nvidia
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
  - provider: openrouter
    model: baidu/ernie-5.5-flash-preview:free
  - provider: custom
    model: nemotron-3-ultra-550b-a55b-uncensored:free
    base_url: https://crowllm.com/v1
    key_env: CROWLLM_API_KEY
  - provider: custom
    model: crow-roleplay:free
    base_url: https://crowllm.com/v1
    key_env: CROWLLM_API_KEY
  - provider: custom
    model: laguna-xs-2.1-uncensored:free
    base_url: https://crowllm.com/v1
    key_env: CROWLLM_API_KEY
  - provider: custom
    model: deepseek-ai/DeepSeek-V4.1-Flash-1017
    base_url: https://api.sailresearch.com/v1
    key_env: SAIL_API_KEY
  - provider: custom
    model: qwen/qwen3.8-27b:free
    base_url: https://llm.onerouter.pro/v1
    key_env: INFRON_API_KEY
  - provider: custom
    model: free-ai
    base_url: https://api.apisfreellm.com/v1
    api_key: free
tts:
  primary: speechify
  speechify:
    api_key: ${SPEECHIFY_API_KEY}
    endpoint: https://api.speechify.ai/v1/audio/stream
    model: simba-3.2
    voice_id: harper
    options:
      text_normalization: false
  fallback_providers:
    - provider: edge
stt:
  enabled: true
  provider: local
  local:
    model: base
# Titles and compression used to pin gemini, and the OpenRouter free lane held
# everything else. Both are other models: with the account restricted to two
# `:free` ids, an aux task routed anywhere else breaks that rule without buying
# anything — `provider: auto` sends aux work to the main chat model instead.
# `free_only` stays as a belt on the OpenRouter default lane for any aux call
# that still has no explicit destination.
auxiliary:
  free_only: true
  # Unset, the goal judge resolves a built-in `deepseek`/`deepseek-flash`
  # default that no `providers:` entry declares — every verdict errors.
  # infron is daily-capped (1000 req/day, hit 2026-11-24); the sail lane is
  # billed per request and answers — SAIL_API_KEY comes from sops
  # ai-services-shared-env, the same env the fallback lanes read.
  goal_judge:
    provider: custom
    model: deepseek-ai/DeepSeek-V4.1-Flash-1017
    base_url: https://api.sailresearch.com/v1
    key_env: SAIL_API_KEY

# Titles and summaries use their own model lane, pinned to hydrogen so aux
# work never burns the `:free` ids on the main chat route.
title_generation:
  model: gemini-4-hydrogen-high

summary:
  model: gemini-4-hydrogen-high
skills:
  trusted_project_dirs:
    - /Volumes/data/projects/nixconfig
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '8679391100'
      name: Matt Ji
      user_id: '8679391100'
# A dead IPv6 route (advertised, never answers) makes every connect spend its
# IPv6 attempt first: `hermes doctor`'s 44-check pass took 23 s for exactly this
# reason, and `doctor_connectivity` reported openrouter.ai unreachable after a 2 s
# timeout on each check (measured 2026-11-22). `force_ipv4` drops AAAA candidates
# before the connect, so a lookup answers on IPv4 instead of waiting the stall
# out. Honoured outside doctor too — hermes_cli/config_defaults.py (default
# false), gateway/run.py and cron/scheduler.py all read it.
network:
  force_ipv4: true

# Bundled platform plugins are imported on commands that load plugins, each
# under a per-plugin deadline (`plugins.load_timeout_seconds`, default 10 s).
# slack-platform is configured on no host and its adapter imports slack_bolt,
# which this package does not ship — the import never returns, so the load paid
# the full deadline and then warned that register_platform() arrived too late
# (measured 2026-11-22: 10 s + two WARNINGs per loading invocation).
# `plugins.disabled` is the loader's deny-list and wins over `plugins.enabled`
# (hermes_cli/plugins_discovery.gate_manifest), so the plugin is never imported.
plugins:
  disabled:
    - slack-platform
fallback:
  min_switch_reset_seconds: 120
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
_config_version: 52
# The gateway's own unit is off-limits to agent turns. A Telegram turn that ran
# `systemctl --user restart hermes-gateway` took the daemon down mid-answer
# (2026-11-22 18:54), and every stop then races the shutdown watchdog. Fleet
# infra still restarts services through `task infra:*`, whose systemctl call is
# a plain process rather than a gateway tool shell.
approvals:
  deny:
    - systemctl --user restart hermes-gateway*
    - systemctl --user stop hermes-gateway*
    - systemctl --user kill hermes-gateway*
    - systemctl restart hermes-gateway*
    - systemctl stop hermes-gateway*
    - hermes gateway restart
    - hermes gateway stop
command_allowlist:
  - delete in root path
  - execute_code
  - script execution via -e/-c flag
  - script execution via heredoc
  - shell command via -c/-lc flag
  - upload a secret or credential file via curl/wget (possible exfiltration)
memory:
  write_approval: true
