# The check inventory: one row per gate, and the kind that decides how it is
# invoked. `task check:leaf NAME=...` / `check:host HOST=...` / `check:cache
# HOST=...` are the three verbs; `task check:list` renders this table with each
# task's live description. A row that names no task, or a `checks:*` task with
# no row, fails `task check:verify` -- so adding a gate is a row, not a name
# nobody classifies.

