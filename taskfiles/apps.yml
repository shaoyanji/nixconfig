version: "3"

vars:
  # The workflow checkout is retired as a source of truth (86bdb73b, 2026-11-03):
  # its applications.json is an export, and its bin/appflow still builds the
  # Typst documents. Everything that reads or writes the pipeline goes through
  # the archive API on delphi — scripts/task/apps-db.sh.
  APPS_DIR: "/srv/data/projects/antigravity-application-workflow"
  APPS_DB: "bash scripts/task/apps-db.sh"

tasks:
  apps:list:
    desc: List tracked applications from the archive database
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} list {{.CLI_ARGS}}

  apps:search:
    desc: Search applications (company, role, status, id, next action)
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} search {{.CLI_ARGS}}

  apps:get:
    desc: View one application and the mail linked to it
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} get {{.CLI_ARGS}}

  apps:update:
    desc: Update status in Postgres (task apps:update -- <id> --status Rejected [--next-action none])
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} update {{.CLI_ARGS}}

  apps:add:
    desc: Add one application — flags, no JSON (task apps:add -- --company C --role R [--apply-url U])
    summary: >
      The everyday write path. `--company` and `--role` are required; the id
      defaults to a slug of the two, so a re-run updates the same row instead of
      duplicating — pass `--id` to reuse an id the scan already chose. Status
      defaults to `lead` and the stage follows the status, the same rule the
      hourly sync applies. For a record a tool already produced as JSON,
      `apps:upsert` takes the object on stdin or from a file.
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} add {{.CLI_ARGS}}

  # Scouting finds roles a sweep turned up, not applications already sent. One
  # row per live role, on the pipeline's own columns: the family is the origin,
  # the one-line summary is the notes, and the owner rides the status line
  # because the table has none — where list and search can see it.
  apps:scout:
    desc: Record one scouted lead — --family, --company, --role, --summary required (--owner, --status, --url, --fit, --next-action, --id, --dry)
    summary: >
      One lead a sweep found. `--family devops|sre|platform|infrastructure`,
      `--company`, `--role` and `--summary` are required; `--owner` defaults to
      `agent:apps`; `--status`, `--url`, `--fit 1-5`, `--next-action` and `--id`
      are optional. Summary goes to `notes`, family to `origin` `scout:<family>`;
      the status defaults to `lead (scout <family>, owner <owner>)` — no owner
      column, so it rides the status line where list and search show it. The
      same company and role updates one row. Exit 2 = bad input; `--dry` prints only.
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" bash scripts/task/apps-scout.sh {{.CLI_ARGS}}

  # A sweep is a cycle, not a scan: the lane's durable state is the record, and
  # the boards move independently — a flat german feed says nothing about
  # Stepstone. This carries the next cycle's id and read order so a pass starts
  # where the last one ended instead of re-deriving it.
  apps:scout:sweep:
    desc: The next scout sweep — id, the boards in read order and the write rules (SWEEP, FAMILY)
    summary: >
      Sweep id `2026-11-25p`, the next DevOps/SRE/Platform/Infrastructure pass
      after 25o. Prints the boards in read order with the trap each one hides,
      then the lane's write rules. Read-only and network-free: a sweep still
      dedupes through `apps:scout`/`apps:search` and files with `apps:scout`,
      never a second writer. The 2026-12-07 send hold stands over every row
      found, and no row is filed from a listing alone.
    vars:
      SWEEP: '{{.SWEEP | default "2026-11-25p"}}'
      FAMILY: '{{.FAMILY | default "devops|sre|platform|infrastructure"}}'
    cmds:
      - |
        printf 'sweep %s\n' '{{.SWEEP}}'
        printf 'families: %s\n\n' '{{.FAMILY}}'
        printf '%s\t%s\n' 'board' 'trap that makes it read wrong'
        printf '%s\t%s\n' \
          'germantechjobs.de/rss.xml' 'www answers 301; a 167-byte 301 body reads as an empty feed' \
          'stepstone.de, six lane queries' 'detail pages need Referer: https://www.stepstone.de/jobs/devops-engineer; cards sit in an embedded companyName JSON' \
          'berlinstartupjobs /engineering/feed/' 'a listing is not a posting' \
          'weworkremotely remote-devops-sysadmin' 'US-only unless the ad says otherwise' \
          'remoteok /api' 'US-only unless the ad says otherwise' \
          'arbeitnow /api/job-board-api?page=1' '300 per page; page one is not the board' \
          'ashby camunda/kubermatic, personio 1KOMMA5GRAD, smartrecruiters DeliveryHero' 'employer feeds, not the market'
        printf '\nrules: dedupe by exact name and by house token before filing; read the detail page before a verdict;\n'
        printf 'band 1-5 from FIT_MAP, never 0 or 100; origin scout-{{.SWEEP}}, stage scouted; nothing sends before 2026-12-07.\n'
        printf 'exit: AGENTS.nix note job-scout-sweep-{{.SWEEP}} plus one xs turn naming the commit and the gate.\n'

  # The eleven Stepstone ads 25o read and parked on expiry are not rows: seven
  # leads from that cycle were filed and these waited on a validThrough inside
  # the send window. The date is the reason to look again, so it is carried here
  # — a parked lead with no date is a lead nobody rechecks.
  apps:scout:parked:
    desc: The leads parked on a posting's expiry — validThrough first, none filed (2026-11-25o)
    summary: >
      Eleven Stepstone ads from the 2026-11-25o read, parked on expiry rather
      than merit and never filed as rows because their validThrough falls inside
      the 2026-12-07 send hold. Each line carries the date the posting closes;
      when it passes the recheck is one read — gone, so it is dropped, or
      reposted, so it is filed with that cycle's origin. Prints only.
    vars:
      SWEEP: '{{.SWEEP | default "2026-11-25p"}}'
    cmds:
      - |
        printf '%s\t%s\t%s\n' 'validThrough' 'employer' 'note'
        printf '%s\t%s\t%s\n' \
          '2026-11-25' 'Pradtke' 'expired in the 25o read' \
          '2026-11-28' 'AUGENTIC' 'parked on expiry' \
          '2026-11-28' 'LAIQON' 'parked on expiry' \
          '2026-11-28' 'Liebherr-Digital' 'parked on expiry' \
          '2026-11-29' 'STULZ' 'parked on expiry' \
          '2026-11-30' 'BIOTRONIK' 'parked on expiry' \
          '2026-12-03' 'Liebherr-Digital' 'second posting' \
          '2026-12-03' 'ZaGoTec' 'parked on expiry' \
          '2026-12-04' 'EWE NETZ' 'parked on expiry' \
          '2026-12-05' 'novomind' 'parked on expiry' \
          '2026-12-07' 'HxGN' 'parked on expiry'
        printf '\nrecheck: read the posting once after its date; gone = drop, reposted = file at scout-{{.SWEEP}}.\n'

  apps:upsert:
    desc: Add or refresh one application record — JSON or TOON (CLI_ARGS is a file, or pipe stdin; FORMAT=toon for the row back)
    summary: >
      The write path for a record the hourly sync did not create. Send the whole
      object, camelCase or snake_case, with `id`, `company`, `role`, `status`,
      `stage` and the next action; the route 404s on a missing key, so the script
      fills every key it was not given with null instead of omitting it. Prints
      the stored id, company and stage. A re-run with the same id updates in
      place, so this is also the way to correct a row the mail got wrong.
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} upsert {{.CLI_ARGS}}

  apps:overview:
    desc: Pipeline summary - stage counts and how many carry a next action
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} overview

  apps:status:
    desc: Totals, newest change and open queue depth from the archive
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} status

  apps:doctor:
    desc: Which appflow transports this client has (API, SQL, Typst checkout, PII)
    summary: >
      Bounded probes, one per transport, so a missing piece answers no instead of
      hanging the shell. Every pipeline verb needs only the archive API over the
      tailnet; `query` needs SQL, which is the one verb with no API route; build,
      audit and followups need the Typst checkout; pii is per host.
    cmds:
      - "{{.APPS_DB}} doctor"

  # The sync itself is a unit on delphi (appflow-sync.timer, hourly), and each
  # run starts appflow-resolve.service for what the rules could not decide. This
  # shows what is waiting for them instead of running a second scanner by hand.
  apps:emails:
    desc: Messages waiting for agent:apps (the hourly sync on delphi drains them)
    cmds:
      - FORMAT="{{.FORMAT | default "toon"}}" {{.APPS_DB}} queue {{.CLI_ARGS}}

  # Rules first: a form, an alert, an automatic reply, a retention request, or an
  # acknowledgement that names an employer the tracker does not have. What they
  # cannot decide gets a ternary from the two System One engines (attribute /
  # ignore / unsure), and the unsures go to exactly one hermes turn, which may
  # attribute to a supplied candidate or retire the entry to the reversible
  # `ignore` tier. Nothing is written unless --apply; `--restore` undoes an ignore.
  apps:queue:resolve:
    desc: Attribute or close the appflow queue (dry default; -- --apply, --restore <id>)
    cmds:
      - bash scripts/task/apps-resolve.sh {{.CLI_ARGS}}

  # The workflow's applications.json is a generated artifact now. This writes it
  # on demand in the shape that repo reads; nothing schedules it.
  apps:export:
    desc: Write applications.json from the database (CLI_ARGS=<file>, default stdout)
    cmds:
      - "{{.APPS_DB}} export {{.CLI_ARGS}}"

  apps:query:
    desc: Read-only SQL against email_archive (task apps:query -- "select ...")
    cmds:
      - "{{.APPS_DB}} query {{.CLI_ARGS}}"

  # The Typst-checkout verbs delegate to frieren when /srv/data is not mounted
  # here — apps-typst.sh runs the same bin/appflow call in both cases.
  apps:followups:
    desc: View drafted recruiter follow-up notes from the workflow checkout (--copy <id>)
    cmds:
      - "APPS_DIR={{.APPS_DIR}} bash scripts/task/apps-typst.sh followups {{.CLI_ARGS}}"

  apps:build:
    desc: Compile Typst resumes/cover letters to dist/ (no args = --all)
    cmds:
      - "APPS_DIR={{.APPS_DIR}} bash scripts/task/apps-typst.sh build {{.CLI_ARGS}}"

  apps:audit:
    desc: QA layout, page budget, and orphan line audit on dist/
    cmds:
      - "APPS_DIR={{.APPS_DIR}} bash scripts/task/apps-typst.sh audit"

  apps:git:status:
    desc: Raw git status of the (retired as source) workflow checkout
    cmds:
      - "APPS_DIR={{.APPS_DIR}} bash scripts/task/apps-typst.sh git-status"

  # The text behind an application: the job description, a note that outgrew the
  # row. `import` reads $APPFLOW_JD_DIR (~/.config/appflow/jd) where those files
  # live today; a re-run skips a description whose bytes are already stored.
  apps:docs:import:
    desc: Import JD text files into the database (DIR= to override, DRY=1 to preview)
    cmds:
      - bash scripts/task/appflow-docs.sh import {{.CLI_ARGS}}

  apps:docs:
    desc: List the text the database holds, without bodies
    cmds:
      - bash scripts/task/appflow-docs.sh list

  apps:docs:show:
    desc: Print one application's stored text (task apps:docs:show -- <id> [kind])
    cmds:
      - bash scripts/task/appflow-docs.sh show {{.CLI_ARGS}}

  # The gap `apps:docs:import` fills, for a whole stage at once. Packet builds
  # fail one application at a time on missing text, which hides how many rows
  # are in that state; this is the count and the list (FAIL_ON_MISSING=1 gates).
  apps:docs:coverage:
    desc: Which rows of a stage still have no stored text (STAGE=, FAIL_ON_MISSING=1)
    cmds:
      - bash scripts/task/appflow-docs.sh coverage {{.CLI_ARGS}}

  # The other half of the deletion gate: a packet whose description came from
  # the database, not from `$APPFLOW_CONFIG/jd`. A task because building one is a
  # nix build; `checks:appflow:gate` is the read-only half.
  apps:gate:packet:
    desc: Build a packet from the database's own text (task apps:gate:packet -- <id>)
    cmds:
      - bash scripts/task/appflow-gate.sh packet {{.CLI_ARGS}}

  # The career corpus is the database's now: the JSON Resume files are exports,
  # so a role is added here and the artifact is rebuilt from the rows. `set`
  # changes only the flags it is given; `rm` needs --yes because prose does not
  # come back. Flags go through CLI_ARGS (`task career:add:role -- --employer …`).
  career:roles:
    desc: The roles in CV order (CLI_ARGS="--language de --json" to narrow)
    cmds:
      - bash scripts/task/content.sh career roles {{.CLI_ARGS}}

  career:projects:
    desc: The projects in CV order
    cmds:
      - bash scripts/task/content.sh career projects {{.CLI_ARGS}}

  career:show:
    desc: One role or project, every field (task career:show -- role ID)
    cmds:
      - bash scripts/task/content.sh career show {{.CLI_ARGS}}

  career:add:role:
    desc: Add a role (--employer and --position required, --highlight repeatable)
    cmds:
      - bash scripts/task/content.sh career add-role {{.CLI_ARGS}}

  career:add:project:
    desc: Add a project (--name required, --resume-name on the German row)
    cmds:
      - bash scripts/task/content.sh career add-project {{.CLI_ARGS}}

  career:set:role:
    desc: Edit one role; only the flags given change (task career:set:role -- ID --position …)
    cmds:
      - bash scripts/task/content.sh career set-role {{.CLI_ARGS}}

  career:set:project:
    desc: Edit one project; only the flags given change
    cmds:
      - bash scripts/task/content.sh career set-project {{.CLI_ARGS}}

  career:rm:role:
    desc: Delete one role (--yes required)
    cmds:
      - bash scripts/task/content.sh career rm-role {{.CLI_ARGS}}

  career:rm:project:
    desc: Delete one project (--yes required)
    cmds:
      - bash scripts/task/content.sh career rm-project {{.CLI_ARGS}}

  career:import:
    desc: Seed the rows from a JSON Resume (FROM=file; CLI_ARGS="--language de --dry")
    cmds:
      - bash scripts/task/content.sh career import --from "{{.FROM | default \"lib/matt/resume.json\"}}" {{.CLI_ARGS}}

  career:export:en:
    desc: Rebuild lib/matt/resume.json's work and projects from the rows
    cmds:
      - bash scripts/task/content.sh career export --into lib/matt/resume.json

  career:export:de:
    desc: Rebuild lib/matt/lebenslauf.json's work and projects from the German rows
    cmds:
      - bash scripts/task/content.sh career export --into lib/matt/lebenslauf.json --language de

  career:export:
    desc: Rebuild one JSON Resume from the rows (INTO=file; CLI_ARGS="--language de --out x")
    cmds:
      - bash scripts/task/content.sh career export --into "{{.INTO}}" {{.CLI_ARGS}}

  # The portfolio is the second corpus on the same wire: rows in
  # `portfolio_project`, `lib/bountystash/portfolio.json` as the export. A
  # translated project names its English title because the German file does not,
  # and `import --language de` pairs by position and refuses a count mismatch.
  portfolio:projects:
    desc: The portfolio projects in page order (CLI_ARGS="--language de --json")
    cmds:
      - bash scripts/task/content.sh portfolio projects {{.CLI_ARGS}}

  portfolio:show:
    desc: One project, every field (task portfolio:show -- ID)
    cmds:
      - bash scripts/task/content.sh portfolio show {{.CLI_ARGS}}

  portfolio:add:
    desc: Add a project (--title required; --links "Label=href" repeatable)
    cmds:
      - bash scripts/task/content.sh portfolio add-project {{.CLI_ARGS}}

  portfolio:set:
    desc: Edit one project; only the flags given change (--featured / --no-featured)
    cmds:
      - bash scripts/task/content.sh portfolio set-project {{.CLI_ARGS}}

  portfolio:rm:
    desc: Delete one project (--yes required)
    cmds:
      - bash scripts/task/content.sh portfolio rm-project {{.CLI_ARGS}}

  portfolio:import:
    desc: Seed the rows from a portfolio JSON (FROM=file; CLI_ARGS="--language de --dry")
    cmds:
      - bash scripts/task/content.sh portfolio import --from "{{.FROM | default \"lib/bountystash/portfolio.json\"}}" {{.CLI_ARGS}}

  portfolio:export:en:
    desc: Rebuild lib/bountystash/portfolio.json's projects from the rows
    cmds:
      - bash scripts/task/content.sh portfolio export --into lib/bountystash/portfolio.json

  portfolio:export:de:
    desc: Rebuild lib/bountystash/portfolio.de.json's projects from the German rows
    cmds:
      - bash scripts/task/content.sh portfolio export --into lib/bountystash/portfolio.de.json --language de

  portfolio:export:
    desc: Rebuild one portfolio JSON from the rows (INTO=file; CLI_ARGS="--language de")
    cmds:
      - bash scripts/task/content.sh portfolio export --into "{{.INTO}}" {{.CLI_ARGS}}

  # The private half of the personal data. Published sites build only what the
  # page renders; a phone number or a referee lives sops-encrypted and reaches a
  # document here, at runtime, never through a site build.
  apps:pii:sync:
    desc: Decrypt the private personal data (modules/secrets/pii.yaml) to ~/.config/appflow/pii.json
    cmds:
      - bash scripts/task/pii.sh sync

  apps:menu:
    desc: Interactive Charmbracelet Gum menu for the job application workflow
    cmds:
      - |
        action=$(printf '%s\n' \
          "list: List tracked applications" \
          "search: Search by company, role, ID, or keywords" \
          "get: View one application and its mail" \
          "add: Track a new application" \
          "update: Update application status" \
          "overview: Pipeline counts per stage" \
          "status: Totals and open queue" \
          "emails: Messages waiting for the sync" \
          "resolve: Attribute or close the mail queue" \
          "docs: Stored text (JD bodies) in the database" \
          "export: Write applications.json from the database" \
          "build: Compile Typst documents to dist/" \
          "audit: QA layout and page budget" \
          "exit: Quit" | gum choose --header "Job Applications (appflow, Postgres)")

        case "$action" in
          "list"*)
            task apps:list
            ;;
          "search"*)
            task apps:search -- "$(gum input --placeholder 'search query')"
            ;;
          "get"*)
            task apps:get -- "$(gum input --placeholder 'application id')"
            ;;
          "add"*)
            company=$(gum input --placeholder 'company')
            role=$(gum input --placeholder 'role')
            url=$(gum input --placeholder 'apply URL (optional)')
            args=(--company "$company" --role "$role")
            [ -n "$url" ] && args+=(--apply-url "$url")
            task apps:add -- "${args[@]}"
            ;;
          "update"*)
            task apps:update -- "$(gum input --placeholder 'id --status Applied')"
            ;;
          "overview"*)
            task apps:overview
            ;;
          "status"*)
            task apps:status
            ;;
          "emails"*)
            task apps:emails
            ;;
          "resolve"*)
            task apps:queue:resolve
            ;;
          "docs"*)
            task apps:docs
            ;;
          "export"*)
            task apps:export -- "$(gum input --placeholder 'output file')"
            ;;
          "build"*)
            task apps:build
            ;;
          "audit"*)
            task apps:audit
            ;;
          *)
            echo "Exited."
            ;;
        esac
