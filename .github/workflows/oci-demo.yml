name: oci-demo

# Two tiers, because only one of them can run anywhere.
#
# static  - every push and PR touching the project: format, validate, shell
#           syntax and shellcheck. No credentials, no cloud calls.
# live    - dispatch only: runs scripts/verify.sh against the real tenancy. That
#           fails on an unhealthy backend, a missing secret, an alarm in FIRING,
#           or an A record that no longer points at the load balancer.
# drift   - dispatch only, self-hosted: runs adb-sql.sh --apex-check, which is the
#           only gate that can catch a stale APEX export. It needs a runner whose
#           egress is inside the bastion's client CIDR, an open port-forward, and
#           SQLcl — a hosted runner can do none of that, so it is a separate job
#           rather than a silently skipped step.
#
# Secrets used by the live and drift jobs:
#   OCI_CLI_USER, OCI_CLI_TENANCY, OCI_CLI_FINGERPRINT, OCI_CLI_KEY_CONTENT,
#   OCI_CLI_REGION                      API key + region for the CLI and the backend
#   OCI_TF_BUCKET, OCI_TF_NAMESPACE     remote state coordinates
#   TF_OPERATOR_CIDR, TF_SSH_PUBLIC_KEY, TF_NOTIFICATION_EMAIL
#                                       the required terraform variables
# Optional repository variable for the drift job: OCI_DEMO_ADB_LOCAL_PORT (1522).

on:
  push:
    paths:
      - "projects/oci-always-free-demo/**"
      - ".github/workflows/oci-demo.yml"
  pull_request:
    paths:
      - "projects/oci-always-free-demo/**"
  workflow_dispatch:
    inputs:
      live:
        description: "Run the live checks against the tenancy"
        type: boolean
        default: false
      drift:
        description: "Run the APEX export drift check (needs the self-hosted runner and an open tunnel)"
        type: boolean
        default: false

concurrency:
  group: oci-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/oci-always-free-demo
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/oci-always-free-demo
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_TF_BUCKET: ${{ secrets.OCI_TF_BUCKET }}
      OCI_TF_NAMESPACE: ${{ secrets.OCI_TF_NAMESPACE }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_CLI_TENANCY }}
      TF_VAR_operator_cidr: ${{ secrets.TF_OPERATOR_CIDR }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
      TF_VAR_notification_email: ${{ secrets.TF_NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install OCI CLI
        run: |
          python3 -m pip install --quiet --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: API key
        env:
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Init remote state
        run: |
          cat > backend.hcl <<EOF
          bucket    = "$OCI_TF_BUCKET"
          namespace = "$OCI_TF_NAMESPACE"
          region    = "$OCI_CLI_REGION"
          EOF
          terraform init -backend-config=backend.hcl -input=false -no-color

      - name: Verify deployment
        run: scripts/verify.sh

  drift:
    if: github.event_name == 'workflow_dispatch' && inputs.drift
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: projects/oci-always-free-demo
    env:
      ADB_LOCAL_PORT: ${{ vars.OCI_DEMO_ADB_LOCAL_PORT || '1522' }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_TF_BUCKET: ${{ secrets.OCI_TF_BUCKET }}
      OCI_TF_NAMESPACE: ${{ secrets.OCI_TF_NAMESPACE }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_CLI_TENANCY }}
      TF_VAR_operator_cidr: ${{ secrets.TF_OPERATOR_CIDR }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
      TF_VAR_notification_email: ${{ secrets.TF_NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: API key
        env:
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Init remote state
        run: |
          cat > backend.hcl <<EOF
          bucket    = "$OCI_TF_BUCKET"
          namespace = "$OCI_TF_NAMESPACE"
          region    = "$OCI_CLI_REGION"
          EOF
          terraform init -backend-config=backend.hcl -input=false -no-color

      - name: Preflight
        run: scripts/preflight.sh

      - name: APEX export drift
        run: scripts/adb-sql.sh --apex-check
