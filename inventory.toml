gpu = "Intel UHD Graphics 620 @ 1.10 GHz (QuickSync VA-API H.264/HEVC/H.265 4K)"
ram = "11.47 GiB DDR4 (4GB soldered + 8GB SO-DIMM) + 13.73 GiB swap (8GB disk + 5.7GB zram)"
