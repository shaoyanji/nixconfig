version: "3"

vars:
  # The workflow checkout is retired as a source of truth (86bdb73b, 2026-11-03):
  # its applications.json is an export, and its bin/appflow still builds the
  # Typst documents. Everything that reads or writes the pipeline goes through
  # the archive API on delphi — scripts/task/apps-db.sh.
  APPS_DIR: "/srv/data/projects/antigravity-application-workflow"
  APPS_BIN: "{{.APPS_DIR}}/bin/appflow"
  APPS_RUN: "nix-shell -p python3 --run"
  APPS_DB: "bash scripts/task/apps-db.sh"

tasks:
  apps:list:
    desc: List tracked applications from the archive database
    cmds:
      - "{{.APPS_DB}} list {{.CLI_ARGS}}"

  apps:search:
    desc: Search applications (company, role, status, id, next action)
    cmds:
      - "{{.APPS_DB}} search {{.CLI_ARGS}}"

  apps:get:
    desc: View one application and the mail linked to it
    cmds:
      - "{{.APPS_DB}} get {{.CLI_ARGS}}"

  apps:update:
    desc: Update status in Postgres (task apps:update -- <id> --status Rejected [--next-action none])
    cmds:
      - "{{.APPS_DB}} update {{.CLI_ARGS}}"

  apps:overview:
    desc: Pipeline summary - stage counts and how many carry a next action
    cmds:
      - "{{.APPS_DB}} overview"

  apps:status:
    desc: Totals, newest change and open queue depth from the archive
    cmds:
      - "{{.APPS_DB}} status"

  # The sync itself is a unit on delphi (appflow-sync.timer, hourly), and each
  # run starts appflow-resolve.service for what the rules could not decide. This
  # shows what is waiting for them instead of running a second scanner by hand.
  apps:emails:
    desc: Messages waiting for agent:apps (the hourly sync on delphi drains them)
    cmds:
      - "{{.APPS_DB}} queue {{.CLI_ARGS}}"

  # Rules first: a form, an alert, an automatic reply, a retention request, or an
  # acknowledgement that names an employer the tracker does not have. What they
  # cannot decide gets a ternary from the two System One engines (attribute /
  # ignore / unsure), and the unsures go to exactly one hermes turn, which may
  # attribute to a supplied candidate or retire the entry to the reversible
  # `ignore` tier. Nothing is written unless APPLY=1; `--restore` undoes an ignore.
  apps:queue:resolve:
    desc: Attribute or close the appflow queue (dry default; --apply, --restore <id>)

  # The workflow's applications.json is a generated artifact now. This writes it
  # on demand in the shape that repo reads; nothing schedules it.
  apps:export:
    desc: Write applications.json from the database (CLI_ARGS=<file>, default stdout)
    cmds:
      - "{{.APPS_DB}} export {{.CLI_ARGS}}"

  apps:query:
    desc: Read-only SQL against email_archive (task apps:query -- "select ...")
    cmds:
      - "{{.APPS_DB}} query {{.CLI_ARGS}}"

  apps:followups:
    desc: View drafted recruiter follow-up notes from the workflow checkout (--copy <id>)
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} followups {{.CLI_ARGS}}\""

  apps:build:
    desc: Compile Typst resumes/cover letters to dist/ (no args = --all)
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} build {{.CLI_ARGS}}\""

  apps:audit:
    desc: QA layout, page budget, and orphan line audit on dist/
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} audit\""

  apps:git:status:
    desc: Raw git status of the (retired as source) workflow checkout
    cmds:
      - git -C "{{.APPS_DIR}}" status -sb

  # The text behind an application: the job description, a note that outgrew the
  # row. `import` reads $APPFLOW_JD_DIR (~/.config/appflow/jd) where those files
  # live today; a re-run skips a description whose bytes are already stored.
  apps:docs:import:
    desc: Import JD text files into the database (DIR= to override, DRY=1 to preview)
    cmds:
      - bash scripts/task/appflow-docs.sh import {{.CLI_ARGS}}

  apps:docs:
    desc: List the text the database holds, without bodies
    cmds:
      - bash scripts/task/appflow-docs.sh list

  apps:docs:show:
    desc: Print one application's stored text (task apps:docs:show -- <id> [kind])
    cmds:
      - bash scripts/task/appflow-docs.sh show {{.CLI_ARGS}}

  # The other half of the deletion gate: a packet whose description came from
  # the database, not from `$APPFLOW_CONFIG/jd`. A task because building one is a
  # nix build; `checks:appflow:gate` is the read-only half.
  apps:gate:packet:
    desc: Build a packet from the database's own text (task apps:gate:packet -- <id>)
    cmds:
      - bash scripts/task/appflow-gate.sh packet {{.CLI_ARGS}}

  # The career corpus is the database's now: the JSON Resume files are exports,
  # so a role is added here and the artifact is rebuilt from the rows. `set`
  # changes only the flags it is given; `rm` needs --yes because prose does not
  # come back. Flags go through CLI_ARGS (`task career:add:role -- --employer …`).
  career:roles:
    desc: The roles in CV order (CLI_ARGS="--language de --json" to narrow)
    cmds:
      - bash scripts/task/content.sh career roles {{.CLI_ARGS}}

  career:projects:
    desc: The projects in CV order
    cmds:
      - bash scripts/task/content.sh career projects {{.CLI_ARGS}}

  career:show:
    desc: One role or project, every field (task career:show -- role ID)
    cmds:
      - bash scripts/task/content.sh career show {{.CLI_ARGS}}

  career:add:role:
    desc: Add a role (--employer and --position required, --highlight repeatable)
    cmds:
      - bash scripts/task/content.sh career add-role {{.CLI_ARGS}}

  career:add:project:
    desc: Add a project (--name required, --resume-name on the German row)
    cmds:
      - bash scripts/task/content.sh career add-project {{.CLI_ARGS}}

  career:set:role:
    desc: Edit one role; only the flags given change (task career:set:role -- ID --position …)
    cmds:
      - bash scripts/task/content.sh career set-role {{.CLI_ARGS}}

  career:set:project:
    desc: Edit one project; only the flags given change
    cmds:
      - bash scripts/task/content.sh career set-project {{.CLI_ARGS}}

  career:rm:role:
    desc: Delete one role (--yes required)
    cmds:
      - bash scripts/task/content.sh career rm-role {{.CLI_ARGS}}

  career:rm:project:
    desc: Delete one project (--yes required)
    cmds:
      - bash scripts/task/content.sh career rm-project {{.CLI_ARGS}}

  career:import:
    desc: Seed the rows from a JSON Resume (FROM=file; CLI_ARGS="--language de --dry")
    cmds:
      - bash scripts/task/content.sh career import --from "{{.FROM | default \"lib/matt/resume.json\"}}" {{.CLI_ARGS}}

  career:export:en:
    desc: Rebuild lib/matt/resume.json's work and projects from the rows
    cmds:
      - bash scripts/task/content.sh career export --into lib/matt/resume.json

  career:export:de:
    desc: Rebuild lib/matt/lebenslauf.json's work and projects from the German rows
    cmds:
      - bash scripts/task/content.sh career export --into lib/matt/lebenslauf.json --language de

  career:export:
    desc: Rebuild one JSON Resume from the rows (INTO=file; CLI_ARGS="--language de --out x")
    cmds:
      - bash scripts/task/content.sh career export --into "{{.INTO}}" {{.CLI_ARGS}}

  # The portfolio is the second corpus on the same wire: rows in
  # `portfolio_project`, `lib/bountystash/portfolio.json` as the export. A
  # translated project names its English title because the German file does not,
  # and `import --language de` pairs by position and refuses a count mismatch.
  portfolio:projects:
    desc: The portfolio projects in page order (CLI_ARGS="--language de --json")
    cmds:
      - bash scripts/task/content.sh portfolio projects {{.CLI_ARGS}}

  portfolio:show:
    desc: One project, every field (task portfolio:show -- ID)
    cmds:
      - bash scripts/task/content.sh portfolio show {{.CLI_ARGS}}

  portfolio:add:
    desc: Add a project (--title required; --links "Label=href" repeatable)
    cmds:
      - bash scripts/task/content.sh portfolio add-project {{.CLI_ARGS}}

  portfolio:set:
    desc: Edit one project; only the flags given change (--featured / --no-featured)
    cmds:
      - bash scripts/task/content.sh portfolio set-project {{.CLI_ARGS}}

  portfolio:rm:
    desc: Delete one project (--yes required)
    cmds:
      - bash scripts/task/content.sh portfolio rm-project {{.CLI_ARGS}}

  portfolio:import:
    desc: Seed the rows from a portfolio JSON (FROM=file; CLI_ARGS="--language de --dry")
    cmds:
      - bash scripts/task/content.sh portfolio import --from "{{.FROM | default \"lib/bountystash/portfolio.json\"}}" {{.CLI_ARGS}}

  portfolio:export:en:
    desc: Rebuild lib/bountystash/portfolio.json's projects from the rows
    cmds:
      - bash scripts/task/content.sh portfolio export --into lib/bountystash/portfolio.json

  portfolio:export:de:
    desc: Rebuild lib/bountystash/portfolio.de.json's projects from the German rows
    cmds:
      - bash scripts/task/content.sh portfolio export --into lib/bountystash/portfolio.de.json --language de

  portfolio:export:
    desc: Rebuild one portfolio JSON from the rows (INTO=file; CLI_ARGS="--language de")
    cmds:
      - bash scripts/task/content.sh portfolio export --into "{{.INTO}}" {{.CLI_ARGS}}

  # The private half of the personal data. Published sites build only what the
  # page renders; a phone number or a referee lives sops-encrypted and reaches a
  # document here, at runtime, never through a site build.
  apps:pii:sync:
    desc: Decrypt the private personal data (modules/secrets/pii.yaml) to ~/.config/appflow/pii.json
    cmds:
      - bash scripts/task/pii.sh sync

  apps:menu:
    desc: Interactive Charmbracelet Gum menu for the job application workflow
    cmds:
      - |
        action=$(printf '%s\n' \
          "list: List tracked applications" \
          "search: Search by company, role, ID, or keywords" \
          "get: View one application and its mail" \
          "update: Update application status" \
          "overview: Pipeline counts per stage" \
          "status: Totals and open queue" \
          "emails: Messages waiting for the sync" \
          "export: Write applications.json from the database" \
          "build: Compile Typst documents to dist/" \
          "audit: QA layout and page budget" \
          "exit: Quit" | gum choose --header "Job Applications (appflow, Postgres)")

        case "$action" in
          "list"*)
            task apps:list
            ;;
          "search"*)
            task apps:search -- "$(gum input --placeholder 'search query')"
            ;;
          "get"*)
            task apps:get -- "$(gum input --placeholder 'application id')"
            ;;
          "update"*)
            task apps:update -- "$(gum input --placeholder 'id --status Applied')"
            ;;
          "overview"*)
            task apps:overview
            ;;
          "status"*)
            task apps:status
            ;;
          "emails"*)
            task apps:emails
            ;;
          "export"*)
            task apps:export -- "$(gum input --placeholder 'output file')"
            ;;
          "build"*)
            task apps:build
            ;;
          "audit"*)
            task apps:audit
            ;;
          *)
            echo "Exited."
            ;;
        esac
