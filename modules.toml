# ------------------------------------------------------------------------------
# 3. SYSTEM ROLES
# ------------------------------------------------------------------------------
[knobs.role-heim]
name = "Heim Full Workstation Role"
type = "role"
category = "roles"
option = "roles.heim.enable"
path = "modules/roles/heim.nix"
description = "Full daily-driver developer workstation with GUI and user tooling"
default = false
