desktop_environment = "niri (Wayland) via greetd/dms-greeter autologin (4K TV output)"
users = ["devji"]

[hosts.frieren.hardware]
model = "Lenovo ideapad 320-15IKB (Type 81BG, Laptop-as-Server & Media Center)"
