version: "3"

tasks:
  services:validate:host:*:
    desc: Validate a deployed host (systemd overall state over ssh)
    summary: >
      Proves the host actually came up after a switch by asking systemd for its
      overall state. Transport is TARGET (default: the host name), so a host
      whose ssh alias points at the tailnet can still be validated over the LAN
      with TARGET=user@<lan-ip> — the same knob infra:apply:host:* takes, which
      keeps the two steps composable.
      Vars: TARGET= (default: <host>).
    vars:
      HOST: '{{index .MATCH 0}}'
      TARGET: '{{.TARGET | default .HOST}}'
    cmds:
      - |
        state=$(ssh {{.TARGET}} "systemctl is-system-running 2>/dev/null || true")
        echo "Host {{.HOST}} systemd state: $state"
        case "$state" in
          running)
            exit 0
            ;;
          degraded)
            echo "WARNING: Host {{.HOST}} is running in degraded state. Failed units:" >&2
            ssh {{.TARGET}} "systemctl --failed --no-pager" >&2 || true
            exit 0
            ;;
          starting)
            echo "Host {{.HOST}} is still starting up; waiting 5s..."
            sleep 5
            state=$(ssh {{.TARGET}} "systemctl is-system-running 2>/dev/null || true")
            echo "Host {{.HOST}} systemd state: $state"
            [ "$state" = "running" ] || [ "$state" = "degraded" ]
            ;;
          *)
            echo "ERROR: Host {{.HOST}} systemd state is unhealthy: $state" >&2
            exit 1
            ;;
        esac

  services:record:host:*:
    desc: Record deployment outcome in git (manual/operator-triggered)
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - task dev:git:stage
      - git commit -m "nix-build was successful on {{.HOST}}"
      - git push

  services:rollback:apply:host:*:
    desc: Alias for infra:rollback:apply:host:*
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - task infra:rollback:apply:host:{{.HOST}}

  services:evidence:rollback:host:*:
    desc: Validate after rollback
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - task services:validate:host:{{.HOST}}

  services:rollback:host:*:
    desc: Roll back host, re-validate, and capture rollback evidence
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - task infra:rollback:host:{{.HOST}}
      - task services:evidence:rollback:host:{{.HOST}}

  services:deploy:host:*:
    desc: Plan + apply + validate a specific remote host (no git side effects)
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - task infra:deploy:host:{{.HOST}}

  services:logs:host:*:
    desc: Alias for infra:logs:host:*
    vars:
      HOST: '{{index .MATCH 0}}'
      UNIT: '{{.UNIT | default "go-backend"}}'
    cmds:
      - task infra:logs:host:{{.HOST}} UNIT={{.UNIT}}
