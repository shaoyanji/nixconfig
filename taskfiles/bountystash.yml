version: "3"

vars:
  BOUNTY_DIR: "/Volumes/data/projects/bountystash-console"
  # The Pages project is `cv-resume` — Cloudflare appended `-40q` to its
  # pages.dev subdomain because the bare name is taken — and `bountystash.com` is
  # a custom domain on that one project. Checked against the live host on
  # 2026-11-08: `cv-resume-40q.pages.dev` and the custom domain serve the same
  # `CV - Shaoyan (Matt) Ji` document, and `bountystash.pages.dev` does not exist.
  # Do not "fix" this name: a deploy to a nonexistent project creates one.
  PROJECT_NAME: "cv-resume"
  PROJECT_MATT: "matt"
  PROJECT_MOCKUP: "bountystash-mockup"

tasks:
  bountystash:login:
    desc: Authenticate Wrangler with Cloudflare via OAuth device flow
    cmds:
      - nix-shell -p wrangler --run "wrangler login --device"

  bountystash:whoami:
    desc: Display currently authenticated Cloudflare account
    cmds:
      - nix-shell -p wrangler --run "wrangler whoami"

  bountystash:status:
    desc: HTTP health check on production (bountystash.com) and preview endpoints
    cmds:
      - |
        echo "=== Production (https://bountystash.com) ==="
        curl -Is https://bountystash.com | head -n 6
        echo ""
        echo "=== Preview (https://preview.cv-resume-40q.pages.dev) ==="
        curl -Is https://preview.cv-resume-40q.pages.dev | head -n 6

  bountystash:build:
    desc: Compile modern brutalist console & validate 14KB TCP envelope
    cmds:
      - nix-shell -p nodejs --run "cd {{.BOUNTY_DIR}} && node scripts/build.js"

  bountystash:preview:
    desc: Launch zero-dependency local preview server on http://localhost:3000
    cmds:
      - nix-shell -p nodejs --run "cd {{.BOUNTY_DIR}} && npm run preview"

  bountystash:dev:
    desc: Local Cloudflare Edge emulation server via wrangler pages dev
    cmds:
      - task: bountystash:build
      - nix-shell -p wrangler --run "cd {{.BOUNTY_DIR}} && wrangler pages dev dist"

  bountystash:deploy:preview:
    desc: Deploy preview branch to Cloudflare Pages (generates unique URL)
    cmds:
      - task: bountystash:build
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy {{.BOUNTY_DIR}}/dist --project-name={{.PROJECT_NAME}} --branch=preview"

  bountystash:deploy:prod:
    desc: Deploy live production to Cloudflare Pages (bountystash.com)
    cmds:
      - task: bountystash:build
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy {{.BOUNTY_DIR}}/dist --project-name={{.PROJECT_NAME}} --branch=main"

  # The Nix-rendered site (flake output `.#bountystash-site`). It deliberately
  # does NOT run `bountystash:build`: that compiles the console's template into
  # `dist/`, and deploying the Nix artifact means the artifact is the input.
  bountystash:deploy:nix:preview:
    desc: Deploy the Nix-rendered portfolio (.#sites.bountystash-site) to a Pages preview branch
    cmds:
      - nix build --builders "" --out-link "/tmp/bountystash-site" .#sites.bountystash-site
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy /tmp/bountystash-site --project-name={{.PROJECT_NAME}} --branch=preview"

  bountystash:deploy:nix:prod:
    desc: "[destructive] Publish the Nix-rendered portfolio to bountystash.com"
    cmds:
      - nix build --builders "" --out-link "/tmp/bountystash-site" .#sites.bountystash-site
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy /tmp/bountystash-site --project-name={{.PROJECT_NAME}} --branch=main"

  bountystash:projects:
    desc: List all Cloudflare Pages projects in account
    cmds:
      - nix-shell -p wrangler --run "wrangler pages project list"

  bountystash:git:pull:
    desc: Pull latest design updates from GitHub (shaoyanji/bountystash-console)
    cmds:
      - git -C {{.BOUNTY_DIR}} pull --ff-only

  bountystash:git:push:
    desc: Push commits to GitHub (triggers interactive Cloudflare deploy nudge)
    cmds:
      - git -C {{.BOUNTY_DIR}} push origin main

  bountystash:git:status:
    desc: Check git status of local bountystash-console
    cmds:
      - git -C {{.BOUNTY_DIR}} status -s

  bountystash:hook:install:
    desc: Install git pre-push Cloudflare deploy nudge hook in bountystash-console
    cmds:
      - cp {{.BOUNTY_DIR}}/scripts/pre-push.sh {{.BOUNTY_DIR}}/.git/hooks/pre-push
      - chmod +x {{.BOUNTY_DIR}}/.git/hooks/pre-push
      - echo "Installed .git/hooks/pre-push successfully."

  # matt.bountystash.com — the personal page. It is its own Pages project rather
  # than a route on `cv-resume`, so a deploy of the portfolio cannot overwrite the
  # page a cold-mail recipient opens.
  matt:build:
    desc: Build matt.bountystash.com (flake output .#sites.matt-site)
    cmds:
      - nix build --builders "" --out-link /tmp/matt-site .#sites.matt-site -L

  matt:init:
    desc: Create the Cloudflare Pages project for matt.bountystash.com (idempotent)
    cmds:
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages project create {{.PROJECT_MATT}} --production-branch=main"

  matt:deploy:preview:
    desc: Deploy matt.bountystash.com to a Cloudflare Pages preview branch
    cmds:
      - task: matt:build
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy /tmp/matt-site --project-name={{.PROJECT_MATT}} --branch=preview"

  matt:deploy:prod:
    desc: "[destructive] Publish matt.bountystash.com live"
    cmds:
      - task: matt:build
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy /tmp/matt-site --project-name={{.PROJECT_MATT}} --branch=main"

  matt:status:
    desc: HTTP status of matt.bountystash.com
    cmds:
      - curl -Is https://matt.bountystash.com | head -n 6

  # The bug-bounty concept mockup: sample data, `noindex`, its own Pages project.
  # Publishing it to bountystash.com itself is deliberately not a task.
  mockup:build:
    desc: Build the bountystash bug-bounty concept mockup (.#sites.bountystash-mockup)
    cmds:
      - nix build --builders "" --out-link /tmp/bountystash-mockup .#sites.bountystash-mockup -L

  mockup:init:
    desc: Create the Cloudflare Pages project for the mockup (idempotent)
    cmds:
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages project create {{.PROJECT_MOCKUP}} --production-branch=main"

  mockup:deploy:preview:
    desc: Deploy the mockup to a Cloudflare Pages preview branch
    cmds:
      - task: mockup:build
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy /tmp/bountystash-mockup --project-name={{.PROJECT_MOCKUP}} --branch=preview"

  mockup:deploy:prod:
    desc: "[destructive] Publish the mockup to its own *.pages.dev production URL"
    cmds:
      - task: mockup:build
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages deploy /tmp/bountystash-mockup --project-name={{.PROJECT_MOCKUP}} --branch=main"

  mockup:status:
    desc: HTTP status of the mockup on concept.bountystash.com and its pages.dev URL
    cmds:
      - curl -Is https://concept.bountystash.com | head -n 6
      - curl -Is https://bountystash-mockup.pages.dev | head -n 6

  bountystash:menu:
    desc: Interactive Charmbracelet Gum menu for Bountystash Console operations
    cmds:
      - |
        action=$(printf '%s\n' \
          "build: Compile 14KB brutalist console (dist/index.html)" \
          "preview: Run zero-dependency local preview (port 3000)" \
          "dev: Cloudflare Edge emulation (wrangler pages dev)" \
          "deploy:preview: Deploy preview branch to Cloudflare Pages" \
          "deploy:prod: Deploy live production to bountystash.com" \
          "projects: List Cloudflare Pages projects" \
          "git:pull: Pull updates from GitHub" \
          "git:push: Push commits to GitHub (with Cloudflare nudge)" \
          "whoami: Check Cloudflare authentication status" \
          "login: Authenticate Wrangler via device OAuth" \
          "exit: Quit" | gum choose --header "💰 Bountystash Console Control Plane")

        case "$action" in
          "build"*)
            task bountystash:build
            ;;
          "preview"*)
            task bountystash:preview
            ;;
          "dev"*)
            task bountystash:dev
            ;;
          "deploy:preview"*)
            task bountystash:deploy:preview
            ;;
          "deploy:prod"*)
            task bountystash:deploy:prod
            ;;
          "projects"*)
            task bountystash:projects
            ;;
          "git:pull"*)
            task bountystash:git:pull
            ;;
          "git:push"*)
            task bountystash:git:push
            ;;
          "whoami"*)
            task bountystash:whoami
            ;;
          "login"*)
            task bountystash:login
            ;;
          *)
            echo "Exited."
            ;;
        esac
