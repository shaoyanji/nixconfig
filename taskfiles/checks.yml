version: "3"

tasks:
  # HONEST SCOPE. This task used to end with four
  # `nix eval .?submodules=1#nixosConfigurations.<h>.config.networking.hostName` lines. Those
  # forced ONE option and type-checked nothing else, so they could not fail on
  # the class of error that actually happens (EXP-114: an invalid
  # `networkmanager.dispatcherScripts.*.type = "up"` "passed" that smoke test on
  # four hosts and only surfaced in a build). Four nix processes, zero proof —
  # removed rather than replaced with whole-toplevel forces, which on this 11 GiB
  # host were measured at >120 s with swap and are O(hosts) in memory. The config
  # gate is `checks:host` (all assertions, one host, ~13 s / 720 MiB).
  # REBUILD RULE: never run this (or any checks task) as a pre-flight for a
  # local rebuild. `nixos-rebuild switch` evaluates and builds the host; a check
  # first is a second evaluation for no extra proof. This task is repo hygiene,
  # not a config gate. `checks:build:route` is the one that forces a whole
  # toplevel and is CI/operator-only — it is no longer wired into any switch.
  checks:quick:
    desc: Run narrow repo checks (repo HYGIENE — evaluates no host config)
    aliases: [check]
    summary: >
      Bounded repo hygiene — "is the repo internally consistent", not "does host
      X evaluate": compiled inventory, task graph, knowledge graph and sidecar
      parity, skill task-mirrors, nix lint, sops drift, modules.toml. No
      nixosConfiguration is forced; that is `checks:host HOST=<h>` (~13 s / 720
      MiB) or `checks:hosts HOSTS="a b"`.

      Not `nix flake check`: 23 configs, 6078 MiB, SIGKILL 137 here. Shape:
      independent gates are parallel `deps` (12.8 s -> 8.2 s on delphi), then
      one serial flake eval (8 s, `policies` 7.5 s of it), then the timing gate
      `entry` alone — ~22 s total. Exit 0 = clean.
    vars:
      # These checks are per-system and the flake has them for aarch64-linux too,
      # but the attribute was pinned to x86_64-linux — so on delphi (aarch64, the
      # ARM64 build offloader) every one of them was a platform mismatch and this
      # gate could not run at all. Resolved from the running system, per
      # scripts/task/taskfile-graph.sh.
      SYSTEM:
        sh: nix eval --impure --raw --expr builtins.currentSystem
    # The independent gates run CONCURRENTLY (go-task runs `deps` in parallel);
    # none of them writes, and every one is a text scan or a leaf eval, so the
    # sum of their runtimes was waiting rather than work. Measured on delphi
    # (2 cores): 12.8 s sequential -> 8.2 s parallel. Not 2x, because `tasks` and
    # `kg` each start their own nix eval and three of those contend for the two
    # cores; the floor is a shared eval, not more concurrency.
    deps:
      - task: checks:repo:paths
      - task: checks:docs:links
      - task: checks:prose
      - task: checks:yaml:lint
      - task: checks:toon
      - task: checks:toon:surfaces
      - task: checks:tasks
      - task: checks:skills:mirror
      - task: checks:kg
      # `checks:kg:iets` stays out on purpose: it is two uncached full evals
      # (~3 s) for a parity experiment, and its own summary says so.
      - task: checks:ports:test
      - task: checks:nix:lint
      - task: checks:nix:shell
      - task: checks:modules:edges
      # The check inventory (taskfiles/checks.toml): every checks:* task has a row
      # and every row names a task, so the three verbs cannot drift from the tree.
      - task: check:verify
    # Serial on purpose, in this order. The build leg is ONE flake eval (`policies`
    # is ~7.5 s of it, the other attrs are ~1 s together); `knobs` rides along in
    # that same process for ~0.1 s and is the compiled registry gate, strictly
    # stronger than the bash smoke check it replaces here (`checks:modules:validate`
    # still exists for hosts that cannot evaluate `checks.<system>`). `entry` is a
    # TIMING gate with a min-of-3 budget, so it must never share a core: it goes
    # last, after the deps have finished and every other task has exited.
    cmds:
      - nix build --no-link --builders "" .?submodules=1#checks.{{.SYSTEM}}.inventory-schema .?submodules=1#checks.{{.SYSTEM}}.inventory-hosts .?submodules=1#checks.{{.SYSTEM}}.inventory-modules .?submodules=1#checks.{{.SYSTEM}}.knobs .?submodules=1#checks.{{.SYSTEM}}.site-assets .?submodules=1#checks.{{.SYSTEM}}.policies
      - task: checks:sops:drift
      - task: checks:entry

  checks:docs:links:
    desc: "[gate] Every markdown link resolves, and none points at a machine path"
    summary: >
      Scans tracked markdown for two classes found on 2026-10-20: a
      `file:///Volumes/...` link to one machine's checkout (dead everywhere else,
      and a local path in a public doc), and a relative path that is simply
      wrong. Web links and anchors are skipped. A deliberate dangling pointer
      carries `link-ok: <reason>` on its line. ~0.1 s, no network, no eval.
    cmds:
      - bash scripts/task/docs-links.sh

  checks:prose:
    desc: "[gate] Docs and skills carry none of the unslop vocabulary"
    summary: >
      The machine-checkable half of `.agents/skills/unslop` (rules 7, 8, 19, 20,
      23, 26, 31), over fenced-code-stripped prose. The words are one file,
      `modules/config/prose-tells.tsv`, which this gate and the skill both read,
      so neither carries a second copy; `VOCAB=1` prints them by rule without
      scanning. Rows are `gate` (a hit fails) or `reader` (a concrete sense here,
      judged by a person). A concrete use carries `prose-tell-ok: <reason>`.
      docs/history/, the skill itself and SOUL files are out of scope. ~0.3 s,
      no eval.
    env:
      VOCAB: '{{.VOCAB | default ""}}'
    cmds:
      - bash scripts/task/prose-tells.sh

  checks:images:
    desc: "[gate] The asset manifest is a projection of urls.tsv, row for row"
    summary: >
      Every row of the gallery's urls.tsv must appear in the manifest exactly once,
      and the manifest may carry nothing else. A matching count is not enough: one
      row dropped while another is counted twice passes the arithmetic, so the
      paths are compared as sets. External state, so it says so and exits 0 where
      the asset root is absent instead of failing a repo-only CI run.
    cmds:
      - bash scripts/task/images-check.sh

  checks:toon:surfaces:
    desc: "[gate] Agent-facing docs pipe JSON into toon, never into the reader"
    summary: >
      Scans AGENTS.md, .agents/README.md, .agents/SCHEMA.md and every skill for a
      command that emits JSON straight to a reader. A pipeline into `jq` or a
      redirect to a file is a program consumer and stays JSON; anything else must
      pipe into `toon -e`, or carry `json-ok: <reason>`. Joins backslash
      continuations first, so a two-line pipeline is judged as one command.
    cmds:
      - bash scripts/task/toon-surfaces.sh

  checks:toon:
    desc: "[gate] TOON array lengths are counted, and every tracked .toon strict-decodes"
    summary: >
      The `[n]` header is a row count. An agent writing TOON by hand counts rows
      itself and gets it wrong, and strict decode then refuses the document, so
      the gate proves the repair path instead of the author's arithmetic: a wrong
      under-count and a wrong over-count are both repaired to the counted value,
      then every tracked `.toon` document must strict-decode. ~0.2 s, no host.
    cmds:
      - bash scripts/task/toon-check.sh

  checks:repo:paths:
    desc: "[gate] No tracked file hardcodes this machine's checkout path"
    summary: >
      A checkout path baked into a task, module or script works on exactly one
      machine; the fleet deploys to every host and CI, where it does not exist.
      Runs in ~0.1 s over tracked .sh/.py/.yml/.nix. Names the file, the line,
      and the replacement to use. A line carrying `repo-path-ok:` with a reason
      is accepted, for text that quotes a path rather than using one.
    cmds:
      - bash scripts/task/repo-paths.sh

  checks:repo:blobs:
    desc: "[gate] No blob over 512 KiB in the index or reachable in history"
    summary: >
      A blob outlives its file: the 26.5 MiB STL and the 829 KiB wallpaper sat
      in this history for a year after deletion, and removing them cost a
      rewrite of every commit on every branch. --index screens what would be
      committed (~0.3 s); --history every blob reachable from any ref (~0.6 s).
      Headroom is over AGENTS.nix's 342 KiB. MAX= bytes, ALLOW= comma-separated
      globs for a deliberate exception, which the run prints. Exit 0 = clean,
      1 = a blob is over, 2 = bad usage.
    cmds:
      - bash scripts/task/repo-blobs.sh --history

  checks:submodules:
    desc: "[gate] Every submodule pin is the head of the branch it tracks"
    summary: >
      A gitlink is a revision nothing watches: the project's repository moves on
      and nixconfig points at an older commit. Compares the COMMITTED pin
      (`git ls-tree HEAD`) with the head of the branch the remote reports
      (`.gitmodules` `branch =`, else its default branch): one `git ls-remote`,
      no fetch, no mutation. Not in `checks:quick` — it needs the network, and
      ssh remotes are probed with `BatchMode=yes` and a 10 s timeout so an
      unattended run fails instead of prompting. Vars: FETCH=1 adds behind N /
      ahead / diverged. Exit 0 = current, 1 = drifted, 2 = unreachable.
    cmds:
      - bash scripts/task/submodule-drift.sh
    silent: true

  checks:skills:mirror:
    desc: "[gate] No skill table restates a task's own desc (three rows in one skill is an index)"
    summary: >
      scripts/task/skills-task-mirror.py: a skill table row whose cells restate a
      task's `desc` (>= 70 % of its significant words, and no longer than 1.5x) is
      a second copy of a fact go-task already serves, and it goes stale the first
      time the task changes. Three such rows in one skill is a task index wearing
      a skill's name. Reads `task --list-all --json` through taskfile-list.sh (the
      120 ms warm cache), so no eval. Exit 0 = clean or warnings only, 1 = a skill
      mirrors the surface, 2 = the task list or the skills tree is unreadable.
    cmds:
      - python3 scripts/task/skills-task-mirror.py

  checks:tasks:
    desc: "[gate] Task graph: yq compiles it, Python applies the rules, go-task confirms the name set"
    summary: >
      The graph, compiled by scripts/task/lib/taskfile_graph.py (yq parses; the
      rules are the script). It asserts what YAML accepts silently: duplicate
      keys, dangling `task <name>` calls, include cycles, orphan shards,
      `internal: true`, MATCH arity, desc/summary budgets, and an exit code a
      summary promises but its script never emits. The name set must equal
      `task --list-all --json`, the fixture must fire every bucket, and every
      `task <name>` citation on docs/agent-contract.md must resolve.

      Exit 0 = clean, 1 = violation or drift, 2 = unreadable. ~1 s, no eval.
    cmds:
      - bash scripts/task/taskfile-graph.sh
    silent: true

  checks:codespace:
    desc: "[gate] Every codespace is Shutdown, so nothing is on the billing clock"
    summary: >
      Lists every codespace with its state and last use, then fails when any is not
      Shutdown — a codespace bills while it runs, and one left Available overnight
      is silent. Read-only: it starts, stops and resolves nothing, so it cannot cost
      a boot or a build minute.

      Exit 0 = all Shutdown (or no codespaces), 1 = at least one is billing and the
      line names `codespace:stop CS=<name>`, 2 = gh is absent or the query failed,
      which is no answer rather than a clean one. Needs gh auth; not in checks:quick.
    cmds:
      - bash scripts/task/codespace.sh check

  checks:codespace:sync:
    desc: "[gate] Codespace sync body: a failed fetch exits 1 and resets nothing"
    summary: >
      Offline cases for the body `codespace:sync` sends over ssh
      (scripts/task/codespace-sync-test.sh): an unreachable origin, a dirty tree,
      FORCE, a fast-forward, and a branch the remote lacks — all against local
      repositories, so no codespace, gh or network is involved.

      The regression it locks: a failed fetch fell through to `git reset --hard
      origin/$BRANCH`, moved to the stale ref and printed "now at <old commit>" with
      exit 0. CODESPACE_SYNC_BODY=<path> points the cases at another body, which is
      how the test is proved to fail on the bug. Exit 0 = every case held, 1 = one
      did not.
    cmds:
      - bash scripts/task/codespace-sync-test.sh

  checks:kg:
    desc: "[gate] Knowledge-graph schema and all six query patterns still agree"
    summary: >
      The schema gate under the graph query surface (scripts/task/kg-check.sh):
      required fields, unique ids, endpoints and edge shapes; every pattern
      return rows of the right types and agree in reverse, which catches a one-sided
      rename; and the six `ops:kg:*` tasks exist with a typo still exiting 2
      (`no_such_node`).

      Renaming a field or dropping `label` leaves every pattern exiting 0 with an
      empty answer — the silent failure this exists for. Cost: one `nix eval` (~1 s)
      plus ~30 jq calls, never `nix build`; KG_GRAPH= uses a mutated JSON copy and
      skips nix. Exit 0 = clean, 1 = drift.
    cmds:
      - bash scripts/task/kg-check.sh

  checks:kg:iets:
    desc: "[gate] The graph's fast evaluator renders what nix renders, byte for byte"
    summary: >
      scripts/task/kg-iets-check.sh — evaluates the compiled graph and two leaf
      registries through `iets --no-cache` and through `nix eval`, and compares
      the bytes. iets is why the graph does not need a resident daemon (1.7 s →
      820 ms cold, 25 ms warm), and a faster evaluator that renders a different
      value would be a quieter answer rather than a faster one.

      Skips with exit 0 and says so where iets cannot be resolved, because the nix
      path is still correct; it never skips a real disagreement. Cost ~3 s (two
      full evals, no cache on either side), so not in `checks:quick`.
    cmds:
      - bash scripts/task/kg-iets-check.sh

  checks:entry:
    desc: "[gate] Entry reads stay on their cache layer (min-of-3 timing budgets)"
    summary: >
      scripts/task/kg-speed.sh --gate: the reads a turn makes before it knows
      anything, timed three times each against budgets sized on delphi and
      frieren. It gates the layer, not the milliseconds — `near` is budgeted as
      `show + 300` because it shares show's eval, and `iets` must be at most
      half the nix floor. `task help` at 2.3 s and `near` at 546 ms are the
      regressions this exists for. A host slower than frieren raises the budget
      in one place: the script. Exit 0 = every read on its layer.
    cmds:
      - bash scripts/task/kg-speed.sh --gate

  checks:blast:
    desc: "[report] Pre-flight blast radius for changed paths (FILES='a b' or STAGED=1)"
    summary: >
      scripts/task/kg-preflight.sh — maps each changed path to its graph anchor
      (hosts/<h>/… → host:<h>, .agents/skills/<s>/… → skill:<s>, docs/*.md →
      doc:<path>) and prints that anchor's transitive dependents: "what does this
      change reach?", before it is applied. Paths that are not graph nodes
      (modules/, flake/, taskfiles/) are UNMAPPED on purpose — they have closures,
      not edges.

      Backend: the reverse-edge closure in jq (lib/kg-closure.jq, the same
      definition `ops:kg:blast` uses). Advisory by default; STAGED=1 reads
      `git diff --cached`. Exit 0 = reported.
    cmds:
      - bash scripts/task/kg-preflight.sh {{if eq .STAGED "1"}}--staged{{end}} {{.FILES | default ""}}

  checks:kg:canvas:
    desc: "[gate] Knowledge-graph canvas: slices resolve, and a real node click navigates"
    summary: >
      scripts/task/kg-canvas-check.sh — builds `.?submodules=1#sites.fleet-docs-site` locally
      (`--builders ""`) and tests the canvas through the interface: every node names
      a slice, every slice exists, every neighbour button resolves, index.html loads
      and parses the script, and — with agent-browser — headless Chrome clicks the
      Knowledge Graph tab, a node at `host:frieren`'s position, the search box, the
      type chips and a cold `#kg?q=…&types=…` load. Expected counts come from the
      data, never hardcoded.

      SKIP_BROWSER=1 runs the static half. ~15 s. Exit 0 = clean.
    cmds:
      - bash scripts/task/kg-canvas-check.sh

  checks:host:
    desc: "[gate] Evaluate ONE host: module system + assertions + compiled inventory (HOST=name)"
    summary: >
      Builds hostChecks.<arch>.<host>: ONE host per attribute — module system plus
      every assertion nixpkgs' toplevel asserts — so option conflicts, bad values
      and policy violations fail without instantiating the closure; it also proves
      the host compiles inventory.toml. ARCH defaults to the host's own arch from
      the compiled registry, so the gate runs wherever you are. Under oom-guard.sh;
      the closure build is CI's job. Vars: HOST= (required), ARCH=, MODE=build|eval,
      STRICT=1, OFFLOAD=1. Exit 0 = passed, 1 = assertion failed, 2 = watchdog abort.
    cmds:
      - bash scripts/task/host-check-sweep.sh --hosts "{{.HOST}}" --mode {{.MODE | default "build"}} --arch "{{.ARCH}}" --timeout {{.TIMEOUT | default "120"}}

  checks:drv-equality:
    desc: "[gate] Every configuration's derivation is unchanged against a baseline (MODE=snapshot|compare)"
    summary: >
      The refactor gate: a rename or moved module may not change behaviour, so it
      may not change a host's `hostChecks` derivation or config fingerprint.
      MODE=snapshot writes the baseline (~/.cache/nixconfig/drv-baseline.json);
      MODE=compare re-evaluates every configuration, ONE PROCESS EACH under
      oom-guard.sh, exiting 1 on any drift. A host already failing compares by its
      error text. DEEP=1 uses each toplevel derivation instead (narrow with
      HOSTS=); a config embedding the flake source changes it on any tree edit.
      Refuses the 03:00-05:30 window unless FORCE=1.
    env:
      HOSTS: '{{.HOSTS}}'
      DEEP: '{{.DEEP}}'
    cmds:
      - python3 scripts/task/drv-equality.py {{.MODE | default "compare"}}

  checks:units:
    desc: "[gate] systemd understands every unit ONE host's config installs, and can exec each ExecStart (HOST=name)"
    summary: >
      The gate an eval cannot be: `systemd-analyze verify` reads the unit text as
      systemd will, so a directive it does not know fails here, not at the next
      switch. On 2026-11-05 two units passed `checks:host` and died at exec: `path`
      inside `serviceConfig` is dropped (127), a `@python@` pointed at a directory
      (126).

      One host eval (~36 s on delphi), so a pre-switch instrument: it proves the
      FILE, and the switch proves the start. Fragments and microVM units are
      skipped. Vars: HOST= (required), EVAL_TIMEOUT=240. Exit 0 = clean, 1 = a
      problem, 2 = the host did not evaluate.
    vars:
      HOST: '{{.HOST}}'
    cmds:
      - |
        if [ -z "{{.HOST}}" ]; then
          echo "checks:units needs HOST=<host>: one host per eval, never the fleet." >&2
          echo "  e.g.  task checks:units HOST=delphi" >&2
          exit 2
        fi
        HOST="{{.HOST}}" bash scripts/task/unit-gate.sh

  checks:hosts:
    desc: "[gate] Evaluate a NAMED SET of hosts, ONE AT A TIME, under the OOM watchdog"
    summary: >
      HOSTS IS REQUIRED AND HAS NO DEFAULT: a default host set is the footgun that
      got `nix flake check` SIGKILLed (6078 MiB, exit 137). Name them: `task
      checks:hosts HOSTS="frieren mtfuji"`. One host per process under the watchdog,
      so peak memory is one host; the fleet is CI's job.

      MODE=eval is arch-independent (aarch64/darwin from x86_64); build needs a
      local builder for ARCH. STRICT=1 and OFFLOAD=1 route the build as in
      `checks:host`. Exit 0 = every named host passed, 1 = a host failed or HOSTS
      was not given, 2 = watchdog abort. Vars: HOSTS= (required), MODE=, ARCH=,
      TIMEOUT=.
    cmds:
      - bash scripts/task/host-check-sweep.sh --hosts "{{.HOSTS}}" --mode {{.MODE | default "build"}} --arch "{{.ARCH}}" --timeout {{.TIMEOUT | default "120"}}

  checks:boot:
    desc: "[gate] Boot ONE host's real module graph in a VM; fail unless stage-2 is reached (HOST=name)"
    summary: >
      scripts/task/boot-check.sh — realises hostBootChecks.<arch>.<host>: a NixOS VM
      test over the host's OWN module list, failing unless stage-2 is reached
      (`Reached target Multi-User System` on the console). The only gate that runs
      the config. KVM ONLY: refuses before any eval without /dev/kvm — a boot is a CI
      instrument, not a hygiene step. ONE host, `--builders ""`, oom-guard. Prints
      elapsed + peak RSS and records both in $XDG_STATE_HOME/nixconfig/boot-check.log
      so the next run can compare. Vars: HOST=, ARCH=, TIMEOUT=900. Exit 0 = stage-2,
      1 = no stage-2/no KVM, 2 = watchdog.
    cmds:
      - bash scripts/task/boot-check.sh --host "{{.HOST}}" --arch "{{.ARCH}}" --timeout "{{.TIMEOUT | default "900"}}"

  checks:boot:self:
    desc: "[gate] Boot THIS host before its own switch — the one path allowed to emulate"
    summary: >
      scripts/task/boot-check.sh --self. A bad stage-1 on the machine you are about
      to switch is a box nobody can diagnose from outside, so booting it is a real
      pre-flight even under TCG: no /dev/kvm, one vCPU, `nice -n 19`, watchdog and
      `--builders ""`. It is NOT the hygiene gate — for another host the answer is
      `checks:boot HOST=` (KVM or CI), which refuses here. Vars: TIMEOUT=900.
      Exit 0 = stage-2, 1 = refused or no stage-2, 2 = watchdog.
    cmds:
      - bash scripts/task/boot-check.sh --self --timeout "{{.TIMEOUT | default "900"}}"

  checks:flake:
    desc: "[gate] Run `nix flake check` only where the machine can hold it; refuse otherwise"
    summary: >
      `nix flake check` evaluates EVERY flake output, not just checks.<system> — its
      own progress output says "checking flake output 'nixosConfigurations'", then
      one line per host. On this 11 GiB NAS that is 23 configs in one process:
      339.78 s, 6078.5 MiB peak, SIGKILL 137, and a 62 % IO-stall that outlived it.

      So this refuses below REQ_MB (default 16384) and points at the bounded gates;
      above it, and in CI, it runs the real thing. Vars: REQ_MB=. Exit 0 = ran, 2 =
      REFUSED (host too small), non-zero = a real check failure.
    cmds:
      - |
        req="{{.REQ_MB | default "16384"}}"
        total=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)
        echo "nix flake check: evaluating every flake output (all nixosConfigurations) in ONE process"
        if [ "$total" -lt "$req" ]; then
          echo "REFUSED: ${total} MiB RAM on this host, ${req} MiB required." >&2
          echo "Measured on frieren: 339.78 s, 6078.5 MiB peak, SIGKILL 137, 62% IO-stall." >&2
          echo "Run instead:  task checks:quick  |  task checks:host:HOST=<host>  |  task checks:hosts" >&2
          exit 2
        fi
        exec nix flake check

  checks:modules:validate:
    desc: "[smoke] modules.toml syntax and knob paths, without a flake eval"
    summary: >
      The host-agnostic smoke check: parses modules.toml and confirms every knob
      path exists, with no eval, so it works on a machine that cannot evaluate
      `checks.<system>` (darwin, a cross-arch box). The GATE is the compiled
      `checks.<system>.knobs` in flake/checks.nix — it also asserts every path
      declares a toggle, every host it names is in the inventory, and the
      `total_knobs` count — and `checks:quick` builds it.
    cmds:
      - bash scripts/task/modules-menu.sh validate

  checks:modules:edges:
    desc: "[gate] A module under modules/ is reached by name, never by relative path"
    summary: >
      The dendritic composition rule, as text: `import ../x.nix;` with no
      arguments and a bare relative path sitting in an `imports` list are
      refusals, because both keep working until somebody renames the file and
      neither is visible to `.#modules`. Loads with arguments, asset reads
      (readFile, src, sopsFile) and `nixpkgs.overlays` imports are dependencies,
      not module edges, and stay allowed. ~0.5 s over ~160 files, no eval, no
      network; the same script the CI docs-budget job runs.
    cmds:
      - bash scripts/task/modules-edges.sh

  checks:hermes:
    desc: "[gate] hermes surface: call-site flags, gateway, secret bridge, config version"
    summary: >
      Token-free and local — no model call, no ssh, no writes. Four questions
      the 03:00 job cannot answer out loud: does every top-level hermes call site
      use a flag `hermes --help` publishes (Tier 3 passed `-q`, a `hermes chat`
      option, to the top-level CLI and exited 2 before any model call until
      2026-11-05); is the gateway active with no platform flagged
      needs_attention; is every rendered secret key present in the ~/.hermes/.env
      bridge (names only, never values); and does `hermes doctor` call the
      persona config current. Runtime sections skip on a host without hermes.
      Exit 0 = clean, 1 = defect.
    cmds:
      - bash scripts/task/hermes-check.sh

  checks:build:route:
    desc: "[gate] This host must not compile its own closure — report derivations that would build locally (EXP-107)"
    summary: >
      Read-only routing gate: counts the derivations in the local host's closure
      (HOSTS="a b" for others) that no substituter can serve — the ones a rebuild
      would COMPILE here. Exits 1 when the caller is not the fleet builder and gaps
      remain; on the builder itself gaps are reported but allowed. Prints the fix
      (`task infra:warm:host:<h>`).

      COST: forces the whole toplevel (drvPath/outPath plus `nix build --dry-run`),
      the most expensive eval there is. A CI/operator gate, NOT a pre-switch hook —
      `infra:switch:*` does not call it. Vars: HOSTS= (default: the local hostname).
    cmds:
      - bash scripts/task/warm-host.sh --check {{.HOSTS | default ""}}

  checks:site:path:
    desc: "[gate] The live site serves the store path this tree builds (no ssh, no journal)"
    summary: >
      A deploy can finish and leave the previous generation's tree serving — a
      boot-only activation, a rollback, a flake ref that never moved — and from
      outside that looks like success. Each site vhost emits `X-Site-Path`; this
      asks the live server which store path it serves and compares it with
      `.#sites.delphi-site`, the host's `system.build.delphiSite`.

      One request with a timeout plus one eval, under the OOM watchdog, no ssh.
      Vars: ATTR=, URL= (default http://127.0.0.1/), HOST_HEADER=, TIMEOUT=,
      EVAL_TIMEOUT=. Exit 0 = in sync, 1 = stale, 2 = cannot tell.
    cmds:
      - bash scripts/task/site-drift.sh

  checks:flake:transitive:
    desc: Sweep flake.lock transitive inputs against upstream heads (read-only; fails on drift)
    cmds:
      - bash scripts/task/flake-transitive-sweep.sh check

  checks:qmd:docs:
    desc: Check the nixconfig qmd docs collection exists and its index is fresh
    cmds:
      - bash scripts/task/qmd-docs-index.sh check nixconfig

  checks:inventory:compiled:
    desc: Fail if inventory.toml is inconsistent with itself or with the flake's host set
    summary: >
      Builds the automatic inventory checks. inventory-schema: derived counts match
      the declared copies and no field contradicts its kind (an `is_nix` disagreeing
      with `kind`, a non-Nix device marked `managed`). inventory-hosts:
      bidirectional coverage — every host the flake builds is registered and every
      registered flake host is built. inventory-modules: every registered host
      carries the compiled-inventory module, proven from the module lists rather
      than by evaluating hosts.

      Exit 0 = clean, 1 = drift.
    vars:
      # Per-system attrs, resolved from the running system so the gate also runs on
      # the fleet's aarch64 hosts (see `checks:quick`).
      SYSTEM:
        sh: nix eval --impure --raw --expr builtins.currentSystem
    cmds:
      - nix build --no-link --builders "" .?submodules=1#checks.{{.SYSTEM}}.inventory-schema .?submodules=1#checks.{{.SYSTEM}}.inventory-hosts .?submodules=1#checks.{{.SYSTEM}}.inventory-modules

  checks:ports:
    desc: Diff THIS machine's declared firewall surface against its live listeners
    summary: >
      Compares `nix eval` of networking.firewall against the LOCAL `ss`: SERVED,
      SERVED-GLOBAL (global list), SERVED-SERVE (`tailscale serve`), DEAD-HOLE,
      REDUNDANT, FIREWALL-ONLY, ACCEPTED, DYNAMIC. REDUNDANT — declared but loopback-only
      — always exits 1: the hole has no possible client. Audits this machine and refuses
      a foreign HOST with exit 2; no self-scan (`-i lo`). Vars: HOST= (local hostname),
      IFACE= (enp1s0), STRICT=1 adds DEAD-HOLE/FIREWALL-ONLY; exit 2 = wrong host, an
      interface declaring nothing, or failed eval. Fixture: `checks:ports:test`.
    cmds:
      - HOST="{{.HOST | default ""}}" IFACE={{.IFACE | default "enp1s0"}} STRICT={{.STRICT | default "0"}} bash scripts/task/port-audit.sh

  checks:ports:test:
    desc: Regression fixture for checks:ports (fake host, listeners and serve state)
    summary: >
      Runs port-audit.sh against tests/port-audit/bin — fake hostname, nix, ss, sysctl,
      tailscale — so each bucket fires on demand: a declared port whose only listener is
      loopback exits 1 (v4 and ::1), a `tailscale serve` port is SERVED-SERVE, a
      global-list port is SERVED-GLOBAL, and STRICT drift exits 1 while a plain run only
      reports it. A foreign HOST and an interface declaring no ports are refused (exit 2).
      Coverage is asserted both ways — every EXPECTED case must run and every case that
      runs must be listed — so deleting one fails. Pure shell, ~1 s. Exit 0 = all behave.
    cmds:
      - bash tests/port-audit/run.sh

  checks:appflow:
    desc: Fixture for the CV projector — a job description narrows the corpus without losing a role or inventing a line
    summary: >
      Runs the selector against a fictional corpus and four descriptions: no role
      loses every line, a matching role keeps its matching lines, an unrelated one
      falls back to its lead lines and the audit says `matched: false`, kept lines
      come from the corpus in the role's order, the caps hold, languages and
      education are never touched, a German description reaches the English corpus
      through glossary.json, two runs are identical, a missing corpus exits 2.
      Coverage is asserted both ways, so deleting a case fails. No nix; ~1 s.
    cmds:
      - bash tests/appflow-select/run.sh

  checks:appflow:triage:
    desc: Fixture for the mail-to-status rules — a German rejection with none of the English words still rejects
    summary: >
      Runs the sync's event vocabulary over the shapes that reach it: an English
      rejection, the German team decision that says no `leider` and no `Absage`,
      an acknowledgement and its "we cannot consider every application" footer
      (which must stay No event, or every acknowledgement becomes a rejection),
      an interview invite, and a job alert. Also asserts the stage a rejection
      lands in. The WattFox rejection of 2026-10-23 is the motivating case. No
      network, no nix; ~1 s.
    cmds:
      - bash tests/appflow-triage/run.sh

  checks:appflow:resolve:
    desc: Fixture for the queue resolver — rules, closed vocabulary, and every refusal path
    summary: >
      Proves the resolver decides the bulk classes without a model (job alert,
      EEO form, Loopcv submission, automatic reply, retention request), attributes
      by sender domain (PŸUR, Tieto) and refuses an unknown sender, and that the
      model's answer is only accepted when it names a candidate this run supplied,
      both engines agree, and the margin clears the threshold. A stub `ask` keeps
      the fixture offline, so it gates the contract rather than the weights.
      No network, no nix; ~1 s.
    cmds:
      - bash tests/appflow-resolve/run.sh

  checks:career:
    desc: Fixture for the career corpus — import, export, set, add and rm against a stub API
    summary: >
      Proves the JSON Resume files are exports of the rows rather than a second
      source: a fictional two-role, two-project corpus is imported and exported
      back byte for byte in both languages, including a field that is absent
      versus one that is empty and the contact block the rows do not own. The
      stub refuses a sparse write body as NpgsqlRest does, so every parameter is
      exercised; set changes only the flags given, add refuses an existing id,
      rm refuses without --yes, and an id shared by en and de needs --language.
      Coverage is asserted both ways. No nix, loopback only; ~2 s.
    cmds:
      - bash tests/career-cli/run.sh

  checks:portfolio:
    desc: Fixture for the portfolio corpus — the rows and the exported JSON agree, both languages
    summary: >
      The second corpus on the same wire as checks:career. A fictional three-project
      portfolio is imported and exported back byte for byte, links included as
      label/href objects rather than text, while the profile, sections, skills and
      UI the rows do not own survive untouched. The German file names no English
      project, so it is paired by position: the fixture asserts the pairing and
      that a count mismatch is refused instead of shifted. add appends, set
      changes only its flags, rm waits for --yes. Coverage is asserted both ways;
      no nix, loopback only; ~2 s.
    cmds:
      - bash tests/portfolio-cli/run.sh

  checks:media-relay:
    desc: Fixture for the media library — the manifest the page reads and the rows it renders
    summary: >
      Lifts the index jq out of modules/services/media-relay.nix and runs it over
      a six-file fixture: a poster attaches to its folder's video and is never
      listed or counted, bytes cover media only, an upper-case extension is
      lowercased, a .txt is dropped. Runs the page's row and search-card
      functions under node, then starts api.py against stub yt-dlp wrappers and
      drives it over HTTP: the URL allow-list refuses a non-YouTube host and a
      queued fetch reaches done. Needs node, jq and python3; ~2 s.
    cmds:
      - bash tests/media-relay/run.sh

  checks:ssh:bitwarden:
    desc: Log into a fleet host with the Bitwarden-vault SSH key and its CA certificate
    summary: >
      Unlocks the vault with bitwarden-cli, copies the key to a 0600 temp file
      (removed on exit), checks it is the key the certificate covers, then performs
      two real handshakes: one with the certificate, one without as a control — so a
      success cannot be the static authorized_keys entry doing the work.

      ~/.ssh/bitwarden-cert.pub is hand-signed and nothing renews it (`renew-ssh-
      cert` covers only id_ed25519): re-sign on expiry. NOT safe unattended (master
      password prompt, or BW_SESSION). Vars: HOST=, ITEM=, PUBKEY=/CERT=,
      PRIVATE_KEY=. Exit 1 = certificate login failed, 2 = preflight.
    cmds:
      - HOST={{.HOST | default "frieren"}} ITEM="{{.ITEM | default ""}}" nix-shell -p bitwarden-cli jq --run "bash scripts/task/bitwarden-ssh-test.sh"

  checks:ssh:modes:
    desc: Assert SSH private keys are 600-class and certificates are readable
    summary: >
      Walks SSH_DIR (default ~/.ssh): private keys (id_*, *.key, user_ca_key, or
      any file whose first line is a PRIVATE KEY header) must have no group/other
      bits — the rule ssh itself enforces, so 400 and 600 pass and 640/644 fail —
      and every *-cert.pub must be owner-readable and parse with ssh-keygen -L.
      Symlinks are followed (id_ed25519, user_ca_key); a dangling one is a
      failure, not a skip. Certificates are public: 644 is correct, not a finding.
      Exit 0 = clean, 1 = violation, 2 = cannot evaluate (no SSH_DIR or nothing
      to check). Vars: SSH_DIR=.
    cmds:
      - SSH_DIR="{{.SSH_DIR | default ""}}" bash scripts/task/ssh-key-modes.sh

  checks:email:bodies:
    desc: Gate — HTML-only mail converts to text and archived rows carry it (SAMPLE=n)
    summary: >
      Runs html2markdown over the newest SAMPLE envelopes' HTML parts, the same
      extraction the importer uses, and asserts every body part yields text;
      then asks the API whether those messages were archived with a non-zero
      body. Exits non-zero on an empty conversion or an archived empty body.
      Run on delphi (needs himalaya's config and the archive API).
    cmds:
      - python3 scripts/task/email-body-gate.py {{if .SAMPLE}}--sample {{.SAMPLE}}{{end}}

  checks:restic:drill:
    desc: Verify frieren's restic repository and restore a sample (HC-2)
    summary: >
      Starts restic-drill.service and surfaces its journal; exits non-zero if the
      drill did not complete. Proves the nightly backup is restorable, not just
      present. Run on frieren (the host that owns /srv/backup/restic). The same
      drill also runs unattended weekly via restic-drill.timer (Sun 06:30).
    cmds:
      - /run/wrappers/bin/sudo systemctl start restic-drill.service
      - /run/wrappers/bin/sudo journalctl -u restic-drill.service -n 50 --no-pager

  checks:ha:mqtt:
    desc: Report whether Home Assistant is actually subscribed to the MQTT broker (HC-5)
    summary: >
      Reads services.ha-stack from HOST (default frieren) and reports three facts
      from authoritative sources: the broker is listening; HA has an mqtt entry in
      <configDir>/.storage/core.config_entries; and the broker has an established
      client.

      Exits 1 while the broker is up but HA is NOT wired — the open HC-5 gap, so
      "declared but not wired" is a visible, tracked state rather than an
      assumption. Exit 0 = wired, 2 = not evaluable (stack disabled, broker down,
      eval failed). HA's MQTT integration is config-entry only: a YAML `mqtt:`
      stanza raises yaml_setup_without_active_setup and connects nothing.
    cmds:
      - HOST={{.HOST | default "frieren"}} bash scripts/task/ha-mqtt-check.sh

  checks:closure:budget:
    desc: Fail when a host's closure exceeds its dynamic budget (HC-4)
    summary: >
      Compares each host's measured closure size against closure-budgets.toml, where
      budget = baseline_bytes × (1 + headroom_pct/100) unless a host pins `bytes`.
      The basis prints per row (`base+1.0%` / `pin`), so a pass cannot hide its
      promise. Baselines are adopted, never typed: `task dev:closure:budget:adopt
      HOST=<h>`.

      Measurement is the store-DB sum `dev:closure:size` prints (nix path-info, no
      eval), so budget and size view cannot disagree. Vars: HOST= (default: local),
      ALL=1, TARGET=<store path>; no entry = NOT BUDGETED. Exit 0 = within, 1 =
      over, 2 = no budget file.
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} {{if eq (.ALL | default "0") "1"}}--all{{end}} budget {{if .TARGET}}{{.TARGET}}{{end}}

  checks:dns:failover:
    desc: Verify the DNS resolver group answers the wildcard zone and can fail over (HC-3)
    summary: >
      Reads profiles.dnsFailover from HOST (default frieren) — so it cannot drift
      from the declaration — digs the wildcard zone at every resolver, and probes a
      declared VIP for two answering MACs (split brain). Redundancy is either >=2
      literal resolvers, or one VIP owned by exactly one MAC. Exit 0 = redundant,
      1 = a resolver did not answer or the VIP had two owners, 2 = one member and no
      probed VIP: the primary answers, failover is unproven. Probes a subdomain
      (NAME=, default hc3-check.<zone>), not the apex, which carries an override.
      Vars: HOST=, RESOLVERS=, NAME=, EXPECT=, VIP=, IFACE=.
    cmds:
      - HOST={{.HOST | default "frieren"}} RESOLVERS="{{.RESOLVERS | default ""}}" NAME="{{.NAME | default ""}}" IFACE={{.IFACE | default ""}} bash scripts/task/dns-failover-check.sh

  checks:dns:pool:
    desc: Fail when a declared DNS resolver address sits inside the LAN DHCP pool
    summary: >
      Reads the resolver addresses from profiles.dnsFailover on HOST (default
      frieren: resolvers, zoneAddress, virtualIp) and compares them with the
      router's dynamic DHCP range. The pool is router state, so it is passed in
      and never guessed: POOL=192.168.3.100-192.168.3.200 (or POOL_START=/POOL_END=).

      Exit 0 = every address is outside the pool; 1 = at least one is inside (a
      device leased it would answer DNS for the LAN), or the range is misordered;
      2 = cannot evaluate (no pool, bad address, nix eval failed). Vars: HOST=,
      RESOLVERS=, POOL=, POOL_START=, POOL_END=.
    cmds:
      - HOST={{.HOST | default "frieren"}} RESOLVERS="{{.RESOLVERS | default ""}}" POOL="{{.POOL | default ""}}" POOL_START="{{.POOL_START | default ""}}" POOL_END="{{.POOL_END | default ""}}" bash scripts/task/dns-pool-check.sh

  checks:qmd:vault:
    desc: Check the Obsidian vault qmd collection exists and its index is fresh
    cmds:
      - bash scripts/task/qmd-docs-index.sh check vault

  checks:nixcache:probe:
    desc: "[gate] Probe the deployed edge cache: nix-cache-info, HEAD, a 404 miss and a 405 write"
    summary: >
      `-- <url> [store-hash]`. The hash additionally asserts that narinfo is
      signed and names a nar. Four things a Nix client depends on and a Worker
      can regress silently: the three nix-cache-info fields, HEAD without a body,
      a miss answered 404 (not 200/403, which would look like a corrupt cache) and
      a write answered 405. No token, no bucket listing.
    cmds:
      - bash scripts/task/nixcache.sh probe {{.CLI_ARGS}}

  checks:nixcache:fleet:
    desc: "[gate] Every active NixOS host trusts and asks the edge cache, and the edge answers"
    summary: >
      Three questions one run: the compiled policy carries the edge in every
      active host's substituters (0.2 s, no host eval), one host's evaluated
      nix.settings proves the policy actually reaches Nix, and the live URL
      answers nix-cache-info. Order is asserted too — the edge must sit after
      cachix, because a path is never pushed here that cachix already serves.
    cmds:
      - bash scripts/task/nixcache.sh fleet

  checks:invalidation:
    desc: "[gate] Measure what a diff costs to build per touched host (microfix vs closure)"
    summary: >
      `[BASE] [--full] [--max-builds N] [--max-hosts N] [--hosts "a b"]`.
      Scopes the diff to the hosts it can reach (host-local dir, else chain-wide
      and sampled) and counts the derivations `nix build --dry-run` would build
      on each, with `--builders ""` so the question costs nothing. Over
      MAX_BUILDS (5) it fails and names what would be compiled: that is the
      difference between a microfix and a change that invalidates the fleet's
      cache. Exit 1 is a finding, not a broken check.
    cmds:
      - bash scripts/task/invalidation.sh {{.CLI_ARGS}}

  checks:sops:drift:
    desc: Verify every sops file's embedded age recipients match .sops.yaml (catches un-rekeyed files)
    cmds:
      - bash scripts/task/sops-drift-check.sh

  checks:nix:lint:
    desc: Run deadnix (hard gate) and statix (advisory) on all Nix files
    summary: >
      Routes through scripts/task/nix-fmt.sh — the single toolchain-resolution
      path — with --tools deadnix,statix, so these are the flake.lock-pinned
      versions the pre-commit gate uses, not a fresh `nix-shell -p` resolve.
      deadnix fails the task; statix stays advisory (its W20 repeated-key
      warning fires on the house style).
    cmds:
      - bash scripts/task/nix-fmt.sh --check --all --tools deadnix,statix

  checks:nix:shell:
    desc: "[gate] Shell inside Nix strings: no expansion read as interpolation, shellcheck clean"
    summary: >
      Two checks over all 61 scripts behind writeShellApplication,
      writeShellScriptBin and writeShellScript. A `${x:-y}` in an indented string
      is Nix interpolation, and Nix parses `x:-y` as a URI literal — the script
      then ships a literal where an expansion was meant, with no eval error.
      That is a hard failure. Each script is then shellchecked with Nix values
      stubbed, which is the build-time coverage the two helpers other than
      writeShellApplication never had. ~0.4 s, no host eval, no network.
    cmds:
      - bash scripts/task/nix-shell-lint.sh

  checks:nix:prose:
    desc: "[gate] Nix comments must cite a home (docs/, skill, policy), not explain in place"
    summary: >
      Judges the DIFF, not the corpus: a run of 8+ added comment lines that cite
      no home (docs/ path, .agents/ skill, policy citation, `task <name>`, `.#`
      attribute, repo path) fails, because a comment is compiled by nothing while
      the graph, qmd and the skills index are. The same rule runs in the
      pre-commit hook, so `--staged` is the default scope and an essay cannot
      land in the first place. MODE=all reports the existing backlog read-only
      and never fails. MIN= raises the run length. ~0.1 s, git only, no eval.
    cmds:
      - bash scripts/task/nix-prose-lint.sh --{{.MODE | default "staged"}}

  checks:nix:fix:
    desc: Auto-fix the Nix hard gates (deadnix + alejandra) on all Nix files
    summary: >
      Delegates to scripts/task/nix-fmt.sh, the single implementation shared with
      checks:nix:watch, using the flake.lock-pinned toolchain (same versions as
      the pre-commit gate), cached as GC-rooted links. Applies only the HARD
      gates — the ones that would reject the commit. statix is advisory in this
      repo and is deliberately never auto-applied; to write its suggestions run
      `bash scripts/task/nix-fmt.sh --fix --all --tools deadnix,statix,alejandra`.
    cmds:
      - bash scripts/task/nix-fmt.sh --fix --all

  checks:nix:format:
    desc: Check Nix file formatting with alejandra (read-only)
    summary: >
      Routes through scripts/task/nix-fmt.sh with --tools alejandra, so this
      check and checks:nix:lint cannot resolve different tool versions. Writes
      nothing; exits 1 listing every file that is not alejandra-formatted.
    cmds:
      - bash scripts/task/nix-fmt.sh --check --all --tools alejandra

  checks:nix:watch:
    desc: "watch: auto-format Nix files on save (deadnix + alejandra) — no manual tool calls"
    summary: >
      Long-running background hook. Watches **/*.nix with task's watch flag and
      formats only the files git reports dirty, so a save costs one file. Applies
      the HARD gates only — deadnix and alejandra — never statix (advisory here: W20
      fires on house style); a watcher that silently rewrote style while you edited
      is the wrong trade. `task checks:nix:lint` still reports it.

      Writes only when a file actually changes (idempotent), so it cannot re-
      trigger. No inputs; start once. Toolchain from the flake.lock pin, i.e. the
      commit gate's.
    watch: true
    sources:
      - "**/*.nix"
    cmds:
      - bash scripts/task/nix-fmt.sh --tools deadnix,alejandra

  checks:nix:watch:status:
    desc: Show whether the Nix watcher is running (pid + elapsed)
    summary: >
      Matches the watcher process exactly (cmdline `task checks:nix:watch`), so
      it never confuses itself or a sibling task for the watcher.
    cmds:
      - |
        pids=$(pgrep -f '^task checks:nix:watch$' 2>/dev/null || true)
        if [ -z "$pids" ]; then
          echo "checks:nix:watch: not running"
        else
          echo "checks:nix:watch: running"
          ps -o pid,etime,args -p $(echo "$pids" | tr '\n' ',' | sed 's/,$//') 2>/dev/null || echo "$pids"
        fi

  checks:nix:watch:stop:
    desc: Stop a running Nix watcher (kills the watcher, not your shell)
    summary: >
      Killing the shell that started the watcher does NOT stop it — the watcher
      is a grandchild of that shell, so it keeps formatting the repo while
      looking stopped (it once ran ~8 minutes unnoticed that way). This targets
      the `task checks:nix:watch` process itself, waits for exit, then proves it
      is gone rather than assuming the kill landed. Idempotent: with no watcher
      running it reports that and exits 0.
    cmds:
      - |
        pids=$(pgrep -f '^task checks:nix:watch$' 2>/dev/null || true)
        if [ -z "$pids" ]; then
          echo "checks:nix:watch: not running (nothing to stop)"
          exit 0
        fi
        for pid in $pids; do
          echo "stopping watcher pid $pid"
          # Signalling MUST go through a real bash: task runs cmds in its own
          # restricted shell interpreter, where `kill` is an
          # "unsupported builtin" and would silently do nothing (it did).
          # Do not suppress the error — a signal that does not land must be
          # visible, and the verification below turns it into a failure.
          if ! bash -c 'kill "$1"' _ "$pid"; then
            echo "WARNING: could not signal pid $pid" >&2
          fi
        done
        # Wait for exit, then verify instead of assuming the signal landed.
        i=0
        while [ "$i" -lt 50 ]; do
          pgrep -f '^task checks:nix:watch$' >/dev/null 2>&1 || break
          i=$((i + 1))
          sleep 0.1
        done
        still=$(pgrep -f '^task checks:nix:watch$' 2>/dev/null || true)
        if [ -n "$still" ]; then
          echo "FAIL: watcher still running (pids: $(echo "$still" | tr '\n' ' '))" >&2
          exit 1
        fi
        echo "checks:nix:watch: stopped (verified, no watcher process remains)"

  checks:yaml:lint:
    desc: Validate that every tracked YAML file parses — the guard for task and workflow edits
    summary: >
      YAML here has three consumers with three parsers: go-task reads
      `taskfiles/*.yml`, GitHub reads `.github/workflows/*.yml`, sops reads
      `.sops.yaml`. One failure mode is shared: a file stops parsing and only
      the consumer notices. Edits go through `yq -p yaml -o yaml -i`; this
      proves the result parses and names every file that does not.
    cmds:
      - |
        fail=0
        count=0
        for f in $(git ls-files '*.yml' '*.yaml'); do
          count=$((count + 1))
          if ! yq '.' "$f" >/dev/null 2>&1; then
            echo "FAIL: $f does not parse"
            fail=1
          fi
        done
        if [ "$fail" -ne 0 ]; then exit 1; fi
        echo "PASS: $count YAML files parse."

  checks:toml:lint:
    desc: Validate that every tracked TOML file parses — the guard for tool-written TOML edits
    summary: >
      TOML is edited with a format-aware tool, never by hand, and this proves the
      result actually parses. Lists every file that no longer does and exits 1.
      One trap it guards against: yq picks its parser from the path's extension,
      so `yq -i` on a path that does not end in `.toml` (a temp copy, say) parses
      the file as YAML and writes nothing (see the AGENTS.md TOML rule).
    cmds:
      - |
        fail=0
        count=0
        for f in $(git ls-files '*.toml'); do
          count=$((count + 1))
          if ! yq '.' "$f" >/dev/null 2>&1; then
            echo "INVALID TOML: $f" >&2
            fail=1
          fi
        done
        if [ "$fail" = 0 ]; then
          echo "OK: $count tracked TOML file(s) parse"
        fi
        exit "$fail"

  checks:btrfs:stats:
    desc: Inspect Btrfs device error counters across root and data storage pools (EXP-022)
    summary: >
      Checks btrfs device stats across declared mounts (/ and /Volumes/data).
      Fails if any device reports non-zero hardware read/write/flush/corruption errors.
    cmds:
      - |
        if command -v btrfs-watchdog >/dev/null 2>&1; then
          btrfs-watchdog
        else
          sudo btrfs device stats / && sudo btrfs device stats /Volumes/data
        fi

  checks:uds:docs:
    desc: Verify the zero-TCP static documentation bridge over UNIX domain socket (EXP-024)
    summary: >
      Sends an HTTP request over unix:/run/uds-docs/docs.sock using curl --unix-socket.
      Probes the Nix-store compiled Aki documentation site with zero TCP overhead and reports response timing.
    cmds:
      - |
        if [ ! -S /run/uds-docs/docs.sock ]; then
          echo "FAIL: Socket /run/uds-docs/docs.sock does not exist or is not a socket" >&2
          exit 1
        fi
        TIME=$(curl -s -o /dev/null -w "%{time_total}" --unix-socket /run/uds-docs/docs.sock http://localhost/ || true)
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" --unix-socket /run/uds-docs/docs.sock http://localhost/ || true)
        if [ "$STATUS" = "200" ]; then
          echo "PASS: Zero-TCP static documentation bridge active at unix:/run/uds-docs/docs.sock (HTTP $STATUS, latency: $TIME s)"
        else
