# Hermes Agent Configuration — Vanta persona
# Sensitive tokens (e.g. TELEGRAM_BOT_TOKEN) loaded from ~/.hermes/.env
#
# `_config_version` is written by hermes' own migrator. Keep it current: with
# v0 stamped, every `hermes doctor` reported "Config version outdated (v0 →
# v51)" and the retired `security.tirith_enabled` key sat in the file. Both
# were fixed on 2026-11-05 by migrating a copy under HERMES_HOME=/tmp/hh and
# taking the diff (nothing else changed). Next hermes that bumps the schema:
# `cp config.yaml /tmp/hh/config.yaml && HERMES_HOME=/tmp/hh hermes doctor
# --fix && diff -u config.yaml /tmp/hh/config.yaml`.
terminal:
  backend: local
  timeout: 180
telegram:
  reactions: false
# Infron (llm.onerouter.pro) holds a prepaid $5 and nothing tops it up, so the
# only models this file may name are the `:free` ids on that route. A paid id
# here spends the balance that keeps the free ones working.
#
# The key is never written in this file: the provider entry names the env var and
# INFRON_API_KEY comes from the shared sops blob (ai-services-shared-env), so a
# rotation reaches hermes through hermes-env-sync instead of a second copy here.
# Verified 2026-11-18: one `:free` completion returns `ok`, usage 12 tokens.
providers:
  infron:
    api: https://llm.onerouter.pro/v1
    key_env: INFRON_API_KEY
    api_mode: openai
    default_model: deepseek/deepseek-v4-flash-0731:free
    models:
      "deepseek/deepseek-v4-flash-0731:free": {}
      "qwen/qwen3.8-27b:free": {}
model:
  provider: custom
  default: deepseek/deepseek-v4-flash-0731:free
  base_url: https://llm.onerouter.pro/v1
agent:
  max_turns: 150
  reasoning_effort: medium
# Search is pinned to Tavily, extraction is not pinned. Both keys arrive from the
# one shared sops blob (`ai-services-shared-env`), and per-capability keys never
# reroute the other capability (tools/web_tools.py `_get_backend`), so extract
# stays on Firecrawl's keyed path. Left unpinned, `hermes doctor` resolved both
# capabilities to firecrawl (measured 2026-11-12), which left the Tavily key
# loaded but unused.
web:
  search_backend: tavily
display:
  interface: cli
  tool_progress: all
# Fallback chain: the second and last free id on the same route. The chain used
# to span four vendors, which was the right shape while it read as free quota —
# it is the wrong shape now, because every extra entry names a model outside the
# two this account may run. One failover inside one route is the whole chain.
fallback_providers:
  - provider: custom
    model: qwen/qwen3.8-27b:free
    base_url: https://llm.onerouter.pro/v1
# chatplayground is deliberately NOT a provider here. Its chat endpoint takes
# exactly one message of at most 15,000 characters, while a hermes turn sends
# ~29,000 characters of system prompt and tool schemas, so every
# `--provider chatplayground` turn did the work and then fell back. It is used
# as a CLI advice lane instead: `.agents/skills/cpg` (skill) over
# `cpg chat`, a self-contained client that needs no unit and no shim.
# The loopback shim on 127.0.0.1:8799 still exists for aichat's
# `openai-compatible` client (`programs.hermes-user.chatplayground`).
tts:
  primary: speechify
  speechify:
    api_key: ${SPEECHIFY_API_KEY}
    endpoint: https://api.speechify.ai/v1/audio/stream
    model: simba-3.2
    voice_id: harper
    options:
      text_normalization: false
  fallback_providers:
    - provider: edge
stt:
  enabled: true
  provider: local
  local:
    model: base
# Titles and compression used to pin gemini, and the OpenRouter free lane held
# everything else. Both are other models: with the account restricted to two
# `:free` ids, an aux task routed anywhere else breaks that rule without buying
# anything — `provider: auto` sends aux work to the main chat model instead.
# `free_only` stays as a belt on the OpenRouter default lane for any aux call
# that still has no explicit destination.
auxiliary:
  free_only: true
skills:
  trusted_project_dirs:
    - /Volumes/data/projects/nixconfig
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '8679391100'
      name: Matt Ji
      user_id: '8679391100'
fallback:
  min_switch_reset_seconds: 120
  api_max_retries: 1
onboarding:
  seen:
    busy_input_prompt: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
_config_version: 52
