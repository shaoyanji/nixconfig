version: "3"

# PythonAnywhere has no SSH on the free tier and no remote-command endpoint in
# its REST API, so every task here is an HTTP call against api/v0 — the same
# "ask over HTTP with a timeout, never open ssh in an unattended path" rule the
# fleet applies to cache checks. The token lives in the sops apikeys file.
#
# What the API cannot do: run a shell. `git pull`, `pip install` and
# `main.py db-upgrade` are Bash console actions; a code change reaches the host
# as files-API writes plus a reload, which is what `pythonanywhere:push` is for.
#
# The `PYTHONANYWHERE.MYSQL.PASSWORD` entry in the same sops file is deliberately
# unused: PythonAnywhere only accepts MySQL connections from inside its own
# network, so no task here can reach the database directly — migrations run in a
# console, and `pythonanywhere:status` reads the app's own /api/summary instead.
vars:
  PYANY_USER: "jisifu"
  PYANY_DOMAIN: "jisifu.pythonanywhere.com"
  PYANY_SITE: "https://jisifu.pythonanywhere.com"
  PYANY_API: "https://www.pythonanywhere.com/api/v0/user/jisifu"
  PYANY_ROOT: "/home/jisifu/pythonanywhere"
  PYANY_DEPLOY_DESC: "pyany-deploy"
  # PYANY_DEPLOY_HOUR is deliberately NOT declared here: a declared var shadows
  # the CLI value, so `PYANY_DEPLOY_HOUR=15 task ...:install` silently created a
  # 03:00 task. The cmd reads it with `| default "3"` instead.
  PYANY_DEPLOY_CMD: "cd /home/jisifu/pythonanywhere && git fetch https://github.com/shaoyanji/pythonanywhere.git master && git merge --ff-only FETCH_HEAD && /home/jisifu/.local/bin/pa webapp reload"

tasks:
  pythonanywhere:status:
    desc: Health, web app state, CPU quota and expiry in one read-only pass
    summary: >
      GET /api/health plus api/v0 webapps, cpu and the .git ref of the deployed
      checkout. Exits 1 when the health route is not 200 or the web app is
      disabled; expiry, quota and commit drift are printed but do not fail,
      because a lapsed date or a not-yet-pulled commit is a chore, not a fault.
      Set PYANY_LOCAL=<path to the checkout> to compare the host commit against it.
    cmds:
      - |
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        echo "=== health ({{.PYANY_SITE}}/api/health) ==="
        CODE=$(curl -sS -m 20 -o /tmp/pyany-health.$$ -w '%{http_code}' {{.PYANY_SITE}}/api/health)
        cat /tmp/pyany-health.$$; echo " [HTTP $CODE]"; rm -f /tmp/pyany-health.$$
        echo
        echo "=== web app ($CODE) ==="
        APP=$(curl -sS -m 20 -H "Authorization: Token $TOKEN" {{.PYANY_API}}/webapps/)
        echo "$APP" | yq -r '.[0] | "  domain:     \(.domain_name)\n  enabled:    \(.enabled)\n  python:     \(.python_version)\n  source:     \(.source_directory)\n  expires:    \(.expiry)"'
        VENV=$(echo "$APP" | yq -r '.[0].virtualenv_path')
        if [ -z "$VENV" ]; then VENV="(none: system site-packages)"; fi
        echo "  virtualenv: $VENV"
        echo
        echo "=== cpu quota ==="
        curl -sS -m 20 -H "Authorization: Token $TOKEN" {{.PYANY_API}}/cpu/ | yq -r '"  \(.daily_cpu_total_usage_seconds) of \(.daily_cpu_limit_seconds) CPU-seconds used today, resets \(.next_reset_time)"'
        echo
        echo "=== deployed commit ==="
        HEADREF=$(curl -sS -m 20 -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/files/path{{.PYANY_ROOT}}/.git/HEAD?raw=1")
        SHA=$(curl -sS -m 20 -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/files/path{{.PYANY_ROOT}}/.git/$(echo "$HEADREF" | sed 's/^ref: //')?raw=1")
        echo "  $(echo "$HEADREF" | sed 's/^ref: //') $SHA"
        if [ -n "{{.PYANY_LOCAL | default ""}}" ]; then
          WANT=$(git -C "{{.PYANY_LOCAL}}" rev-parse HEAD 2>/dev/null)
          if [ "$SHA" = "$WANT" ]; then echo "  in sync with {{.PYANY_LOCAL}}"; else echo "  DRIFT: {{.PYANY_LOCAL}} is at $WANT"; fi
        fi
        echo
        echo "=== error log, last 3 lines ==="
        curl -sS -m 20 -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/files/path/var/log/{{.PYANY_DOMAIN}}.error.log?raw=1" | tail -n 3
        if [ "$CODE" != "200" ]; then exit 1; fi
        if [ "$(echo "$APP" | yq -r '.[0].enabled')" != "true" ]; then
          echo "web app is disabled"; exit 1
        fi

  pythonanywhere:reload:
    desc: Reload the web app after a code or config change, then re-check health
    summary: >
      POST webapps/<domain>/reload/ then GET /api/health. Exits 1 when reload is
      refused or health does not come back 200 — a reload that silently did not
      take is the failure mode this pairs with.
    cmds:
      - |
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        echo "=== reload {{.PYANY_DOMAIN}} ==="
        R=$(curl -sS -m 60 -X POST -H "Authorization: Token $TOKEN" -w '\n%{http_code}' {{.PYANY_API}}/webapps/{{.PYANY_DOMAIN}}/reload/)
        BODY=$(echo "$R" | head -n -1); CODE=$(echo "$R" | tail -n 1)
        echo "$BODY [HTTP $CODE]"
        if [ "$CODE" != "200" ]; then exit 1; fi
        echo "=== health after reload ==="
        H=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' {{.PYANY_SITE}}/api/health)
        echo "HTTP $H"
        if [ "$H" != "200" ]; then exit 1; fi

  pythonanywhere:logs:
    desc: Tail the web app log over the files API — PYANY_LOG=error|access|server, PYANY_LINES=40
    summary: >
      GET /files/path/var/log/<domain>.<PYANY_LOG>.log. Defaults to the error log,
      the one that answers "why is the page blank"; PYANY_LOG=access for requests.
    cmds:
      - |
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        echo "=== {{.PYANY_DOMAIN}}.{{.PYANY_LOG | default "error"}}.log, last {{.PYANY_LINES | default "40"}} lines ==="
        curl -sS -m 30 -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/files/path/var/log/{{.PYANY_DOMAIN}}.{{.PYANY_LOG | default "error"}}.log?raw=1" | tail -n {{.PYANY_LINES | default "40"}}

  pythonanywhere:files:
    desc: List the remote tree under PYANY_PATH (default the project checkout)
    summary: >
      GET /files/tree/?path=PYANY_PATH. One path per line, directories trailing
      a slash — the cheap way to confirm what the host actually has, since a
      console `git pull` can leave stale modules behind a files-API sync.
    cmds:
      - |
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        echo "=== {{.PYANY_ROOT}} ==="
        curl -sS -m 30 -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/files/tree/?path={{.PYANY_ROOT}}" | yq -r '.[]'

  pythonanywhere:push:
    desc: Upload one local file over the files API — args are a local file, then an optional remote path
    summary: >
      POST /files/path/ multipart with the `content` field, which is the only
      upload form the API accepts. Remote paths are filesystem-absolute and
      writable only under /home/<user>; with no destination the file lands at
      PYANY_ROOT under its own name. Nothing reloads: pair it with a reload.
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=$(echo "$ARGS" | awk '{print $1}')
        DEST=$(echo "$ARGS" | awk '{print $2}')
        if [ -z "$SRC" ]; then
          echo "usage: task pythonanywhere:push -- <local-file> [remote-path]"
          echo "example: task pythonanywhere:push -- app/templates/layouts/base.html /home/jisifu/pythonanywhere/app/templates/layouts/base.html"
          exit 1
        fi
        if [ ! -f "$SRC" ]; then echo "not a file: $SRC"; exit 1; fi
        if [ -z "$DEST" ]; then DEST="{{.PYANY_ROOT}}/$(basename "$SRC")"; fi
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        echo "=== upload $SRC -> $DEST ==="
        curl -sS -m 60 -X POST -H "Authorization: Token $TOKEN" -F "content=@$SRC" -w ' [HTTP %{http_code}]\n' "{{.PYANY_API}}/files/path${DEST}"

  pythonanywhere:pull:
    desc: Download one remote file over the files API — args are a remote path, then an optional local path
    summary: >
      GET /files/path/<remote>?raw=1. With no local path the file is written to
      the current directory under its own name. Use it to diff what the host
      serves against the checkout before overwriting anything.
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        REMOTE=$(echo "$ARGS" | awk '{print $1}')
        LOCAL=$(echo "$ARGS" | awk '{print $2}')
        if [ -z "$REMOTE" ]; then
          echo "usage: task pythonanywhere:pull -- <remote-path> [local-path]"
          exit 1
        fi
        if [ -z "$LOCAL" ]; then LOCAL=$(basename "$REMOTE"); fi
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        echo "=== download $REMOTE -> $LOCAL ==="
        curl -sS -m 60 -H "Authorization: Token $TOKEN" -o "$LOCAL" -w '[HTTP %{http_code}]\n' "{{.PYANY_API}}/files/path${REMOTE}?raw=1"

  pythonanywhere:schedule:install:
    desc: Install the daily console-free deploy — git fetch + fast-forward + web app reload, on the host's own clock
    summary: >
      Creates a PythonAnywhere scheduled task (daily, PYANY_DEPLOY_HOUR UTC,
      default 03:00) running PYANY_DEPLOY_CMD, replacing any task already
      described as PYANY_DEPLOY_DESC so the command stays one fact. The fetch
      uses the public HTTPS URL rather than origin: no deploy key to register
      and no known_hosts dependency, which a non-interactive run cannot satisfy.
      Free-tier tasks expire every 4 weeks — the extend URL is the web UI, not
      an API route, so renewing is a browser click.
    cmds:
      - |
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        DESC="{{.PYANY_DEPLOY_DESC}}"
        echo "=== removing any existing task described as $DESC ==="
        for id in $(curl -sS -m 20 -H "Authorization: Token $TOKEN" {{.PYANY_API}}/schedule/ | jq -r --arg d "$DESC" '.[] | select(.description == $d) | .id'); do
          curl -sS -m 20 -X DELETE -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/schedule/$id/" -w "  removed $id [%{http_code}]\n"
        done
        echo "=== creating the daily task ==="
        BODY=$(jq -nc --arg c '{{.PYANY_DEPLOY_CMD}}' --arg d "$DESC" --argjson h {{.PYANY_DEPLOY_HOUR | default "3"}} \
          '{command: $c, enabled: true, interval: "daily", hour: $h, minute: 0, description: $d}')
        OUT=$(curl -sS -m 20 -X POST -H "Authorization: Token $TOKEN" -H 'Content-Type: application/json' -d "$BODY" -w '\n%{http_code}' {{.PYANY_API}}/schedule/)
        CODE=$(echo "$OUT" | tail -n 1); JSON=$(echo "$OUT" | head -n -1)
        echo "HTTP $CODE"
        if [ "$CODE" != "201" ]; then echo "$JSON"; exit 1; fi
        echo "$JSON" | jq -r '"  id:        \(.id)\n  runs:      \(.printable_time) UTC, \(.interval)\n  expires:   \(.expiry)\n  log:       \(.logfile)\n  command:   \(.command)"'
        echo
        echo "Renew with the extend URL in the dashboard before the expiry date."

  pythonanywhere:schedule:show:
    desc: List scheduled tasks and tail the deploy task's own log
    summary: >
      GET /schedule/ plus the task's logfile over the files API. The log is the
      only place a scheduled run reports itself: a pull that fails on a merge
      conflict writes here and nowhere else, so a green web app proves nothing
      about the last deploy attempt.
    cmds:
      - |
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        echo "=== scheduled tasks ==="
        LIST=$(curl -sS -m 20 -H "Authorization: Token $TOKEN" {{.PYANY_API}}/schedule/)
        echo "$LIST" | jq -r 'if length == 0 then "  none" else (.[] | "  \(.id)  \(.printable_time) \(.interval)  enabled=\(.enabled)  expires=\(.expiry)  \(.description)") end'
        ID=$(echo "$LIST" | jq -r --arg d '{{.PYANY_DEPLOY_DESC}}' '.[] | select(.description == $d) | .id' | head -1)
        if [ -z "$ID" ]; then
          echo "no task described as {{.PYANY_DEPLOY_DESC}}"
        else
          echo
          echo "=== deploy task log (id $ID), last {{.PYANY_LINES | default "40"}} lines ==="
          curl -sS -m 30 -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/files/path/var/log/schedule-log-$ID.log?raw=1" | tail -n {{.PYANY_LINES | default "40"}}
        fi

  pythonanywhere:schedule:remove:
    desc: Delete the console-free deploy task, leaving the web app running
    summary: >
      DELETEs every scheduled task described as PYANY_DEPLOY_DESC. It removes
      the deploy timer only: the checkout, the web app and the current code are
      untouched, so this is the revert for a scheduled deploy you no longer want.
    cmds:
      - |
        TOKEN=$(sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -r '.PYTHONANYWHERE.API.TOKEN')
        DESC="{{.PYANY_DEPLOY_DESC}}"
        IDS=$(curl -sS -m 20 -H "Authorization: Token $TOKEN" {{.PYANY_API}}/schedule/ | jq -r --arg d "$DESC" '.[] | select(.description == $d) | .id')
        if [ -z "$IDS" ]; then echo "no task described as $DESC"; exit 0; fi
        for id in $IDS; do
          curl -sS -m 20 -X DELETE -H "Authorization: Token $TOKEN" "{{.PYANY_API}}/schedule/$id/" -w "  removed $id [%{http_code}]\n"
        done
