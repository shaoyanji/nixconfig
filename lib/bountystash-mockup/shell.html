<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:locale" content="{{ogLocale}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0c0b'/%3E%3Ctext x='8' y='23' font-family='monospace' font-size='17' fill='%23b8f36b'%3Eb%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{cssHref}}">
</head>
<body>
<p class="mock">{{banner}}</p>
<header class="bar">
  <a class="mark" href="#top">{{brandName}}<span class="caret" aria-hidden="true">_</span><span class="badge">{{badge}}</span></a>
  <nav class="bar-nav" aria-label="Sections">{{nav}}</nav>
  <p class="langs">{{langs}}</p>
  <a class="btn small" href="{{ctaHref}}">{{ctaLabel}}</a>
</header>
<main id="top">
{{body}}
</main>
<footer class="foot">
  <p>{{footer}}</p>
  <p class="foot-links"><a href="#top">{{topLabel}}</a> · <a href="{{ctaHref}}">{{ctaLabel}}</a> · <a href="https://bountystash.com">bountystash.com</a></p>
</footer>
</body>
</html>
