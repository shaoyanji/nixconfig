# Hermes Agent Configuration — Vanta persona
# Sensitive tokens (e.g. TELEGRAM_BOT_TOKEN) loaded from ~/.hermes/.env
#
# `_config_version` is written by hermes' own migrator. Keep it current: with
# v0 stamped, every `hermes doctor` reported "Config version outdated (v0 →
# v51)" and the retired `security.tirith_enabled` key sat in the file. Both
# were fixed on 2026-11-05 by migrating a copy under HERMES_HOME=/tmp/hh and
# taking the diff (nothing else changed). Next hermes that bumps the schema:
# `cp config.yaml /tmp/hh/config.yaml && HERMES_HOME=/tmp/hh hermes doctor
# --fix && diff -u config.yaml /tmp/hh/config.yaml`.
terminal:
  backend: local
  timeout: 180
telegram:
  reactions: false
model:
  provider: nous
  default: inclusionai/ling-3.0-flash-sante:free
agent:
  max_turns: 150
display:
  interface: cli
  tool_progress: all
fallback_providers:
  - provider: openrouter
    model: thinkingmachines/inkling:free
  - provider: deepseek
    model: deepseek-flash
tts:
  primary: speechify
  speechify:
    api_key: ${SPEECHIFY_API_KEY}
    endpoint: https://api.speechify.ai/v1/audio/stream
    model: simba-3.2
    voice_id: harper
    options:
      text_normalization: false
  fallback_providers:
    - provider: edge
stt:
  enabled: true
  provider: local
  local:
    model: base
security: {}
auxiliary:
  title_generation:
    model: nous/inclusionai/ling-3.0-flash-sante:free
skills:
  trusted_project_dirs:
    - /Volumes/data/projects/nixconfig
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '8679391100'
      name: Matt Ji
      user_id: '8679391100'
fallback:
  min_switch_reset_seconds: 120
  api_max_retries: 1
onboarding:
  seen:
    busy_input_prompt: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
_config_version: 51
