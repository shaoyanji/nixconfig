# telc B2 Schreiben, one full mock session: two tasks to choose from (as the
# exam hands them out), a model for each, and the clock. The other two files
# hold the connectors and the Redemittel; this one is the rehearsal.
#
# Format it rehearses: 30 minutes, Aufgabe A (Bitte um Informationen) or
# Aufgabe B (Beschwerde), one written, at least 150 words, four Leitpunkte of
# which three are treated, 45 of 300 points.

