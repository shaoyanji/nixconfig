[[deck.card]]
front = "Wie ist der schriftliche Teil von telc B2 aufgebaut?"
back = "<b>Zwei Aufgaben, eine Wahl:</b> Sie bekommen Aufgabe A (Bitte um Informationen) und Aufgabe B (Beschwerde) und bearbeiten genau eine davon.<br><b>Zeit:</b> 30 Minuten für den ganzen Teil, keine Vorbereitungszeit wie im mündlichen Teil.<br><b>Umfang:</b> mindestens 150 Wörter, Richtwert 150–200.<br><b>Punkte:</b> 45 von 300, also ein Viertel der Prüfung.<br><b>Leitpunkte:</b> Die Aufgabe nennt vier; behandeln Sie drei davon oder zwei plus einen eigenen Aspekt.<br><b>Textsorte:</b> (halb-)formeller Brief oder E-Mail — Anrede, Einleitung, ein Absatz pro Leitpunkt, Schluss, Grußformel.<br><br>Beide Aufgaben beziehen sich auf eine Anzeige oder eine kurze Situationsbeschreibung; wer die Textsorte verfehlt, verliert fast alle Punkte."

[[deck.card]]
front = "Woran erkenne ich in 60 Sekunden, welche Aufgabe ich nehme?"
back = "<b>Zählen Sie die Leitpunkte, die Sie mit zwei Sätzen füllen können.</b> Wer drei Punkte sofort mit einem konkreten Detail (Datum, Summe, Name) füllen kann, nimmt diese Aufgabe.<br><b>Beschwerde (B):</b> leicht, wenn Sie echte Details erfinden können — Rechnungsnummer, Termin, zugesagte Leistung. Die Struktur trägt sich selbst: Problem → Folgen → Forderung → Frist.<br><b>Anfrage (A):</b> leicht, wenn Sie Fragen sicher formulieren — „ich würde gern wissen, ob …“, „könnten Sie mir mitteilen, wie …“. Jede Frage ist ein Satz, also schnell geschrieben.<br><b>Nie beides anfangen.</b> Nach zwei Minuten steht die Wahl; wer wechselt, hat 30 Minuten für zwei halbe Texte.<br><b>Faustregel:</b> Beschwerde, wenn Ihnen drei konkrete Probleme einfallen; Anfrage, wenn Ihnen drei konkrete Fragen einfallen. Beides gelingt fast immer — entscheiden Sie nach dem ersten Einfall, nicht nach Sympathie."

[[deck.card]]
front = "Aufgabe A (Bitte um Informationen)\n\nAnzeige: „Deutsch intensiv am Bodensee“ — vier Wochen, 20 Lektionen pro Woche, Einzelzimmer mit Frühstück, Vorbereitung auf telc B2, 1.890 €, Anmeldung bis 15. Mai.\n\nSchreiben Sie an das Sprachinstitut und behandeln Sie drei der vier Leitpunkte:\na) Nennen Sie den Grund Ihres Schreibens und den gewünschten Zeitraum.\nb) Fragen Sie nach den Kurszeiten und nach einem Einstufungstest.\nc) Fragen Sie nach der Unterkunft und der Verpflegung.\nd) Fragen Sie, ob die Prüfungsgebühr enthalten ist und ob Ratenzahlung möglich ist; sagen Sie, was Sie erwarten.\n\n30 Minuten. Mindestens 150 Wörter. Formelle Anrede, Grußformel."
back = "<b>Erwartungshorizont:</b> formelle Anrede · Bezug auf die Anzeige in der Einleitung · drei Leitpunkte, jeder in einem eigenen Absatz · höfliche Fragen im Konjunktiv II · Schluss mit Bitte um Antwort und Frist · Grußformel.<br><b>Struktur:</b> 1 Einleitungssatz, 3 Absätze (je Leitpunkt), 1 Schlussabsatz. Kein Absatz länger als vier Sätze.<br><b>Redemittel:</b> „ich habe Ihre Anzeige … gelesen und interessiere mich für …“ · „zunächst würde ich gern wissen, ob …“ · „außerdem interessiert mich, wie / wann / ob …“ · „könnten Sie mir bitte mitteilen, ob …“ · „ich bitte Sie um eine Antwort bis zum …“<br><b>Typischer Fehler:</b> Fragen ohne Fragezeichen-Konstruktion aufzählen („Wie viel kostet der Kurs?“ fünfmal hintereinander) — das klingt wie ein Fragebogen. Jede Frage braucht einen eigenen Rahmen.<br><b>Zweiter Fehler:</b> die Anzeige nicht zitieren. Wer den Kurs nicht nennt, schreibt an einen beliebigen Empfänger."
requires = "Wie ist der schriftliche Teil von telc B2 aufgebaut?"

[[deck.card]]
front = "Musterlösung Aufgabe A (Anfrage: Sprachkurs am Bodensee)"
back = "Sehr geehrte Damen und Herren,<br><br>ich habe Ihre Anzeige für den Sprachkurs „Deutsch intensiv“ am Bodensee gelesen und interessiere mich für den Kurs im Juli nächsten Jahres, da ich im September die Prüfung telc B2 ablegen möchte.<br><br>Für meine Planung benötige ich noch einige Informationen. Zunächst würde ich gern wissen, ob der Unterricht vormittags oder nachmittags stattfindet und ob ein Einstufungstest vorgeschrieben ist. Außerdem interessiert mich, ob das Einzelzimmer mit Frühstück im Preis enthalten ist oder ob ich die Verpflegung separat buchen muss. Darüber hinaus wäre es wichtig zu wissen, ob die Prüfungsgebühr für telc B2 in den 1.890 € enthalten ist; falls nicht, hätte ich gern eine Aufstellung der zusätzlichen Kosten. Da ich die Gebühr nicht auf einmal zahlen kann, möchte ich außerdem fragen, ob eine Ratenzahlung möglich ist.<br><br>Ich bitte Sie um eine ausführliche Antwort bis Ende des Monats und um eine schriftliche Bestätigung der Buchung.<br><br>Mit freundlichen Grüßen<br>Matt Ji<br><br><i>Konnektoren: da, zunächst, außerdem, darüber hinaus, falls, weil. Vier Absätze, jeder Leitpunkt genau einmal. Die Fragen tragen Konjunktiv II („würde gern wissen“, „hätte gern“, „wäre wichtig“), damit sie wie Bitten klingen und nicht wie ein Formular.</i>"
requires = "Aufgabe A (Bitte um Informationen)\n\nAnzeige: „Deutsch intensiv am Bodensee“ — vier Wochen, 20 Lektionen pro Woche, Einzelzimmer mit Frühstück, Vorbereitung auf telc B2, 1.890 €, Anmeldung bis 15. Mai.\n\nSchreiben Sie an das Sprachinstitut und behandeln Sie drei der vier Leitpunkte:\na) Nennen Sie den Grund Ihres Schreibens und den gewünschten Zeitraum.\nb) Fragen Sie nach den Kurszeiten und nach einem Einstufungstest.\nc) Fragen Sie nach der Unterkunft und der Verpflegung.\nd) Fragen Sie, ob die Prüfungsgebühr enthalten ist und ob Ratenzahlung möglich ist; sagen Sie, was Sie erwarten.\n\n30 Minuten. Mindestens 150 Wörter. Formelle Anrede, Grußformel."

[[deck.card]]
front = "Aufgabe B (Beschwerde)\n\nSie haben das Online-Training „Bewerbung auf Deutsch“ gebucht: drei Abende, 240 €, bezahlt am 3. Oktober. Zwei Termine fielen kurzfristig aus, die Trainerin wurde nach der ersten Sitzung ausgewechselt, die Arbeitsblätter und die Teilnahmebescheinigung fehlen bis heute. Auf zwei E-Mails hat niemand geantwortet.\n\nSchreiben Sie an den Anbieter und behandeln Sie drei der vier Leitpunkte:\na) Nennen Sie den Grund Ihres Schreibens und die Buchungsdaten.\nb) Schildern Sie die Probleme.\nc) Erklären Sie die Folgen für Sie.\nd) Sagen Sie, was Sie erwarten, und setzen Sie eine Frist.\n\n30 Minuten. Mindestens 150 Wörter. Formelle Anrede, Grußformel."
back = "<b>Erwartungshorizont:</b> formelle Anrede · Bezug mit Rechnungsnummer, Summe und Datum · drei Probleme, jedes mit einem Konnektor (obwohl, außerdem, darüber hinaus) · Folgen konkret (verpasste Frist, doppelte Vorbereitung) · Forderung mit Zahl und Frist · Grußformel.<br><b>Struktur:</b> Einleitung mit Bezug (1–2 Sätze) · Problemabsatz (3–4 Sätze, ein Problem pro Satz) · Folgenabsatz (2 Sätze) · Forderung + Frist (2 Sätze) · Grußformel.<br><b>Redemittel:</b> „leider muss ich Ihnen mitteilen, dass …“ · „obwohl Sie … zugesagt hatten, …“ · „hinzu kommt, dass …“ · „ich habe Sie bereits am … darauf hingewiesen“ · „ich erwarte daher, dass …“ · „sollte ich bis dahin nichts hören, werde ich …“<br><b>Ton:</b> sachlich bleiben. Eine Drohung mit der Verbraucherzentrale ist in Ordnung, eine Beleidigung kostet Punkte.<br><b>Typischer Fehler:</b> nur jammern und die Forderung vergessen — der Leitpunkt d) ist ein eigener Punkt im Bewertungsraster."
requires = "Wie ist der schriftliche Teil von telc B2 aufgebaut?"

[[deck.card]]
front = "Musterlösung Aufgabe B (Beschwerde: Online-Training)"
back = "Sehr geehrte Damen und Herren,<br><br>ich schreibe Ihnen bezüglich des Online-Trainings „Bewerbung auf Deutsch“, das ich am 3. Oktober gebucht und vollständig bezahlt habe (Rechnung Nr. 2214, 240 €).<br><br>Leider muss ich Ihnen mitteilen, dass der Kurs nicht wie angekündigt stattgefunden hat. Obwohl drei Abende vereinbart waren, fielen zwei Termine kurzfristig aus, ohne dass ich eine Erklärung erhielt. Außerdem wurde die Trainerin nach der ersten Sitzung ausgewechselt, sodass die Gruppe zweimal von vorn beginnen musste. Darüber hinaus habe ich die zugesagten Arbeitsblätter bis heute nicht bekommen. Da ich mich in dieser Zeit auf zwei Bewerbungen vorbereiten wollte, sind mir konkrete Nachteile entstanden: Eine Bewerbungsfrist habe ich deshalb verpasst. Zwar habe ich zweimal per E-Mail um Rückmeldung gebeten, jedoch ohne Antwort.<br><br>Ich erwarte daher eine Teilerstattung von mindestens 50 Prozent sowie die Zusendung der Unterlagen und der Teilnahmebescheinigung bis zum 30. November. Sollte ich bis dahin nichts von Ihnen hören, werde ich mich an die Verbraucherzentrale wenden.<br><br>Mit freundlichen Grüßen<br>Matt Ji<br><br><i>Konnektoren: obwohl, außerdem, sodass, darüber hinaus, da, deshalb, zwar … jedoch, daher, sowie. Jeder Leitpunkt ist ein Absatz; die Frist steht im letzten Satz vor der Grußformel. „Zwar … jedoch“ trägt den Satz, der zeigt, dass Sie es zuerst höflich versucht haben.</i>"
requires = "Aufgabe B (Beschwerde)\n\nSie haben das Online-Training „Bewerbung auf Deutsch“ gebucht: drei Abende, 240 €, bezahlt am 3. Oktober. Zwei Termine fielen kurzfristig aus, die Trainerin wurde nach der ersten Sitzung ausgewechselt, die Arbeitsblätter und die Teilnahmebescheinigung fehlen bis heute. Auf zwei E-Mails hat niemand geantwortet.\n\nSchreiben Sie an den Anbieter und behandeln Sie drei der vier Leitpunkte:\na) Nennen Sie den Grund Ihres Schreibens und die Buchungsdaten.\nb) Schildern Sie die Probleme.\nc) Erklären Sie die Folgen für Sie.\nd) Sagen Sie, was Sie erwarten, und setzen Sie eine Frist.\n\n30 Minuten. Mindestens 150 Wörter. Formelle Anrede, Grußformel."

[[deck.card]]
front = "Der 30-Minuten-Plan für den schriftlichen Teil"
back = "<b>0–2 Min:</b> beide Aufgaben lesen, eine wählen. Nicht nach Geschmack, sondern nach den Leitpunkten, die Sie füllen können.<br><b>2–4 Min:</b> drei Leitpunkte als Stichworte, je ein Verb und ein Konnektor dazu. Kein vollständiger Satz, keine Einleitung.<br><b>4–22 Min:</b> schreiben. Ein Absatz pro Leitpunkt, Anrede und Einleitung in den ersten drei Sätzen.<br><b>22–26 Min:</b> Schluss: Forderung oder Bitte, Frist, Grußformel. Erst schreiben, wenn der Schluss steht — ein Brief ohne Schluss verliert mehr Punkte als einer mit einem schwachen Mittelteil.<br><b>26–30 Min:</b> prüfen: Anrede, Grußformel, Verb an Position 2 nach jedem Konnektor, Wortzahl (eine handschriftliche Seite mit vier Absätzen sind ungefähr 150 Wörter).<br><br>Wenn die Zeit knapp wird: Platz für einen Absatz lassen und zuerst den Schluss schreiben. Ein fehlender Leitpunkt kostet weniger als ein fehlender Schluss."
requires = "Wie ist der schriftliche Teil von telc B2 aufgebaut?"

[[deck.card]]
front = "Wie wird der schriftliche Teil bewertet? (3 Kriterien)"
back = "<b>1. Aufgabenbewältigung:</b> Sind die Leitpunkte behandelt? Ist die Textsorte getroffen? Ist die Situation erkennbar (wer schreibt an wen, warum)?<br><b>2. Kommunikative Gestaltung:</b> Absätze, Konnektoren, angemessener Ton, Anrede und Grußformel, ein Schluss, der zur Situation passt.<br><b>3. Formale Richtigkeit:</b> Grammatik, Wortschatz, Rechtschreibung. Fehler zählen, aber sie wiegen weniger als ein verfehltes Thema.<br><br><b>Was fast alles kostet:</b> Thema verfehlt oder Textsorte verfehlt — dann hilft auch fehlerfreie Grammatik nicht mehr.<br><b>Was wenig kostet:</b> ein einzelner Rechtschreibfehler, ein zu kurzer Absatz.<br><b>Was auffällt:</b> „du“ statt „Sie“ im formellen Brief, fehlende Anrede, ein Schluss mitten im Satz."
requires = "Wie ist der schriftliche Teil von telc B2 aufgebaut?"

[[deck.card]]
front = "Selbstkorrektur in vier Minuten (Checkliste)"
back = "Gehen Sie den Text von oben nach unten durch und haken Sie ab:<br><b>1.</b> Steht „Sehr geehrte …,“ mit Komma und klein weiter?<br><b>2.</b> Steht am Ende „Mit freundlichen Grüßen“ ohne Komma, danach der Name?<br><b>3.</b> Hat jeder Leitpunkt einen eigenen Absatz?<br><b>4.</b> Steht nach „deshalb“, „trotzdem“, „außerdem“ das Verb an Position 2?<br><b>5.</b> Steht nach „weil“, „obwohl“, „dass“, „damit“ das Verb am Ende?<br><b>6.</b> Gibt es mindestens vier verschiedene Konnektoren, keiner zweimal direkt hintereinander?<br><b>7.</b> Steht eine Forderung oder Bitte mit Frist im letzten Absatz?<br><b>8.</b> Sind es mindestens 150 Wörter?<br><br>Punkt 3 und 7 sind die, die im Zeitdruck zuerst verloren gehen — prüfen Sie sie zuerst."
