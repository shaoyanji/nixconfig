<p class="back"><a href="{{backHref}}">{{backLabel}}</a></p>
<article class="project">
  <h2><span>{{index}}</span> {{kind}}</h2>
  <h3>{{title}}</h3>
  <p class="meta">{{role}} · {{period}}</p>
  <p class="lede">{{description}}</p>
  <h3>{{impactLabel}}</h3>
  <p class="impact">{{impact}}</p>
  <h3>{{stackLabel}}</h3>
  <ul class="tags">{{stack}}</ul>
</article>
