version: "3"

# vox is the explainer layer built in a separate project (shaoyanji/pancakes-harness,
# `internal/vox`), pinned in flake/cli.nix. Three model roles, one CLI:
# needle3 picks a tool call, jev-decide routes the lane, cpg says the result.
#
# Each role is optional, which is why these tasks do not gate on all three: a
# missing engine makes the caller a replay fixture, a missing decision model
# leaves the caller's own pick, a missing chat lane returns the raw answer.
# `vox:doctor` is the task that says which one is missing on this host.
# An agent reads the result, so the default projection is TOON and `FORMAT=json`
# asks for the wire form the CLI emits; `scripts/task/vox.sh` does the converting
# and keeps the exit code, which is the actual verdict.
vars:
  FORMAT: '{{.FORMAT | default "toon"}}'

tasks:
  vox:doctor:
    desc: Which of the caller, the router and the voice exist on this host
    summary: >
      One line per backend and a `note` for every absence, plus the platform:
      needle3's engine is linux-arm64, so an x86_64 host reports it and expects
      `-replay` or a chat-only lane. Read-only, no network, no model call.
    cmds:
      - bash scripts/task/vox.sh doctor {{.CLI_ARGS}}

  vox:tools:
    desc: The call surface a question can be routed to
    summary: >
      Every tool in `scripts/task/vox-tools.json` with its command template and
      whether it is read-only. A non-read-only tool needs `--allow-write` at ask
      time even when the lane is confident.
    cmds:
      - bash scripts/task/vox.sh tools

  vox:battery:
    desc: Measure how often the caller picks the tool each prompt needs
    summary: >
      Runs `scripts/task/vox-battery.json` against the surface in
      `vox-tools.json` and scores every pass: the tool, the arguments, and
      whether the caller stayed silent where silence is right. `-repeat N`
      exposes a case that disagrees with itself, which one pass hides. Exit 1
      means the score is below `-threshold`. The engine is arm64, so this is a
      delphi task; on x86_64 there is no caller to measure.
    cmds:
      - VOX_FORMAT={{.FORMAT}} bash scripts/task/vox.sh battery -cases scripts/task/vox-battery.json {{.CLI_ARGS}}

  vox:ask:
    desc: Explain one question end to end (caller -> router -> tool -> voice)
    summary: >
      `task vox:ask -- "what is fern"`. One caller pass picks a tool, the lane is
      routed, a read-only tool runs, and the answer is explained in prose. The
      result is TOON; `FORMAT=json` prints the wire form. Exit 2 means the gate
      held it as a proposal, 3 a refusal, 4 an escalation to a reasoning model —
      the exit code carries the verdict, so nothing parses the prose.
    cmds:
      - VOX_FORMAT={{.FORMAT}} bash scripts/task/vox.sh ask {{.CLI_ARGS}}

  vox:decide:
    desc: Ask a decision model for a label and a probability
    summary: >
      `task vox:decide -- -choices "run it,ask a person" "is this worth a tool
      call"`. Prints `{status, pick, probability, margin}`; exit 2 is
      `needs_review`, which is a signal and never an authorisation.
    cmds:
      - bash scripts/task/vox.sh decide {{.CLI_ARGS}}

  vox:say:
    desc: One chat-lane call, no tools and no routing
    summary: >
      `task vox:say -- "explain mkForce in two sentences"`. The human-loop lane
      on its own: one prompt, one answer, no packet assembly.
    cmds:
      - bash scripts/task/vox.sh say {{.CLI_ARGS}}

  vox:round:
    desc: A speculative round through the voice, every candidate returned
    summary: >
      `task vox:round -- "when should a module use mkDefault"`. Four chat lanes
      plus a Jev grade, using `speculate.sh --all` so the candidates are not
      discarded — a round below the gate is evidence, not a winner.
    cmds:
      - bash .agents/skills/cpg-speculate/scripts/speculate.sh --all {{.CLI_ARGS}}
