version: "3"
# Watch mode: coalesce changes that land within 500ms so a multi-file save
# triggers ONE run instead of several duplicate events (task's default is 100ms,
# and duplicates were observed when a new file appeared). Only affects tasks
# using watch/--watch — see checks:nix:watch.
interval: '500ms'
vars:
    # Control-plane vars consumed by taskfiles/* via {{.SECRETS}}/{{.ENC_*}}/
    # {{.PI}}/{{.EMAIL}} — lost together with the menu tasks when c85a41d
    # replaced this file (2026-10-08); restored verbatim. SECRETS is a
    # DIRECTORY: tasks expand it as {{.SECRETS}}/{{.ENC_SECRETS}} etc.
    EMAIL: e@mail.shaoyanji.is-a.dev
    ENC_DETASKFILE: DE-Taskfile.yaml
    ENC_TASKFILE: DE-Taskfile.yaml
    ENC_SECRETS: secrets.yaml
    ENC_ENVS: apikeys.yaml
    SECRETS: modules/secrets
    PI: minyx
    # Personal/desktop vars used by this file's own tasks:
    #
    # There was a `NIX_CONFIG: ~/Documents/nixconfig` here, restored by the
    # c85a41d comment above. Nothing ever read `{{.NIX_CONFIG}}`, and the name is
    # not free: NIX_CONFIG is how Nix takes configuration *lines*, so task
    # exporting this var into a command's environment made every `nix` invocation
    # under it die with "syntax error in configuration line '~/Documents/nixconfig'".
    # It was invisible until a task resolved the local system in a `sh:` var
    # (checks:quick), where the failure is a failed eval, not a loud error.
    NIXNAS: /Volumes/data
    MNTW: /Volumes/peachcable
    MNTX: /Volumes/shared
includes:
    # Fleet taskfiles, flattened (task names are already namespaced:
    # checks:*, infra:*, dev:*, …). Do NOT include this file itself —
    # ~/Documents/nixconfig resolves back to this very file via the
    # home-manager symlink chain, which made task load a include cycle
    # ("include cycle detected … Taskfile.yml <--> Taskfile.yml", exit 110)
    # and broke every root-level `task` run.
    # services.yml flatten-includes services-core/legacy themselves — do not
    # include those two here or every services:* task would be defined twice.
    # dir: . keeps tasks in the repo root even when invoked via the
    # ~/Taskfile.yml forwarder from $HOME.
    agents:
        taskfile: taskfiles/agents.yml
        dir: .
        flatten: true
    apps:
        taskfile: taskfiles/apps.yml
        dir: .
        flatten: true
    bitlockerpremium:
        taskfile: taskfiles/bitlockerpremium.yml
        dir: .
        flatten: true
    bountystash:
        taskfile: taskfiles/bountystash.yml
        dir: .
        flatten: true
    burgernas:
        taskfile: taskfiles/burgernas.yml
        dir: .
        flatten: true
    checks:
        taskfile: taskfiles/checks.yml
        dir: .
        flatten: true
    data:
        taskfile: taskfiles/data.yml
        dir: .
        flatten: true
    dev:
        taskfile: taskfiles/dev.yml
        dir: .
        flatten: true
    dragoncourt:
        taskfile: taskfiles/dragoncourt.yml
        dir: .
        flatten: true
    envs:
        taskfile: taskfiles/envs.yml
        dir: .
        flatten: true
    infra:
        taskfile: taskfiles/infra.yml
        dir: .
        flatten: true
    lifecycle:
        taskfile: taskfiles/lifecycle.yml
        dir: .
        flatten: true
    moto:
        taskfile: taskfiles/moto.yml
        dir: .
        flatten: true
    neocities:
        taskfile: taskfiles/neocities.yml
        dir: .
        flatten: true
    ops:
        taskfile: taskfiles/ops.yml
        dir: .
        flatten: true
    pythonanywhere:
        taskfile: taskfiles/pythonanywhere.yml
        dir: .
        flatten: true
    serv00:
        taskfile: taskfiles/serv00.yml
        dir: .
        flatten: true
    services:
        taskfile: taskfiles/services.yml
        dir: .
        flatten: true
tasks:
    default:
        desc: Show the operator map (intent -> canonical task)
        cmds:
            - task help

    # `help` is the discoverability surface, and it is deliberately NOT
    # `task --list-all`: 373 namespaced task names is a wall, not a map, and
    # the question that actually gets asked is "which task answers THIS".
    # The map below is static (no yq, no nix, no network) so it can never be
    # slow or stale-by-evaluation; the namespace index underneath it is
    # computed from the live task list, so a new shard shows up on its own.
    # All 373 remain one command away: `task --list-all`, or `task find:<word>`.
    help:
        desc: Operator map — intent -> canonical task, plus a live namespace index
        summary: >
          Prints the curated map of intents to tasks, then counts tasks per
          namespace from `task --list-all --json`. Static text + one jq pass:
          no nix evaluation, no build, no network. `task --list-all` is still
          the unfiltered list; `task find:<word>` greps it.
        cmds:
            - |
              cat <<'MAP'
              NIXCONFIG CONTROL PLANE — start from the intent, not from a task name

                task help              this map
                task find:<word>       search task names + descriptions
                task --list-all        every task, unfiltered
                task menu              gum TUI (human)  ·  task menu:operator (agent view)

              WHAT NEEDS DOING (cheap, read-only, no config evaluated)
                task status                    git state + hostname                     free
                task checks:tasks              task graph: Nix-compiled + parity        ~1s
                task checks:build:route        would THIS host have to compile?         HTTP only
                task checks:ports              declarations vs live listeners           free, local
                task checks:dns:failover       resolver group answers + can fail over    LAN probes
                task checks:dns:pool           resolver addresses vs DHCP pool         POOL=<a-b>

              REPO HYGIENE  (proves no host config — that is `checks:host`)
                task checks:quick              inventory checks + lint + sops drift      bounded, no host eval
                task checks:inventory:compiled inventory.toml vs flake host set          store-cached
                task checks:nix:lint           deadnix (hard) + statix (advisory)
                task checks:nix:format         alejandra --check, read-only
                task checks:sops:drift         age recipients match .sops.yaml

              HOST CONFIG  (phased: eval -> build -> size; see AGENTS.md)
                task checks:host HOST=<h>      modules + ALL assertions, ONE host      ~13 s / 720 MiB
                task checks:host HOST=<h> MODE=eval   arch-independent, for aarch64/darwin
                task checks:hosts HOSTS="a b"  a NAMED set, one at a time (no default!)
                task checks:flake             refuses below 16 GiB — do not "improve" this

              HOST FACTS  (never evaluate a config to answer these)
                task dev:inventory:host HOST=<h>  compiled record, no host eval          ~0.15 s
                task dev:inventory:json           whole registry, schema-checked         store-cached
                task dev:inventory:feed           every host, agent-facing digest       store-cached
                task dev:flake:get-hosts          host NAMES only, no config forced     ~2.4 s

              DEPLOY / BUILD  (one intended host at a time)
                task infra:plan:host:<h>       build/substitute the closure, no apply
                task infra:deploy:host:<h>     plan -> apply -> validate
                task infra:apply:host:<h>      apply the closure
                task infra:rollback:host:<h>   roll back + validate
                task infra:warm:host:<h>       build on the BUILDER, verify the cache serves it
                task dev:nixbuild:plan         what would build/fetch (read-only)

              LOCAL REBUILDS
                task infra:rebuild:nixos       sudo nixos-rebuild switch (local)
                task infra:rebuild:home-manager
                task infra:rebuild:darwin

              CLOSURE SIZE  (build PREPARATION — proves nothing)
                task dev:closure:size HOST=<h>     total size
                task dev:closure:top HOST=<h>      biggest contributors
                task dev:closure:reduce ROOT=<p>   duplicate groups

              DOCS  (pages + site nav generated from the compiled metadata)
                task docs:build                markdown + nav from .#artifacts.docs         store path only
                task docs:site                 rendered site (Nix-native)          store path

              OBSERVE / CONTEXT  (live system + compiled knowledge)
                task ops:health                sentinel verdict, exit 1 when degraded
                task ops:ledger                recent observations (JSONL)
                task ops:ledger:toon           same window as TOON, token-cheap
                task ops:skills                compiled skill index (nix eval)
                task ops:skills:check          skill schema gate
                task ops:kg                    knowledge graph stats
                task ops:docs:budget           living-doc line budgets

              CANARY MICROVM (EXP-102)
                task vm:canary:build           build the cloud-hypervisor runner
                task vm:canary:run             boot it
                task vm:canary:test            boot -> ssh -> proxy verify -> stop

              SECRETS
                task infra:sops:fzf            dump apikeys.yaml as KEY=value
                task infra:secrets:edit:apikeys

              COST RULE: eval to catch a config error · build to prove a closure ·
              size to plan a build. Nothing here defaults to the whole fleet —
              `nix flake check` on this NAS was measured at 339.78 s / 6078.5 MiB / SIGKILL 137.
              MAP
            - |
              echo
              echo "NAMESPACES (live, from task --list-all --json)"
              task --list-all --json \
                | jq -r '
                    ([.tasks[].name | select(contains(":")) | split(":")[0]]
                      | group_by(.) | map("\(.[0])\t\(length)") | .[]),
                    ("(root)" + "\t" + ([.tasks[].name | select(contains(":") | not)] | length | tostring))' \
                | sort -t$'\t' -k2,2nr \
                | awk -F'\t' '{printf "  %-20s %3s tasks\n", $1, $2}'
        silent: true

    # Cheap task search, for when the map is not specific enough. Reads the
    # same JSON the map does: no shard is executed, no nix evaluation happens.
    find:*:
        desc: Search task names + descriptions (e.g. `task find:dns`)
        summary: >
          Case-insensitive substring match over every task name and description
          in the control plane (`task --list-all --json` + jq). Read-only and
          cheap; use it before reading a taskfile by hand.
        cmds:
            - |
              q='{{index .MATCH 0}}'
              task --list-all --json \
                | jq -r --arg q "$q" '
                    .tasks[]
                    | select((.name | ascii_downcase | contains($q | ascii_downcase))
                             or ((.desc // "") | ascii_downcase | contains($q | ascii_downcase)))
                    | "\(.name)\t\(.desc // "")"' \
                | sort
        silent: true

    status:
        desc: Show repo/operator status
        cmds:
            - git status --short
            - echo "host=$(hostname)"

    deploy:
        desc: Open deployment menu
        cmds:
            - task infra:deploy:menu

    logs:
        desc: Open logs menu
        cmds:
            - task infra:logs:menu

    menu:
        desc: Open the task control plane (gum TUI, human view)
        cmds:
            - bash scripts/task/menu.sh human

    menu:operator:
        desc: Open the task control plane (gum TUI, machine-operator view)
        cmds:
            - bash scripts/task/menu.sh operator

    menu:json:
        desc: Print the whole task control plane as JSON (machine-readable)
        cmds:
            - bash scripts/task/menu.sh --json

    menu:list:
        desc: Print every task as a flat name<TAB>desc listing
        cmds:
            - bash scripts/task/menu.sh --list

    inventory:
        desc: Open fleet inventory menu (gum)
        cmds:
            - task dev:inventory:menu

    inventory:menu:
        desc: Alias for dev:inventory:menu
        cmds:
            - task dev:inventory:menu

    modules:
        desc: Open fleet control knobs menu (gum)
        cmds:
            - task dev:modules:menu

    modules:menu:
        desc: Alias for dev:modules:menu
        cmds:
            - task dev:modules:menu

    # No `internal: true` (AGENTS.md): it hides a task from `--list-all --json`
    # too, i.e. from the agent/MCP surface. No `desc` either, so it stays out of
    # the human `task --list` menu (§ "keep tasks visible to agents" in
    # docs/task-control-plane.md) — but it keeps a `summary`, so the JSON surface
    # still says what it does. Neither would make it invisible twice.
    exit:
        summary: >
            Exits the task shell (a no-op convenience for menus); no `desc` on purpose so
            `task --list` stays free of it.
        cmds:
            - exit
        silent: true

    load-env:
        desc: prints api keys with multi-selector
        cmds:
            # sopsfzf alias was removed in 739b66e; infra:sops:fzf is its
            # replacement (dumps apikeys.yaml as shell KEY=value, quotes stripped).
            - export $(task infra:sops:fzf)
    llm:
        desc: uses aichat loading the necessary secrets
        vars:
            SECFOLDER: /Volumes/data/security/secrets
        cmds:
            - export $(age -d -i {{.SECFOLDER}}/key.txt {{.SECFOLDER}}/.env.age) && aichat
    notes:
        desc: opens up obsidian notes and does a sync afterwards
        vars:
            OBSIDIANNOTES: ~/Documents/Obsidian-Git-Sync
        cmds:
            - $EDITOR {{.OBSIDIANNOTES}}/notes.md
            - task -t {{.OBSIDIANNOTES}}/Taskfile.yml
    youtube-dl:
        desc: downloads a youtube link from clipboard
        vars:
            VIDEOS: ~/Videos/videos
        cmds:
            - echo $(wl-paste) >> {{.VIDEOS}}/youtube-dl.txt
            - task -t {{.VIDEOS}}/Taskfile.yml
    cloak-otp:
        desc: totp
        cmds:
            - command grep "\[" .cloak/accounts | fzf | tr -d '[]' | xargs cloak view
    image:
        desc: opens up an image with kitty
        cmds:
            - command ls $CWD | fzf | awk '{print $7}' | xargs kitty icat
    appimage:
        desc: opens up appimage from NAS
        vars:
            APPIMAGE: '{{.NIXNAS}}/appimages'
        cmds:
            - command ls {{.APPIMAGE}} | fzf | awk '{print "{{.APPIMAGE}}/"$1}' | xargs appimage-run
    books:
        desc: uses custom gutenberg script and downloads on nas
        cmds:
            - task -t {{.NIXNAS}}/gutenberg/Taskfile.yml
    wishlist:
        desc: access ssh on my tailscale
        cmds:
            - export $(sops -d ~/Documents/nixconfig/modules/secrets/apikeys.yaml | yq -o=shell . | grep TAILSCALE | awk '{ gsub(/\047/, ""); print }'); nix-shell -p wishlist --run "wishlist --tailscale.net=cloudforest-kardashev.ts.net --tailscale.client.id=$TAILSCALE_CLIENT_ID --tailscale.client.secret=$TAILSCALE_CLIENT_SECRET"
    ytfzf:
        desc: activates youtube from the terminal
        cmds:
            - invidious_instance='https://inv.perditum.com' ytfzf
    kando:
        desc: kando menu
        cmds:
            - kando -m "Kando Menu"
    ytcast:
        desc: casts to screen a search of youtube to TV
        cmds:
            - ytsearch "$(gum input)" | ytcast -p
    kitty:
        desc: opens up a kitty terminal in tmux
        cmds:
            - kitty tmux
    tmux-reattach:
        desc: reattaches tmux session
        cmds:
            - tmux attach
