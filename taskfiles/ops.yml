version: "3"

# Observation and context-plane tasks.
#
# Why a separate shard instead of checks.yml: a *check* must be able to fail a
# build and should not need a running system. These tasks read the live sentinel
# ledger, the compiled skill index, or the graph projection — they report on a
# machine, they do not build one.

tasks:
  ops:health:
    desc: Gate on the fleet sentinel verdict (exit 1 when degraded)
    summary: >
      Reads /var/lib/fleet-sentinel/www/health.txt and, on degradation, prints
      every reason from status.json. Exit 0 = ok, 1 = degraded or no sentinel.
      Cheap and local: no nix, no network. This is the closed-loop gate a
      scheduler or an agent runs before doing work.
    cmds:
      - |
        f=/var/lib/fleet-sentinel/www/health.txt
        if [ ! -r "$f" ]; then
          echo "sentinel: no health file at $f (fleet-sentinel not enabled/running?)"
          exit 1
        fi
        state="$(cat "$f")"
        if [ "$state" = "ok" ]; then
          echo "sentinel: ok"
          exit 0
        fi
        echo "sentinel: $state"
        jq -r '.reasons[]?' /var/lib/fleet-sentinel/www/status.json 2>/dev/null || true
        exit 1

  ops:categorize:
    desc: Categorize prose (jev, TypeSafe) behind calibration, rule and error gates
    summary: >
      Classifies each file from its features only (comment density, restated
      code, facts already in inventory/policies, age, assertion/metric/block/
      task-reference/address counts); no contents leave the host. A page with
      two command blocks or three `task …` references is a `procedure` by RULE,
      and a page that argues (rejections) while tabulating (measured sections)
      is `design`; neither is asked. Refuses a table when anchors miss, pairs flip under
      swap, any file errors, or every file lands in one category; automation is
      gated by [[flake/policies.nix#automation-is-earned]].
    cmds:
      - bash scripts/task/categorize.sh {{.CLI_ARGS}}

  ops:categorize:plan:
    desc: Turn a categorize table into a routing plan, validated against the page
    summary: >
      Runs the categorizer, then names the channel each page would move to
      (policy → flake/policies.nix, fact → inventory.toml, procedure → docs plus
      the owning taskfile, history → docs/history/, docs → docs/). Writes
      nothing. Exits 1 when a row is contradicted by the page's own evidence
      (a non-procedure row carrying command blocks, or a rule-procedure row
      without any), or when the categorizer refuses a table. Reports the
      supervision count that the automation label is gated on.
    cmds:
      - bash scripts/task/categorize-apply.sh {{.CLI_ARGS}}

  ops:decide:
    desc: Ask the self-hosted decision engine (POST /v1/systemone)
    summary: >
      One CLI for the Julia-1/Laya envelope (`task ops:decide -- -s STATE -q q.json`):
      `-s STATE -q QUESTIONS.json` returns
      answers + usage, `--health` probes the engine. Endpoint defaults to
      $SYSTEMONE_URL, else loopback:8091; delphi serves it on tailnet 8444
      (`-e https://delphi.cloudforest-kardashev.ts.net:8444`). Exit 2 on a bad
      flag or envelope, 1 when the engine does not answer. The skill is the
      reasoning; this is the command.
    cmds:
      - bash scripts/task/systemone.sh {{.CLI_ARGS}}

  ops:sentinel:run:
    desc: Force one sentinel collection now
    summary: >
      Runs fleet-sentinel.service synchronously (oneshot). Writes a ledger line,
      refreshes status.json and health.txt. Use after changing a watched unit;
      do not loop it (the timer already runs every 15 minutes).
    cmds:
      - sudo systemctl start fleet-sentinel.service
      - task ops:health

  ops:sentinel:status:
    desc: Show sentinel timer, last run, and dashboard URL
    summary: >
      systemctl status + list-timers for fleet-sentinel, then the current
      status.json summary. Read-only. The dashboard is
      http://sentinel.frieren.lan/ (LAN) or the same path via the default vhost.
    cmds:
      - systemctl status fleet-sentinel.service --no-pager -n 5 || true
      - systemctl list-timers fleet-sentinel.timer --no-pager || true
      - jq -c '{ts,state,reasons,generation_age_h,disk_pct,psi}' /var/lib/fleet-sentinel/www/status.json 2>/dev/null || echo "(no status.json)"

  ops:ledger:
    desc: Print the recent sentinel ledger (N=50)
    summary: >
      `tail -n N` of /var/lib/fleet-sentinel/ledger.jsonl, pretty-printed by jq.
      Each line is one schema-1 observation: ts, state, reasons, jobs,
      generation_age_h, disk_pct, psi. Use jq filters for transitions, e.g.
      `task ops:ledger | jq -r 'select(.state=="degraded") | .ts + " " + (.reasons|join(","))'`.
    cmds:
      - |
        tail -n {{.N | default 50}} /var/lib/fleet-sentinel/ledger.jsonl \
          | jq -c '{ts,state,reasons,jobs,generation_age_h,disk_pct,psi}'

  ops:ledger:toon:
    desc: Encode the recent ledger as TOON with token stats (N=200)
    summary: >
      The agent-facing projection: tail N events -> jq -s (one array) -> toon -e
      --stats. TOON repeats each key once instead of once per row; use it to
      read a long window cheaply. The JSONL file remains the source of truth —
      never write TOON back.
    cmds:
      - |
        tail -n {{.N | default 200}} /var/lib/fleet-sentinel/ledger.jsonl \
          | jq -s . \
          | toon -e --stats

  ops:skills:
    desc: Print the compiled skill index (name, version, tags)
    summary: >
      `nix eval .#agentSkills.skills` (~0.12 s warm, no host eval — lib/skills.nix).
      This is the authoritative list; .agents/README.md routes here instead of
      duplicating a table. Add TAG= to filter.
    cmds:
      - |
        nix eval --json .#agentSkills.skills \
          | jq -r --arg tag "{{.TAG}}" '
              to_entries[]
              | select($tag == "" or (.value.tags | index($tag)))
              | [.key, .value.version, (.value.tags | join(","))] | @tsv' \
          | sort | column -t -s$'\t'

  ops:skills:check:
    desc: Validate .agents/skills against the schema (hard gate)
    summary: >
      Builds checks.<system>.skills-schema and skills-task-mirror. Fails on
      name/dir mismatch, missing or >240-char description, missing body heading,
      or a >400-line skill; and on a skill whose table rows restate a task's own
      `desc` (>=3 rows) instead of naming it. Optional frontmatter is normalised
      and printed as WARN. Cheap; safe in CI. `--builders ""` is deliberate: a
      gate must not spend remote build budget (a trivial runCommand still
      dispatched to nixbuild.net on 2026-10-19).
    vars:
      # Per-system attrs, resolved from the running system so the gate also runs on
      # the fleet's aarch64 hosts (see `checks:quick`).
      SYSTEM:
        sh: nix eval --impure --raw --expr builtins.currentSystem
    cmds:
      - nix build -L --no-link --builders "" .?submodules=1#checks.{{.SYSTEM}}."skills-schema" .?submodules=1#checks.{{.SYSTEM}}."skills-task-mirror"

  ops:skills:tags:
    desc: Print the skill tag cloud
    summary: >
      `nix eval .#agentSkills.byTag` — tag -> skill names, sorted by count.
      Tags are the only grouping in the skill contract; use them instead of
      adding a folder hierarchy.
    cmds:
      - |
        nix eval --json .#agentSkills.byTag \
          | jq -r 'to_entries | sort_by(-(.value|length)) | .[] | "\(.key)\t\(.value|length)\t\(.value|join(","))"' \
          | column -t -s$'\t'

  ops:kg:
    desc: Print knowledge-graph stats and the top connected nodes
    summary: >
      Compiles hosts x skills x docs x mentions (lib/knowledge-graph.nix, ~10 s
      cold because it reads every living doc). No server, no database. For
      "what touches X" questions; use qmd for "where is this explained".
      TOP= sets how many out-degree leaders to list (default 12).
    cmds:
      - bash scripts/task/kg-query.sh stats --top {{.TOP | default 12}}

  ops:kg:speed:
    desc: Measure one graph question on both traversal paths (sidecar vs jq)
    summary: >
      Runs the same query through kg-query.sh N times per path and prints the
      mean wall time, so the sidecar's speed is a command a reader can re-run
      rather than a number in a paragraph. NODE defaults to frieren; RUNS=5.
      Exits 0 = measured. If the socket is not live both columns measure the jq
      path, and it says so instead of reporting a fake win.
    cmds:
      - RUNS={{.RUNS | default "5"}} bash scripts/task/kg-speed.sh {{.NODE | default "frieren"}}

  ops:kg:sidecar:
    desc: Manage or query the in-memory Elixir reactive Knowledge Graph sidecar
    summary: >
      Controls the in-memory ETS graph sidecar on unix:$XDG_RUNTIME_DIR/kg.sock.
      Commands: start, stop, restart, status (default), node ID=, neighbors ID=
      [DEPTH=], blast-radius ID=, search Q=. The graph is the COMPILED projection
      (lib/kg-graph.sh caches it), so the socket and jq cannot disagree; `--native`
      asks for the engine's own builder, which is `checks:kg:native`'s experiment,
      not the query path. Queries auto-start it; `start` waits for readiness. Q="two
      words" stays one term; errors carry real status (400/404), so a typo is not an
      empty answer.
    cmds:
      - 'bash scripts/task/kg-sidecar.sh "{{.CMD | default "status"}}" "{{.ID | default .Q | default ""}}" "{{.DEPTH | default ""}}"'

  ops:kg:blast:
    desc: Calculate transitive blast radius and impact analysis for an entity
    summary: >
      Reverse walk over inbound edges: who depends on or mentions TARGET (any
      node id: host:frieren, skill:qmd, tag:nix, doc:docs/x.md). Server-side
      traversal is ~60 us; ~114 ms end-to-end through `task`, which is task's
      startup, not the walk. Usage: TARGET=<id>.
      This is the one traversal the jq patterns do not answer: "who transitively
      depends on X" is a reverse closure, not a scan.
    cmds:
      - 'bash scripts/task/kg-sidecar.sh blast-radius "{{.ID | default .TARGET}}"'


  # --- the explicit query surface -------------------------------------------
  # Six fixed traversals, the jq analogue of a Cypher MATCH. A caller that knows
  # which question it is asking uses these directly; `ops:ask` is sugar in front
  # of them, not a replacement for them. Shared implementation and exit codes:
  # scripts/task/kg-query.sh — 0 answer (possibly empty), 1 graph unavailable,
  # 2 usage or no such node, so an empty result and a typo never look alike.
  # go-task collapses every failure to 201, so that distinction only survives
  # when the script is called directly: through `task`, ask FORMAT=json and read
  # `error:"no_such_node"` + `suggestions` instead of the exit code.
  #   host      (Doc|Skill)-[:MENTIONS]->(Host)
  #   skill     (Doc|Skill)->(Skill) mentions + (Skill)-[:TAGGED]->(Tag)
  #   doc       (Doc)->(Host|Skill) mentions
  #   tag       (Skill)-[:TAGGED]->(Tag)
  #   comention two hops: shared documents between two hosts
  #   stats     counts (+ top out-degree)

  ops:kg:host:
    desc: Print everything the graph connects to HOST
    summary: >
      Inbound edges for host:<HOST> (docs and skills that mention it). HOST is
      required. Reads the graph projection, not a config. An unmentioned host is
      a successful empty answer; a name with no node fails with near matches.
      FORMAT=json emits {pattern, arg, count, results:[ids]}.
    requires:
      vars: [HOST]
    cmds:
      - |
        if [ "{{.FORMAT}}" = "json" ]; then
          bash scripts/task/kg-query.sh host "{{.HOST}}" --json
        else
          bash scripts/task/kg-query.sh host "{{.HOST}}"
        fi

  ops:kg:skill:
    desc: Print everything the graph connects to SKILL
    summary: >
      Inbound mentions (docs and skills that name it) plus its outbound tags, so
      "where is nix-eval used" is one query instead of a grep. SKILL is required;
      `qmd` and `skill:qmd` both work; an unknown name fails with near matches.
      FORMAT=json emits {pattern, arg, count, results:[ids]} (mentions and tags
      in one sorted list).
    requires:
      vars: [SKILL]
    cmds:
      - |
        if [ "{{.FORMAT}}" = "json" ]; then
          bash scripts/task/kg-query.sh skill "{{.SKILL}}" --json
        else
          bash scripts/task/kg-query.sh skill "{{.SKILL}}"
        fi

  ops:kg:doc:
    desc: Print what one document mentions and links to (DOC=)
    summary: >
      Outbound edges for doc:<DOC> — the hosts and skills that file names, plus
      the other documents it links to (the `references` layer; `ops:kg:blast
      TARGET=doc:<DOC>` is who links back).
      DOC is a repo-relative path (`docs/task-control-plane.md`); the `doc:`
      prefix is optional. This is the reverse of ops:kg:host, which jq cannot
      reach without scanning the whole edge list — the reason both directions
      exist as tasks. An unindexed path fails with near matches — only the eight
      living documents and docs/*.md are in the projection.
      FORMAT=json emits {pattern, arg, count, results:[ids]}.
    requires:
      vars: [DOC]
    cmds:
      - |
        if [ "{{.FORMAT}}" = "json" ]; then
          bash scripts/task/kg-query.sh doc "{{.DOC}}" --json
        else
          bash scripts/task/kg-query.sh doc "{{.DOC}}"
        fi

  ops:kg:tag:
    desc: Print the skills carrying TAG
    summary: >
      Inbound `tagged` edges for tag:<TAG>. TAG is required and is the bare tag
      (`nix`, not `tag:nix`). The graph is authoritative for tags because they
      are compiled from skill frontmatter; ops:skills:tags prints the same
      relation as a cloud. An unknown tag fails with near matches.
      FORMAT=json emits {pattern, arg, count, results:[ids]}.
    requires:
      vars: [TAG]
    cmds:
      - |
        if [ "{{.FORMAT}}" = "json" ]; then
          bash scripts/task/kg-query.sh tag "{{.TAG}}" --json
        else
          bash scripts/task/kg-query.sh tag "{{.TAG}}"
        fi

  ops:kg:comention:
    desc: Print hosts that share documents with HOST (with the shared count)
    summary: >
      Two hops without a join operator: the documents naming host:<HOST>, then
      every OTHER host those same documents name, ranked by how many documents
      they share. MIN= drops pairs below that count (default 1). This is the
      pattern a single-hop index cannot answer, and it is what "what is related
      to X" means in this graph. HOST is required.
      FORMAT=json emits {pattern, arg, count, results:[{id, shared}]}.
    requires:
      vars: [HOST]
    cmds:
      - |
        if [ "{{.FORMAT}}" = "json" ]; then
          bash scripts/task/kg-query.sh comention "{{.HOST}}" --min {{.MIN | default 1}} --json
        else
          bash scripts/task/kg-query.sh comention "{{.HOST}}" --min {{.MIN | default 1}}
        fi

  ops:kg:stats:
    desc: Print graph counts as one machine-readable line (FORMAT=json for an object)
    summary: >
      The `stats` pattern on its own: node counts by type and edge total, read
      from the projection (not from stored counters). FORMAT=json emits
      {pattern,arg,count,results:[{nodes,hosts,skills,docs,tags,edges}]} so a
      check or agent can compare numbers without parsing prose. Same graph
      cache as ops:ask: one eval per revision, then jq (~5 ms).
    cmds:
      - |
        if [ "{{.FORMAT}}" = "json" ]; then
          bash scripts/task/kg-query.sh stats --json
        else
          bash scripts/task/kg-query.sh stats
        fi

  ops:kg:cypher:
    desc: Print the Cypher export of the knowledge graph
    summary: >
      MERGE statements for an *external* Neo4j. Deliberately not a service on
      frieren (JVM heap competes with the NAS page cache); the graph is ~10^3
      nodes and `jq` is enough. Import with:
      `nix run nixpkgs#cypher-shell -- -f <(nix eval --raw .?submodules=1#knowledgeGraph.cypher)`.
    cmds:
      - nix eval --raw .?submodules=1#knowledgeGraph.cypher

  ops:ask:
    desc: Ask the knowledge graph a question in English (Q=)
    summary: >
      scripts/task/kg-ask.sh — front door to `.?submodules=1#knowledgeGraph`. Q= is the question.
      Clean tree: cached per revision; dirty tree: re-evaluates, because a stale
      answer is worse than a slow one.

      ROUTING IS DETERMINISTIC AND OFFLINE: keyword rules; else, if the question
      names a node, return that node's context bundle (route=bundle, `related` =
      neighbours); else intent=UNKNOWN listing the six patterns. Naming no node is
      the blind spot: UNKNOWN, a visible decline rather than a confident guess.
      KG_DECIDE_ALWAYS=1 adds a model as a check (`ops:ask:jev`); scores and
      caveats: `ops:bench:kg`.
    requires:
      vars: [Q]
    cmds:
      - |
        if [ "{{.FORMAT}}" = "json" ]; then
          bash scripts/task/kg-ask.sh --json "{{.Q}}"
        else
          bash scripts/task/kg-ask.sh "{{.Q}}"
        fi

  ops:ask:jev:
    desc: ops:ask plus the hosted-Jev agreement check (key from sops, never echoed)
    summary: >
      Same query as ops:ask with KG_DECIDE_ALWAYS=1, so the Jev-compatible HTTP path
      is exercised: hosted Jev, or the eisen router (point KG_DECIDE_URL at
      `http://eisen:8000/v1/decisions`; it forwards to Jev with a local fallback).
      The sops key stays in-process and is never printed (no `set -x`, no header
      dump).

      A CHECK, not the answer: the model is consulted only when a keyword rule
      already answered, to record `agreed` / `keyword+disagree`. A bundle or
      unmatched question makes NO call, so `model.consulted` stays false. Without
      this task routing is fully offline: `ops:ask` never touches the network.
    requires:
      vars: [Q]
    cmds:
      - |
        token="$(sops -d modules/secrets.yaml 2>/dev/null | sed -n 's/^[[:space:]]*TYPESAFE_API_KEY=//p' | head -1)"
        if [ -z "$token" ]; then
          echo "ops:ask:jev — no TYPESAFE_API_KEY readable from modules/secrets.yaml" >&2
          exit 1
        fi
        if [ "{{.FORMAT}}" = "json" ]; then
          KG_DECIDE_ALWAYS=1 KG_DECIDE_URL=https://api.typesafe.ai/v1/systemone KG_DECIDE_TOKEN="$token" \
            bash scripts/task/kg-ask.sh --json "{{.Q}}"
        else
          KG_DECIDE_ALWAYS=1 KG_DECIDE_URL=https://api.typesafe.ai/v1/systemone KG_DECIDE_TOKEN="$token" \
            bash scripts/task/kg-ask.sh "{{.Q}}"
        fi

  ops:bench:kg:
    desc: Bench the graph-intent router across models (keyword / in-repo / Jev)
    summary: >
      scripts/task/kg-bench.sh — labelled questions scored on intent (and subject).
      Runners: keyword (rules + bundle), heuristic (in-repo systemone-decision), jev
      (hosted, sops key, skipped without one), decide (any KG_DECIDE_URL).
      SET=rule|paraphrase|unnamed|both: `rule` uses the router's own vocabulary and
      so flatters it, `paraphrase` does not, `unnamed` omits the subject (the
      bundle's blind spot), `both` is rule+paraphrase only. VERBOSE=1 prints per-
      question rows, with a routing census, so a silent fallback cannot pass for the
      rules working. Re-run before changing the router. Exit 0 = ran.
    cmds:
      - |
        args=""
        [ "{{.VERBOSE}}" = "1" ] && args="--verbose"
        [ -n "{{.SET}}" ] && args="$args --set {{.SET}}"
        bash scripts/task/kg-bench.sh $args

  ops:context:
    desc: Sentinel state + the graph context that explains it (monitor -> query)
    summary: >
      The trigger side of the loop: the fleet sentinel watches the machine, and
      when it reports anything, this asks the graph which docs and skills touch
      this host — the step that turns "a unit failed" into "read these two
      procedures". Reads status.json only (local, no nix, no network) and then
      runs ops:ask for the host. HOST= overrides the host name (default: the
      local hostname). ADVISORY ONLY — the sentinel detects, it never acts.
    cmds:
      - |
        h="{{.HOST}}"
        [ -n "$h" ] || h="$(hostname)"
        jq -r '"sentinel: \(.state)" + (if (.reasons | length) > 0 then " — " + (.reasons | join("; ")) else "" end)' \
          /var/lib/fleet-sentinel/www/status.json 2>/dev/null \
          || echo "sentinel: no status.json here (fleet-sentinel not enabled on this host?)"
        bash scripts/task/kg-ask.sh "what touches $h"

  ops:tailnet:routes:
    desc: "[gate] Every advertised Tailscale route is actually approved"
    summary: >
      Advertised (`--advertise-routes`) and in-force (`enabledRoutes`) are two
      different facts, and only the second one carries traffic: approval is
      tailnet state, so no host eval can prove it. Prints OFFERED / APPROVED /
      UNAPPROVED per device and exits 1 when any offered route is not in force.
      Reads tailnet state through the sops OAuth client (scope `all:read`); no
      nix, no host eval. Exit 0 = all approved or nothing advertised, 1 =
      divergence, 2 = no usable credential.
    cmds:
      - bash scripts/task/tailnet-routes.sh

  ops:tailnet:approve:
    desc: "[destructive] Approve HOST's advertised Tailscale routes (needs write token)"
    summary: >
      Approves every route HOST advertises, so a new /32 or subnet stops being a
      silent no-op. Changes tailnet routing, hence the explicit HOST and the
      destructive tag. The sops OAuth client is read-only (an approve attempt
      answers HTTP 403), so this needs TAILSCALE_API_TOKEN with write scope, or
      that client's scope widened. Prefer the admin console or an autoApprovers
      block in the policy file for anything that should persist.
    requires:
      vars: [HOST]
    cmds:
      - bash scripts/task/tailnet-routes.sh --approve "{{.HOST}}"

  ops:tailnet:dns:
    desc: "[gate] The tailnet nameserver list actually serves clients"
    summary: >
      Prints global nameservers, MagicDNS and split-DNS state, then probes each
      nameserver for the zone and a known blocked domain. Classifies every entry as
      a tailnet node address or a subnet route — a routed address is unreachable
      from clients with `--accept-routes=false` (deliberate on eisen, fern,
      aristotle). Exit 0 = every resolver answers and filters, 1 = one does not, 2 =
      no credential. `override` is console-only and invisible to the API, so the
      report says so. Run it from a plain client: a `local-bind` entry is answered
      by the reporting host's own bind, not the routed path.
    cmds:
      - bash scripts/task/tailnet-dns.sh

  ops:tailnet:policy:
    desc: "[gate] The repo tailnet policy matches the live tailnet"
    summary: >
      Semantic diff between modules/config/tailnet-policy.hujson and the live
      policy file. Comments and list order do not count as drift; JSON content
      does. Exit 0 = in sync, 1 = drift (the diff is printed), 2 = no usable
      credential or unparseable HuJSON. Reads through the sops OAuth client
      (scope `all:read`), so it works without a write token.
    cmds:
      - bash scripts/task/tailnet-policy.sh

  ops:tailnet:policy:apply:
    desc: "[destructive] Push the repo tailnet policy to the live tailnet"
    summary: >
      POSTs modules/config/tailnet-policy.hujson, which replaces the WHOLE policy
      — a console edit not mirrored in the file is reverted, which is the point.
      Refuses when the change reaches outside `.autoApprovers.routes` unless
      FORCE=1, so it cannot quietly rewrite access rules. Sends If-Match with the
      ETag it read, so a concurrent console edit fails as 412 instead of being
      overwritten. Needs write scope: the fleet OAuth client is `all:read` and
      answers 403 — widen its scopes or set TAILSCALE.API.KEY / TAILSCALE_API_TOKEN.
    cmds:
      - bash scripts/task/tailnet-policy.sh --apply

  ops:docs:budget:
    desc: Check living documents against the SCHEMA.md budgets (stubs stay stubs)
    summary: >
      Line counts for the living documents; exits 1 when one exceeds its budget.
      Budgets are in .agents/SCHEMA.md §2. Over budget means "move detail to
      docs/ and leave a pointer", not "raise the number".
      ARCHITECTURE.md, TODO.md, HANDOFF.md and EXPERIMENTS.md moved into
      AGENTS.nix (2026-10-19) and are now one-screen pointers; this gate fails
      if one grows past 10 lines or stops naming AGENTS.nix. Narrative work
      goes to `task ops:notes`, not back into a root markdown file.
    cmds:
      - bash scripts/task/docs-budget.sh

  ops:bench:evals:
    desc: Benchmark nix-eval vs legacy reads (hyperfine)
    summary: >
      Compares the compiled registry eval, the raw yq read, and the Python
      tomllib read over the same field. Inputs are warm. The eval validates;
      yq/Python do not — the numbers are why "eval-first" is a routing rule, not
      a religion. Requires hyperfine (fleet tool, frieren tools.nix).
    cmds:
      - |
        hyperfine --warmup 2 --runs 10 \
          --command-name "nix eval inventory.hosts.frieren.role" \
            "nix eval --raw .?submodules=1#inventory.hosts.frieren.role" \
          --command-name "yq inventory.toml" \
            "yq -r '.hosts.frieren.role' inventory.toml" \
          --command-name "python tomllib" \
            "python3 -c 'import tomllib;print(tomllib.load(open(\"inventory.toml\",\"rb\"))[\"hosts\"][\"frieren\"][\"role\"])'" \
          --command-name "nix eval agentSkills.count" \
            "nix eval --json .#agentSkills.count"

  ops:notes:
    desc: List AGENTS.nix notes or find the ones near an intent
    summary: >
      The human surface over `.?submodules=1#agentsNotes.json` (lib/agents-notes.nix). No args
      lists every note; STATUS= and KIND= filter; FORMAT=json emits records. A note
      with refs is distilled, a leaf carries the original intent in prose. Starting
      something not in the repo yet? `ops:notes:near Q=<intent>` ranks notes against
      it with each one's lineage — the entry point before any file is written.
      Author or promote with the `agents-notes` skill: a note graduates by gaining
      `refs.modules` and its gate task, never by becoming a markdown file.
    cmds:
      - bash scripts/task/notes.sh list "{{.STATUS | default ""}}" "{{.KIND | default ""}}"

  ops:notes:show:
    desc: Print one AGENTS.nix note (ID= required)
    summary: >
      ID is required (see `task ops:notes`). Prints the status, summary, the
      hosts/modules/tasks/docs it affects, related notes and the body.
      FORMAT=json emits the note object.
    cmds:
      - bash scripts/task/notes.sh show "{{.ID | default ""}}"

  ops:notes:host:
    desc: Print the notes that affect HOST (HOST= required)
    summary: >
      Reads the compiled byHost index. An empty answer is a valid answer: no
      note claims that host. HOST is required.
    cmds:
      - bash scripts/task/notes.sh host "{{.HOST | default ""}}"

  ops:notes:module:
    desc: Print the notes that reference a repository path (PATH= required)
    summary: >
      PATH is repo-relative (e.g. modules/services/fleet-sentinel.nix). This is
      the reverse of the module -> notes edge, so "why does this file look like
      this" becomes one query. An unknown path prints an empty list.
    cmds:
      - bash scripts/task/notes.sh module "{{.PATH | default ""}}"

  ops:notes:task:
    desc: Print the notes that reference TASK (TASK= required)
    summary: >
      TASK is a taskfile task name (e.g. ops:health). Useful before changing or
      deleting a task: the notes explain why it exists.
    cmds:
      - bash scripts/task/notes.sh task "{{.TASK | default ""}}"

  ops:notes:near:
    desc: Rank the notes near an intent (Q= required) — the novel-task entry
    summary: >
      Q= is an intent in your own words ("backups have never been restored"), not a
      keyword: tokenised, stopwords dropped, each note scored on
      id/title/summary/refs (strong) plus a body substring (weak). Every hit prints
      `match n/total` and its lineage + refs, so "has this been tried?" arrives with
      the note it came from and the task that proves it. LIMIT= defaults to 8;
      FORMAT=json emits the ranking. ~1 s: one eval plus jq, no cache — a stale note
      index is worse than a second. An empty answer is a real answer: nothing in the
      design record is near this intent.
    requires:
      vars: [Q]
    cmds:
      - FORMAT="{{.FORMAT | default ""}}" bash scripts/task/notes.sh near "{{.Q}}" "{{.LIMIT | default 8}}"

  ops:notes:lineage:
    desc: Print a note's design provenance in both directions (ID= required)
    summary: >
      `from` (what this idea grew out of), `supersedes` / `replaced by` (the
      retirement record), the transitive ancestry and what it led to. ID is
      required. This is a LOOKUP, not a walk: lib/agents-notes.nix compiles the
      closure, so the query is the same one eval as every other note read.
      A note with no descendants is a frontier note — the place a new idea
      attaches with `from`, which is how the design record stays a line rather
      than a pile. FORMAT=json emits the lineage record.
    requires:
      vars: [ID]
    cmds:
      - FORMAT="{{.FORMAT | default ""}}" bash scripts/task/notes.sh lineage "{{.ID}}"

  ops:notes:doc:
    desc: Print the notes that reference DOC (DOC= required)
    summary: >
      DOC is repo-relative (e.g. .agents/SCHEMA.md). The reverse of the
      docs -> notes edge: read a contract or runbook, then ask why it is shaped
      that way. Alongside :host, :module and :task this is the fourth reverse
      index, all compiled from the same refs — none is hand-maintained.
    requires:
      vars: [DOC]
    cmds:
      - bash scripts/task/notes.sh doc "{{.DOC}}"

  ops:notes:search:
    desc: Full-text search over AGENTS.nix notes (Q= required)
    summary: >
      Case-insensitive substring match over id, title, summary and body. Use it
      for "why did we decide X"; use `ops:notes:host` / `:module` for structure.
    cmds:
      - bash scripts/task/notes.sh search "{{.Q | default ""}}"

  ops:qmd:sync:eisen:
    desc: Offload and synchronize QMD vector embeddings to Eisen via Wake-on-LAN
    cmds:
      - task dev:qmd:sync:eisen -- {{.CLI_ARGS}}
