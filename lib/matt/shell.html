<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="profile">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:locale" content="{{locale}}">
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="en" href="{{altEn}}">
<link rel="alternate" hreflang="de" href="{{altDe}}">
<link rel="alternate" hreflang="x-default" href="{{altEn}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312100d'/%3E%3Ctext x='7' y='23' font-family='monospace' font-size='17' fill='%23e8e2d4'%3Em%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{cssHref}}">
<script type="application/ld+json">{{jsonld}}</script>
<script>
  try {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<header class="masthead">
  <div class="topline">
    <p class="id">{{handle}}</p>
    <div class="utility">
      <p class="avail"><span class="dot" aria-hidden="true"></span>{{status}}</p>
      <button class="theme" type="button" data-theme-toggle aria-label="{{themeAria}}">{{theme}}</button>
      <nav class="lang" aria-label="{{langLabel}}">{{langSwitch}}</nav>
    </div>
  </div>
  <h1>{{name}}</h1>
  <p class="role">{{role}}</p>
  <p class="sub">{{subtitle}}</p>
  <p class="lede">{{bio}}</p>
  <p class="where">{{location}}</p>
  <nav class="links" aria-label="Contact">{{contacts}}</nav>
</header>
<nav class="index" aria-label="{{navLabel}}">{{nav}}</nav>
<main id="main">
{{body}}
</main>
<footer class="colophon">
  <p>{{footer}}</p>
</footer>
<script>
  (function () {
    var button = document.querySelector("[data-theme-toggle]");
    if (!button) return;
    var root = document.documentElement;
    function current() {
      return root.dataset.theme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    button.setAttribute("aria-pressed", String(current() === "dark"));
    button.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      button.setAttribute("aria-pressed", String(next === "dark"));
    });
  })();
</script>
</body>
</html>
