name: nixcachix
on:
  push:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to build (or 'auto', 'all', or comma-separated names)"
        required: false
        default: "auto"
      shared_strategy:
        description: "Strategy when shared modules change (anchor=frieren, all=all active, none=host-only)"
        type: choice
        options:
          - anchor
          - all
          - none
        default: "anchor"

jobs:
  sops-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          # The tree uses `|>` (modules/global/global.nix enables pipe-operators
          # fleet-wide); a runner with only nix-command+flakes cannot PARSE it.
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"
      - name: Check sops recipient drift
        continue-on-error: true
        run: bash scripts/task/sops-drift-check.sh --repo-only

  # Doc-only changes allocate zero build runners (the detector ignores *.md),
  # so without this job a runaway living document lands green. The gate is
  # `checks.<system>.docs-budget`: line counts for AGENTS.md / MANUAL.md /
  # AUDIT.md and the four root stubs (SCHEMA.md §2), evaluated at eval time and
  # building a three-line artifact. It runs on every push, doc-only included.
  docs-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"
      - name: Living documents within budget
        run: nix build -L .?submodules=1#checks.x86_64-linux.docs-budget

  plan:
    runs-on: ubuntu-latest
    outputs:
      has_machines: ${{ steps.detect.outputs.has_machines }}
      affected_hosts: ${{ steps.detect.outputs.affected_hosts }}
      matrix: ${{ steps.detect.outputs.matrix }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect affected hosts
        id: detect
        run: |
          STRATEGY="${{ inputs.shared_strategy }}"
          STRATEGY="${STRATEGY:-anchor}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.host }}" != "auto" ]; then
            if [ "${{ inputs.host }}" = "all" ]; then
              python3 scripts/ci/detect-affected-hosts.py --ci --commit-msg "[ci all]"
            else
              python3 scripts/ci/detect-affected-hosts.py --ci --commit-msg "[ci ${{ inputs.host }}]"
            fi
          else
            python3 scripts/ci/detect-affected-hosts.py --ci --shared-strategy "$STRATEGY"
          fi

  build-machines:
    needs: plan
    if: needs.plan.outputs.has_machines == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Log Target
        run: |
          echo "Building machine: ${{ matrix.host }}"
          echo "Kind: ${{ matrix.kind }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Runner OS: ${{ matrix.os }}"
          echo "Flake attribute: ${{ matrix.attr }}"

      - name: Maximize build disk space (Linux only)
        if: runner.os == 'Linux'
        uses: easimon/maximize-build-space@v10
        with:
          overprovision-lvm: true
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /nix

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"

      - uses: cachix/cachix-action@v14
        with:
          name: shaoyanji
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false
          installCommand: nix profile install nixpkgs#cachix

      - run: nix build -L .?submodules=1#${{ matrix.attr }}

      # Per-host eval gate: module system + every assertion + the compiled
      # inventory.toml record, one host per runner (~13 s, ~700 MiB). This is the
      # half of `nix flake check` that is safe to run per host — running the whole
      # flake check instead forces all 23 configurations in one process and was
      # measured at 6078.5 MiB peak / SIGKILL 137 on the NAS. Previously this
      # assertion (services.go-backend must be enabled by no host) was reachable
      # only from `nix flake check` and `task checks:quick`, neither of which CI
      # ran, so it was not actually enforced automatically.
      - name: Per-host eval + assertion gate
        if: matrix.kind == 'nixos'
        run: nix build -L .?submodules=1#hostChecks.${{ matrix.arch }}.${{ matrix.host }}
