# Hermes Agent Configuration — Vanta persona
# Sensitive tokens (e.g. TELEGRAM_BOT_TOKEN) loaded from ~/.hermes/.env
#
# `_config_version` is written by hermes' own migrator. Keep it current: with
# v0 stamped, every `hermes doctor` reported "Config version outdated (v0 →
# v51)" and the retired `security.tirith_enabled` key sat in the file. Both
# were fixed on 2026-11-05 by migrating a copy under HERMES_HOME=/tmp/hh and
# taking the diff (nothing else changed). Next hermes that bumps the schema:
# `cp config.yaml /tmp/hh/config.yaml && HERMES_HOME=/tmp/hh hermes doctor
# --fix && diff -u config.yaml /tmp/hh/config.yaml`.
terminal:
  backend: local
  timeout: 180
telegram:
  reactions: false
model:
  provider: nous
  default: stepfun/step-3.7-flash:free
  base_url: https://inference-api.nousresearch.com/v1
agent:
  max_turns: 150
  reasoning_effort: medium
# Search is pinned to Tavily, extraction is not pinned. Both keys arrive from the
# one shared sops blob (`ai-services-shared-env`), and per-capability keys never
# reroute the other capability (tools/web_tools.py `_get_backend`), so extract
# stays on Firecrawl's keyed path. Left unpinned, `hermes doctor` resolved both
# capabilities to firecrawl (measured 2026-11-12), which left the Tavily key
# loaded but unused.
web:
  search_backend: tavily
display:
  interface: cli
  tool_progress: all
# Fallback chain: one capable model across three independent free quotas, then
# the single paid endpoint. Nous stays primary even though the portal
# rate-limits (its pool was in a 429 cooldown when this was written); a nous
# fallback would share that limiter and add nothing. Matched models, not matched
# vendors, on purpose: nemotron-3.5-super-vl is the strongest free tool-calling model
# this fleet can reach, so a failover does not trade away capability. Each entry
# ran a one-shot `hermes chat` turn on 2026-11-06.
#
# Why the chain is short, and what stays out of it: every extra entry is another
# id that gets retired (gemini-2.5-flash-lite answered "no longer available to
# new users" the same day). Deliberately absent — groq (hermes' provider registry
# has no entry; `--provider groq` is "Unknown provider"), cerebras (402, paid
# only), aihubmix (free models past the trial cap), opencode-zen (expired key),
# gemini (its terms sit badly with agent work; it does aux tasks below instead).
fallback_providers:
  - provider: nvidia
    model: nvidia/nemotron-3.5-super-vl
  - provider: openrouter
    model: nvidia/nemotron-3.5-super-vl:free
  - provider: ollama-cloud
    model: nemotron-3-ultra
  - provider: deepseek
    model: deepseek-flash
# chatplayground is deliberately NOT a provider here. Its chat endpoint takes
# exactly one message of at most 15,000 characters, while a hermes turn sends
# ~29,000 characters of system prompt and tool schemas, so every
# `--provider chatplayground` turn did the work and then fell back. It is used
# as a CLI advice lane instead: `.agents/skills/cpg-advice` (skill) over
# `cpg chat`, a self-contained client that needs no unit and no shim.
# The loopback shim on 127.0.0.1:8799 still exists for aichat's
# `openai-compatible` client (`programs.hermes-user.chatplayground`).
tts:
  primary: speechify
  speechify:
    api_key: ${SPEECHIFY_API_KEY}
    endpoint: https://api.speechify.ai/v1/audio/stream
    model: simba-3.2
    voice_id: harper
    options:
      text_normalization: false
  fallback_providers:
    - provider: edge
stt:
  enabled: true
  provider: local
  local:
    model: base
# Gemini is kept out of the agent chain (its terms sit badly with agent work) but
# is a sane aux lane: titling and conversation compression are single-shot text
# tasks. `free_only` keeps every other aux call off OpenRouter's paid default
# lane, so the only billable route in this file is the deepseek fallback.
auxiliary:
  free_only: true
  openrouter_model: nvidia/nemotron-3.5-super-vl:free
  title_generation:
    provider: gemini
    model: gemini-3.5-flash-lite
  compression:
    provider: gemini
    model: gemini-3.5-flash-lite
skills:
  trusted_project_dirs:
    - /Volumes/data/projects/nixconfig
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '8679391100'
      name: Matt Ji
      user_id: '8679391100'
fallback:
  min_switch_reset_seconds: 120
  api_max_retries: 1
onboarding:
  seen:
    busy_input_prompt: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
_config_version: 52
