version: "3"

vars:
  # An override, not the path: the checkout is on frieren's data volume, beside
  # this repo on a workstation, and absent on a host that never cloned it. Every
  # task asks scripts/task/bountystash-dir.sh, which reads this first and then
  # names where it looked. Deliberately NOT a `sh:` var: that is evaluated when
  # the task compiles, so `task --dry`, a summary and the task-graph check would
  # all fail on a host without the clone.
  BOUNTY_DIR: ""
  # The Pages project is `cv-resume` — Cloudflare appended `-40q` to its
  # pages.dev subdomain because the bare name is taken — and `bountystash.com` is
  # a custom domain on that one project. Checked against the live host on
  # 2026-11-08: `cv-resume-40q.pages.dev` and the custom domain serve the same
  # `CV - Shaoyan (Matt) Ji` document, and `bountystash.pages.dev` does not exist.
  # Do not "fix" this name: a deploy to a nonexistent project creates one.
  PROJECT_NAME: "cv-resume"
  PROJECT_MATT: "matt"
  PROJECT_MOCKUP: "bountystash-mockup"

tasks:
  bountystash:login:
    desc: Authenticate Wrangler with Cloudflare via OAuth device flow
    cmds:
      - nix-shell -p wrangler --run "wrangler login --device"

  bountystash:whoami:
    desc: Display currently authenticated Cloudflare account
    cmds:
      - nix-shell -p wrangler --run "wrangler whoami"

  bountystash:status:
    desc: HTTP health check on production (bountystash.com) and preview endpoints
    cmds:
      - |
        echo "=== Production (https://bountystash.com) ==="
        curl -Is https://bountystash.com | head -n 6
        echo ""
        echo "=== Preview (https://preview.cv-resume-40q.pages.dev) ==="
        curl -Is https://preview.cv-resume-40q.pages.dev | head -n 6

  # The content is authored once, in lib/bountystash/portfolio*.json (the same
  # corpus the Gemini capsule compiles). The console has its own data/ copy, so
  # this writes it, and the deploy refuses a copy that no longer matches.
  bountystash:dir:
    desc: Print the bountystash-console checkout these tasks operate on
    summary: >
      Resolves BOUNTY_DIR against every layout the fleet has: the sibling of this
      repo, frieren's data volume, and a home directory. A directory counts only
      if it holds scripts/build.js and .git, so a same-named folder is not
      mistaken for the checkout.
    cmds:
      - bash scripts/task/bountystash-dir.sh

  bountystash:data:
    desc: Write the console's data/portfolio*.json from the corpus in lib/bountystash/
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && bash scripts/task/bountystash-data.sh sync "$dir"

  bountystash:data:check:
    desc: "[gate] the console's data is the corpus, not a hand-edited copy"
    summary: >
      Compares both locales as normalised JSON, so key order and formatting are not
      drift and a changed sentence is. The corpus is the one place content is
      edited; a console copy that disagrees means the deploy would publish prose
      nobody reviewed.

      Exit 0 = identical, 1 = drift (run `task bountystash:data`). A host with no
      checkout fails earlier, at BOUNTY_DIR, naming where it looked.
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && bash scripts/task/bountystash-data.sh check "$dir"

  bountystash:secret:resend:
    desc: Set the Resend API key as a secret on the cv-resume Pages project
    summary: >
      The contact form's worker reads env.RESEND_API_KEY; without it the form
      answers 502 and names the mailto fallback. Reads RESEND.API.KEY from the
      apikeys plane through the task plane's path vars, the same file sops.nix
      declares for resend-api-key, and refuses an empty value instead of uploading one.
      Piped to `wrangler pages secret put`, so the key never lands in the repo
      or the shell history. Run before the first deploy that carries _worker.js,
      and again on rotation.
    cmds:
      - |
        key=$(sops -d --extract '["RESEND"]["API"]["KEY"]' "{{.SECRETS}}/{{.ENC_ENVS}}")
        [ -n "$key" ] || { echo "bountystash: no key at RESEND.API.KEY" >&2; exit 1; }
        printf '%s' "$key" \
          | nix-shell -p wrangler --run "wrangler pages secret put RESEND_API_KEY --project-name {{.PROJECT_NAME}}"

  bountystash:build:
    desc: Compile the console, validate the 14KB envelope, and resolve its internal links
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && nix-shell -p nodejs --run "cd $dir && node scripts/build.js"
      # The console is the published site, so its artifact carries the link gate:
      # a page that returns 200 while loading no CSS is invisible to site:check.
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && bash scripts/task/site-links.sh "$dir/dist"

  bountystash:preview:
    desc: Launch zero-dependency local preview server on http://localhost:3000
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && nix-shell -p nodejs --run "cd $dir && npm run preview"

  bountystash:dev:
    desc: Local Cloudflare Edge emulation server via wrangler pages dev
    cmds:
      - task: bountystash:build
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && nix-shell -p wrangler --run "cd $dir && wrangler pages dev dist"

  bountystash:deploy:preview:
    desc: Deploy preview branch to Cloudflare Pages (generates unique URL)
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && bash scripts/task/bountystash-data.sh check "$dir"
      - task: bountystash:build
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && nix-shell -p wrangler --run "bash scripts/task/pages-deploy.sh $dir/dist --project-name={{.PROJECT_NAME}} --branch=preview"

  bountystash:deploy:prod:
    desc: "[destructive] Deploy live production to Cloudflare Pages (bountystash.com)"
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && bash scripts/task/bountystash-data.sh check "$dir"
      - task: bountystash:build
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && nix-shell -p wrangler --run "bash scripts/task/pages-deploy.sh $dir/dist --project-name={{.PROJECT_NAME}} --branch=main"

  bountystash:projects:
    desc: List all Cloudflare Pages projects in account
    cmds:
      - nix-shell -p wrangler --run "wrangler pages project list"

  bountystash:git:pull:
    desc: Pull latest design updates from GitHub (shaoyanji/bountystash-console)
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && git -C "$dir" pull --ff-only

  bountystash:git:push:
    desc: Push commits to GitHub (triggers interactive Cloudflare deploy nudge)
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && git -C "$dir" push origin main

  bountystash:git:status:
    desc: Check git status of local bountystash-console
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && git -C "$dir" status -s

  bountystash:hook:install:
    desc: Install git pre-push Cloudflare deploy nudge hook in bountystash-console
    cmds:
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && cp "$dir/scripts/pre-push.sh" "$dir/.git/hooks/pre-push"
      - dir=$(BOUNTY_DIR={{.BOUNTY_DIR}} bash scripts/task/bountystash-dir.sh) && chmod +x "$dir/.git/hooks/pre-push"
      - echo "Installed .git/hooks/pre-push successfully."

  # matt.bountystash.com — the personal page. It is its own Pages project rather
  # than a route on `cv-resume`, so a deploy of the portfolio cannot overwrite the
  # page a cold-mail recipient opens.
  matt:build:
    desc: Build matt.bountystash.com (flake output .#sites.matt-site)
    cmds:
      - nix build --builders "" --out-link /tmp/matt-site .#sites.matt-site -L

  matt:init:
    desc: Create the Cloudflare Pages project for matt.bountystash.com (idempotent)
    cmds:
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages project create {{.PROJECT_MATT}} --production-branch=main"

  matt:deploy:preview:
    desc: Deploy matt.bountystash.com to a Cloudflare Pages preview branch
    cmds:
      - task: matt:build
      - nix-shell -p wrangler --run "bash scripts/task/pages-deploy.sh /tmp/matt-site --project-name={{.PROJECT_MATT}} --branch=preview"

  matt:deploy:prod:
    desc: "[destructive] Publish matt.bountystash.com live"
    cmds:
      - task: matt:build
      - nix-shell -p wrangler --run "bash scripts/task/pages-deploy.sh /tmp/matt-site --project-name={{.PROJECT_MATT}} --branch=main"

  matt:status:
    desc: HTTP status of matt.bountystash.com
    cmds:
      - curl -Is https://matt.bountystash.com | head -n 6

  # The crawlable surface of both published pages, asserted rather than assumed.
  site:check:
    desc: "[gate] robots, sitemap, canonical, og:image and hreflang on every hostname"
    cmds:
      - bash scripts/task/site-check.sh matt.bountystash.com / /de/ /work/nixos-fleet /de/work/nixos-fleet /brief/platform
      # bountystash.com runs the console. Its case studies are built pages with the
      # same head as the home page, so they are gated like any other.
      - bash scripts/task/site-check.sh bountystash.com / /de/ /contact/ /de/kontakt/ /work/ /de/work/ /work/multi-host-declarative-nixos-infrastructure/
      - bash scripts/task/site-check.sh concept.bountystash.com / /de/

  # Offline, and the only check that sees a stylesheet 404: a page that loads no
  # CSS still returns 200, so the HTTP gate cannot catch a href built from the
  # locale's depth instead of the page's. The console's artifact is checked by
  # `bountystash:build`, on the machine that has its checkout.
  site:links:
    desc: "[gate] build the Nix sites and resolve every internal href/src against the artifacts"
    cmds:
      - nix build --builders "" --out-link /tmp/matt-site .#sites.matt-site
      - nix build --builders "" --out-link /tmp/bountystash-mockup .#sites.bountystash-mockup
      - bash scripts/task/site-links.sh /tmp/matt-site
      - bash scripts/task/site-links.sh /tmp/bountystash-mockup

  matt:gist:pull:
    desc: Fetch resume.json and lebenslauf.json from the gists into the local cache
    cmds:
      - bash scripts/task/matt-gist.sh pull

  # The resume is the fact and the page is the prose: this copies the canonical
  # JSON Resume (the appflow base file) into the repo so the build stays pure.
  matt:gist:sync:
    desc: Copy the canonical resume into lib/matt/resume.json (the page's source of truth)
    cmds:
      - bash scripts/task/matt-gist.sh sync

  matt:gist:drift:
    desc: "[gate] resume copy vs canonical, and every resume role/project must have prose"
    cmds:
      - bash scripts/task/matt-gist.sh drift

  # The German corpus is authored in the repo and the runner reads it from
  # $CONFIG, so this writes the local copy a German packet builds from.
  matt:gist:sync-de:
    desc: Write the German corpus (lib/matt/lebenslauf.json) to ~/.config/appflow/lebenslauf.json
    cmds:
      - bash scripts/task/matt-gist.sh sync-de

  # The gists are the CV feed a cold mail links to. Pushing is a dry run until
  # PUSH_APPLY=1, because both gists are public and the German one is rewritten
  # from the English file's facts before it is written.
  matt:gist:push:
    desc: "What the public gists would say (PUSH_APPLY=1 writes resume.json and the German parity rewrite)"
    cmds:
      - bash scripts/task/matt-gist.sh push

  # The bug-bounty concept mockup: sample data, `noindex`, its own Pages project.
  # Publishing it to bountystash.com itself is deliberately not a task.
  mockup:build:
    desc: Build the bountystash bug-bounty concept mockup (.#sites.bountystash-mockup)
    cmds:
      - nix build --builders "" --out-link /tmp/bountystash-mockup .#sites.bountystash-mockup -L

  mockup:init:
    desc: Create the Cloudflare Pages project for the mockup (idempotent)
    cmds:
      - nix-shell -p wrangler --run "bash scripts/task/wrangler.sh pages project create {{.PROJECT_MOCKUP}} --production-branch=main"

  mockup:deploy:preview:
    desc: Deploy the mockup to a Cloudflare Pages preview branch
    cmds:
      - task: mockup:build
      - nix-shell -p wrangler --run "bash scripts/task/pages-deploy.sh /tmp/bountystash-mockup --project-name={{.PROJECT_MOCKUP}} --branch=preview"

  mockup:deploy:prod:
    desc: "[destructive] Publish the mockup to its own *.pages.dev production URL"
    cmds:
      - task: mockup:build
      - nix-shell -p wrangler --run "bash scripts/task/pages-deploy.sh /tmp/bountystash-mockup --project-name={{.PROJECT_MOCKUP}} --branch=main"

  mockup:status:
    desc: HTTP status of the mockup on concept.bountystash.com and its pages.dev URL
    cmds:
      - curl -Is https://concept.bountystash.com | head -n 6
      - curl -Is https://bountystash-mockup.pages.dev | head -n 6

  bountystash:menu:
    desc: Interactive Charmbracelet Gum menu for Bountystash Console operations
    cmds:
      - |
        action=$(printf '%s\n' \
          "build: Compile 14KB brutalist console (dist/index.html)" \
          "preview: Run zero-dependency local preview (port 3000)" \
          "dev: Cloudflare Edge emulation (wrangler pages dev)" \
          "deploy:preview: Deploy preview branch to Cloudflare Pages" \
          "deploy:prod: Deploy live production to bountystash.com" \
          "projects: List Cloudflare Pages projects" \
          "git:pull: Pull updates from GitHub" \
          "git:push: Push commits to GitHub (with Cloudflare nudge)" \
          "whoami: Check Cloudflare authentication status" \
          "login: Authenticate Wrangler via device OAuth" \
          "exit: Quit" | gum choose --header "💰 Bountystash Console Control Plane")

        case "$action" in
          "build"*)
            task bountystash:build
            ;;
          "preview"*)
            task bountystash:preview
            ;;
          "dev"*)
            task bountystash:dev
            ;;
          "deploy:preview"*)
            task bountystash:deploy:preview
            ;;
          "deploy:prod"*)
            task bountystash:deploy:prod
            ;;
          "projects"*)
            task bountystash:projects
            ;;
          "git:pull"*)
            task bountystash:git:pull
            ;;
          "git:push"*)
            task bountystash:git:push
            ;;
          "whoami"*)
            task bountystash:whoami
            ;;
          "login"*)
            task bountystash:login
            ;;
          *)
            echo "Exited."
            ;;
        esac
