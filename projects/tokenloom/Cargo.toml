[workspace]
resolver = "2"
members = [
  "crates/loom-core",
  "crates/loom-tok",
  "crates/loom-react",
  "crates/loom-wire",
  "crates/loom-srv",
  "crates/loom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
loom-core = { path = "crates/loom-core" }
loom-tok = { path = "crates/loom-tok" }
loom-react = { path = "crates/loom-react" }
loom-wire = { path = "crates/loom-wire" }
loom-srv = { path = "crates/loom-srv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
proptest = "1"

# Thin LTO rather than fat: the box has four cores and a 120 minute clock, and
# the measured numbers below come from the same profile either way.
[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
