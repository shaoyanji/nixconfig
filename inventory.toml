storage_type = "Dual-disk btrfs (1TB SSD System + 2TB HDD Data Pool)"
storage_layout = "/dev/sdb3 (1TB SSD: 923GB btrfs @root, @home, @nix, @snapshots, docker), /dev/sda2 (2TB HDD: 1.8TB btrfs data pool for /srv/data, /Volumes/data, Paperless, Immich, Media, Transmission)"

[hosts.frieren.network]
lan_ip = "192.168.3.25"
tailscale = true
tailscale_hostname = "frieren"
