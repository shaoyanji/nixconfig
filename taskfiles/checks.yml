version: "3"

tasks:
  checks:quick:
    desc: Run narrow repo checks
    aliases: [check]
    cmds:
      - nix eval .#nixosConfigurations.mtfuji.config.networking.hostName
      - nix eval .#nixosConfigurations.garnixMachine.config.networking.hostName
      - nix eval .#nixosConfigurations.aristotle.config.networking.hostName
      - nix eval .#nixosConfigurations.frieren.config.networking.hostName
      - nix build .#checks.x86_64-linux.host-architecture -L
      - task checks:nix:lint
      - task checks:sops:drift
      - task checks:modules:validate

  checks:modules:validate:
    desc: Verify modules.toml syntax and valid module paths on disk
    cmds:
      - bash scripts/task/modules-menu.sh validate

  checks:flake:transitive:
    desc: Sweep flake.lock transitive inputs against upstream heads (read-only; fails on drift)
    cmds:
      - bash scripts/task/flake-transitive-sweep.sh check

  checks:qmd:docs:
    desc: Check the nixconfig qmd docs collection exists and its index is fresh
    cmds:
      - bash scripts/task/qmd-docs-index.sh check nixconfig

  checks:inventory:sync:
    desc: Verify documentation and LLM spec cards match inventory.toml
    cmds:
      - nix-shell -p python3 --run "python3 scripts/task/compile-llm-specs.py --check"

  checks:ports:
    desc: Diff frieren's declared firewall surface against its live listeners
    summary: >
      Reports four buckets — SERVED (declared and listening), DEAD-HOLE (declared with
      nothing behind it), REDUNDANT (declared but loopback-bound, so the hole is
      unusable), and FIREWALL-ONLY (a public listener permitted nowhere, i.e. the
      firewall is the only control). The declared set comes from `nix eval` of the
      merged networking.firewall.interfaces.<iface> option, so it accounts for every
      module's contribution rather than a grep of the ones you remembered; the actual
      set comes from `ss` with bind addresses preserved.
      Prefer this over scanning the host from itself: traffic to a host's own address is
      accepted by the `-i lo` rule before the interface-scoped rules are reached, so a
      self-scan reports every local listener as LAN-reachable — exactly that error
      produced a wrong open-port finding on 2026-10-12.
      Vars: HOST= (default frieren), IFACE= (default enp1s0), STRICT=1 to exit 1 when dead
      holes exist (default 0 = report only). Exits 2 when the host/interface cannot be
      evaluated, so a typo cannot pass as a clean audit.
    cmds:
      - HOST={{.HOST | default "frieren"}} IFACE={{.IFACE | default "enp1s0"}} STRICT={{.STRICT | default "0"}} bash scripts/task/port-audit.sh

  checks:restic:drill:
    desc: Verify frieren's restic repository and restore a sample (HC-2)
    summary: >
      Starts restic-drill.service and surfaces its journal; exits non-zero if the
      drill did not complete. Proves the nightly backup is restorable, not just
      present. Run on frieren (the host that owns /srv/backup/restic). The same
      drill also runs unattended weekly via restic-drill.timer (Sun 06:30).
    cmds:
      - /run/wrappers/bin/sudo systemctl start restic-drill.service
      - /run/wrappers/bin/sudo journalctl -u restic-drill.service -n 50 --no-pager

  checks:dns:failover:
    desc: Verify the DNS resolver group answers the wildcard zone and can fail over (HC-3)
    summary: >
      Reads profiles.dnsFailover from HOST (default frieren) — so the check cannot
      drift from the declaration — digs the wildcard zone at every resolver in the
      group, and probes a declared VRRP VIP for two answering MACs (split brain).
      Exits 2 while the group has fewer than 2 members: that state proves the primary
      answers but NOT that failover works, and is the current HC-3 gap until an
      always-on secondary is provisioned (see docs/dns-failover.md). Exit 1 is a real
      failure (a listed resolver did not answer, or the VIP answered from two MACs).
      Probes a subdomain (NAME=, default hc3-check.<zone>), not the apex — the apex
      can carry a local override, and a wildcard's job is subdomains.
      Vars: HOST= (default frieren); RESOLVERS= / NAME= / EXPECT= / VIP= override the
      declaration for ad-hoc runs; IFACE= scopes the arping probe.
    cmds:
      - HOST={{.HOST | default "frieren"}} RESOLVERS="{{.RESOLVERS | default ""}}" NAME="{{.NAME | default ""}}" IFACE={{.IFACE | default ""}} bash scripts/task/dns-failover-check.sh

  checks:qmd:vault:
    desc: Check the Obsidian vault qmd collection exists and its index is fresh
    cmds:
      - bash scripts/task/qmd-docs-index.sh check vault

  checks:sops:drift:
    desc: Verify every sops file's embedded age recipients match .sops.yaml (catches un-rekeyed files)
    cmds:
      - bash scripts/task/sops-drift-check.sh

  checks:nix:lint:
    desc: Run deadnix (hard gate) and statix (advisory) on all Nix files
    summary: >
      Routes through scripts/task/nix-fmt.sh — the single toolchain-resolution
      path — with --tools deadnix,statix, so these are the flake.lock-pinned
      versions the pre-commit gate uses, not a fresh `nix-shell -p` resolve.
      deadnix fails the task; statix stays advisory (its W20 repeated-key
      warning fires on the house style).
    cmds:
      - bash scripts/task/nix-fmt.sh --check --all --tools deadnix,statix

  checks:nix:fix:
    desc: Auto-fix the Nix hard gates (deadnix + alejandra) on all Nix files
    summary: >
      Delegates to scripts/task/nix-fmt.sh, the single implementation shared with
      checks:nix:watch, using the flake.lock-pinned toolchain (same versions as
      the pre-commit gate), cached as GC-rooted links. Applies only the HARD
      gates — the ones that would reject the commit. statix is advisory in this
      repo and is deliberately never auto-applied; to write its suggestions run
      `bash scripts/task/nix-fmt.sh --fix --all --tools deadnix,statix,alejandra`.
    cmds:
      - bash scripts/task/nix-fmt.sh --fix --all

  checks:nix:format:
    desc: Check Nix file formatting with alejandra (read-only)
    summary: >
      Routes through scripts/task/nix-fmt.sh with --tools alejandra, so this
      check and checks:nix:lint cannot resolve different tool versions. Writes
      nothing; exits 1 listing every file that is not alejandra-formatted.
    cmds:
      - bash scripts/task/nix-fmt.sh --check --all --tools alejandra

  checks:nix:watch:
    desc: "watch: auto-format Nix files on save (deadnix + alejandra) — no manual tool calls"
    summary: >
      Long-running background hook, for agents and humans alike. Uses task's
      watch flag over **/*.nix and formats only the files git reports as dirty,
      so a save costs one file. Applies the HARD gates only — deadnix and
      alejandra, the ones that would reject the commit — and deliberately not
      statix, whose suggestions are advisory in this repo (W20 fires on the
      house style). A watcher that silently rewrote style while you were editing
      would be the wrong trade; statix findings are still reported by
      `task checks:nix:lint`, and applying them is a deliberate opt-in.
      Writes only when a file actually changes (the tools are idempotent,
      verified), so it cannot re-trigger itself into a loop. No inputs; start it
      once and leave it running. Toolchain comes from the flake.lock pin, i.e.
      the same versions the commit gate will use.
    watch: true
    sources:
      - "**/*.nix"
    cmds:
      - bash scripts/task/nix-fmt.sh --tools deadnix,alejandra

  checks:nix:watch:status:
    desc: Show whether the Nix watcher is running (pid + elapsed)
    summary: >
      Matches the watcher process exactly (cmdline `task checks:nix:watch`), so
      it never confuses itself or a sibling task for the watcher.
    cmds:
      - |
        pids=$(pgrep -f '^task checks:nix:watch$' 2>/dev/null || true)
        if [ -z "$pids" ]; then
          echo "checks:nix:watch: not running"
        else
          echo "checks:nix:watch: running"
          ps -o pid,etime,args -p $(echo "$pids" | tr '\n' ',' | sed 's/,$//') 2>/dev/null || echo "$pids"
        fi

  checks:nix:watch:stop:
    desc: Stop a running Nix watcher (kills the watcher, not your shell)
    summary: >
      Killing the shell that started the watcher does NOT stop it — the watcher
      is a grandchild of that shell, so it keeps formatting the repo while
      looking stopped (it once ran ~8 minutes unnoticed that way). This targets
      the `task checks:nix:watch` process itself, waits for exit, then proves it
      is gone rather than assuming the kill landed. Idempotent: with no watcher
      running it reports that and exits 0.
    cmds:
      - |
        pids=$(pgrep -f '^task checks:nix:watch$' 2>/dev/null || true)
        if [ -z "$pids" ]; then
          echo "checks:nix:watch: not running (nothing to stop)"
          exit 0
        fi
        for pid in $pids; do
          echo "stopping watcher pid $pid"
          # Signalling MUST go through a real bash: task runs cmds in its own
          # restricted shell interpreter, where `kill` is an
          # "unsupported builtin" and would silently do nothing (it did).
          # Do not suppress the error — a signal that does not land must be
          # visible, and the verification below turns it into a failure.
          if ! bash -c 'kill "$1"' _ "$pid"; then
            echo "WARNING: could not signal pid $pid" >&2
          fi
        done
        # Wait for exit, then verify instead of assuming the signal landed.
        i=0
        while [ "$i" -lt 50 ]; do
          pgrep -f '^task checks:nix:watch$' >/dev/null 2>&1 || break
          i=$((i + 1))
          sleep 0.1
        done
        still=$(pgrep -f '^task checks:nix:watch$' 2>/dev/null || true)
        if [ -n "$still" ]; then
          echo "FAIL: watcher still running (pids: $(echo "$still" | tr '\n' ' '))" >&2
          exit 1
        fi
        echo "checks:nix:watch: stopped (verified, no watcher process remains)"

  checks:toml:lint:
    desc: Validate that every tracked TOML file parses (yq) — the guard for yq-only TOML edits
    summary: >
      TOML is edited with `yq -i`, never by hand, and this proves the result
      parses. Lists every file that no longer does and exits 1.
    cmds:
      - |
        fail=0
        count=0
        for f in $(git ls-files '*.toml'); do
          count=$((count + 1))
          if ! yq '.' "$f" >/dev/null 2>&1; then
            echo "INVALID TOML: $f" >&2
            fail=1
          fi
        done
        if [ "$fail" = 0 ]; then
          echo "OK: $count tracked TOML file(s) parse"
        fi
        exit "$fail"

  checks:status:
    desc: Show task and git status
    cmds:
      - task --list-all
      - git status --short

  checks:remotes:
    desc: Comprehensive security and health audit across all external remote servers (serv00, dragoncourt, envs)
    cmds:
      - echo "=========================================="
      - echo ">>> [1/3] Serv00 FreeBSD Security & Health Audit <<<"
      - echo "=========================================="
      - task serv00:audit
      - echo ""
      - echo "=========================================="
      - echo ">>> [2/3] Dragoncourt Alwaysdata Debian Audit <<<"
      - echo "=========================================="
      - task dragoncourt:audit
      - echo ""
      - echo "=========================================="
      - echo ">>> [3/3] Envs.net Debian Pubnix Audit <<<"
      - echo "=========================================="
      - task envs:audit

