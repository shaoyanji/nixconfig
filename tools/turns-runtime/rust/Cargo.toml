[package]
name = "turns-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = {version = "1", features = ["full"]}
tokio-stream = {version = "0.1", features = ["sync"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
futures-util = "0.3"

[[bin]]
name = "turns-bench"
path = "src/main.rs"
