version: "3"

tasks:

  # CI has no build matrix to toggle: eligibility is `inventory.toml`
  # (`ci`, `status`), read by scripts/ci/detect-affected-hosts.py. The operator
  # surface is `dev:ci:plan`, `dev:ci:plan:worktree` and `dev:ci:trigger:<host>`;
  # see docs/ci-pipeline.md.

  # ── Commissioning helpers ───────────────────────────────────────

  lifecycle:commission:new-host:*:
    desc: "Scaffold a new host directory and add it to host-inventory.nix"
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - |
        if [ -d "hosts/{{.HOST}}" ]; then
          echo "⚠️  hosts/{{.HOST}} already exists — aborting"
          exit 1
        fi
        mkdir -p "hosts/{{.HOST}}"
        echo "✅ Created hosts/{{.HOST}}/"
        echo ""
        echo "Next steps (see README.md → Host Lifecycle for details):"
        echo ""
        echo "  1. Create configuration.nix + copy hardware-configuration.nix from the host"
        echo "  2. Register in flake/host-inventory.nix"
        echo "  3. Add age key to .sops.yaml → task infra:sops:update-keys"
        echo "  4. SSH in → ip link show → set NIC names"
        echo "  5. Check nixos-hardware for pre-built profiles"
        echo "  6. nix eval .?submodules=1#nixosConfigurations.{{.HOST}}.config.networking.hostName"
        echo "  7. Set `ci = true` in inventory.toml — there is no matrix to edit"
        echo "  8. task infra:plan:host:{{.HOST}}"
        echo "  9. task infra:apply:host:{{.HOST}}"

  # ── Decommissioning helpers ─────────────────────────────────────

  lifecycle:decommission:audit:*:
    desc: "Search for all references to a host across the repo"
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - |
        echo "=== .nix files ==="
        grep -rn "{{.HOST}}" . --include='*.nix' | grep -v flake.lock | grep -v result || echo "(none)"
        echo ""
        echo "=== .md files ==="
        grep -rn "{{.HOST}}" . --include='*.md' | grep -v flake.lock | grep -v AUDIT || echo "(none)"
        echo ""
        echo "=== CI / YAML files ==="
        grep -rn "{{.HOST}}" . --include='*.yml' --include='*.yaml' | grep -v flake.lock || echo "(none)"
        echo ""
        echo "=== Agent skills ==="
        grep -rn "{{.HOST}}" .agents/skills/ --include='*.md' 2>/dev/null || echo "(none)"
        echo ""
        echo "=== Deploy docs ==="
        ls -la ".agents/deploy/hosts/{{.HOST}}.md" 2>/dev/null && echo "⚠️  Deploy doc exists: .agents/deploy/hosts/{{.HOST}}.md" || echo "(none)"

  lifecycle:decommission:clean:*:
    desc: "Remove the most common stale references for a decommissioned host"
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - |
        # CI needs no disable step: eligibility is the `ci`/`status` fields in
        # inventory.toml, removed with the host entry itself.
        # Deploy doc
        if [ -f ".agents/deploy/hosts/{{.HOST}}.md" ]; then
          rm ".agents/deploy/hosts/{{.HOST}}.md"
          echo "✅ Removed .agents/deploy/hosts/{{.HOST}}.md"
        fi
        echo ""
        echo "✅ Deploy doc removed (if it existed); CI eligibility dies with the inventory entry."
        echo ""
        echo "Manual steps remaining:"
        echo "  1. Remove {{.HOST}} from flake/host-inventory.nix"
        echo "  2. rm -rf hosts/{{.HOST}}"
        echo "  3. Check AGENTS.md, README.md, docs/ for stale references"
        echo "  4. nix eval .?submodules=1#nixosConfigurations | grep {{.HOST}}  # should return nothing"
