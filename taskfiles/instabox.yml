version: "3"

# InstaBox machines as a fleet surface: the HTTP API and plain ssh, no provider
# CLI and nothing it installs. scripts/task/instabox.sh holds every call; the
# key's home, the token mechanics and the measured traps are .agents/skills/
# instabox.
#
# The machine is named positionally, and go-task reads a bare word after the
# task name as a TASK name, not an argument: every call goes through `--`,
# `task instabox:ssh -- clanker`, and a command after it is one more word.

tasks:
  instabox:ls:
    desc: List InstaBox machines with state, size and auto-suspend
    summary: >
      One row per machine in the key's workspace: name, state, vCPUs, memory,
      persistent disk, the auto-suspend window and the `m_…` id. The id is what
      a token line and every API path speak; the name is only how you find it.
    cmds:
      - bash scripts/task/instabox.sh ls

  instabox:get:
    desc: Print one machine's full record as JSON
    summary: >
      `task instabox:get -- clanker`. Spec, storage, runtime readiness, run clock
      and the free-tier flags. `jq -r .state` is the one field to watch after
      start, suspend or wake.
    cmds:
      - bash scripts/task/instabox.sh get {{.CLI_ARGS}}

  instabox:ssh:
    desc: Open a shell on a machine, using a minted SSH token (no CLI, no key)
    summary: >
      `task instabox:ssh -- clanker`, or `task instabox:ssh -- clanker 'uname -a'`
      for one command. The gateway terminates SSH: the login is a token
      (`ibssh_…`) minted through the API and cached for seven days, and the
      gateway's host key is pinned into ~/.cache/nixconfig-instabox/known_hosts
      on first use. No key is placed on the machine and no agent forwarding is
      available.
    cmds:
      - bash scripts/task/instabox.sh ssh {{.CLI_ARGS}}

  instabox:run:
    desc: Run one command on a machine over ssh
    summary: >
      `task instabox:run -- clanker 'nproc; df -h /data'`. Same token path as
      `instabox:ssh`; use it when the answer is text, and `instabox:exec` when
      the command returns an exit status you want to branch on.
    cmds:
      - bash scripts/task/instabox.sh run {{.CLI_ARGS}}

  instabox:exec:
    desc: Run one command through the HTTP API — no ssh, no token
    summary: >
      `task instabox:exec -- clanker 'go version'`. The narrowest path: one
      API call, stdout and stderr back as JSON, and the command's own exit
      status as the task's. It needs no ssh client, no known_hosts and mints
      nothing, so it is what an unattended agent should reach for first.
    cmds:
      - bash scripts/task/instabox.sh exec {{.CLI_ARGS}}

  instabox:token:
    desc: Print a machine's ssh line (minted; cached for seven days)
    summary: >
      The line is `ssh -p <port> <token>@ssh.instabox.sh`, and the token is the
      credential — anyone holding it has a shell. It is printed so it can be
      pasted into a terminal or a tool that cannot read sops; revoke every token
      of a machine from the dashboard, or with
      `DELETE /v1/machines/<id>/ssh-tokens`.
    cmds:
      - bash scripts/task/instabox.sh token {{.CLI_ARGS}}

  instabox:start:
    desc: Start a machine (answers an operation id at once)
    cmds:
      - bash scripts/task/instabox.sh start {{.CLI_ARGS}}

  instabox:stop:
    desc: Stop a machine; its persistent disk survives
    cmds:
      - bash scripts/task/instabox.sh stop {{.CLI_ARGS}}

  instabox:suspend:
    desc: Suspend a machine (the API's "pause")
    cmds:
      - bash scripts/task/instabox.sh suspend {{.CLI_ARGS}}

  instabox:resume:
    desc: Resume a suspended machine
    cmds:
      - bash scripts/task/instabox.sh resume {{.CLI_ARGS}}

  instabox:wake:
    desc: Wake a machine that auto-suspended itself
    cmds:
      - bash scripts/task/instabox.sh wake {{.CLI_ARGS}}

  instabox:ports:
    desc: List a machine's published ports
    cmds:
      - bash scripts/task/instabox.sh ports {{.CLI_ARGS}}

  # ── clanker as a fleet offload box ──────────────────────────────────────────
  # Permanent since 2026-11-06: 4 vCPU / 8 GiB, `/data` 20 GiB, 120 minutes per
  # run, suspended after 30 idle. A job is a directory on the box (`cmd.sh`, `log`,
  # `exit`) so it survives the ssh channel that started it — and the absence of
  # `exit` is what "running" means, which is why there is no pid file to go stale
  # when the box suspends. Plan: AGENTS.nix `clanker-offload-fixture`.

  clanker:up:
    desc: Install Nix on clanker (single-user), write its nix.conf, make job dirs
    summary: >
      Idempotent. Single-user Nix — no daemon, no root — with the fleet's
      substituters and the task's own ceiling (`max-jobs = 4`, `cores = 1`,
      `sandbox = false`): a shared box, not a builder that starves itself. Run it
      once per image; it also repairs nix.conf after a box reset.
    cmds:
      - bash scripts/task/clanker.sh up

  clanker:status:
    desc: Box, Nix, disk and job state on clanker
    cmds:
      - bash scripts/task/clanker.sh status

  clanker:profile:
    desc: Build and activate the lean home-manager profile on clanker
    summary: >
      Sends the tree and activates `.#homeConfigurations.clanker`
      (`role:lean`: git, gh, go, go-task, ripgrep, jq, yq, tmux, direnv, rsync,
      shellcheck — no desktop, no AI stack, no sops, no age key). Pinned to this
      tree's home-manager, so the CLI cannot drift from the library. Runs as a
      job: `--wait` tails it, and the job id is what to poll if the ssh channel
      drops.
    cmds:
      - bash scripts/task/clanker.sh profile {{.CLI_ARGS}}

  clanker:nix:
    desc: Build one flake attribute on clanker in the background
    summary: >
      `task clanker:nix -- 'hostChecks.x86_64-linux.fern' --wait` (a bare attr;
      the task adds the `.#`). The tree is
      sent with `git archive HEAD` (so commit first — uncommitted work does not
      travel), and the build runs detached from the ssh channel. This box has no
      version of the fleet's cache write keys: a build here warms nothing until
      `nix copy` is given a destination deliberately.
    cmds:
      - bash scripts/task/clanker.sh nix {{.CLI_ARGS}}

  clanker:go:
    desc: Build a Go package on clanker and fetch the binary
    summary: >
      `task clanker:go -- ./modules/services/turns-dashboard --wait`. Measured
      2026-11-06: the 14 MB `turns-dashboard` binary back from a 4 vCPU box while
      this host stayed idle.
    cmds:
      - bash scripts/task/clanker.sh go {{.CLI_ARGS}}

  clanker:devshell:
    desc: Run a command inside a flake devShell on clanker (no local build)
    summary: >
      `task clanker:devshell -- ./templates/agent-shell#default 'agent-browser --version'`.
      The Codespace analogue without an image: the tree travels as `git archive
      HEAD`, the flake's devShell is the environment, and only the command's output
      comes back. `--accept-flake-config` is what lets the template's numtide
      substituter apply, so the ~700 MiB Chromium is a download rather than a
      compile on a 4-core box. A bare `path` means `#default`; anything with a `#`
      is used as written. The command runs in a job, so the box keeps going when
      the ssh channel closes.
    cmds:
      - bash scripts/task/clanker.sh devshell {{.CLI_ARGS}}

  clanker:serve:
    desc: Run a service on clanker in a detached tmux session (no published port)
    summary: >
      `task clanker:serve -- web 8099 'python3 -m http.server 8099 --bind 127.0.0.1'`.
      The service is a tmux session `svc-<name>`; nothing is exposed, so the only
      way in is `clanker:forward`, which tunnels the loopback port through the
      minted ssh token. That is the whole offload: the box's CPU and memory run
      the service, this host keeps the browser tab and the credential.
    cmds:
      - bash scripts/task/clanker.sh serve {{.CLI_ARGS}}

  clanker:services:
    desc: Which services run on clanker, on which port, and whether they are up
    cmds:
      - bash scripts/task/clanker.sh services

  clanker:forward:
    desc: Foreground loopback forward to a service on clanker
    summary: >
      `task clanker:forward -- 8099`. Opens `ssh -N -L 127.0.0.1:8099:…`, so
      `http://127.0.0.1:8099` is the service on the box. Ctrl-C ends the forward,
      not the service — the tmux session keeps running until the box suspends.
    cmds:
      - bash scripts/task/clanker.sh forward {{.CLI_ARGS}}

  clanker:stop-serve:
    desc: End one service's tmux session on clanker
    cmds:
      - bash scripts/task/clanker.sh stop-serve {{.CLI_ARGS}}

  clanker:job:
    desc: Start a detached shell command on clanker and print its job id
    summary: >
      `task clanker:job -- 'nix flake update'`. The `--` is required: go-task
      reads a bare word as a task name. The command runs in `/data/jobs/<id>`,
      its output in `log`, its status in `exit`; it keeps running when the ssh
      channel closes, and the box suspends it after 30 idle minutes.
    cmds:
      - bash scripts/task/clanker.sh job {{.CLI_ARGS}}

  clanker:jobs:
    desc: List every job on clanker with its exit status
    cmds:
      - bash scripts/task/clanker.sh jobs

  clanker:logs:
    desc: Tail one job's log
    summary: "`task clanker:logs -- <id> 100`. `no log yet` means the wrapper has not opened it."
    cmds:
      - bash scripts/task/clanker.sh logs {{.CLI_ARGS}}

  clanker:wait:
    desc: Block until a job exits and return its status
    summary: >
      `task clanker:wait -- <id> [seconds]`, default 7200. Polls the API every
      5 s, so no ssh session is held open across a long build.
    cmds:
      - bash scripts/task/clanker.sh wait {{.CLI_ARGS}}

  clanker:result:
    desc: Fetch a job's output directory back as a tar
    summary: >
      `task clanker:result -- <id>` lands in `.clanker-out/<id>/` (gitignored).
      The box has no rsync, so the return trip is one tar over ssh.
    cmds:
      - bash scripts/task/clanker.sh result {{.CLI_ARGS}}

  clanker:cancel:
    desc: Kill a job's process group and mark it cancelled
    cmds:
      - bash scripts/task/clanker.sh cancel {{.CLI_ARGS}}

  clanker:ssh:
    desc: Open a shell on clanker through the job-box script
    cmds:
      - bash scripts/task/clanker.sh ssh {{.CLI_ARGS}}
