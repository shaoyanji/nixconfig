name: gok

# BUILD ONLY. Any host edits the instance and pushes; the runner compiles it and
# keeps the artifact. Delivery to delphi is deliberately not in this job yet:
# Taildrop refuses to send between devices owned by different users
# (`peer is owned by a different user`), and the runner is tag:ci while delphi is
# a user device — so a publish step here could only ever fail. Build takes about
# five minutes and nothing in this job waits on a timeout.
#
# One deploy path, deliberately: delphi holds the artifact and is the only host
# that streams it to the appliance over the tailnet — `task infra:gok:deploy`.
# That keeps the 140 MB push on the machine that already has the bytes instead of
# dragging them back to a laptop (or building them on the NAS, which answers DNS
# for the fleet) to send them forward again. Getting the artifact to delphi is
# the open decision (a delphi-side pull with a read-only token is the candidate);
# until then this job's artifact is the deliverable.
#
# The artifact carries baked credentials (wifi PSK, tailnet node key, update
# password), which is why it is never published to a public URL and why
# `gok-stream.sh` prints the manifest's `credentials` line before every push.
on:
  push:
    paths:
      - hosts/gok/config.json
      - hosts/gok/instance.nix
      - modules/services/gokrazy.nix
      - scripts/task/gok.sh
      - .github/workflows/gok.yml
  workflow_dispatch:

concurrency:
  group: gok
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The receiver is hosts/delphi/gok-artifacts.nix: a 2-minute timer pulls
      # whatever Taildrop queued, verifies it, unpacks it and serves it back at
      # /gok/ on the tailnet vhost.
      ARTIFACT_HOST: delphi.cloudforest-kardashev.ts.net
    steps:
      # `token:` is load-bearing: the secrets submodule is private, and
      # `persist-credentials: false` alone leaves the submodule clone anonymous —
      # the job died at checkout with the tailscale step never reached.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # `gok.sh` derives the breakglass key list from modules/config/authorized-keys.nix,
      # so the runner needs Nix to evaluate it. Pipe operators are required to parse.
      #
      # WAN substituters only, and the flake's `nixConfig` is refused outright. The
      # materialise step runs `nix eval` on this flake, which inherits this config;
      # flake.nix lists the LAN Harmonia cache, and an internet runner cannot reach
      # it, so every missing path sat on a connect timeout — this job showed 19
      # minutes of silence and then exit 124, twice. Same rule as nixcachix.yml.
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            accept-flake-config = false
            connect-timeout = 5

      # The cache list is DERIVED, never retyped: a hand-written list silently
      # drops a cache the fleet actually has, and every path in it becomes a local
      # build (the 100 % peg this job kept causing). delphi's compiled policy is the
      # WAN-ordered set — cachix, cache.nixos.org, numtide, determinate,
      # nix-community, nix-gaming — with the LAN Harmonia cache already absent,
      # which is exactly what a runner on the internet may use.
      - name: Use the fleet's WAN caches
        run: |
          subs=$(nix eval --json .#inventory.cache.delphi.substituters | jq -r 'join(" ")')
          [ -n "$subs" ] || { echo 'no substituters compiled for delphi' >&2; exit 1; }
          echo "NIX_CONFIG=substituters = $subs" >> "$GITHUB_ENV"
          echo "using: $subs"

      # gok and Go come from nixpkgs through `gok.sh`, exactly as on an operator
      # machine. `go install gok@main` is a different gok: it ignored
      # `-i gok --parent_dir` and looked for the instance at ~/gokrazy/hello,
      # which is how a 4-minute build failed with "no such file or directory".
      - name: Warm gok and Go
        run: nix shell nixpkgs#gokrazy nixpkgs#go -c gok version || true

      # Go's caches are what take the build from minutes to seconds; they live
      # under the wrapper's instance cache so this key covers exactly what gok uses.
      - name: Cache the Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nixconfig-gok/go/build
            ~/.cache/nixconfig-gok/go/mod
            ~/.cache/nixconfig-gok/gok/builddir
          key: gok-go-${{ hashFiles('hosts/gok/config.json') }}-${{ github.run_id }}
          restore-keys: |
            gok-go-${{ hashFiles('hosts/gok/config.json') }}-
            gok-go-

      # Two steps, not one: `gok update` builds and pushes in the same process,
      # so its log cannot say which half is talking and a stall looks identical
      # to a slow build. Here the build is bounded on its own and the artifact is
      # kept, so a publish retry costs a copy rather than another 15 minutes.
      #
      # The output directory carries the run id because delphi treats a repeated
      # tarball name as an already-received build: a fixed name would make every
      # run after the first a silent no-op on the receiving side.
      - name: Build the appliance artifact
        id: build
        env:
          GOK_HTTP_PASSWORD: ${{ secrets.GOK_HTTP_PASSWORD }}
          # Optional. TS_AUTH_KEY is the runner's own ephemeral tag:ci key and must
          # NOT be baked into the appliance, so this is a separate secret; empty
          # means the image carries no auth key (fine for updates, the node key
          # persists in /perm) and the manifest says so.
          GOK_TAILSCALE_AUTH_KEY: ${{ secrets.GOK_TAILSCALE_AUTH_KEY }}
          # Without these the build DELETES the wifi package rather than shipping
          # empty credentials, so the appliance loses its link at the next boot —
          # an update that looks successful and is not (2026-10-26). Optional for
          # a wired node; the manifest's `credentials.wifi` records which it is,
          # and `gok-stream.sh` prints that line before every push.
          GOK_WIFI_SSID: ${{ secrets.GOK_WIFI_SSID }}
          GOK_WIFI_PSK: ${{ secrets.GOK_WIFI_PSK }}
        run: |
          set -eu
          if [ -z "${GOK_HTTP_PASSWORD:-}" ]; then
            echo "GOK_HTTP_PASSWORD is not set — add the gokrazy web password as a repository secret (task infra:secrets:form:gok)" >&2
            exit 1
          fi
          out="$RUNNER_TEMP/gok-$GITHUB_RUN_ID"
          tarball=$(./scripts/task/gok.sh build "$out")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "buildts=$(jq -r .buildTimestamp "$out/manifest.json")" >> "$GITHUB_OUTPUT"
          ls -lh "$out"
          {
            echo "### appliance artifact"
            echo '```'
            jq . "$out/manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always keep a copy in GitHub: it survives a broken tailnet ACL, and it is
      # what `gh run download -n gok-artifact` recovers for a reflash.
      - uses: actions/upload-artifact@v4
        with:
          name: gok-artifact
          path: ${{ steps.build.outputs.tarball }}
          retention-days: 14
