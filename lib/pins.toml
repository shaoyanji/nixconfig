# Small transient data the tree pins, and how to refresh it.
#
# The rule that keeps this honest: a pin is a FILE in the repository, never a
# fetch at eval time. Nix cannot reach the tailnet shim (it wants a bearer
# header, and the sandbox has no network), and a build must be reproducible from
# the commit alone. So the refresh runs outside Nix, the result is committed, and
# `max_bytes` is what stops a large corpus from being dragged in — the kiwix
# archive and the media trees are not pins.

[[pin]]
name = "agent-turns"
path = "lib/agent-turns/turns.json"
cmd = "task agents:turns:snapshot"
max_bytes = 300000

[[pin]]
name = "resume"
path = "lib/matt/resume.json"
cmd = "task matt:gist:sync"
max_bytes = 120000
# The same gist is also a fetchurl entry Nix reads (modules/config/fetches.json).
# Naming it here moves both together: a pin that changes without its hash leaves
# the build describing the previous revision, which is the drift this pin caused.
hash_key = "matt-resume"

# Fetches whose upstream is a gist and whose bytes no file here pins: the shell
# configs and the SSH key list. There is nothing to compare against, so the hash
# IS the pin and every refresh re-reads it. `file` defaults to
# modules/config/fetches.json. A release archive in that registry (ariang) is
# deliberately absent — this table is for small strings and scripts.
[[hash]]
key = "wezterm-config"

[[hash]]
key = "wezterm-mappings"

[[hash]]
key = "elvish-rc"

[[hash]]
key = "lf-icons"

[[hash]]
key = "authorized-keys"
file = "modules/config/authorized-keys.json"

# A release pin whose version builds the URL, so version and hash are one fact in
# one file (modules/services/agent-turns.nix). The refresh follows upstream and
# rewrites both hashes only after every tarball prefetches; `--check` keeps
# comparing the file to HEAD, so a bump travels in the commit that caused it.
[[pin]]
name = "xs-release"
path = "modules/services/agent-turns.nix"
cmd = "bash scripts/task/xs-pin.sh"
max_bytes = 40000
