version: "3"

vars:
  # Originals live on the pool, never in the repo: an accepted plate is a 1.5 MB
  # PNG and a day of them is not a commit. `published/` is the accumulated tree
  # that gets deployed, so a gallery keeps its history instead of being replaced
  # by today's folder.
  IMAGES_ROOT: /Volumes/data/pics/generated
  # Assets are uploaded to Cloudinary, whose delivery URL carries the resize, so
  # there is no project to deploy and no gallery to keep in sync. The manifest of
  # path to delivery URL is published/urls.tsv.
  # Where the discretionary leftover goes. The printer is idempotent and stops
  # when the book has no spread left, so pointing it at a finished book is free.
  STORYBOOK_DIR: /Volumes/data/projects/storybook/lantern

tasks:
  images:plan:
    desc: What the image queue would spend today, lane by lane, and the leftover
    summary: >
      Reads the brief bank (`lib/image-daily/briefs.json`), the ledger at
      `{{.IMAGES_ROOT}}/ledger.jsonl` and `cpg usage`, and prints what is due.
      Spends nothing, needs no agent, and answers the one question a person asks
      before trusting a nightly job: is it going to do anything tonight.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh plan

  images:run:
    desc: Generate the due briefs, judge each with agy, and publish what the judge kept
    summary: >
      Spends the allowance in lane order (site, wall, blog, fleet), one plate per
      brief, each judged by `agy`; a named defect buys one re-roll and an unjudged
      plate never publishes. Leftover stays unspent unless `STORYBOOK=1`.

      Idempotent per pass: the same slot exits 0 unless FORCE=1. Env: `DRY=1` plans,
      `LANES="wall"` narrows, `CAP=<n>` caps this pass, `SLOT=<n>` gives it its own
      day marker, `PUBLISH=0` skips the deploy.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} STORYBOOK_DIR={{.STORYBOOK_DIR}} bash scripts/task/image-daily.sh run

  images:status:
    desc: "[gate] per-lane freshness from the ledger — exit 1 when a lane is stale"
    summary: >
      Answers whether the queue is keeping its promise, not whether a timer fired.
      A lane is stale when its newest accepted asset is older than the lane's
      `max_age_days`, or when it has never produced one. Exit 0 = fresh, 1 = stale
      (or no ledger yet), so a sentinel can page on it without reading prose.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh status

  images:judge:
    desc: Judge one image file with agy and print the verdict JSON
    summary: >
      The same judge the nightly run uses, on one file — for checking a prompt
      before it goes into the bank. Prints `{verdict, reason, defect, tags}`;
      `unjudged` means agy failed, which is not a rejection.
    cmds:
      - bash scripts/task/image-daily.sh judge {{.FILE}} {{.LANE}}

  images:blog:
    desc: Print the Chirpy front matter for each published banner (DIR=… also copies the JPEGs)
    summary: >
      The blog lane's consumer is the Chirpy checkout, not a gallery. Each banner
      is a 1200x630 JPEG under `{{.IMAGES_ROOT}}/published/blog/`, and ffmpeg makes
      that crop locally, so it costs no image. Prints the `image:` block Chirpy
      reads for the hero and og:image, pointing at the Cloudinary delivery URL the
      publish step recorded in `published/urls.tsv`.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh blog {{if .DIR}}--dir "{{.DIR}}"{{end}}

  images:publish:
    desc: Stage kept assets and upload them to Cloudinary, recording delivery URLs
    summary: >
      Copies every accepted `site`, `wall` and `blog` plate out of the ledger into
      `{{.IMAGES_ROOT}}/published/`, uploads each to Cloudinary and writes
      `published/urls.tsv`, the manifest of path to delivery URL, and rebuilds
      `manifest.json` for the search frontend that Pages serves. Every row carries its
      lane, day and tags derived from the public id, so the frontend filters as well
      as searches. The resize is in the URL, so one upload serves the card, the
      thumbnail and the retina hero, and the deploy carries no images at all.
      Re-running re-uploads; a versioned URL is immutable.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh publish

  images:post:
    desc: One motion from a title to a post with its banner already on Cloudinary
    summary: >
      Generates a banner, has `agy` judge it (one defect buys one re-roll), crops
      1200x630, uploads it as `assets/blog/<slug>` and adds it to the manifest, then
      writes `_posts/<day>-<slug>.md` with that URL in `image:`. The banner exists
      before the file does, so a post cannot carry a hero that 404s. `SLUG=` and
      `TITLE=` are required; `DRAFT=1` promotes an existing `_posts/*-<slug>.md` —
      body, description, toc flags — removes the draft and lands both in one commit;
      `PUSH=1` pushes and `FORCE=1` rewrites an existing post.
    cmds:
      - SLUG="{{.SLUG}}"{{if .DRAFT}} DRAFT="{{.DRAFT}}"{{end}} TITLE="{{.TITLE}}" PROMPT="{{if .PROMPT}}{{.PROMPT}}{{end}}" TAGS="{{if .TAGS}}{{.TAGS}}{{end}}" PUSH="{{if .PUSH}}{{.PUSH}}{{end}}" IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh post

  images:gc:
    desc: Destroy Cloudinary public ids that nothing references (orphans of old conventions)
    summary: >
      Cloudinary keeps every upload forever, so a superseded convention leaves an id
      nothing serves that every listing still shows. The references are the manifest
      and the blog checkout; everything under `GC_PREFIX` that neither names is
      destroyed, and `DRY=1` prints the list instead.
    cmds:
      - GC_PREFIX="{{if .GC_PREFIX}}{{.GC_PREFIX}}{{end}}" IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh gc

  images:wallpaper:
    desc: Set the first in-rotation wallpaper with swaybg (a dwl session's rotation)
    summary: >
      Picks the first plate approved in `lib/image-daily/rotation.json` — the list
      is priority, not freshness, so the head of it is what the screen shows —
      skipping everything that file rejects, restarts swaybg on it, and prints the
      file name. `DRY=1` prints the path instead, which is how a config can ask
      what it would use. A `taste/<day>/<name>.png` id reads the palette-test
      folder beside the bank.
    cmds:
      - IMAGES_ROOT={{.IMAGES_ROOT}} bash scripts/task/image-daily.sh wallpaper

  images:rotation:
    desc: Show the wallpapers in rotation and the rejected ones, with reasons
    summary: >
      Reads `lib/image-daily/rotation.json`. `in` is approval and priority:
      `images:wallpaper` installs the first id named there. `out` is a rejection
      and wins over `in`, carrying the reason it was rejected. A plate in neither
      list is unjudged — not rejected, just not in rotation yet.
    cmds:
      - >-
        jq -r '"in rotation:", (.wall.in[] | "  " + .), "", "out of rotation:", (.wall.out | to_entries[] | "  " + .key + "  -  " + .value)' lib/image-daily/rotation.json
