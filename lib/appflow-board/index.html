<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job pipeline</title>
<style>
:root{--bg:#101013;--panel:#17171c;--line:#26262e;--ink:#e8e8ee;--dim:#8b8b99;--accent:#7ee0b8;--warn:#ffd76a;--bad:#ff8f8f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{padding:1.25rem;max-width:74rem;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);padding-bottom:.75rem;border-bottom:1px solid var(--line);z-index:2}
h1{font-size:1rem;margin:0;letter-spacing:.08em;text-transform:uppercase}
h1 small{color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none}
#q{width:100%;margin:.75rem 0 .5rem;padding:.6rem .75rem;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;border-radius:.3rem}
#q:focus{outline:1px solid var(--accent);border-color:var(--accent)}
#chips{display:flex;flex-wrap:wrap;gap:.35rem}
button.chip{background:transparent;border:1px solid var(--line);color:var(--dim);padding:.2rem .55rem;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
button.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--line)}
li.app button.row{display:grid;grid-template-columns:1fr auto;gap:.75rem;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:.6rem .4rem;cursor:pointer}
li.app button.row:hover{background:var(--panel)}
.co{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{display:block;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 .5rem;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.tag.applied{color:var(--accent);border-color:var(--accent)}
.tag.interview,.tag.screening{color:var(--warn);border-color:var(--warn)}
.tag.rejected{color:var(--bad);border-color:var(--bad)}
.when{color:var(--dim);font-size:11px;white-space:nowrap}
.next{grid-column:1/-1;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next b{color:var(--ink);font-weight:400}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:.3rem;padding:.6rem .7rem;margin:0 .4rem .6rem;font-size:12px;white-space:pre-wrap}
.detail dl{display:grid;grid-template-columns:8rem 1fr;gap:.15rem .6rem;margin:0}
.detail dt{color:var(--dim)}
.detail dd{margin:0}
.detail a{color:var(--accent)}
.detail h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:400;margin:1rem 0 .2rem}
.mail{list-style:none;margin:0;padding:0}
.mail li{display:grid;grid-template-columns:1fr auto;gap:.2rem .5rem;border-top:1px solid var(--line);padding:.35rem 0;white-space:normal}
.mail .who{grid-column:1/-1;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .tier{color:var(--warn);font-size:11px;text-transform:uppercase}
#state{color:var(--dim);padding:2rem .5rem;text-align:center}
#state code{color:var(--accent)}
@media(max-width:36rem){body{padding:.75rem}.detail dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Job pipeline <small id="stats"></small></h1>
  <input id="q" type="search" placeholder="search company, role, status, next action" autocomplete="off" spellcheck="false" aria-label="Search the pipeline">
  <div id="chips" role="group" aria-label="Filter by stage"></div>
</header>
<main id="list" aria-live="polite"></main>
<script>
'use strict';

const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const statsEl = document.getElementById('stats');
const chipsEl = document.getElementById('chips');
const stateEl = document.createElement('div');
stateEl.id = 'state';

// Fixed order: the pipeline reads left to right, and a stage the database adds
// without a row here still appears, after the named ones.
const ORDER = ['lead', 'prep', 'applied', 'screening', 'interview', 'rejected', 'other'];

let apps = [];
let pipeline = [];
let stage = 'all';
let query = '';
let open = '';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = (s) => (s ? String(s).slice(0, 10) : '—');

function getJSON(url) {
  return fetch(url, { cache: 'no-store' }).then((r) => {
    if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
    return r.json();
  });
}

function stageOf(a) {
  return (a.stage || 'other').toLowerCase();
}

function label(a) {
  return `${a.company || ''} ${a.role || ''} ${a.status || ''} ${a.nextAction || ''}`.toLowerCase();
}

function visible() {
  const q = query.trim().toLowerCase();
  return apps.filter((a) => (stage === 'all' || stageOf(a) === stage) && (!q || label(a).includes(q)));
}

function row(a) {
  const s = stageOf(a);
  const isOpen = open === a.id;
  const next = a.nextAction && a.nextAction !== 'none'
    ? `<span class="next"><b>next:</b> ${esc(a.nextAction)}</span>`
    : '<span class="next">no next action</span>';
  const mail = a.linkedMail ? ` · ${a.linkedMail} mail` : '';
  // The detail sits beside the button, not inside it: a button may hold only
  // phrasing content, and a block child makes some browsers drop the row.
  return `<li class="app"><button class="row" type="button" data-id="${esc(a.id)}" aria-expanded="${isOpen}">`
    + `<span><span class="co">${esc(a.company)}</span><span class="role">${esc(a.role)}</span></span>`
    + `<span><span class="tag ${esc(s)}">${esc(s)}</span> <span class="when">${day(a.updatedAt)}${mail}</span></span>`
    + next
    + '</button>'
    + (isOpen ? `<div class="detail" data-for="${esc(a.id)}">loading…</div>` : '')
    + '</li>';
}

function render() {
  const pool = visible();
  listEl.replaceChildren();
  if (!apps.length) {
    stateEl.textContent = 'The pipeline is empty.';
    listEl.append(stateEl);
    return;
  }
  if (!pool.length) {
    stateEl.textContent = query ? `Nothing matches “${query}”.` : 'Nothing in this stage.';
    listEl.append(stateEl);
    return;
  }
  const ul = document.createElement('ul');
  ul.innerHTML = pool.map(row).join('');
  listEl.append(ul);
  if (open) fillDetail(open);
}

// The parameter names come from the endpoint's OpenAPI, not from the SQL: the
// plugin writes `:application_id` and NpgsqlRest exposes `applicationId`, which
// is why asking for the snake_case name is a 404.
function mailOf(id) {
  return getJSON(`/api/application-mail?applicationId=${encodeURIComponent(id)}&lim=20`)
    .then((rows) => rows || [])
    .catch(() => null);
}

function mailBlock(rows) {
  if (!rows) return '<h3>mail</h3><p>cannot read the messages</p>';
  if (!rows.length) return '<h3>mail</h3><p>no linked message</p>';
  const short = (s) => esc(String(s || '').replace(/\s*<[^>]*>/g, ''));
  return '<h3>mail</h3><ul class="mail">' + rows.map((m) =>
    `<li><span>${esc(m.subject || '(no subject)')}</span>`
    + `<span class="tier">${esc(m.tier || '')}</span>`
    + `<span class="who">${short(m.sender)} · ${day(m.sentAt)} · ${esc(m.matchedBy || '')}`
    + `${m.confidence != null ? ` ${Math.round(m.confidence * 100)}%` : ''}</span></li>`).join('') + '</ul>';
}

function fillDetail(id) {
  const box = listEl.querySelector(`.detail[data-for="${CSS.escape(id)}"]`);
  if (!box) return;
  Promise.all([
    getJSON(`/api/application-get?id=${encodeURIComponent(id)}`),
    mailOf(id),
  ])
    .then(([rows, mail]) => {
      const a = (rows || [])[0];
      if (!a) {
        box.textContent = 'no record';
        return;
      }
      const fields = [
        ['status', a.status],
        ['next action', a.nextAction],
        ['fit', a.fit == null ? '—' : `${a.fit}/5`],
        ['category', a.category],
        ['language', a.language],
        ['origin', a.origin],
        ['updated', day(a.updatedAt)],
        ['created', day(a.createdAt)],
        ['notes', a.notes],
      ].filter(([, v]) => v != null && v !== '');
      const link = a.applyUrl ? `<dt>apply</dt><dd><a href="${esc(a.applyUrl)}" rel="noreferrer noopener">${esc(a.applyUrl)}</a></dd>` : '';
      box.innerHTML = `<dl>${fields.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}${link}</dl>`
        + mailBlock(mail);
    })
    .catch((err) => { box.textContent = `cannot read the record: ${err.message}`; });
}

function stats() {
  const total = apps.length;
  const withNext = pipeline.reduce((n, p) => n + (p.withNextAction || 0), 0);
  statsEl.textContent = total ? `· ${total} tracked · ${withNext} with a next action` : '';
}

function chips() {
  chipsEl.replaceChildren();
  const counts = new Map(pipeline.map((p) => [String(p.stage).toLowerCase(), p.applications]));
  const stages = [...ORDER.filter((s) => counts.has(s)), ...[...counts.keys()].filter((s) => !ORDER.includes(s))];
  const add = (name, n) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = `${name} ${n}`;
    b.setAttribute('aria-pressed', String(stage === name));
    b.addEventListener('click', () => { stage = name; chips(); render(); });
    chipsEl.append(b);
  };
  add('all', apps.length);
  for (const s of stages) add(s, counts.get(s));
}

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button.row');
  if (!btn) return;
  open = open === btn.dataset.id ? '' : btn.dataset.id;
  render();
});

qEl.addEventListener('input', () => { query = qEl.value; render(); });

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
  if (e.key === 'Escape') { qEl.value = ''; query = ''; open = ''; render(); qEl.blur(); }
});

Promise.all([
  getJSON('/api/applications?lim=500'),
  getJSON('/api/application-pipeline'),
])
  .then(([list, stages]) => {
    apps = list || [];
    pipeline = stages || [];
    stats();
    chips();
    render();
  })
  .catch((err) => {
    stateEl.innerHTML = `Cannot read the archive (${esc(err.message)}). `
      + 'The board proxies four read-only routes of the mail hub; '
      + 'check <code>npgsqlrest</code> and <code>nginx</code> on delphi.';
    listEl.append(stateEl);
  });
</script>
</body>
</html>
