version: "3"

vars:
  DRAGON_HOST: "ssh-dragoncourt.alwaysdata.net"
  DRAGON_USER: "dragoncourt"
  # ssh destination, not an ssh-config alias (Home Manager owns ~/.ssh/config).
  DRAGON_TARGET: "{{.DRAGON_USER}}@{{.DRAGON_HOST}}"
  DRAGON_DOMAIN: "dragoncourt.alwaysdata.net"
  DRAGON_WWW: "/home/dragoncourt/www"

tasks:
  dragoncourt:ssh:
    desc: Open interactive SSH shell into Alwaysdata host
    cmds:
      - ssh {{.DRAGON_TARGET}}

  dragoncourt:exec:
    desc: Run command on Alwaysdata via SSH (agent-friendly)
    cmds:
      - ssh {{.DRAGON_TARGET}} -- {{.CLI_ARGS}}

  dragoncourt:status:
    desc: Health check on Alwaysdata website (https://dragoncourt.alwaysdata.net)
    cmds:
      - |
        echo "=== HTTP Health Check (https://{{.DRAGON_DOMAIN}}) ==="
        curl -Is https://{{.DRAGON_DOMAIN}} | head -n 6
        echo ""
        echo "=== Disk & Home Directory Usage ==="
        ssh {{.DRAGON_TARGET}} "df -h /home/{{.DRAGON_USER}}"

  dragoncourt:build:
    desc: Rebuild static/Comrak templates in ~/www
    cmds:
      - |
        ssh {{.DRAGON_TARGET}} "
          if [ -f {{.DRAGON_WWW}}/build.sh ]; then
            cd {{.DRAGON_WWW}} && bash build.sh
            echo 'Build script executed successfully.'
          else
            echo 'No build.sh found in {{.DRAGON_WWW}}.'
          fi
        "

  dragoncourt:push:
    desc: Upload file to Alwaysdata (defaults to ~/www/)
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=$(echo "$ARGS" | awk '{print $1}')
        DEST=$(echo "$ARGS" | awk '{print $2}')
        if [ -z "$SRC" ]; then
          echo "Usage: task dragoncourt:push -- <local_file> [remote_dest]"
          echo "Example: task dragoncourt:push -- index.md www/home/"
          exit 1
        fi
        if [ -z "$DEST" ]; then
          DEST="www/"
        fi
        echo "Pushing $SRC -> {{.DRAGON_TARGET}}:$DEST ..."
        scp -r "$SRC" "{{.DRAGON_TARGET}}:$DEST"
        echo "Transfer complete."

  dragoncourt:pull:
    desc: Download file from Alwaysdata (e.g. task dragoncourt:pull -- www/index.php [dest])
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=$(echo "$ARGS" | awk '{print $1}')
        DEST=$(echo "$ARGS" | awk '{print $2}')
        if [ -z "$SRC" ]; then
          echo "Usage: task dragoncourt:pull -- <remote_file> [local_dest]"
          exit 1
        fi
        if [ -z "$DEST" ]; then
          DEST="."
        fi
        echo "Pulling {{.DRAGON_TARGET}}:$SRC -> $DEST ..."
        scp -r "{{.DRAGON_TARGET}}:$SRC" "$DEST"
        echo "Transfer complete."

  dragoncourt:info:
    desc: Query Alwaysdata Debian system info, PHP/Node/Go versions, and quota
    cmds:
      - |
        echo "=== System & OS ==="
        ssh {{.DRAGON_TARGET}} "uname -a; cat /etc/os-release | grep PRETTY_NAME"
        echo ""
        echo "=== Installed Runtimes ==="
        ssh {{.DRAGON_TARGET}} "php -v | head -n 1; node -v; python3 --version; go version 2>/dev/null || true"
        echo ""
        echo "=== Webroot Files (www/) ==="
        ssh {{.DRAGON_TARGET}} "ls -lh ~/www"

  # The API half of the same account: one token (`alwaysdatatoken` in
  # `modules/secrets.yaml`), read at call time by scripts/task/alwaysdata.sh and
  # never written to a file. GET is 250 rpm, a write 50 rpm.
  dragoncourt:api:
    desc: Raw Alwaysdata API call (CLI_ARGS="METHOD PATH [JQ]"; BODY= JSON, or - for stdin)
    cmds:
      - bash scripts/task/alwaysdata.sh {{.CLI_ARGS}}

  dragoncourt:api:account:
    desc: The account behind the token — name, product and period
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/account/ '.[] | [.name, .id, (.period // ""), (.product.href // "")] | @tsv'

  dragoncourt:sites:
    desc: Every site on the account — name, addresses, httpd, path
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/site/ '.[] | [.name, ((.addresses // []) | join(",")), (.httpd // ""), (.path // "")] | @tsv'

  dragoncourt:services:
    desc: The account's always-on services — name, ssh user, command, disabled
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/service/ '.[] | [.name, (.ssh_user.href // ""), (.command // ""), (.is_disabled | tostring)] | @tsv'

  dragoncourt:databases:
    desc: Databases on the account — name, type
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/database/ '.[] | [.name, (.type // "")] | @tsv'

  dragoncourt:mailboxes:
    desc: Mailboxes on the account — address, domain
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/mailbox/ '.[] | [.name, (.domain.href // "")] | @tsv'

  dragoncourt:ssh:users:
    desc: SSH users on the account — name, home, shell
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/ssh/ '.[] | [.name, (.home_directory // ""), (.shell // "")] | @tsv'

  dragoncourt:ftp:
    desc: FTP users on the account — name, path
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/ftp/ '.[] | [.name, (.path // "")] | @tsv'

  dragoncourt:subdomains:
    desc: Subdomains and their addresses
    cmds:
      - bash scripts/task/alwaysdata.sh GET /v1/subdomain/ '.[] | [.hostname, ((.ip_addresses // []) | map(tostring) | join(","))] | @tsv'

  dragoncourt:harden:
    desc: Enforce secure permissions on Alwaysdata (~/.ssh, ~/www, ~/.local/bin)
    cmds:
      - |
        ssh {{.DRAGON_TARGET}} "
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys 2>/dev/null || true
          chmod 750 ~/www
          chmod 750 ~/.local/bin 2>/dev/null || true
          echo '✅ Alwaysdata permissions hardened (SSH 700/600, www 750).'
        "

  dragoncourt:audit:
    desc: Comprehensive health and security audit of Alwaysdata host
    cmds:
      - |
        echo "=== 1. System & Uptime ==="
        ssh {{.DRAGON_TARGET}} "uname -a; uptime"
        echo ""
        echo "=== 2. Disk Quota & Usage ==="
        ssh {{.DRAGON_TARGET}} "df -h /home/{{.DRAGON_USER}}"
        echo ""
        echo "=== 3. Web Service HTTP Status ==="
        curl -Is https://{{.DRAGON_DOMAIN}} | head -n 8
        echo ""
        echo "=== 4. Permissions Audit ==="
        ssh {{.DRAGON_TARGET}} "ls -ld ~/.ssh ~/.ssh/* ~/www ~/.local/bin 2>/dev/null"

  dragoncourt:logs:
    desc: Tail live Apache HTTP access/error logs from ~/admin/logs/sites/
    cmds:
      - |
        ssh {{.DRAGON_TARGET}} "
          YEAR=\$(date +%Y)
          TODAY=\$(date +%Y-%m-%d)
          LOGFILE=~/admin/logs/sites/\$YEAR/sites-\$TODAY.log
          if [ -f \$LOGFILE ]; then
            tail -n 50 -f \$LOGFILE
          else
            tail -n 50 -f \$(ls -t ~/admin/logs/sites/\$YEAR/sites-*.log 2>/dev/null | head -n 1)
          fi
        "

  dragoncourt:backup:
    desc: Download compressed backup of Alwaysdata webroot (~/www)
    cmds:
      - |
        BACKUP_FILE="dragoncourt-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
        echo "Creating remote archive..."
        ssh {{.DRAGON_TARGET}} "tar -czf ~/$BACKUP_FILE --exclude='*.log' ~/www 2>/dev/null || true"
        echo "Downloading $BACKUP_FILE..."
        scp {{.DRAGON_TARGET}}:~/$BACKUP_FILE ./
        ssh {{.DRAGON_TARGET}} "rm -f ~/$BACKUP_FILE"
        echo "Backup saved locally to ./$BACKUP_FILE"

  dragoncourt:menu:
    desc: Interactive Charmbracelet Gum / Wish menu for Alwaysdata host
    cmds:
      - |
        action=$(printf '%s\n' \
          "ssh: Connect to Alwaysdata shell" \
          "status: Check https://{{.DRAGON_DOMAIN}} health" \
          "audit: Security, quota & permissions audit" \
          "harden: Enforce 700/600 permissions" \
          "logs: Tail live Apache HTTP logs" \
          "backup: Download full ~/www backup tarball" \
          "build: Run build.sh in ~/www" \
          "info: System info & runtimes" \
          "push: Upload file to Alwaysdata (www/)" \
          "pull: Download file from Alwaysdata" \
          "wishlist: Open Wishlist SSH directory" \
          "exit: Quit" | gum choose --header "🐉 Dragoncourt Alwaysdata Menu")

        case "$action" in
          "ssh"*)
            task dragoncourt:ssh
            ;;
          "status"*)
            task dragoncourt:status
            ;;
          "audit"*)
            task dragoncourt:audit
            ;;
          "harden"*)
            task dragoncourt:harden
            ;;
          "logs"*)
            task dragoncourt:logs
            ;;
          "backup"*)
            task dragoncourt:backup
            ;;
          "build"*)
            task dragoncourt:build
            ;;
          "info"*)
            task dragoncourt:info
            ;;
          "push"*)
            filepath=$(gum input --placeholder "Path to local file to upload:")
            if [ -n "$filepath" ]; then
              task dragoncourt:push -- "$filepath"
            fi
            ;;
          "pull"*)
            remotepath=$(gum input --placeholder "Path to remote file on Alwaysdata:")
            if [ -n "$remotepath" ]; then
              task dragoncourt:pull -- "$remotepath"
            fi
            ;;
          "wishlist"*)
            nix-shell -p wishlist --run wishlist
            ;;
          *)
            echo "Exited."
            ;;
        esac
