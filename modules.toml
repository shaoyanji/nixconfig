# ==============================================================================
# FLEET MODULAR CONTROL KNOB REGISTRY (modules.toml)
# ==============================================================================
# Canonical declarative registry for system roles, optional profiles, and services.
# Provides fast, native in-place updates via yq and the interactive TUI.
# ==============================================================================
[metadata]
title = "Fleet Modular Control Knob Registry"
description = "Declarative control knobs for optional profiles, services, and system roles across the fleet."
version = "1.0.0"
canonical_repo = "https://github.com/shaoyanji/nixconfig"
total_knobs = 14

# ------------------------------------------------------------------------------
# 1. OPTIONAL PROFILES
# ------------------------------------------------------------------------------
[knobs.ai]
name = "AI Agent Tooling"
type = "profile"
category = "ai"
option = "profiles.ai.enable"
path = "modules/global/noDE.nix"
description = "AI coding agent CLI tooling (mods, aichat, crush, freebuff, antigravity-cli)"
default = false
hosts = ["eisen", "poseidon", "fern", "stark", "scratch", "guckloch"]

[knobs.steam]
name = "Steam Gaming & Gamescope"
type = "profile"
category = "gaming"
option = "programs.steam.enable"
path = "modules/profiles/steam.nix"
description = "Steam client with gamescope session support and hardware controller udev rules"
default = false
hosts = ["eisen", "kellerbench", "deckstation", "ares"]

[knobs.nixbuild]
name = "nixbuild.net Remote Builder"
type = "profile"
category = "infrastructure"
option = "profiles.nixbuild-client.enable"
path = "modules/profiles/nixbuild-client.nix"
description = "Offloads heavy x86_64/aarch64 Nix compilations to nixbuild.net cloud builders"
default = false
hosts = ["frieren"]

[knobs.server-hardening]
name = "Server Hardening"
type = "profile"
category = "security"
option = "profiles.server-hardening.enable"
path = "modules/profiles/server-hardening.nix"
description = "Security baseline with journald caps, aggressive tmp cleanup, and audit logging"
default = false
hosts = ["frieren", "delphi"]

[knobs.hermes]
name = "Hermes Agent Gateway"
type = "profile"
category = "ai"
option = "profiles.hermes.enable"
path = "modules/profiles/hermes.nix"
description = "Autonomous Hermes agent environment and isolated runtime permissions"
default = false
hosts = ["frieren"]

[knobs.nas-client]
name = "NAS Client Mounts"
type = "profile"
category = "storage"
option = "profiles.nas-client.enable"
path = "modules/profiles/desktop-client.nix"
description = "Direct NFS and Samba mounts to frieren NAS data pools"
default = false
hosts = ["eisen", "poseidon", "fern", "kellerbench", "deckstation", "ares"]

[knobs.nvidia]
name = "NVIDIA Proprietary Drivers"
type = "profile"
category = "hardware"
option = "hardware.nvidia.modesetting.enable"
path = "modules/profiles/nvidia.nix"
description = "Proprietary NVIDIA graphics drivers (unfree, local builds on host)"
default = false
hosts = ["stark", "kellerbench"]

[knobs.dell-dock]
name = "Dell D6000 Docking Station"
type = "profile"
category = "hardware"
option = "profiles.dell-dock.enable"
path = "modules/profiles/dell-dock.nix"
description = "Dell D6000 Universal Dock (DisplayLink / EVDI drivers, USB autosuspend prevention, udev rules)"
default = false
hosts = ["frieren", "fern"]

[knobs.dwl-desktop]
name = "dwl Desktop Session"
type = "profile"
category = "desktop"
option = "profiles.dwlDesktop.enable"
path = "modules/profiles/dwl-desktop.nix"
description = "Suckless Wayland session shared by the smallest desktops: dwl with the fleet keymap, fleet-menu launcher, waybar, foot, swaybg and waylock"
default = false
hosts = ["scratch", "netbook"]

[knobs.impermanence]
name = "Impermanence Root Rollback"
type = "profile"
category = "system"
option = "environment.persistence.enable"
path = "modules/profiles/impermanence.nix"
description = "Erase-your-darlings root filesystem rollback on every boot"
default = false
hosts = ["ares", "garnixMachine"]

# ------------------------------------------------------------------------------
# 2. SYSTEM SERVICES
# ------------------------------------------------------------------------------
[knobs.harmonia]
name = "Harmonia LAN Binary Cache"
type = "service"
category = "infrastructure"
option = "services.harmonia.enable"
path = "modules/services/harmonia.nix"
description = "Serves local nix store closures over HTTP (:5000) for zero-latency LAN caching"
default = false
hosts = ["frieren"]

[knobs.home-assistant]
name = "Home Assistant & Mosquitto"
type = "service"
category = "iot"
option = "services.home-assistant.enable"
path = "modules/services/home-assistant.nix"
description = "Home Assistant Core IoT dashboard (:8123) with Mosquitto MQTT message broker"
default = false
hosts = ["frieren"]

[knobs.kiwix]
name = "Kiwix Offline Wikipedia"
type = "service"
category = "knowledge"
option = "services.kiwix-serve.enable"
path = "modules/services/kiwix.nix"
description = "Declarative Kiwix offline Wikipedia / ArchWiki server (:8088)"
default = false
hosts = ["frieren"]

[knobs.aria2]
name = "Aria2 RPC Download Daemon"
type = "service"
category = "downloads"
option = "services.aria2-daemon.enable"
path = "modules/services/aria2-daemon.nix"
description = "Headless aria2 RPC daemon (:6801) with AriaNg web UI frontend"
default = false
hosts = ["frieren"]
