version: "3"

vars:
  APPS_DIR: "/srv/data/projects/antigravity-application-workflow"
  APPS_BIN: "{{.APPS_DIR}}/bin/appflow"
  APPS_DATA: "{{.APPS_DIR}}/data/applications.json"
  # uv is configured with downloads=never on this fleet and python3 is not
  # on the base PATH, so uv-backed appflow commands run inside a python3
  # nix-shell (same pattern as taskfiles/bountystash.yml).
  APPS_RUN: "nix-shell -p python3 --run"

tasks:
  apps:list:
    desc: List tracked job applications
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} list {{.CLI_ARGS}}\""

  apps:search:
    desc: Search applications by company, role, ID, or keywords
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} search {{.CLI_ARGS}}\""

  apps:get:
    desc: View full details of one application record
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} get {{.CLI_ARGS}}\""

  apps:update:
    desc: Update application status or notes (e.g. task apps:update -- <id> --status Applied)
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} update {{.CLI_ARGS}}\""

  apps:overview:
    desc: Pipeline summary - coarse stage counts (Applied, Rejected, Interview, ...)
    cmds:
      - |
        jq -r '
          def stage:
            if test("Interview|Trial|Warteliste") then "Interview/Pending"
            elif test("^Rejected") then "Rejected"
            elif test("^Applied") then "Applied"
            elif test("^Lead|Rezi") then "Lead"
            elif test("Screening|Follow-up Required") then "Screening"
            elif test("Draft|packet|Packet|JD") then "Prep"
            else "Other" end;
          group_by(.status | stage)[] | "\(.[0].status | stage)\t\(length)"
        ' "{{.APPS_DATA}}" | sort

  apps:emails:
    desc: Run inbound Himalaya email radar and sync application statuses
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} emails {{.CLI_ARGS}}\""

  apps:followups:
    desc: View drafted recruiter follow-up notes (--copy <id> for clipboard)
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} followups {{.CLI_ARGS}}\""

  apps:build:
    desc: Compile Typst resumes/cover letters to dist/ (no args = --all)
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} build {{.CLI_ARGS}}\""

  apps:audit:
    desc: QA layout, page budget, and orphan line audit on dist/
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} audit\""

  apps:query:
    desc: Read-only SQL against applications.db (e.g. task apps:query -- "select ...")
    cmds:
      - "{{.APPS_BIN}} query {{.CLI_ARGS}}"

  apps:sync:status:
    desc: Check JSON <-> SQLite <-> GitHub synchronization state
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} status\""

  apps:sync:push:
    desc: Reconcile JSON (source of truth) into DB/CSV, commit data, push to GitHub
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} push\""

  apps:sync:pull:
    desc: Pull remote application changes from GitHub and reconcile locally
    cmds:
      - "{{.APPS_RUN}} \"{{.APPS_BIN}} pull\""

  apps:git:status:
    desc: Raw git status of the antigravity-application-workflow checkout
    cmds:
      - git -C "{{.APPS_DIR}}" status -sb

  # The text behind an application: the job description, a note that outgrew the
  # row. `import` reads $APPFLOW_JD_DIR (~/.config/appflow/jd) where those files
  # live today; a re-run skips a description whose bytes are already stored.
  apps:docs:import:
    desc: Import JD text files into the database (DIR= to override, DRY=1 to preview)
    cmds:
      - bash scripts/task/appflow-docs.sh import {{.CLI_ARGS}}

  apps:docs:
    desc: List the text the database holds, without bodies
    cmds:
      - bash scripts/task/appflow-docs.sh list

  apps:docs:show:
    desc: Print one application's stored text (task apps:docs:show -- <id> [kind])
    cmds:
      - bash scripts/task/appflow-docs.sh show {{.CLI_ARGS}}

  # The other half of the deletion gate: a packet whose description came from
  # the database, not from `$APPFLOW_CONFIG/jd`. A task because building one is a
  # nix build; `checks:appflow:gate` is the read-only half.
  apps:gate:packet:
    desc: Build a packet from the database's own text (task apps:gate:packet -- <id>)
    cmds:
      - bash scripts/task/appflow-gate.sh packet {{.CLI_ARGS}}

  # The career corpus is the database's now: the JSON Resume files are exports,
  # so a role is added here and the artifact is rebuilt from the rows. `set`
  # changes only the flags it is given; `rm` needs --yes because prose does not
  # come back. Flags go through CLI_ARGS (`task career:add:role -- --employer …`).
  career:roles:
    desc: The roles in CV order (CLI_ARGS="--language de --json" to narrow)
    cmds:
      - bash scripts/task/career.sh roles {{.CLI_ARGS}}

  career:projects:
    desc: The projects in CV order
    cmds:
      - bash scripts/task/career.sh projects {{.CLI_ARGS}}

  career:show:
    desc: One role or project, every field (task career:show -- role ID)
    cmds:
      - bash scripts/task/career.sh show {{.CLI_ARGS}}

  career:add:role:
    desc: Add a role (--employer and --position required, --highlight repeatable)
    cmds:
      - bash scripts/task/career.sh add-role {{.CLI_ARGS}}

  career:add:project:
    desc: Add a project (--name required, --resume-name on the German row)
    cmds:
      - bash scripts/task/career.sh add-project {{.CLI_ARGS}}

  career:set:role:
    desc: Edit one role; only the flags given change (task career:set:role -- ID --position …)
    cmds:
      - bash scripts/task/career.sh set-role {{.CLI_ARGS}}

  career:set:project:
    desc: Edit one project; only the flags given change
    cmds:
      - bash scripts/task/career.sh set-project {{.CLI_ARGS}}

  career:rm:role:
    desc: Delete one role (--yes required)
    cmds:
      - bash scripts/task/career.sh rm-role {{.CLI_ARGS}}

  career:rm:project:
    desc: Delete one project (--yes required)
    cmds:
      - bash scripts/task/career.sh rm-project {{.CLI_ARGS}}

  career:import:
    desc: Seed the rows from a JSON Resume (FROM=file; CLI_ARGS="--language de --dry")
    cmds:
      - bash scripts/task/career.sh import --from "{{.FROM | default "lib/matt/resume.json"}}" {{.CLI_ARGS}}

  career:export:en:
    desc: Rebuild lib/matt/resume.json's work and projects from the rows
    cmds:
      - bash scripts/task/career.sh export --into lib/matt/resume.json

  career:export:de:
    desc: Rebuild lib/matt/lebenslauf.json's work and projects from the German rows
    cmds:
      - bash scripts/task/career.sh export --into lib/matt/lebenslauf.json --language de

  career:export:
    desc: Rebuild one JSON Resume from the rows (INTO=file; CLI_ARGS="--language de --out x")
    cmds:
      - bash scripts/task/career.sh export --into "{{.INTO}}" {{.CLI_ARGS}}

  # The private half of the personal data. Published sites build only what the
  # page renders; a phone number or a referee lives sops-encrypted and reaches a
  # document here, at runtime, never through a site build.
  apps:pii:sync:
    desc: Decrypt the private personal data (modules/secrets/pii.yaml) to ~/.config/appflow/pii.json
    cmds:
      - bash scripts/task/pii.sh sync

  apps:menu:
    desc: Interactive Charmbracelet Gum menu for the job application workflow
    cmds:
      - |
        action=$(printf '%s\n' \
          "list: List tracked applications" \
          "search: Search by company, role, ID, or keywords" \
          "get: View one application record" \
          "update: Update application status or notes" \
          "overview: Pipeline counts per status" \
          "emails: Inbound email radar + status sync" \
          "followups: Recruiter follow-up notes" \
          "build: Compile Typst documents to dist/" \
          "audit: QA layout and page budget" \
          "sync:status: JSON <-> DB <-> GitHub sync state" \
          "sync:push: Reconcile + commit + push data" \
          "sync:pull: Pull remote changes" \
          "git:status: Raw git status" \
          "exit: Quit" | gum choose --header "Job Applications (appflow)")

        case "$action" in
          "list"*)
            task apps:list
            ;;
          "search"*)
            task apps:search -- "$(gum input --placeholder 'search query')"
            ;;
          "get"*)
            task apps:get -- "$(gum input --placeholder 'application id')"
            ;;
          "update"*)
            task apps:update -- "$(gum input --placeholder 'id --status Applied')"
            ;;
          "overview"*)
            task apps:overview
            ;;
          "emails"*)
            task apps:emails
            ;;
          "followups"*)
            task apps:followups
            ;;
          "build"*)
            task apps:build
            ;;
          "audit"*)
            task apps:audit
            ;;
          "sync:status"*)
            task apps:sync:status
            ;;
          "sync:push"*)
            task apps:sync:push
            ;;
          "sync:pull"*)
            task apps:sync:pull
            ;;
          "git:status"*)
            task apps:git:status
            ;;
          *)
            echo "Exited."
            ;;
        esac
