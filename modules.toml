[knobs.role-minimal]
name = "Minimal Server Role"
type = "role"
category = "roles"
option = "roles.minimal.enable"
path = "modules/roles/minimal.nix"
description = "Headless server role without desktop environments or heavy AI CLI tools"
default = false
hosts = ["delphi", "garnixMachine", "minyx", "kali", "alarm"]
