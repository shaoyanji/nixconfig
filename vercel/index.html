<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fleet status</title>
<style>
  :root { color-scheme: dark; --bg:#11111b; --panel:#1e1e2e; --text:#cdd6f4; --muted:#6c7086;
          --ok:#a6e3a1; --bad:#f38ba8; --accent:#89b4fa; }
  * { box-sizing: border-box; }
  body { margin:0; padding:2rem; background:var(--bg); color:var(--text);
         font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { font-size:1.1rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(14rem,1fr)); max-width:72rem; }
  .card { background:var(--panel); border-radius:1rem; padding:1rem 1.25rem;
          box-shadow:0 0.5rem 1.5rem rgba(0,0,0,.35); }
  .state { font-size:1.5rem; font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .k { color:var(--muted); font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; }
  .v { font-size:1.1rem; margin-top:.2rem; }
  a { color:var(--accent); text-decoration:none; }
  footer { margin-top:1.5rem; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<h1>fleet status · public surfaces</h1>
<div class="grid" id="grid"><div class="card"><div class="k">state</div><div class="state">loading…</div></div></div>
<footer>probed live at request time · <a href="/ops">ops</a> (gated) ·
  source: <a href="https://github.com/shaoyanji/nixconfig">nixconfig</a></footer>
<script>
fetch('/api/check', {cache:'no-store'}).then(r => r.json()).then(({rows}) => {
  document.getElementById('grid').innerHTML = rows.map(r => `
    <div class="card"><div class="k">${r.id}</div>
      <div class="state ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'up' : 'down'}</div>
      <div class="v"><a href="${r.url}">${r.label}</a></div>
      <div class="k">http ${r.status || '—'} · ${r.ms} ms</div></div>`).join('');
}).catch(() => {
  document.getElementById('grid').innerHTML =
    `<div class="card"><div class="k">state</div><div class="state bad">probe unreachable</div></div>`;
});
</script>
</body>
</html>
