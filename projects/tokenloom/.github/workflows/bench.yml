# The gate's verdict, on a schedule.
#
# `bench-sweep.sh` runs the socket bench at three window widths and on a 40 k
# document, and compares each verdict with the table README.md publishes. A shared
# runner moves the milliseconds; it should not move the verdict. When it does,
# this job fails with the p99 beside it, because a gate whose answer changed is a
# fact to look at rather than one to re-read in prose.
#
# The table came from a four-core box, so the core count is printed, carried in
# every row and written into `bench-sweep.json`. Below four cores the script
# reports the verdicts as advisory and does not fail: that run measured the
# runner. Public-repository runners have four vCPUs, which is why they are the
# comparison and not a stand-in for it.
name: bench

on:
  schedule:
    # Mondays, 05:23 UTC — off the hour, so not in every other cron's thundering herd.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The runner's rustup is the toolchain; no action and no cache to keep
      # green, because the build here is one crate graph and a minute.
      - name: toolchain
        run: rustup default stable && cargo --version
      - name: machine
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          uname -sr
      - name: build
        run: cargo build --release --locked
      - name: sweep
        env:
          SWEEP_JSON: bench-sweep.json
        run: bash scripts/bench-sweep.sh
      - name: record
        if: always()
        run: cat bench-sweep.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-sweep
          path: bench-sweep.json
          if-no-files-found: warn
