version: "3"

tasks:
  dev:git:quick-push:
    desc: Commit/push config updates quickly using AI-generated commit messages
    cmds:
      - |
        if ! git diff --quiet || ! git diff --cached --quiet; then
          git add -u
          gmc -a --yes
          bash scripts/task/git-push.sh
        else
          echo "No changes to commit"
        fi

  dev:git:quick-push-safe:
    desc: Commit/push with automatic stash handling using AI-generated commit messages
    cmds:
      - |
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "Stashing uncommitted changes..."
          git stash push -m "auto-stash before quick-push"
        fi
      - |
        if ! git diff --cached --quiet; then
          gmc -a --yes
          bash scripts/task/git-push.sh
        else
          echo "No changes to commit"
        fi
      - |
        if git stash list | grep -q "auto-stash before quick-push"; then
          echo "Restoring stashed changes..."
          git stash pop
        fi

  dev:git:build-push:
    desc: Commit tracked changes after a successful build using AI-generated commit messages
    cmds:
      - |
        if ! git diff --quiet || ! git diff --cached --quiet; then
          git add -u
          gmc -a -c "Successful build on $(uname -a)" --yes
        else
          echo "No changes to commit"
        fi

  dev:git:ai-commit:
    desc: Stage all tracked changes and generate AI commit message (interactive)
    cmds:
      - git add -u
      - gmc -a

  dev:git:ai-commit-push:
    desc: Stage all tracked changes, generate AI commit message, and push
    cmds:
      - git add -u
      - gmc -a --yes
      - bash scripts/task/git-push.sh

  dev:git:quick-pull:
    desc: Pull, then move the private secrets submodule and re-attach it to master
    summary: >
      `submodule.recurse` is off fleet-wide, so a plain `git pull` leaves
      `modules/secrets` alone — which is the point: a recursive fetch aborts the
      whole parent pull on a host without the private ssh key (exit 1, nothing
      pulled). This pulls the superproject fast-forward only, moves the submodule
      to the pin, then puts its checkout back on `master` instead of the detached
      HEAD that `git submodule update` always produces. A submodule that cannot
      be fetched leaves the superproject pull intact and says so. Exit 1 only when
      the superproject itself could not fast-forward.
    cmds:
      - |
        set -uo pipefail
        git pull --ff-only --no-recurse-submodules || { echo "quick-pull: superproject did not pull — git's own error is above; the submodule was not moved" >&2; exit 1; }

        sub=modules/secrets
        [ -e "$sub/.git" ] || { echo "quick-pull: $sub not initialized — skipped"; exit 0; }

        if ! git submodule update --init "$sub"; then
          echo "quick-pull: $sub could not be fetched (private remote, no key?) — superproject is pulled, submodule left as it was" >&2
          exit 0
        fi

        # The pin is a commit, so the checkout is detached. Attach the branch
        # `.gitmodules` names WITHOUT moving the worktree. `git switch` is wrong
        # here: it jumps to the branch tip, and the tip is not the pin whenever
        # the submodule holds commits the superproject has not pointed at yet.
        # Measured the hard way — a local `master` one commit ahead turned the
        # parent gitlink dirty and made this task the thing it was fixing.
        branch="$(git config -f .gitmodules --get "submodule.$sub.branch" || echo master)"
        head="$(git -C "$sub" rev-parse HEAD)"
        if git -C "$sub" symbolic-ref -q HEAD >/dev/null; then
          echo "quick-pull: $sub already on $(git -C "$sub" branch --show-current)"
        else
          tip="$(git -C "$sub" rev-parse --verify -q "refs/heads/$branch" || true)"
          if [ -z "$tip" ] || git -C "$sub" merge-base --is-ancestor "$tip" "$head" 2>/dev/null; then
            # Missing or BEHIND the pin: moving the branch pointer to the pin is a
            # fast-forward, so no commit can be lost. A stale local branch is the
            # common case — `git switch` on it would move the worktree BACKWARDS.
            git -C "$sub" update-ref "refs/heads/$branch" "$head"
            git -C "$sub" symbolic-ref HEAD "refs/heads/$branch"
            echo "quick-pull: $sub attached to $branch at the pin (${head:0:7}, branch was ${tip:0:7})"
          else
            echo "quick-pull: $sub left DETACHED — $branch ${tip:0:7} and the pin ${head:0:7} diverge," >&2
            echo "            so $branch holds commits the superproject does not point at; push them and bump the pin" >&2
          fi
        fi

        git submodule status

  dev:git:stage:
    desc: Stage tracked changes and warn on .sops.yaml recipient drift
    cmds:
      - git add -u  # Only stage tracked files, not new untracked files
      - |
        if git diff --cached --name-only | grep -q '^\.sops\.yaml$'; then
          echo "Notice: .sops.yaml is staged. Checking for recipient drift..."
          if ! bash scripts/task/sops-drift-check.sh --repo-only >/dev/null 2>&1; then
            echo -e "\033[1;33mWARNING: SOPS recipient drift detected! You modified .sops.yaml without re-keying.\033[0m"
            echo -e "\033[1;33mRun 'task infra:sops:update-keys' to update recipients across all files before pushing.\033[0m"
          fi
        fi

  dev:git:status:
    desc: Show detailed git status including stashed changes
    cmds:
      - echo "=== Current Branch ===" && git branch --show-current
      - echo -e "\n=== Working Tree Status ===" && git status --short
      - echo -e "\n=== Stashed Changes ===" && git stash list

  dev:git:stash-push:
    desc: Stash current changes with a message
    cmds:
      - git stash push -m "auto-stash before operation"

  dev:git:stash-pop:
    desc: Pop most recent stash
    cmds:
      - git stash pop

  dev:vim:sync:
    desc: Deploy canonical modules/config/vimrc to serv00, dragoncourt, and envs
    cmds:
      - |
        # Transport goes through each shard's push/exec, which own the connection
        # details (user@host, non-22 ports). A bare hostname here resolved only
        # while a hand-written ~/.ssh/config alias existed.
        for host in serv00 dragoncourt envs; do
          echo "Syncing vimrc to $host..."
          task "$host:push" -- modules/config/vimrc .vimrc
          task "$host:exec" -- 'mkdir -p ~/.vim/undo && chmod 700 ~/.vim ~/.vim/undo && chmod 644 ~/.vimrc'
        done
        echo "✅ Unified vimrc deployed to all 3 remotes."

  dev:site:list:
    desc: List site deployment targets from manifest
    cmds:
      - ./scripts/task/site-target.sh list

  dev:site:show:*:
    desc: Show manifest metadata for a site target
    vars:
      TARGET: '{{index .MATCH 0}}'
    cmds:
      - ./scripts/task/site-target.sh show {{.TARGET}}

  dev:site:build:*:
    desc: Build a site target from manifest
    vars:
      TARGET: '{{index .MATCH 0}}'
    cmds:
      - ./scripts/task/site-target.sh build {{.TARGET}}

  dev:site:preview:*:
    desc: Preview a site target from manifest
    vars:
      TARGET: '{{index .MATCH 0}}'
    cmds:
      - ./scripts/task/site-target.sh preview {{.TARGET}}

  dev:site:deploy:*:
    desc: Deploy a site target from manifest
    vars:
      TARGET: '{{index .MATCH 0}}'
    cmds:
      - ./scripts/task/site-target.sh deploy {{.TARGET}}

  dev:site:build:
    desc: Build the default site target from manifest
    cmds:
      - ./scripts/task/site-target.sh build

  dev:site:preview:
    desc: Preview the default site target from manifest
    cmds:
      - ./scripts/task/site-target.sh preview

  dev:site:deploy:
    desc: Deploy the default site target from manifest
    cmds:
      - ./scripts/task/site-target.sh deploy

  dev:flake:update-branch:
    desc: "[destructive] Create/reset update branch and force-push flake.lock update (fetches main first)"
    cmds:
      - |
        # Ensure we're on main and up to date
        git switch main 2>/dev/null || git checkout main
        git pull --rebase origin main
      - |
        # Check if update branch exists remotely
        if git fetch origin update 2>/dev/null; then
          echo "Warning: Remote update branch exists, will be overwritten"
        fi
      - git branch -D update || true
      - git switch -c update
      - nix flake update
      - task dev:flake:update-garnix
      - git add flake.lock garnix.yaml
      - gmc -c "flake update and garnix sync" --yes
      - git push -f origin update
      - git switch main

  dev:flake:merge-update:
    desc: "[destructive] Merge update branch into main, push result, and delete branch"
    cmds:
      - |
        # Validate update branch exists
        if ! git show-ref --verify --quiet refs/heads/update; then
          echo "Error: update branch does not exist locally"
          exit 1
        fi
      - git switch main
      - git pull --rebase origin main
      - |
        # Merge with explicit message
        if git merge update --no-ff -m "Merge flake updates from update branch"; then
          echo "Merge successful"
        else
          echo "Error: Merge failed - resolve conflicts manually"
          exit 1
        fi
      - bash scripts/task/git-push.sh origin main
      - git branch -d update
      - echo "Update branch merged and deleted"

  dev:flake:update-complete:
    desc: "[destructive] Complete flake update workflow: create branch, update, merge to main, push (all in one)"
    cmds:
      - |
        # Ensure we're on main and up to date
        git switch main 2>/dev/null || git checkout main
        git pull --rebase origin main
      - |
        # Check for uncommitted changes
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "Error: Working tree has uncommitted changes"
          echo "Commit or stash them first, or use dev:git:stash-push"
          exit 1
        fi
      - |
        # Check if update branch exists remotely
        if git fetch origin update 2>/dev/null; then
          echo "Warning: Remote update branch exists, will be overwritten"
          read -p "Continue? (y/N) " -n 1 -r
          echo
          if [[ ! $REPLY =~ ^[Yy]$ ]]; then
            echo "Aborted"
            exit 1
          fi
        fi
      - git branch -D update || true
      - git switch -c update
      - nix flake update
      - task dev:flake:update-garnix
      - git add flake.lock garnix.yaml
      - gmc -c "flake update and garnix sync" --yes
      - git push -f origin update
      - git switch main
      - git pull --rebase origin main
      - |
        # Merge with explicit message
        if git merge update --no-ff -m "Merge flake updates from update branch"; then
          echo "Merge successful"
        else
          echo "Error: Merge failed - resolve conflicts manually"
          exit 1
        fi
      - bash scripts/task/git-push.sh origin main
      - git branch -d update
      - echo "Flake update completed successfully"

  dev:flake:update:bountystash:
    desc: Update only the bountystash flake input
    cmds:
      - nix flake update bountystash

  dev:flake:update-transitive:
    desc: "[destructive] Update transitive flake inputs a root 'nix flake update' misses (branch-following pins like impermanence/nixpkgs, dms/dank-qml-common)"
    cmds:
      - bash scripts/task/flake-transitive-sweep.sh update

  dev:toon:fix:
    desc: Recompute every TOON array length from the rows actually present
    summary: >
      The `[n]` in `items[12]{id,name}:` is a row count, and a hand-written TOON
      document miscounts it; strict decode then refuses the file. This decodes
      loosely, re-encodes, and writes the result back, so the length is counted
      rather than trusted. Prints the declared-vs-counted headers it changed.
      FILES="a.toon b.toon" for files, or pipe TOON on stdin with no FILES.
      Exit 0 = repaired or already correct; 1 = not a TOON document.
    # go-task vars are templated, not exported to the shell: `${FILES:-}` would
    # silently read stdin instead of the named files. Use the template form.
    cmds:
      - bash scripts/task/toon-fix.sh {{.FILES | default ""}}

  dev:toon:
    desc: Encode JSON from stdin as TOON (the agent-facing projection)
    summary: >
      AGENTS.md rule: an agent reads TOON, not JSON. Pipe any command that
      emits JSON into this instead of showing the raw document. --stats prints
      the measured saving, which is not always positive: nested records can
      grow (inventory.hosts measured -1.6 %), flat rows shrink (task list +15 %).
      Example: nix eval --json .?submodules=1#inventory.hosts | task dev:toon
    cmds:
      - toon -e --stats

  dev:qmd:refresh:
    desc: (Re)index markdown docs (nixconfig repo and personal vault) into local qmd collections
    cmds:
      - bash scripts/task/qmd-docs-index.sh ensure all

  dev:qmd:vault:refresh:
    desc: (Re)index personal Obsidian vault into the local qmd collection
    cmds:
      - bash scripts/task/qmd-docs-index.sh ensure vault

  dev:qmd:docs:refresh:
    desc: (Re)index this repo's markdown docs into the local qmd collection
    cmds:
      - bash scripts/task/qmd-docs-index.sh ensure nixconfig

  dev:qmd:blog:refresh:
    desc: (Re)index the published blog (shaoyanji.is-a.dev) into the local qmd collection
    cmds:
      - bash scripts/task/qmd-docs-index.sh ensure blog

  dev:blog:draft:
    desc: "Scaffold ideas/<slug>.md from the knowledge graph, citations attached"
    summary: >
      Walks the compiled graph two hops out from whatever node matches TOPIC and
      writes a draft whose frontmatter names those entities, so the draft is a
      node with edges the moment it exists (ops:kg:blast / ops:kg:host answer
      for it). Hop 1 is the obvious citation; hop 2 is the page that shares a
      host or a skill without linking to it, which is where disagreement lives.
      Free text in TOPIC, no vault/qmd search (delphi carries no qmd — the
      skeleton prints the two follow-up queries instead). Refuses to overwrite
      an existing slug. FLAGS=--force replaces it.
    cmds:
      - bash scripts/task/blog-draft.sh "{{.TOPIC}}" {{.FLAGS}}

  dev:blog:export:
    desc: "Publish ideas/<slug>.md as a Jekyll post in the blog repo (never commits)"
    summary: >
      Converts a finished draft into the blog's own post front matter (layout,
      title, date, author, categories: [Blog], tags) and copies the body into
      BLOG_REPO/_posts/YYYY-MM-DD-<slug>.md. Default checkout is
      ~/Documents/shaoyanji.is-a.dev; BLOG_REPO= points it elsewhere and
      BLOG_AUTHOR= overrides the blog's `matt` default. It writes and stops: no
      commit, no push, because that repo's CI deploys on push and publication
      must stay an operator decision. Exit 2 when the checkout or the target
      post is missing/already there (FLAGS=--force to replace).
    cmds:
      - bash scripts/task/blog-export.sh "{{.SLUG}}" {{.FLAGS}}

  dev:blog:mataroa:
    desc: "The mataroa console's ledger: local markdown files against the blog (TOON; FORMAT=text, CONSOLE=url)"
    summary: >
      Reads /api/state from the console and prints one row per post with the
      state that matters: in-sync, differs, local-only, remote-only. The console
      is loopback on delphi (:8095) and proxied on the tailnet (:8454), so
      CONSOLE= picks the address and defaults to the tailnet mount, which works
      from any host on the tailnet. Read-only: it starts nothing, writes nothing,
      and spends no build budget. Exit 0 = the console answered, 1 = it did not
      (a down unit, or this host is not on the tailnet).
    vars:
      CONSOLE: '{{.CONSOLE | default "https://delphi.cloudforest-kardashev.ts.net:8454"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        if ! state="$(curl -fsS --max-time 20 "{{.CONSOLE}}/api/state")"; then
          echo "mataroa: no answer from {{.CONSOLE}} — the unit runs on delphi (mataroa-console.service), and the mount is tailnet-only" >&2
          exit 1
        fi
        case "{{.FORMAT}}" in
          json) printf '%s\n' "$state" ;;
          text) printf '%s' "$state" | jq -r '.posts[] | "\(.state)\t\(.published_at // "draft")\t\(.slug)"' ;;
          *) printf '%s' "$state" | toon -e ;;
        esac

  dev:qmd:sync:eisen:
    desc: Offload and synchronize QMD vector embeddings to Eisen via Wake-on-LAN
    summary: >
      Deterministic monthly offload pipeline: wakes Eisen via WoL magic packet,
      updates local lexical indices on Frieren, pushes index.sqlite to Eisen NVMe,
      runs multi-threaded qmd embed on Eisen's 12-core Xeon, and pulls the updated
      vector database and model weights back to Frieren.
    cmds:
      - bash scripts/task/qmd-eisen-embed-sync.sh {{.CLI_ARGS}}

  dev:inventory:menu:
    desc: Interactive Charmbracelet Gum TUI for fleet inventory.toml management (yq-backed)
    cmds:
      - bash scripts/task/inventory-menu.sh

  dev:inventory:sync:
    desc: Refresh the generated docs and the host-home AGENTS.md after an inventory edit
    summary: >
      Two owners: lib/home-agents.nix owns ~/AGENTS.md (a store symlink) and
      lib/docs.nix owns every generated page, including the fleet matrix and one
      page per host — they exist only as a store path, so that step is a print.
      The repo AGENTS.md is hand-written routing and no step rewrites it.
      `#artifacts.docs` is in both architectures' package set, so the docs step runs
      everywhere the repo is checked out.
      Exit 0 = the symlink is refreshed and the docs path is printed.
    cmds:
      - task dev:inventory:home-agents
      - task docs:build

  dev:inventory:counts:
    desc: Recompute inventory.toml's derived [metadata] counts from .hosts
    summary: >
      The fix the inventory-schema gate names when a host changes status. It runs
      the same yq expression the inventory TUI uses (yq -i over inventory.toml),
      non-interactively, because that menu item used to be the ONLY writer of
      these counts — so the gate's advice pointed at dev:inventory:sync, which
      never touches inventory.toml, and stayed red until someone drove the TUI by
      hand. Run after any status/kind change, then re-run the gate. Exit 0 =
      counts rewritten; 1 = yq missing.
    cmds:
      - bash scripts/task/inventory-menu.sh --counts

  dev:inventory:llm:
    desc: Print the compiled host page for one host (HOST=name, default frieren)
    summary: >
      The card an agent is handed for a single host: facts, network, persona and
      the constraints it may not break. It is `docs/generated/hosts/<host>.md`
      inside `.#artifacts.docs`, so it cannot disagree with inventory.toml. Builds
      with `--builders ""` (no remote budget) and prints the page.
      Exit 0 = printed; 1 = no such host or the build failed.
    cmds:
      - |
        out=$(nix build --builders "" --no-link --print-out-paths ".?submodules=1#artifacts.docs") || exit 1
        page="$out/docs/generated/hosts/{{.HOST | default "frieren"}}.md"
        [ -f "$page" ] || { echo "dev:inventory:llm: no host '{{.HOST | default "frieren"}}' in inventory.toml" >&2; exit 1; }
        cat "$page"

  dev:inventory:home-agents:
    desc: Materialize the Nix-generated ~/AGENTS.md for HOST (default this host)
    summary: >
      Symlinks the flake output `.#homeAgents.<host>` (lib/home-agents.nix) to
      ~/AGENTS.md. HOST defaults to /etc/hostname. The content is the fleet
      preamble + compiled inventory card + persona; no Python, no second TOML
      parser. The artifact is `builtins.toFile` (pure text, no builder), so it
      is architecture-independent and costs no build budget — `nix eval --raw`
      is the correct read, `nix build` would reject a non-derivation.
    cmds:
      - |
        HOST="{{.HOST}}"
        if [ -z "$HOST" ]; then
          HOST="$(cat /etc/hostname 2>/dev/null || true)"
          HOST="${HOST%%.*}"
        fi
        if [ -z "$HOST" ]; then
          echo "HOST= is required (no /etc/hostname on this machine)"
          exit 1
        fi
        p="$(nix eval --raw ".#homeAgents.$HOST")"
        ln -sfn "$p" "$HOME/AGENTS.md"
        echo "~/AGENTS.md -> $p"

  dev:inventory:json:
    desc: Print the compiled inventory as pretty JSON (schema-checked, derived counts)
    summary: >
      Builds packages.<system>.inventory-json from the single parse in lib/inventory.nix.
      Consume THIS rather than re-parsing inventory.toml with yq: it is already validated,
      defaults-normalised, and carries the derived counts, so no consumer can disagree
      with another. Store-cached — repeat calls cost nothing.
    cmds:
      - nix build --no-link --print-out-paths .?submodules=1#packages.x86_64-linux.inventory-json | xargs cat

  dev:inventory:feed:
    desc: Print the compiled agent feed for every Nix host
    summary: >
      Builds packages.<system>.fleet-feed: role, status, persona hint, compute tier,
      hardware, traits, key services and notes for every Nix host, generated from the
      compiled registry. This is where host commentary is meant to live (inventory.toml
      `notes`) instead of as comments in Nix.
    cmds:
      - nix build --no-link --print-out-paths .?submodules=1#packages.x86_64-linux.fleet-feed | xargs cat

  dev:inventory:host:
    desc: Print one host's compiled inventory record (HOST=name)
    summary: >
      Reads self.inventory — parsed once at flake level — so this evaluates NO host
      configuration. The fast path for scripts that today shell out to `yq`. Fails
      loudly on an unknown host rather than printing null.
    cmds:
      - nix eval --json .?submodules=1#inventory.hosts.{{.HOST | default "frieren"}}

  dev:modules:menu:
    desc: Interactive Charmbracelet Gum TUI for fleet modules.toml control knobs (yq-backed)
    cmds:
      - bash scripts/task/modules-menu.sh

  dev:modules:sync:
    desc: Build the generated modules registry (delegates to `task docs:build`)
    summary: >
      The knob table is not produced by modules-menu.sh: lib/docs.nix builds it
      from modules.toml (with the fleet inventory and per-host pages), and it
      lives only in the store — `nix build .?submodules=1#artifacts.docs`, printed by `task docs:build`.
      The wrapper stays because `task modules` offers a "sync" action.
    cmds:
      - bash scripts/task/modules-menu.sh sync

  dev:modules:validate:
    desc: Validate modules.toml syntax and file paths
    cmds:
      - bash scripts/task/modules-menu.sh validate

  dev:closure:
    desc: Closure subsystem breakdown (HOST=name|local, TARGET=store path; store-DB only)
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} subsystems {{if .TARGET}}{{.TARGET}}{{end}}

  dev:closure:size:
    desc: Total closure size for a host or store path (HOST=name|local)
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} size {{if .TARGET}}{{.TARGET}}{{end}}

  dev:closure:top:
    desc: Biggest contributors by own size (HOST=name, N=count, TARGET=store path)
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} top {{.N | default "20"}} {{if .TARGET}}{{.TARGET}}{{end}}

  dev:closure:graph:
    desc: ASCII graph of a host's closure subsystem breakdown (HOST=name|local)
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} graph {{if .TARGET}}{{.TARGET}}{{end}}

  dev:closure:dot:
    desc: Emit raw Graphviz DOT for a closure (HOST=name|local)
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} dot {{if .TARGET}}{{.TARGET}}{{end}}

  dev:eval:profile:
    desc: Peak RSS and wall clock of a gate on a stub host, per chain feature (FEATURES="base nixos dms")
    summary: >
      Rung 3 of `eval-cost-ladder` (AGENTS.nix): the unit of eval cost is the
      feature, not the host file, so this evaluates one stub host per feature
      subset and forces `config.assertions` — the same thing `checks:host`
      forces, so the numbers compare. `EXTRA_NIX` appends one override module to
      price a member the chain imports. Nothing is built and no builder is
      contacted; a failed assertion is counted, not thrown.
    cmds:
      - bash scripts/task/chain-profile.sh

  dev:closure:toml:
    desc: Emit a 3-level closure TOML tree for handoff/agent reports (HOST=name, OUT=path)
    cmds:
      - mkdir -p docs/closures
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} toml > {{.OUT | default "docs/closures/local.toml"}}

  dev:closure:budget:
    desc: Compare a host's closure against its dynamic budget (HOST=name|local, ALL=1, TARGET=store path)
    summary: >
      budget = baseline_bytes × (1 + headroom_pct/100), or an absolute `bytes`
      pin. The baseline is measured, not typed: adopt it with
      `task dev:closure:budget:adopt HOST=<h>`. HEADROOM_PCT=<n> overrides the
      file's headroom for one run (e.g. HEADROOM_PCT=0 to see the raw baseline).
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} {{if eq (.ALL | default "0") "1"}}--all{{end}} budget {{if .TARGET}}{{.TARGET}}{{end}}

  dev:closure:budget:adopt:
    desc: Adopt a host's measured deployed closure as its baseline (dynamic budget ratchet)
    summary: >
      Measures a host's deployed closure and rewrites the managed `# >>> baseline`
      block in closure-budgets.toml; policy (headroom_pct, absolute `bytes` pins,
      comments) is preserved. Run it after every intentional cut — that is the
      ratchet that makes the budget meaningful. HOST defaults to this machine.
      A remote host requires REMOTE=1: the number is read from THAT host's store
      DB over ssh (`readlink /run/current-system` then `nix path-info --store
      ssh://<h>`), and an unreachable host aborts without writing anything — a
      baseline is never this machine's closure recorded under another host's name.
    cmds:
      - bash scripts/task/closure-analysis.sh {{if .HOST}}--host {{.HOST}}{{end}} {{if eq (.REMOTE | default "0") "1"}}--remote{{end}} adopt

  dev:closure:budget:adopt:hosts:
    desc: Adopt baselines for a NAMED set of hosts (HOSTS="a b", required — never the fleet)
    summary: >
      Runs `dev:closure:budget:adopt` once per named host, in sequence, each in
      its own process. HOSTS is REQUIRED and has no default: a fleet-wide sweep
      costs one ssh + one store-DB read per host and is a deliberate act, not
      something an agent gets by forgetting a variable. Hosts that are offline
      are reported and skipped; the task exits 1 unless every named host was
      adopted, so a partial run cannot look like coverage. Every value written
      comes from that host's own store DB (no typing, no inferred numbers).
    cmds:
      - |
        if [ -z "{{.HOSTS}}" ]; then
          echo 'ERROR: HOSTS is required, e.g. HOSTS="frieren eisen fern" (no fleet default by design)' >&2
          exit 2
        fi
        adopted=0; failed=""
        for h in {{.HOSTS}}; do
          echo "== $h"
          if bash scripts/task/closure-analysis.sh --host "$h" --remote adopt; then
            adopted=$((adopted + 1))
          else
            failed="$failed $h"
          fi
        done
        echo
        echo "adopted $adopted host(s)"
        if [ -n "$failed" ]; then
          echo "NOT adopted (unreachable or no store access):$failed" >&2
          exit 1
        fi

  dev:closure:tui:
    desc: Interactive closure explorer — pick a host, then a view (gum)
    cmds:
      - bash scripts/task/closure-analysis.sh tui

  dev:closure:native:
    desc: Nix-native closure breakdown (prototype; HOST=label, ROOT=store path)
    cmds:
      - bash scripts/task/closure-graph.sh {{if .HOST}}--host {{.HOST}}{{end}} {{if .ROOT}}--root {{.ROOT}}{{end}} subsystems

  dev:closure:native:top:
    desc: Nix-native biggest contributors by own size (N=count, ROOT=store path)
    cmds:
      - bash scripts/task/closure-graph.sh {{if .ROOT}}--root {{.ROOT}}{{end}} top {{.N | default "20"}}

  dev:closure:native:graph:
    desc: Nix-native closure subsystem graph as terminal ASCII art (HOST=label)
    cmds:
      - bash scripts/task/closure-graph.sh {{if .HOST}}--host {{.HOST}}{{end}} {{if .ROOT}}--root {{.ROOT}}{{end}} graph

  dev:closure:native:toml:
    desc: Nix-native 3-level closure TOML tree (ROOT=store path)
    cmds:
      - bash scripts/task/closure-graph.sh {{if .ROOT}}--root {{.ROOT}}{{end}} toml

  dev:closure:native:diff:
    desc: "[gate] Verify the Nix-native closure graph matches closure-analysis.sh byte-for-byte"
    cmds:
      - bash scripts/task/closure-graph-diff.sh {{if .ROOT}}{{.ROOT}}{{end}}

  dev:closure:menu:
    desc: Traversable closure explorer (gum TUI; subcommand after -- e.g. `task dev:closure:menu -- reduce 10`)
    cmds:
      - bash scripts/task/closure-menu.sh {{if .HOST}}--host {{.HOST}}{{end}} {{if .ROOT}}--root {{.ROOT}}{{end}} {{.CLI_ARGS | default "menu"}}

  dev:closure:reduce:
    desc: Closure reduction report — duplicate groups with every concrete copy (N=groups, ROOT=store path)
    cmds:
      - bash scripts/task/closure-menu.sh {{if .ROOT}}--root {{.ROOT}}{{end}} reduce {{.N | default "10"}}

  dev:closure:attribution:
    desc: Attribute closure bytes to their owners — services and package farms (ROOT=store path)
    cmds:
      - |
        INFO=$(bash scripts/task/closure-graph.sh {{if .ROOT}}--root {{.ROOT}}{{end}} json | jq -r .infoPath)
        nix-shell -p python3 --run "python3 scripts/task/closure-attribution.py $INFO"

  dev:closure:diff:
    desc: Closure size deltas between two store paths (FROM=old, TO=new)
    cmds:
      - bash scripts/task/closure-analysis.sh diff {{.FROM}} {{.TO | default "/run/current-system"}}

  # The uniform contract: a rival answers the same four routes and is measured
  # by the same battery, so a second architecture competes on latency and
  # correctness instead of on being the one that got built first.
  dev:email:bench:
    desc: Benchmark an email-archive API against the uniform contract (BASE=url, N=iterations, OUT=json)
    cmds:
      - python3 scripts/task/email-bench.py {{if .BASE}}--base {{.BASE}}{{end}} {{if .N}}--iterations {{.N}}{{end}} {{if .OUT}}--out {{.OUT}}{{end}}

  # Extract nixosConfigurations hostnames from flake
  dev:flake:get-hosts:
    desc: Print every nixosConfigurations host name (attr names only — no config forced)
    summary: >
      The cheap answer to "which hosts exist": `builtins.attrNames` over the flake's
      nixosConfigurations forces NO host configuration. Measured 2026-10-17 on
      frieren: 2.42 s cold, 0.08 s on a warm eval cache. For host FACTS prefer
      `dev:inventory:host` (compiled registry, also no host eval).
    cmds:
      - "nix eval --raw .?submodules=1#nixosConfigurations --apply 'hosts: builtins.concatStringsSep \"\\n\" (builtins.attrNames hosts)'"

  # Update garnix.yaml with current nixosConfigurations
  dev:flake:update-garnix:
    desc: Rewrite garnix.yaml builds.include from the current nixosConfigurations host set
    cmds:
      - |
        # Start with empty builds.include array
        yq -i '.builds.include = []' garnix.yaml
        # Add each host from flake
        for host in $(task dev:flake:get-hosts); do
          yq -i ".builds.include += [\"nixosConfigurations.$host\"]" garnix.yaml
        done

  # --- docs: generated from the compiled metadata (lib/docs.nix) ------------
  # The pages and the site nav are Nix values built from `.?submodules=1#inventory` and
  # modules.toml, so they cannot drift from the hosts/knobs they describe.
  # `.?submodules=1#artifacts.docs` is the ONLY copy: the tree is a store path, and no part of it is
  # checked in (docs/generated/ used to be, which is why a drift gate had to
  # exist — see docs/docs-pipeline-audit.md §4).
  docs:build:
    desc: Build the generated docs tree from compiled metadata (nix build .?submodules=1#artifacts.docs)
    summary: >
      Prints the store path of the generated docs: fleet-inventory.md,
      modules-registry.md, hosts/<h>.md and the AGENTS.nix note pages. There is
      no nav file — the site derives navigation from the knowledge graph.
      Nothing in the repo is written; read the pages from that path, or from
      the served site (`.?submodules=1#sites.fleet-docs-site`).
    cmds:
      - nix build --no-link --print-out-paths .?submodules=1#artifacts.docs

  docs:site:
    desc: Build the rendered documentation site (nix build .?submodules=1#sites.fleet-docs-site)
    summary: >
      The site is a Nix-native hypermedia tree (lib/aki-site.nix): it renders the
      compiled registry, the knowledge graph (which now includes .agents/** and
      taskfiles/*.md as document nodes) and the generated doc pages. Prints the
      store path; it does NOT create a ./result-docsite symlink — build artifacts
      in the checkout are what `result`/`result-*` used to be. There is no Python
      phase — the markdown renderer that lived in docs-site/ is retired. Exit 1 on
      a build failure.
    cmds:
      - nix build --no-link --print-out-paths .?submodules=1#sites.fleet-docs-site

  dev:nixbuild:plan:
    desc: Report what would build/fetch for hosts against local substituters (read-only)
    cmds:
      - bash scripts/task/nixbuild-warm.sh plan {{.CLI_ARGS}}

  dev:nixbuild:warm:
    desc: "[destructive] Build host closures on the remote builder (nixbuild.net budget!) and push to Cachix"
    cmds:
      - bash scripts/task/nixbuild-warm.sh warm {{.CLI_ARGS}}

  dev:nixcache:check:
    desc: "[gate] Validate the edge cache offline: worker tests + wrangler bundle, no token and no bucket"
    summary: >
      The Worker's own tests run under node with types stripped, so there is no
      npm tree and no build step, and wrangler then bundles it for real. A
      protocol regression (a range answered 200, a PUT answered 404) is caught
      here instead of by a client that silently rebuilds.
    cmds:
      - bash scripts/task/nixcache.sh check

  dev:nixcache:deploy:
    desc: "[destructive] Create the R2 bucket if absent and deploy the edge cache Worker from delphi"
    summary: >
      Reads CLOUDFLARE.API.TOKEN and CLOUDFLARE.ACCOUNT.ID from the sops apikeys
      plane at run time; no rebuild and no credential in the store. The Worker
      serves GET/HEAD only — uploads go through the bucket's S3 API.
    cmds:
      - bash scripts/task/nixcache.sh deploy

  dev:nixcache:size:
    desc: "Report R2 bucket bytes against the 10 GiB free-tier budget (exit 1 at the cap)"
    summary: >
      R2 bills storage and has no per-bucket quota, so the budget is measured
      rather than declared: a bucket past BUDGET_GIB fails, which is what stops
      a fill loop from turning free into a monthly charge.
    cmds:
      - bash scripts/task/nixcache.sh size {{.CLI_ARGS}}

  dev:nixcache:gc:
    desc: "[destructive with -- --delete] Collect the oldest cache paths until the bucket is under target"
    summary: >
      Cachix's shape, as far as R2 allows: sort by age, delete the oldest until
      under 75%. Cachix sorts by last access because it sees every request; this
      Worker cannot — narinfo is served immutable, so Cloudflare answers the
      repeats and the origin only observes misses — so upload age stands in, and
      a re-push refreshes a path. Dry run unless `-- --delete`; a narinfo and its
      nar always leave together; one run stops at GC_LIMIT paths.
    cmds:
      - bash scripts/task/nixcache.sh gc {{.CLI_ARGS}}

  dev:nixcache:keygen:
    desc: "Generate the edge cache signing key once: secret to sops, public key printed"
    summary: >
      The name (`task dev:nixcache:keygen -- delphi.edge-1`) is the prefix of
      every signature and cannot change later without republishing the cache.
      It refuses when sops already holds a key, so a second identity cannot
      replace a live one by accident.
    cmds:
      - bash scripts/task/nixcache.sh keygen {{.CLI_ARGS}}

  dev:nixcache:sync:
    desc: "Monthly handoff: build each host's closure on the right machine, then push its delta (spends build budget)"
    summary: >
      `--hosts "a,b" --dry-run`. Routing only — push owns dedupe, the budget
      refusal and the read-back. Arch picks the builder: native for this
      machine's arch (delphi compiles aarch64, its own system and minyx, where
      the inputs the official caches were built from are already local), and
      /etc/nix/machines with --max-jobs 0 for anything else, so a 2-OCPU ARM box
      never silently compiles an x86_64 closure. No machines file means SKIPPED,
      not a compile. The monthly timer runs `--hosts delphi,minyx` on delphi.
    cmds:
      - bash scripts/task/nixcache.sh sync {{.CLI_ARGS}}

  dev:nixcache:push:
    desc: "Push the unique part of a closure through the R2 S3 API, signed locally (the path CI uses)"
    summary: >
      Dedupes against every non-LAN cache in lib/cache-registry.nix first, so a
      system closure uploads its delta (771 MiB of 18.48 GiB, measured) rather
      than the closure. Refuses before writing when it would cross BUDGET_GIB.
      The signing key travels in NIX_CONFIG, never on the command line. This is
      the same write path CI takes, so a local push is a real rehearsal of it.
    cmds:
      - bash scripts/task/nixcache.sh push {{.CLI_ARGS}}

  dev:config:hash-update:
    desc: Refresh sha256 checksums for all modules/config/*.json files (nu.json, authorized-keys.json, fetches.json)
    cmds:
      - |
        for f in modules/config/*.json; do
          if [[ -f "$f" ]]; then
            echo "Updating $f..."
            scripts/task/nix-hash-update.sh "$f"
          fi
        done

  dev:fmt:
    desc: Format all Nix files in-place with alejandra (alias of checks:nix:fix)
    summary: >
      Delegates to scripts/task/nix-fmt.sh --fix --all, the single implementation
      also behind checks:nix:fix and checks:nix:watch. alejandra is the repo's
      canonical formatter; do NOT switch this to nixpkgs-fmt, which would rewrite
      ~170 of the 187 tracked .nix files.
    cmds:
      - bash scripts/task/nix-fmt.sh --fix --all

  dev:pr:list:
    desc: List open pull requests
    cmds:
      - gh pr list --state open --author "@me" 2>/dev/null || gh pr list --state open

  dev:pr:create:
    desc: Create a pull request from the current branch
    cmds:
      - |
        branch=$(git branch --show-current)
        if [ "$branch" = "main" ]; then
          echo "On main branch — switch to a feature branch first"
          exit 1
        fi
        gh pr create --fill --web

  dev:pr:checkout:*:
    desc: Checkout a pull request by number
    vars:
      PR: '{{index .MATCH 0}}'
    cmds:
      - gh pr checkout {{.PR}}

  dev:pr:review:*:
    desc: Review a pull request by number (opens in browser)
    vars:
      PR: '{{index .MATCH 0}}'
    cmds:
      - gh pr review {{.PR}} --approve || gh pr review {{.PR}}

  dev:pr:status:
    desc: Show CI status for the current branch
    cmds:
      - gh pr checks 2>/dev/null || echo "No open PR for this branch"

  dev:cloak:edit:
    desc: Edit the cloak accounts file via SOPS (navigate to the `cloak` key)
    cmds:
      # The submodule copy is canonical; the mirror in `modules/` is produced by
      # `infra:secrets:sync` and never edited directly.
      - sops {{.SECRETS}}/{{.ENC_SECRETS}}
      - task infra:secrets:sync

  dev:cloak:list:
    desc: List all cloak accounts
    cmds:
      - |
        sops -d {{.SECRETS}}/{{.ENC_SECRETS}} 2>/dev/null | yq '.cloak' | grep -E '^\[.*\]$' | tr -d '[]' \
          || sops -d modules/secrets.yaml 2>/dev/null | yq '.cloak' | grep -E '^\[.*\]$' | tr -d '[]'

  dev:cloak:view:
    desc: Pick an account and view its TOTP
    cmds:
      - |
        account=$(task dev:cloak:list | gum filter --placeholder "Select account..." --no-strict)
        [ -n "$account" ] && cloak view "$account" || echo "No account selected"

  dev:cloak:view:*:
    desc: View TOTP for a specific account
    vars:
      ACCOUNT: '{{index .MATCH 0}}'
    cmds:
      - cloak view {{.ACCOUNT}}

  dev:cloak:sync-bw:
    desc: Automatically import and sync TOTP tokens from Bitwarden/Vaultwarden export or accounts TOML into Cloak and SOPS
    aliases: [dev:cloak:sync]
    cmds:
      - |
        bw_export="${1:-}"
        ./scripts/bw-cloak-sync.sh ${bw_export:+"$bw_export"} --apply

  dev:cloak:export-age:
    desc: Export and encrypt active SOPS Cloak accounts directly to an age-encrypted file (default /Volumes/data/security/accounts.age)
    cmds:
      - |
        target="${1:-/Volumes/data/security/accounts.age}"
        ./scripts/bw-cloak-sync.sh --export-age "$target"

  # ── CI Control Plane ──────────────────────────────────────────

  dev:ci:plan:
    desc: Analyze git diff against origin/main to show affected hosts for CI
    cmds:
      - nix-shell -p python3 --run "python3 scripts/ci/detect-affected-hosts.py"

  dev:ci:plan:worktree:
    desc: Analyze local uncommitted working tree changes for CI impact
    cmds:
      - nix-shell -p python3 --run "python3 scripts/ci/detect-affected-hosts.py --working-tree"

  dev:ci:wait:
    desc: Block until CI for a commit is finished; 0 green, 1 failed, 124 timeout
    summary: >
      scripts/task/ci-wait.sh — one call instead of a poll every few minutes. gh is
      the source (exact, and `--log-failed` names the failing lines); VIA=mail waits
      on GitHub's "Run failed" mail through himalaya instead, which is the only path
      without a gh token. Nothing is committed: one line per verdict goes to
      $XDG_STATE_HOME/nixconfig/ci-watch.log. Vars: COMMIT=HEAD, VIA=gh|mail,
      TIMEOUT=2400.
    cmds:
      - scripts/task/ci-wait.sh --commit "{{.COMMIT | default "HEAD"}}" --via "{{.VIA | default "gh"}}" --timeout "{{.TIMEOUT | default "2400"}}"

  dev:ci:trigger:*:
    desc: Trigger remote GitHub Actions CI build for a host (e.g. task dev:ci:trigger:stark, all, auto)
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - gh workflow run nixcachix.yml -f host={{.HOST}}
      - echo "Dispatched CI build for {{.HOST}}"

