name: nixcachix
# One run per ref. Without this, a burst of pushes starts a build per commit and
# they queue behind each other (measured 2026-10-30: eleven runs in flight), so a
# superseded build can occupy a runner for hours before it is cancelled. A new
# push now cancels the run it supersedes instead of racing it.
concurrency:
  group: nixcachix-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to build (or 'auto', 'all', or comma-separated names)"
        required: false
        default: "auto"
      shared_strategy:
        description: "Strategy when shared modules change (anchor=frieren, all=all active, none=host-only)"
        type: choice
        options:
          - anchor
          - all
          - none
        default: "anchor"
      boot_host:
        description: "Boot this host on purpose (needs the same host= above); empty keeps the canary tied to modules/services diffs"
        required: false
        default: ""

jobs:
  sops-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          # The tree uses `|>` (modules/global/global.nix enables pipe-operators
          # fleet-wide); a runner with only nix-command+flakes cannot PARSE it.
          # WAN substituters only; the flake's nixConfig is deliberately not
          # accepted here. flake.nix lists the LAN Harmonia cache, which a GitHub
          # runner cannot reach — accepting it spends a connect-timeout per path on
          # a cache behind this house's LAN, and CI must never depend on that. The
          # NAS consumes cachix; it is not CI's build or warm path.
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            substituters = https://shaoyanji.cachix.org https://cache.nixos.org/ https://cache.numtide.com https://install.determinate.systems
            connect-timeout = 5
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"
      - name: Check sops recipient drift
        continue-on-error: true
        run: bash scripts/task/sops-drift-check.sh --repo-only

  # Doc-only changes allocate zero build runners (the detector ignores *.md),
  # so without this job a runaway living document lands green. The gate is
  # `checks.<system>.docs-budget`: line counts for AGENTS.md / MANUAL.md /
  # AUDIT.md and the four root stubs (SCHEMA.md §2), evaluated at eval time and
  # building a three-line artifact. It runs on every push, doc-only included.
  docs-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          # WAN substituters only; the flake's nixConfig is deliberately not
          # accepted here. flake.nix lists the LAN Harmonia cache, which a GitHub
          # runner cannot reach — accepting it spends a connect-timeout per path on
          # a cache behind this house's LAN, and CI must never depend on that. The
          # NAS consumes cachix; it is not CI's build or warm path.
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            substituters = https://shaoyanji.cachix.org https://cache.nixos.org/ https://cache.numtide.com https://install.determinate.systems
            connect-timeout = 5
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"
      - name: Living documents within budget
        run: nix build -L .?submodules=1#checks.x86_64-linux.docs-budget
      - name: Task graph digests still pinned
        run: nix build -L .?submodules=1#checks.x86_64-linux.taskfile-digest-pin

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_machines: ${{ steps.detect.outputs.has_machines }}
      affected_hosts: ${{ steps.detect.outputs.affected_hosts }}
      matrix: ${{ steps.detect.outputs.matrix }}
      reason: ${{ steps.detect.outputs.reason }}
      services_changed: ${{ steps.services.outputs.changed }}
      boot_matrix: ${{ steps.boot.outputs.matrix }}
      has_boot: ${{ steps.boot.outputs.any }}
      force_boot: ${{ steps.boot.outputs.forced }}
    steps:
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect affected hosts
        id: detect
        run: |
          STRATEGY="${{ inputs.shared_strategy }}"
          STRATEGY="${STRATEGY:-anchor}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.host }}" != "auto" ]; then
            if [ "${{ inputs.host }}" = "all" ]; then
              python3 scripts/ci/detect-affected-hosts.py --ci --commit-msg "[ci all]"
            else
              python3 scripts/ci/detect-affected-hosts.py --ci --commit-msg "[ci ${{ inputs.host }}]"
            fi
          else
            python3 scripts/ci/detect-affected-hosts.py --ci --shared-strategy "$STRATEGY"
          fi

      # The boot canary is scoped to a path class, not to every push: it boots a
      # full VM per host, which is minutes, while a normal host build is the gate
      # for everything else. `modules/services/**` is the class where a change
      # evaluates and builds and then never reaches userspace.
      - name: Detect service-module changes
        id: services
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^modules/services/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A job-level `if` cannot read `matrix` (it is evaluated before the matrix
      # is expanded), so the boot canary's host list is filtered here instead.
      # GitHub's ubuntu-24.04-arm runners have no /dev/kvm, and a boot test without
      # it is TCG, not a gate (measured 2026-10-30).
      # `boot_host` is how the canary is re-run AFTER a change to
      # flake/boot-checks.nix: no `modules/services` diff triggers it, so the
      # sizing fix for frieren could otherwise only be proved by waiting for an
      # unrelated services commit. It narrows the matrix to that one host and
      # drops the diff gate, so the run is deliberate and costs one boot.
      - name: Boot-capable hosts (KVM runners only)
        id: boot
        env:
          MATRIX: ${{ steps.detect.outputs.matrix }}
          BOOT_HOST: ${{ inputs.boot_host }}
        run: |
          # The matrix is a GitHub matrix object ({"include": [...]}), not a bare
          # array, and a job-level `if` can only test strings — hence `any`.
          if [ -n "$BOOT_HOST" ]; then
            if ! jq -e --arg h "$BOOT_HOST" '[.include[] | select(.host == $h)] | length > 0' <<<"$MATRIX" >/dev/null; then
              echo "::error::boot_host=$BOOT_HOST is not in the detected matrix — dispatch with host=$BOOT_HOST as well"
              {
                echo "any=false"
                echo "forced=false"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "matrix=$(jq -c --arg h "$BOOT_HOST" '{include: [.include[] | select(.host == $h)]}' <<<"$MATRIX")"
              echo "any=true"
              echo "forced=true"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          EMU=$(jq -c '{include: [.include[] | select(.arch == "x86_64-linux")]}' <<<"$MATRIX")
          {
            echo "forced=false"
            echo "matrix=$EMU"
            if jq -e '[.include[] | select(.arch == "x86_64-linux")] | length > 0' <<<"$MATRIX" >/dev/null; then echo "any=true"; else echo "any=false"; fi
          } >>"$GITHUB_OUTPUT"

  build-machines:
    needs: plan
    if: needs.plan.outputs.has_machines == 'true'
    # Secrets are not readable from an `if`; a job env is. It is empty when the
    # secret is absent, which is what the cachix step tests.
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    # The runner's 6-hour maximum is not a budget. A warm host builds in ~5
    # minutes and a cold aarch64 closure compiles for ~30; anything past an hour
    # is a stall (measured 2026-10-30: a job sat on one derivation for 5.5 h and
    # was only stopped by GitHub's hard cap), so fail fast and keep the runner
    # for a run that can finish.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Log Target
        run: |
          echo "Building machine: ${{ matrix.host }}"
          echo "Kind: ${{ matrix.kind }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Runner OS: ${{ matrix.os }}"
          echo "Flake attribute: ${{ matrix.attr }}"

      - name: Maximize build disk space (Linux only)
        if: runner.os == 'Linux'
        uses: easimon/maximize-build-space@v10
        with:
          overprovision-lvm: true
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /nix

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          # WAN substituters only; the flake's nixConfig is deliberately not
          # accepted here. flake.nix lists the LAN Harmonia cache, which a GitHub
          # runner cannot reach — accepting it spends a connect-timeout per path on
          # a cache behind this house's LAN, and CI must never depend on that. The
          # NAS consumes cachix; it is not CI's build or warm path.
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            substituters = https://shaoyanji.cachix.org https://cache.nixos.org/ https://cache.numtide.com https://install.determinate.systems
            connect-timeout = 5

      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"

      # Push needs the token; substitution needs only the public cache URL
      # already in extra_nix_config. Skipping the action when the secret is
      # absent keeps the build honest (it still substitutes, it just cannot
      # publish) instead of failing the whole run on missing auth.
      - uses: cachix/cachix-action@v14
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: shaoyanji
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false
          installCommand: nix profile install nixpkgs#cachix

      # Every artifact the host needs to be substitutable — for an embedded host
      # that includes `sdImage`, whose Raspberry Pi kernel is not on
      # cache.nixos.org. Warming only the toplevel is what left image builds
      # compiling from source on every attempt.
      - run: |
          set -euo pipefail
          for attr in ${{ join(matrix.attrs, ' ') }}; do
            echo "::group::nix build $attr"
            nix build -L ".?submodules=1#${attr}"
            echo "::endgroup::"
          done

      # Per-host eval gate: module system + every assertion + the compiled
      # inventory.toml record, one host per runner (~13 s, ~700 MiB). This is the
      # half of `nix flake check` that is safe to run per host — running the whole
      # flake check instead forces all 23 configurations in one process and was
      # measured at 6078.5 MiB peak / SIGKILL 137 on the NAS. Previously this
      # assertion (services.go-backend must be enabled by no host) was reachable
      # only from `nix flake check` and `task checks:quick`, neither of which CI
      # ran, so it was not actually enforced automatically.
      - name: Per-host eval + assertion gate
        if: matrix.kind == 'nixos'
        run: nix build -L .?submodules=1#hostChecks.${{ matrix.arch }}.${{ matrix.host }}

  # Boot the host's REAL module graph before a services change can be trusted.
  # Reuses `plan`'s matrix, so only hosts the change reaches boot, and runs after
  # build-machines so their closures are already substituted. Gated on
  # `modules/services/**` because a boot test is a full host evaluation plus a
  # QEMU run — minutes per host, not a per-push cost.
  boot-canary:
    needs: [plan, build-machines]
    # x86_64 only: GitHub's ubuntu-24.04-arm runners have no /dev/kvm (measured
    # 2026-10-30 — the runner advertises `nixos-test` but not `kvm`, and the boot
    # test then fails `a 'aarch64-linux' with features {kvm, nixos-test} is
    # required`). A boot test under TCG is not a gate, so ARM hosts are booted
    # from the host itself, not here; `plan` filters those out of boot_matrix.
    if: >-
      needs.plan.outputs.has_machines == 'true' &&
      needs.plan.outputs.has_boot == 'true' &&
      (needs.plan.outputs.services_changed == 'true' || needs.plan.outputs.force_boot == 'true')
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.boot_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Maximize build disk space (Linux only)
        if: runner.os == 'Linux'
        uses: easimon/maximize-build-space@v10
        with:
          overprovision-lvm: true
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /nix

      # nixosTest drives QEMU with KVM when /dev/kvm is usable. GitHub's Linux
      # runners expose it but root-only; without this the test falls back to TCG
      # and a boot takes tens of minutes instead of one.
      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "::warning::/dev/kvm absent; the boot test runs under TCG (slow)"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          # WAN substituters only; the flake's nixConfig is deliberately not
          # accepted here. flake.nix lists the LAN Harmonia cache, which a GitHub
          # runner cannot reach — accepting it spends a connect-timeout per path on
          # a cache behind this house's LAN, and CI must never depend on that. The
          # NAS consumes cachix; it is not CI's build or warm path.
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
            substituters = https://shaoyanji.cachix.org https://cache.nixos.org/ https://cache.numtide.com https://install.determinate.systems
            connect-timeout = 5

      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"

      - uses: cachix/cachix-action@v14
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: shaoyanji
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false
          installCommand: nix profile install nixpkgs#cachix

      - name: Boot to stage-2 (no stage-1 handoff = failure)
        if: matrix.kind == 'nixos'
        run: nix build -L .?submodules=1#hostBootChecks.${{ matrix.arch }}.${{ matrix.host }}
