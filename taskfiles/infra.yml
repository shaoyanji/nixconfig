version: "3"

tasks:
  infra:load:menu:
    desc: Choose a load action
    cmds:
      - |
        choice=$(printf '%s\n' infra:load:env exit | gum choose)
        task "$choice"

  infra:load:env:
    desc: Load common API env lines from encrypted env file
    cmds:
      - task infra:api:get:API
      - task infra:api:get:POP
      - task infra:api:get:TOKEN

  infra:api:get:*:
    desc: Print matching API key line from encrypted env file
    vars:
      API: '{{index .MATCH 0}}'
    cmds:
      - sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -o=shell . | grep {{.API}}

  infra:sops:get:*:
    desc: Query secrets file and print matching value
    vars:
      QUERY: '{{index .MATCH 0}}'
    cmds:
      - sops -d {{.SECRETS}}/{{.ENC_SECRETS}} | yq -o=shell . | grep {{.QUERY}} | awk -F'=' '{print $2}'

  infra:sops:fzf:
    desc: Select env entries from encrypted env file
    cmds:
      - sops -d {{.SECRETS}}/{{.ENC_ENVS}} | yq -o=shell . | fzf -m | awk '{ gsub(/\047/, ""); print }'

  infra:secrets:edit:apikeys:
    desc: Edit encrypted API keys and push to secrets repo
    cmds:
      - scripts/task/sops-edit-commit.sh "{{.SECRETS}}" "{{.ENC_ENVS}}" "taskfile - update"

  infra:secrets:edit:taskfile:
    desc: Edit encrypted operator Taskfile and refresh ~/Taskfile.yml
    cmds:
      - scripts/task/sops-edit-commit.sh "{{.SECRETS}}" "{{.ENC_TASKFILE}}" "taskfile - update"
      - scripts/task/sops-decrypt-to.sh "{{.SECRETS}}/{{.ENC_TASKFILE}}" "$HOME/Taskfile.yml"

  infra:secrets:edit:detaskfile:
    desc: Edit encrypted DE Taskfile and refresh ~/Taskfile.yml
    cmds:
      - scripts/task/sops-edit-commit.sh "{{.SECRETS}}" "{{.ENC_DETASKFILE}}" "detaskfile - update"
      - scripts/task/sops-decrypt-to.sh "{{.SECRETS}}/{{.ENC_DETASKFILE}}" "$HOME/Taskfile.yml"

  infra:secrets:sync:
    desc: Sync the mirrored secrets yaml in modules/ from the submodule (idempotent)
    cmds:
      - cp -f {{.SECRETS}}/{{.ENC_SECRETS}} {{.SECRETS}}.yaml
      - echo "Synced {{.SECRETS}}/{{.ENC_SECRETS}} -> {{.SECRETS}}.yaml"

  infra:secrets:edit:secrets:
    desc: Edit encrypted secrets and sync local mirrored yaml
    cmds:
      - sops edit {{.SECRETS}}/{{.ENC_SECRETS}}
      - task infra:secrets:sync
      - cd {{.SECRETS}} && git add {{.ENC_SECRETS}} && git commit -m "secrets - update" && git push origin HEAD:master

  infra:sops:update-keys:
    desc: Rotate SOPS recipient keys across ALL sops files, resync mirror, push secret repo changes
    cmds:
      - cp -f .sops.yaml {{.SECRETS}}/.sops.yaml
      - sops updatekeys {{.SECRETS}}/*.yaml
      - sops updatekeys modules/ssh-ca-key.yaml
      - task infra:secrets:sync
      - cd {{.SECRETS}} && git switch master && git add *.yaml .sops.yaml && git commit -m "updated sops keys" && git push origin HEAD:master
      - git add {{.SECRETS}} modules/secrets.yaml modules/ssh-ca-key.yaml .sops.yaml
      - 'echo "Updated and staged: {{.SECRETS}}, modules/secrets.yaml, modules/ssh-ca-key.yaml, .sops.yaml. Ready to commit in main repo."'

  infra:secrets:decrypt:detaskfile-home:
    desc: Decrypt DE Taskfile to ~/Taskfile.yml
    cmds:
      - scripts/task/sops-decrypt-to.sh "{{.SECRETS}}/{{.ENC_DETASKFILE}}" "$HOME/Taskfile.yml"

  infra:secrets:new:generate:
    desc: Generate SSH + AGE keys for SOPS bootstrap
    cmds:
      - ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -C "{{.EMAIL}}"
      - mkdir -p ~/.config/sops/age
      - nix-shell -p ssh-to-age --run "ssh-to-age -private-key -i ~/.ssh/id_ed25519 > ~/.config/sops/age/keys.txt"
      - echo "&$(hostname) $(nix-shell -p ssh-to-age --run 'ssh-to-age < ~/.ssh/id_ed25519.pub')"
      - echo "&$(hostname)host $(nix-shell -p ssh-to-age --run 'ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub')"

  infra:secrets:new:copy-nas:
    desc: Copy AGE key from NAS backup path
    vars:
      NAS_PATH: /Volumes/data/security/USB\ Copy_2024-11-24_131715
    cmds:
      - mkdir -p ~/.config/sops/age
      - cp {{.NAS_PATH}}/age-key.txt ~/.config/sops/age/keys.txt

  infra:rebuild:nixos:
    desc: Rebuild local NixOS host and refresh ~/Taskfile.yml
    aliases: [nixos-rebuild]
    cmds:
      - task infra:switch:nixos
      - task infra:secrets:decrypt:detaskfile-home

  infra:rebuild:darwin:
    desc: Rebuild local Darwin host and refresh ~/Taskfile.yml
    aliases: [darwin-rebuild]
    cmds:
      - task infra:switch:darwin
      - task infra:secrets:decrypt:detaskfile-home

  infra:rebuild:home-manager:
    desc: Rebuild local Home Manager profile
    summary: >
      The switch IS the check: it evaluates and builds the profile. Do not run
      `task checks:*` first — that is extra evaluation for no proof. `NOM=1`
      pipes through nom for the human TUI; agents leave it unset.
    aliases: [home-manager-switch]
    cmds:
      - |
        set -o pipefail
        if [ "${NOM:-0}" = "1" ]; then
          home-manager switch --flake .?submodules=1#$(hostname) 2>&1 | nom
        else
          home-manager switch --flake .?submodules=1#$(hostname)
        fi
      - task infra:secrets:decrypt:detaskfile-home

  infra:rebuild:wsl:
    desc: Rebuild WSL host configuration
    summary: No pre-rebuild checks; NOM=1 only for the human TUI.
    aliases: [wsl-rebuild]
    cmds:
      - |
        set -o pipefail
        if [ "${NOM:-0}" = "1" ]; then
          sudo nixos-rebuild switch --flake .?submodules=1#guckloch --use-substitutes 2>&1 | nom
        else
          sudo nixos-rebuild switch --flake .?submodules=1#guckloch --use-substitutes
        fi

  infra:rebuild:orb:
    desc: Rebuild OrbStack host configuration and refresh ~/Taskfile.yml
    summary: No pre-rebuild checks; NOM=1 only for the human TUI.
    aliases: [orb-rebuild]
    cmds:
      - |
        set -o pipefail
        if [ "${NOM:-0}" = "1" ]; then
          sudo nixos-rebuild switch --flake .?submodules=1#$(hostname) --impure 2>&1 | nom
        else
          sudo nixos-rebuild switch --flake .?submodules=1#$(hostname) --impure
        fi
      - task infra:secrets:decrypt:detaskfile-home

  infra:switch:*:
    desc: Switch current host using a rebuild command (nixos|darwin)
    summary: >
      NO pre-switch check. The rebuild evaluates the host and builds the closure
      itself; running `task checks:*` or `warm-host.sh --check` first is a second
      whole-toplevel evaluation for no extra proof (measured >120 s with swap on
      this host). The routing question is answered in CI and deliberately, with
      `task checks:build:route` — not on every switch.
      ROUTE_CHECK=1 opts into the old best-effort routing report for an operator
      who genuinely needs it; agents leave it unset. NOM=1 pipes through nom for
      the human TUI; agents leave it unset. Vars: OS (from the wildcard).
    vars:
      OS: '{{index .MATCH 0}}'
    cmds:
      - |
        set -o pipefail
        if [ "${ROUTE_CHECK:-0}" = "1" ]; then
          bash scripts/task/warm-host.sh --check --best-effort "$(hostname)"
        fi
        if [ "${NOM:-0}" = "1" ]; then
          sudo {{.OS}}-rebuild switch --flake .?submodules=1#$(hostname) 2>&1 | nom
        else
          sudo {{.OS}}-rebuild switch --flake .?submodules=1#$(hostname)
        fi

  infra:boot:*:
    desc: "[safe stage] Stage next generation in bootloader via rebuild command (reboot to activate)"
    summary: No pre-rebuild checks; NOM=1 only for the human TUI.
    vars:
      OS: '{{index .MATCH 0}}'
    cmds:
      - |
        set -o pipefail
        if [ "${NOM:-0}" = "1" ]; then
          sudo {{.OS}}-rebuild boot --flake .?submodules=1#$(hostname) 2>&1 | nom
        else
          sudo {{.OS}}-rebuild boot --flake .?submodules=1#$(hostname)
        fi

  infra:plan:host:netbook:
    desc: Dry-run netbook configuration remotely using its pinned 25.11 channel
    cmds:
      - rsync -avz hosts/netbook/configuration.nix hosts/netbook/hardware-configuration.nix root@netbook:/tmp/netbook-dry/
      - ssh root@netbook "NIXOS_CONFIG=/tmp/netbook-dry/configuration.nix nixos-rebuild dry-build"

  infra:plan:host:*:
    desc: Build/evaluate a specific host closure (no apply)
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - nix build .#nixosConfigurations.{{.HOST}}.config.system.build.toplevel -L

  infra:apply:host:netbook:
    desc: Push configuration and switch netbook remotely using its pinned 25.11 channel
    cmds:
      - rsync -avz hosts/netbook/configuration.nix hosts/netbook/hardware-configuration.nix root@netbook:/etc/nixos/
      - ssh root@netbook "nixos-rebuild switch"

  infra:apply:host:*:
    desc: Activate ONE active host by pulling its closure from the LAN cache
    summary: >
      The fast unattended deploy: the TARGET pulls the closure from harmonia over
      HTTP and switches itself. Preconditions are checked, not assumed: the host
      must be ACTIVE in inventory.toml and the closure already servable by the cache
      (`infra:warm:cache HOSTS=<h>`), else the gate fails instead of compiling on
      the target. No ssh prompt (BatchMode + ConnectTimeout); activation runs
      detached in a transient unit. ONE HOST; the fleet is `infra:apply:fleet`.

      A PRESERVED host is a warning and exit 0 — no eval, no cache query, no ssh
      (ALLOW_PRESERVED=1 revives). Vars: TARGET= (default: <host>), CACHE=.
    vars:
      HOST: '{{index .MATCH 0}}'
      TARGET: '{{.TARGET | default .HOST}}'
    cmds:
      - bash scripts/task/activate-host.sh {{.HOST}} {{.TARGET}}

  infra:warm:cache:
    desc: Build the managed host closures locally so harmonia serves them at LAN speed (HOSTS="a b" overrides; UPDATE=1 also refreshes flake.lock)
    vars:
      # The set comes from inventory.toml, NOT from `status = "active"`: warming
      # costs a full closure fetch/build on the cache host and the store is
      # garbage-collected, so it is a deliberate per-host opt-in (`managed = true`).
      # DERIVED must be declared BEFORE HOSTS — task resolves task vars in
      # declaration order, so a later DERIVED resolves to nil and yields an
      # empty HOSTS (a silent no-op).
      DERIVED:
        sh: yq -r '.hosts | to_entries | .[] | select(.value.managed == true and .value.status == "active") | .key' inventory.toml | tr '\n' ' '
      HOSTS: '{{.HOSTS | default .DERIVED}}'
      UPDATE: '{{.UPDATE | default "0"}}'
    cmds:
      - |
        if [ -z "{{.HOSTS}}" ]; then
          echo "ERROR: no hosts to warm — inventory.toml has no 'managed = true' host (or is unreadable)." >&2
          exit 1
        fi
        if [ "{{.UPDATE}}" = "1" ]; then
          echo "==> refreshing flake.lock"
          nix flake update --commit-lock-file
        fi
        # Run on the cache host (frieren): harmonia serves paths straight
        # out of the local store, so every closure built here becomes an
        # instant LAN cache hit for all other hosts.
        fail=0
        for h in {{.HOSTS}}; do
          echo "==> warming: $h"
          nix build ".#nixosConfigurations.$h.config.system.build.toplevel" -L || fail=1
        done
        exit $fail

  infra:warm:host:*:
    desc: Make one host's closure substitutable — builds on the builder, verifies the cache serves it
    summary: >
      Run this ON THE BUILDER (inventory metadata.builder_host, else frieren). It
      builds <host>'s closure from the LOCAL tree — so uncommitted edits are
      covered, which neither CI (pushed branch) nor fleet-warm-cache (github: ref)
      can do — then verifies the LAN cache actually serves the result. On any other
      host it refuses and prints the right command instead of compiling where that
      is not affordable.

      No ssh: the verification is one bounded HTTP request, so it cannot hang on an
      auth prompt. Env: CACHE=<url>, NO_VERIFY=1. Exit 1 = derivations remain (a
      switch would compile them locally).
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - bash scripts/task/warm-host.sh {{.HOST}}

  infra:update:fleet:
    desc: Full fleet update cycle — flake update, warm harmonia, then apply everywhere
    summary: >
      The canonical answer to "clients hit uncached builds after flake updates".
      NVIDIA drivers (580/legacy etc.) are unfree and never on upstream caches,
      so every fleet bump must be built ONCE on frieren (infra:warm:cache) and
      let harmonia serve the closures at LAN speed before any client switches.
    cmds:
      - task infra:warm:cache UPDATE={{.UPDATE | default "1"}}
      - task infra:apply:fleet

  infra:cache:push:host:*:
    desc: Push a host closure to harmonia from wherever it was built (nix copy, signed at serve time)
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - nix copy --to http://192.168.3.25:5000?compress=true ".#nixosConfigurations.{{.HOST}}.config.system.build.toplevel"

  infra:apply:fleet:
    desc: Sequentially activate managed hosts from the LAN binary cache (HOSTS="h1 h2"; default = managed active hosts)
    summary: >
      Applies the warmed closure to each managed active host sequentially via
      scripts/task/activate-host.sh. Each target pulls its closure directly from
      harmonia at LAN speed over HTTP, avoiding nix-daemon OOM spikes and the
      slow SSH push bottlenecks of nixos-rebuild --target-host.
      Vars: HOSTS=, ACTION= (default "switch"; use "boot" for major library upgrades).
    vars:
      # The same deliberate, inventory-derived set as infra:warm:cache; DERIVED
      # is declared before HOSTS for the reason noted there.
      DERIVED:
        sh: yq -r '.hosts | to_entries | .[] | select(.value.managed == true and .value.status == "active") | .key' inventory.toml | tr '\n' ' '
      HOSTS: '{{.HOSTS | default .DERIVED}}'
      ACTION: '{{.ACTION | default "switch"}}'
    cmds:
      - |
        if [ -z "{{.HOSTS}}" ]; then
          echo "ERROR: no hosts to apply to — inventory.toml has no 'managed = true' host (or is unreadable)." >&2
          exit 1
        fi
        fail=0
        for h in {{.HOSTS}}; do
          echo "==> activating host: $h (action: {{.ACTION}})"
          ACTION="{{.ACTION}}" bash scripts/task/activate-host.sh "$h" || fail=1
        done
        exit $fail
  infra:wol:eisen:
    desc: Wake Eisen (workstation) via Wake-on-LAN, address read from the compiled inventory
    summary: >
      The MAC and the broadcast network are host facts, so they are read from
      `.#inventory.hosts.eisen.network.{mac,lan_ip}` — compiled by
      `lib/inventory.nix` from `inventory.toml`, which is the reflection. Nothing
      is spelled twice here: a re-cased NIC edit is a data edit.

      Exit 0 means the magic packets were handed to the kernel, NOT that the
      machine answered — follow with a ping before assuming it booted.
    cmds:
      - |
        set -euo pipefail
        mac="$(nix eval --raw .#inventory.hosts.eisen.network.mac)"
        ip="$(nix eval --raw .#inventory.hosts.eisen.network.lan_ip)"
        if [ -z "$mac" ]; then
          echo "infra:wol:eisen: hosts.eisen.network.mac is empty in the inventory" >&2
          exit 1
        fi
        if [ -z "$ip" ]; then
          echo "infra:wol:eisen: hosts.eisen.network.lan_ip is empty in the inventory" >&2
          exit 1
        fi
        python3 - "$mac" "$ip" <<'PY'
        import socket, sys

        mac, ip = sys.argv[1], sys.argv[2]
        magic = b"\xff" * 6 + bytes.fromhex(mac.replace(":", "").replace("-", "")) * 16
        bcast = ip.rsplit(".", 1)[0] + ".255"
        sent = 0
        for iface in ("enp1s0", "wlp2s0", "enp0s20f0u2u1i5"):
            for port in (9, 7):
                with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as s:
                    s.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
                    try:
                        s.setsockopt(socket.SOL_SOCKET, 25, iface.encode())  # SO_BINDTODEVICE
                    except OSError:
                        pass  # no such NIC here; the default route still carries it
                    for dest in (bcast, "255.255.255.255"):
                        try:
                            s.sendto(magic, (dest, port))
                            sent += 1
                        except OSError:
                            pass
        if not sent:
            sys.exit("infra:wol:eisen: no interface accepted the magic packet")
        print(f"WoL magic packet -> eisen {mac} via {bcast} ({sent} sends)")
        PY

  infra:wol:host:eisen:
    desc: Alias for infra:wol:eisen
    cmds:
      - task infra:wol:eisen

  infra:deploy:host:netbook:
    desc: Push configuration, switch, and validate netbook remotely
    cmds:
      - task infra:apply:host:netbook
      - ssh root@netbook "hostname && nixos-version"

  infra:deploy:host:*:
    desc: Deploy ONE intended host — gate, activate from the cache, then validate
    summary: >
      The intended single-host deploy: routing gate → pull from the cache → switch →
      `services:validate`. Not fleet-wide (fleet builds are scheduled;
      `infra:apply:fleet` pushes). The gate runs first and read-only, so a closure
      that is not yet servable fails the deploy instead of becoming a 30-minute
      compile; the toplevel is resolved once, and activate-host re-gates it.

      Commit before warming (a new commit changes the toplevel). A PRESERVED host
      prints why and exits 0 before any eval or ssh (ALLOW_PRESERVED=1). Vars:
      TARGET=, CACHE=, ACTION=switch|boot. Exit 0 = validated.
    vars:
      HOST: '{{index .MATCH 0}}'
      TARGET: '{{.TARGET | default .HOST}}'
      ACTION: '{{.ACTION | default "switch"}}'
    cmds:
      - |
        set -euo pipefail
        status="$(yq -r ".hosts.\"{{.HOST}}\".status // \"absent\"" inventory.toml 2>/dev/null || echo absent)"
        if [ "$status" != "active" ]; then
          echo "deploy [{{.HOST}}] WARNING — inventory status is '$status', not 'active'." >&2
          echo "         Preserved hosts are not deployed and are not checked here:" >&2
          echo "         nothing was evaluated, warmed, copied, switched or validated." >&2
          echo "         Revive deliberately with: ALLOW_PRESERVED=1 task infra:apply:host:{{.HOST}}" >&2
          exit 0
        fi
        top="$(bash scripts/task/warm-host.sh --check --emit-path {{.HOST}})"
        ACTION={{.ACTION}} TOP="$top" bash scripts/task/activate-host.sh {{.HOST}} {{.TARGET}}
        # Same cmd block on purpose: `exit 0` above must stop the chain before
        # validation, and a separate cmds entry would still run after the guard.
        task services:validate:host:{{.HOST}} TARGET={{.TARGET}}

  infra:rollback:host:netbook:
    desc: Roll back netbook to previous generation remotely
    cmds:
      - ssh root@netbook "nixos-rebuild switch --rollback"

  infra:rollback:apply:host:*:
    desc: Roll back a remote host to previous generation (apply only)
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - ssh {{.HOST}} "sudo nixos-rebuild switch --rollback"

  infra:rollback:host:*:
    desc: Roll back a remote host to the previous generation (apply-only canonical)
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - task infra:rollback:apply:host:{{.HOST}}

  infra:generations:
    desc: List NixOS system generations with flake commit revisions
    cmds:
      - nixos-rebuild list-generations

  infra:generations:host:*:
    desc: List NixOS system generations on a remote host with flake commit revisions
    vars:
      HOST: '{{index .MATCH 0}}'
    cmds:
      - ssh {{.HOST}} "nixos-rebuild list-generations"

  infra:ssh:rotate-cert:
    desc: Sign a fresh 90-day SSH certificate for the current user
    cmds:
      - |
        if [ ! -f "$HOME/.ssh/user_ca_key" ]; then
          echo "CA key not found. Run 'sops decrypt' or rebuild first."
          exit 1
        fi
        ssh-keygen -s "$HOME/.ssh/user_ca_key" \
          -I "$(whoami)@$(hostname)-$(date +%Y%m%d)" \
          -n "devji" \
          -V "+90d" \
          "$HOME/.ssh/id_ed25519.pub"
        echo "Certificate signed: $HOME/.ssh/id_ed25519-cert.pub (valid 90 days)"

  infra:ssh:status:
    desc: Show certificate validity and CA key presence
    cmds:
      - |
        echo "=== CA Private Key ==="
        if [ -f "$HOME/.ssh/user_ca_key" ]; then
          echo "Present: $HOME/.ssh/user_ca_key"
          ssh-keygen -l -f "$HOME/.ssh/user_ca_key" 2>/dev/null || true
        else
          echo "MISSING: $HOME/.ssh/user_ca_key"
        fi
        echo ""
        echo "=== CA Public Key ==="
        if [ -f "$HOME/.ssh/user_ca_key.pub" ]; then
          cat "$HOME/.ssh/user_ca_key.pub"
        else
          echo "Not found"
        fi
        echo ""
        echo "=== Current Certificate ==="
        if [ -f "$HOME/.ssh/id_ed25519-cert.pub" ]; then
          ssh-keygen -L -f "$HOME/.ssh/id_ed25519-cert.pub"
        else
          echo "No certificate found — run infra:ssh:rotate-cert"
        fi

  infra:ssh:add-workstation:
    desc: Add a new workstation age key as recipient for the CA private key
    vars:
      AGE_KEY: '{{.AGE}}'
    cmds:
      - |
        if [ -z "{{.AGE_KEY}}" ]; then
          echo "Usage: task infra:ssh:add-workstation AGE=<age1abc123...>"
          exit 1
        fi
        sops --rotate --add-age {{.AGE_KEY}} modules/ssh-ca-key.yaml
        git add modules/ssh-ca-key.yaml
        echo "Added {{.AGE_KEY}} as recipient. Commit and push when ready."

  infra:store:gc:
    desc: Run nix store GC to free unreachable store paths
    cmds:
      - sudo nix store gc

  infra:store:optimise:
    desc: Deduplicate identical store paths
    cmds:
      - sudo nix store optimise

  infra:store:collect-garbage:
    desc: Remove old system generations and their orphaned store paths
    cmds:
      - sudo nix-collect-garbage -d
      - echo "Old generations removed"

  infra:store:clean:
    desc: Full store cleanup — collect garbage, gc, then optimise
    cmds:
      - task infra:store:collect-garbage
      - task infra:store:gc
      - task infra:store:optimise

  infra:store:menu:
    desc: Choose a store maintenance action
    cmds:
      - |
        choice=$(
          {
            printf '%s\n' infra:store:clean infra:store:gc infra:store:optimise infra:store:collect-garbage
            printf '%s\n' exit
          } | gum choose
        )
        [ "$choice" = "exit" ] || task "$choice"

  infra:logs:host:netbook:
    desc: "Tail journal logs for netbook via ssh"
    vars:
      UNIT: '{{.UNIT | default ""}}'
    cmds:
      - |
        if [ -n "{{.UNIT}}" ]; then
          ssh root@netbook "journalctl -fu {{.UNIT}}"
        else
          ssh root@netbook "journalctl -f -n 50"
        fi

  infra:logs:host:*:
    desc: "Tail journal logs for a host via ssh (default unit: go-backend)"
    vars:
      HOST: '{{index .MATCH 0}}'
      UNIT: '{{.UNIT | default "go-backend"}}'
    cmds:
      - ssh {{.HOST}} "journalctl -fu {{.UNIT}}"

  infra:deploy:menu:
    desc: Choose a deployment target
    cmds:
      - |
        choice=$(
          {
            printf '%s\n' "infra:deploy:host:{{.PI}}"
            printf '%s\n' infra:deploy:host:garnixMachine infra:deploy:host:mtfuji infra:deploy:host:frieren infra:deploy:host:kellerbench infra:deploy:host:deckstation
            printf '%s\n' exit
          } | awk '!seen[$0]++' | gum choose
        )
        [ "$choice" = "exit" ] || task "$choice"

  infra:logs:menu:
    desc: Choose a logs target
    cmds:
      - |
        host=$(
          {
            printf '%s\n' {{.PI}}
            printf '%s\n' garnixMachine mtfuji frieren kellerbench deckstation
            printf '%s\n' exit
          } | awk '!seen[$0]++' | gum choose
        )
        [ "$host" = "exit" ] || task infra:logs:host:$host

  vm:canary:build:
    desc: Build the frieren-canary microVM runner (EXP-102)
    cmds:
      - nix build .#nixosConfigurations.frieren-canary.config.microvm.declaredRunner -o result-canary

  vm:canary:run:
    desc: Run the frieren-canary microVM interactively (EXP-102)
    cmds:
      - |
        if [ ! -e result-canary ]; then
          task vm:canary:build
        fi
        sudo scripts/task/run-canary.sh

  vm:canary:test:
    desc: Automated boot, SSH health check, Tailscale reverse-proxy verification, and graceful shutdown (EXP-102)
    cmds:
      - |
        if [ ! -e result-canary ]; then
          task vm:canary:build
        fi
        echo "==> [1/6] Launching frieren-canary VM in background..."
        LOGFILE="/tmp/canary-test.log"
        sudo scripts/task/run-canary.sh > "$LOGFILE" 2>&1 &
        RUNNER_PID=$!
        trap "sudo pkill -f 'microvm@frieren-canary' 2>/dev/null || true; wait $RUNNER_PID 2>/dev/null || true" EXIT

        echo "==> [2/6] Probing persistent SSH on frieren-canary (192.168.83.10)..."
        MAX_WAIT=20
        CONNECTED=0
        for i in $(seq 1 $MAX_WAIT); do
          if ssh -o BatchMode=yes -o ConnectTimeout=1 frieren-canary "echo ok" >/dev/null 2>&1; then
            CONNECTED=1
            echo "==> frieren-canary SSH ready in $i s!"
            break
          fi
          sleep 0.5
        done

        if [ "$CONNECTED" -ne 1 ]; then
          echo "ERROR: Failed to connect via SSH to frieren-canary within $MAX_WAIT s"
          cat "$LOGFILE"
          exit 1
        fi

        echo "==> [3/6] Inspecting guest system isolation..."
        ssh frieren-canary "hostname && uptime && free -m && df -h /var /nix/store"

        echo "==> [4/6] Verifying dummy API directly (192.168.83.10:8080)..."
        curl -sSf http://192.168.83.10:8080/ | jq .

        echo "==> [5/6] Verifying Model B Reverse Proxy via Hypervisor Nginx & Tailscale..."
        curl -sSf http://127.0.0.1/canary/ | jq .
        curl -sSf http://100.97.61.65/canary/ | jq .
        curl -sSf -H "Host: canary.frieren.lan" http://100.97.61.65/ | jq .

        echo "==> [6/6] Triggering clean guest shutdown & verifying teardown 504..."
        ssh frieren-canary "sudo systemctl poweroff" || true
        wait $RUNNER_PID 2>/dev/null || true

        # Verify Nginx gracefully returns 504 on teardown
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://100.97.61.65/canary/ || true)
        echo "==> Post-teardown HTTP status: $HTTP_CODE (expected: 504)"

        echo "==> EXP-102 Canary microVM Model B dogfood test passed successfully!"

  vm:canary:ssh:
    desc: Open interactive SSH shell into frieren-canary microVM
    cmds:
      - |
        if ! ssh -o BatchMode=yes -o ConnectTimeout=1 frieren-canary "true" >/dev/null 2>&1; then
          echo "Error: frieren-canary is not responding to SSH. Launch it with: task vm:canary:run" >&2
          exit 1
        fi
        ssh -t frieren-canary "bash -l"

  vm:canary:agent:
    desc: Execute subzeroclaw agent task inside frieren-canary microVM (e.g. task vm:canary:agent -- "prompt")
    cmds:
      - |
        if ! ssh -o BatchMode=yes -o ConnectTimeout=1 frieren-canary "true" >/dev/null 2>&1; then
          echo "Error: frieren-canary is not responding to SSH. Launch it with: task vm:canary:run" >&2
          exit 1
        fi
        ssh -t frieren-canary subzeroclaw {{if .CLI_ARGS}}{{.CLI_ARGS | q}}{{else}}"echo Hello World from inside the MicroVM sandbox"{{end}}

  vm:canary:stop:
    desc: Gracefully shut down frieren-canary microVM
    cmds:
      - |
        echo "==> Shutting down frieren-canary microVM..."
        ssh -o BatchMode=yes -o ConnectTimeout=2 frieren-canary "sudo systemctl poweroff" 2>/dev/null || true
        sleep 1
        sudo pkill -f 'microvm@frieren-canary' 2>/dev/null || true
        echo "==> Canary microVM stopped."
