version: "3"

tasks:
  agents:menu:
    desc: Interactive operator control plane menu (themed)
    cmds:
      - |
        choice=$(printf '%s\n' inventory modules "ssh & remotes" projects ops config secrets browse help exit | gum choose --header "Operator control plane")
        case "$choice" in
          inventory) task dev:inventory:menu ;;
          modules) task dev:modules:menu ;;
          "ssh & remotes") task agents:menu:ssh ;;
          projects) task agents:menu:projects ;;
          ops) task agents:menu:ops ;;
          config) task agents:menu:config ;;
          secrets) task agents:menu:secrets ;;
          browse) task browse ;;
          help) task help ;;
          exit) exit 0 ;;
        esac

  agents:menu:ssh:
    desc: "Theme: SSH, remote hosts & diagnostics"
    cmds:
      - |
        choice=$(printf '%s\n' "fleet-ssh" "diagnostics" serv00 dragoncourt envs moto wishlist incus sudologinssh exit | gum choose --header "SSH & remote hosts")
        case "$choice" in
          "fleet-ssh") task agents:ssh:fleet ;;
          diagnostics) task agents:menu:diagnostics ;;
          serv00) task serv00:menu ;;
          dragoncourt) task dragoncourt:menu ;;
          envs) task envs:menu ;;
          moto) task moto:menu ;;
          wishlist|incus|sudologinssh) task "$choice" ;;
          exit) exit 0 ;;
        esac

  agents:ssh:fleet:
    desc: Interactive SSH picker across active fleet devices
    cmds:
      - |
        selected=$(yq -r '.hosts | to_entries | .[] | select(.value.status == "active") |
          [
            .key,
            .value.kind,
            (.value.network.lan_ip // "dynamic"),
            (if .value.network.tailscale then "tailscale" else "lan" end),
            .value.role
          ] | @tsv' inventory.toml | awk -F'\t' '{printf "%-14s [%-7s | %-15s | %-9s] %s\n", $1, $2, $3, $4, $5}' | gum filter --placeholder "Select active host to SSH...")
        [ -z "$selected" ] && exit 0
        host=$(echo "$selected" | awk '{print $1}')
        kind=$(yq -r ".hosts[\"$host\"].kind" inventory.toml)
        # External shards own their connection details (user@host, non-22 ports).
        # network.ssh_alias is a label there, not an ~/.ssh/config entry: that file
        # is Home Manager generated and only carries `Host *`, so `ssh serv00`
        # cannot resolve. Dispatch to <host>:ssh instead of reconstructing it here.
        if [ "$kind" = "external" ]; then
          if task --list-all 2>/dev/null | grep -qE "^\* ${host}:ssh:"; then
            exec task "${host}:ssh"
          fi
          echo "$host has no SSH surface (no ${host}:ssh task)."
          exit 0
        fi
        # Use network.ssh_alias, not the inventory key: external hosts can need an
        # explicit remote user (bitlockerpremium -> benutzer@bitlockerpremium).
        # For every other active host the alias equals the key, so this is a no-op.
        target=$(yq -r ".hosts[\"$host\"].network.ssh_alias // \"$host\"" inventory.toml)
        echo "Connecting to $target..."
        ssh "$target"

  agents:menu:diagnostics:
    desc: "Theme: Remote host & service diagnostics"
    cmds:
      - |
        choice=$(printf '%s\n' "host-health" "external-audit" "cache-probe" "sops-drift" exit | gum choose --header "Remote host & service diagnostics")
        case "$choice" in
          "host-health")
            selected=$(yq -r '.hosts | to_entries | .[] | select(.value.status == "active" and (.value.kind == "nixos" or .value.kind == "darwin")) | .key' inventory.toml | gum filter --placeholder "Select host for systemd probe...")
            [ -z "$selected" ] && exit 0
            echo "Probing $selected systemd status..."
            ssh "$selected" "systemctl is-system-running; echo 'Failed units:'; systemctl --failed --no-pager"
            ;;
          "external-audit") task checks:remotes ;;
          "cache-probe")
            echo "Probing frieren LAN binary cache (:5000)..."
            curl -sI http://192.168.3.25:5000/nix-cache-info || echo "Cache unreachable"
            ;;
          "sops-drift") task checks:sops:drift ;;
          exit) exit 0 ;;
        esac

  agents:menu:projects:
    desc: "Theme: apps & side projects"
    cmds:
      - |
        choice=$(printf '%s\n' apps bountystash exit | gum choose --header "Apps & projects")
        case "$choice" in
          apps) task apps:menu ;;
          bountystash) task bountystash:menu ;;
          exit) exit 0 ;;
        esac

  agents:menu:ops:
    desc: "Theme: system ops, maintenance & deployments"
    cmds:
      - |
        choice=$(printf '%s\n' rebuild check deploy logs store cache update status load-env exit | gum choose --header "System ops")
        case "$choice" in
          rebuild) task agents:menu:rebuild ;;
          check) task agents:menu:check ;;
          deploy) task infra:deploy:menu ;;
          logs) task infra:logs:menu ;;
          store) task infra:store:menu ;;
          cache) task infra:warm:cache ;;
          update) task infra:update:fleet ;;
          status) task status ;;
          load-env) task infra:load:menu ;;
          exit) exit 0 ;;
        esac

  agents:menu:rebuild:
    desc: Interactive system rebuild & switch picker
    cmds:
      - |
        choice=$(printf '%s\n' "nixos-local" "darwin-local" "home-manager-local" "deploy-remote" "fleet-parallel" exit | gum choose --header "Rebuild & deployment options")
        case "$choice" in
          "nixos-local") NOM=1 task infra:rebuild:nixos ;;
          "darwin-local") NOM=1 task infra:rebuild:darwin ;;
          "home-manager-local") NOM=1 task infra:rebuild:home-manager ;;
          "deploy-remote") task infra:deploy:menu ;;
          "fleet-parallel") task infra:apply:fleet ;;
          exit) exit 0 ;;
        esac

  agents:menu:check:
    desc: Interactive repo validation and check picker
    cmds:
      - |
        choice=$(printf '%s\n' "quick" "modules" "inventory" "host" "hosts" "sops-drift" "nix-lint" "remotes" exit | gum choose --header "Validation checks")
        case "$choice" in
          quick) task checks:quick ;;
          modules) task checks:modules:validate ;;
          inventory) task checks:inventory:sync ;;
          # Per-host eval + assertion gate, one host at a time (the fleet-wide
          # `host-architecture` check this replaced evaluated all 23 hosts in one
          # process and was SIGKILLed at 6078 MiB).
          host) task checks:host HOST="$(gum input --header 'Host name' --value "${HOST:-frieren}")" ;;
          hosts) task checks:hosts ;;
          "sops-drift") task checks:sops:drift ;;
          "nix-lint") task checks:nix:lint ;;
          remotes) task checks:remotes ;;
          exit) exit 0 ;;
        esac

  agents:menu:config:
    desc: "Theme: configuration & declarations"
    cmds:
      - |
        choice=$(printf '%s\n' modules inventory secrets nix-modules ssh-ca exit | gum choose --header "Configuration & declarations")
        case "$choice" in
          modules) task dev:modules:menu ;;
          inventory) task dev:inventory:menu ;;
          secrets) task agents:menu:secrets ;;
          nix-modules) task agents:menu:nix-modules ;;
          ssh-ca) task agents:menu:ssh-ca ;;
          exit) exit 0 ;;
        esac

  agents:menu:nix-modules:
    desc: Jump to core Nix module in $EDITOR
    cmds:
      - |
        choice=$(printf '%s\n' "global.nix" "nixos.nix" "home-role.nix" "shell.nix" "sops.nix" "flake.nix" exit | gum choose --header "Select Nix configuration to edit")
        case "$choice" in
          "global.nix") ${EDITOR:-nano} modules/global/global.nix ;;
          "nixos.nix") ${EDITOR:-nano} modules/global/nixos.nix ;;
          "home-role.nix") ${EDITOR:-nano} modules/roles/home.nix ;;
          "shell.nix") ${EDITOR:-nano} modules/shell/default.nix ;;
          "sops.nix") ${EDITOR:-nano} modules/sops.nix ;;
          "flake.nix") ${EDITOR:-nano} flake.nix ;;
          exit) exit 0 ;;
        esac

  agents:menu:ssh-ca:
    desc: SSH Certificate Authority management
    cmds:
      - |
        choice=$(printf '%s\n' "status" "rotate-cert" "add-workstation" exit | gum choose --header "SSH CA operations")
        case "$choice" in
          status) task infra:ssh:status ;;
          "rotate-cert") task infra:ssh:rotate-cert ;;
          "add-workstation")
            age_key=$(gum input --placeholder "Enter recipient age key (age1...)")
            [ -n "$age_key" ] && task infra:ssh:add-workstation AGE="$age_key"
            ;;
          exit) exit 0 ;;
        esac

  agents:menu:secrets:
    desc: "Theme: SOPS encrypted secrets management"
    cmds:
      - |
        choice=$(printf '%s\n' "edit-apikeys" "edit-secrets" "edit-taskfile" "edit-detaskfile" "sync-mirror" "check-drift" "update-keys" "new-key" exit | gum choose --header "SOPS Secrets management")
        case "$choice" in
          "edit-apikeys") task infra:secrets:edit:apikeys ;;
          "edit-secrets") task infra:secrets:edit:secrets ;;
          "edit-taskfile") task infra:secrets:edit:taskfile ;;
          "edit-detaskfile") task infra:secrets:edit:detaskfile ;;
          "sync-mirror") task infra:secrets:sync ;;
          "check-drift") task checks:sops:drift ;;
          "update-keys") task infra:sops:update-keys ;;
          "new-key") task infra:secrets:new:generate ;;
          exit) exit 0 ;;
        esac

  agents:call:
    desc: "Edge caller: needle3 picks a graph lookup for Q= and prefetches it as TOON"
    summary: >
      scripts/task/toolcall.sh — the tool set is DERIVED from `.#taskfileGraph`, so a
      tool exists only when a task does. Class before score: READ-ONLY tools
      (`ops:kg:*`, `ops:ask`) prefetch on any validated call, so context arrives in
      one call instead of a reasoning round; everything else keeps the bands
      (>= ACT runs, >= CONFIRM shows it, below declines). The argument's type is
      repaired from the graph, and an unresolvable call falls through to `ops:ask`.
      Output is TOON; --json for programs. An invented tool is still refused.
      Exit 0 acted, 2 = hand the turn to a reasoner, 3 = confirmation.
    requires:
      vars: [Q]
    cmds:
      - bash scripts/task/toolcall.sh --prompt "{{.Q}}"

  agents:call:batch:
    desc: "Pipe prompts through the edge caller: one JSON line per call (stdin -> stdout)"
    summary: >
      scripts/task/toolcall.sh --batch — prompts on stdin (one per line, or{"prompt":...}),
      one compact JSON line out per call: n, ms, exit, gate, decision, pareto, task,
      confidence and the context. This replaces wrapping a long pipeline in `timeout`:
      every step is its own bounded call (TOOLCALL_STEP_S, default 20s), so a slow step
      is NAMED instead of being fatal to the run. gate=ok|escalated|confirm|timeout|harness;
      the process exits 1 when any step failed or timed out. stdout stays pure JSON (the
      summary goes to stderr), so it pipes into jq.
    cmds:
      - bash scripts/task/toolcall.sh --batch

  agents:edge:
    desc: "Resident edge caller: needle3 stays loaded so a prefetch pays prefill, not startup"
    summary: >
      scripts/task/edge-sidecar.sh — the same caller, resident. Measured 2026-11-02:
      0.85-0.95 s per call resident vs 1.3-1.5 s one-shot for the same pick; ~600 ms
      of the one-shot cost was process start plus weight load. The engine is a SESSION, so
      every ask resets first (an unreset context grew 1147 -> 1811 ms over five
      calls); a server whose tool surface changed is restarted, not reloaded. CMD=
      status (default) or stop. `agents:call` uses this when it is up and falls back
      to one shot when it is not — a warm caller is an optimisation, never a
      dependency.
    requires:
      vars: [CMD]
    cmds:
      - 'bash scripts/task/edge-sidecar.sh "{{.CMD | default "status"}}"'

  agents:xs:post:
    desc: "Post one xs turn from a template (SUBJECT, ACTION, RATIONALE - no JSON)"
    summary: >
      Renders scripts/task/xs-turn.jq - the schema - and posts it, filling id, ts,
      source, base_commit and branch; values cross as environment variables, so
      prose with quotes stays literal and no caller builds JSON. Needs
      SUBJECT=<repo>:<task-id> and ACTION; optional RATIONALE, OUTCOME, SOURCE,
      FILES/COMMITS/CLAIMS (comma-separated), ID (retry), BASE_COMMIT/BRANCH. An
      unreachable endpoint queues the body; the next successful post replays it.
      Exit 2 = bad input (nothing sent), exit 3 = no token, exit 4 = transport (now
      queued), exit 5 = rejected.
    requires:
      vars: [SUBJECT, ACTION]
    env:
      SUBJECT: "{{.SUBJECT}}"
      ACTION: "{{.ACTION}}"
      RATIONALE: "{{.RATIONALE | default \"\"}}"
      OUTCOME: "{{.OUTCOME | default \"done\"}}"
      SOURCE: "{{.SOURCE | default \"\"}}"
      FILES: "{{.FILES | default \"\"}}"
      COMMITS: "{{.COMMITS | default \"\"}}"
      CLAIMS: "{{.CLAIMS | default \"\"}}"
      ID: "{{.ID | default \"\"}}"
      BASE_COMMIT: "{{.BASE_COMMIT | default \"\"}}"
      BRANCH: "{{.BRANCH | default \"\"}}"
    cmds:
      - bash scripts/task/xs-turn-post.sh

  agents:xs:list:
    desc: "List recent xs turns (REPO, SUBJECT, SOURCE, LIMIT) and flag live claims — TOON, FORMAT=table for a person"
    summary: >
      Reads the log before starting: newest turn first, then the live claims (the
      newest entry per subject that says in_progress), then a verdict. REPO=,
      SUBJECT= and SOURCE= filter; LIMIT= 1-200, default 20; CLAIM='area,file'
      flags a live entry whose claims overlap yours. Output is TOON by default
      (JSON is the same payload, table is for a person). Exit 1 = a live claim on
      SUBJECT or an overlap with CLAIM (stop and report the collision), exit 2 =
      no auth or the endpoint did not answer.
    env:
      REPO: "{{.REPO | default \"\"}}"
      SUBJECT: "{{.SUBJECT | default \"\"}}"
      SOURCE: "{{.SOURCE | default \"\"}}"
      LIMIT: "{{.LIMIT | default \"20\"}}"
      CLAIM: "{{.CLAIM | default \"\"}}"
      FORMAT: "{{.FORMAT | default \"toon\"}}"
    cmds:
      - bash scripts/task/xs-turn-list.sh

  browse:
    desc: "[deprecated] Legacy browse menu - use direct commands"
    cmds:
      - |
        choice=$(printf '%s\n' browse-notes browse-internet browse-projects exit | gum choose)
        task "$choice"

  browse-notes:
    desc: Open quick notes
    cmds:
      - $EDITOR ~/Documents/Obsidian-Git-Sync/quicknote.md

  browse-internet:
    desc: Open browser search
    cmds:
      - zen https://duckduckgo.com

  browse-projects:
    desc: Open projects page
    aliases: [projects]
    cmds:
      - zen https://shaoyanji.github.io

  edit-config:
    desc: "[deprecated] Legacy edit-config menu - use task agents:menu:config or direct file edits"
    cmds:
      - task agents:menu:config

  update:
    desc: "[deprecated] Legacy update menu - use dev:git:* or dev:flake:* directly"
    cmds:
      - |
        choice=$(printf '%s\n' dev:git:ai-commit-push dev:git:quick-pull dev:flake:update-branch infra:sops:update-keys exit | gum choose)
        task "$choice"

  new:
    desc: "[deprecated] Legacy bootstrap menu - use infra:secrets:new:* directly"
    cmds:
      - |
        choice=$(printf '%s\n' infra:secrets:new:generate infra:secrets:new:copy-nas exit | gum choose)
        task "$choice"

  incus:
    desc: Launch and attach to a temporary NixOS Incus container
    cmds:
      - sudo incus launch "images:nixos/unstable" nixos -c security.nesting=true
      - sudo incus list
      - sudo incus console nixos

  sudologinssh:
    desc: Run a sudo-login command from encrypted server command list
    cmds:
      - ssh $(sops -d --extract '["server"]["commands"]' {{.SECRETS}}/{{.ENC_SECRETS}} | gum choose)

  # --- mail triage: who owns an incoming message --------------------------
  # The verdicts live in `email_triage` (delphi); these tasks read and write it
  # through the loopback API. docs/email-archive.md.
  agents:mail:resolve:
    desc: "Mark one message done for a person: ID= is the message id a queue row carries (exit 1 when nothing was open)"
    summary: >
      The endpoint returns the rows it changed, so an id with no open verdict is
      not a success: a task that printed "resolved" for anything would make the
      queue look handled while nothing moved.
    vars:
      ID: '{{.ID | default ""}}'
    cmds:
      - |
        [ -n "{{.ID}}" ] || { echo "agents:mail:resolve: ID is required (take it from agents:mail:attention)" >&2; exit 2; }
        changed="$(curl -fsS --max-time 20 -X POST -H 'content-type: application/json' \
          -d "$(jq -nc --arg m "{{.ID}}" '{messageId: $m}')" \
          "${EMAIL_ARCHIVE_API:-http://127.0.0.1:8080}/api/triage-resolve")"
        n="$(jq 'length' <<<"$changed")"
        [ "$n" -gt 0 ] || { echo "agents:mail:resolve: nothing open for {{.ID}}" >&2; exit 1; }
        echo "resolved {{.ID}} ($n verdict(s))"

  agents:mail:sweep:
    desc: "Resolve a block of the human queue by selector (SENDER= DOMAIN= SUBJECT= TIER= OLDER= NEWER=; dry run unless DRY=0)"
    summary: >
      One decision per sender, not 511 per message. Selectors combine with AND
      and at least one is required, so a mistyped command cannot empty the queue.
      Prints what matched, by tier and by sender, before anything is written;
      DRY=0 resolves every match through /api/triage-resolve, which only sets
      `resolved_at` — the mail stays archived and searchable. FORMAT=json and
      FORMAT=text exist; TOON is the default because an agent is the reader.
    vars:
      SENDER: '{{.SENDER | default ""}}'
      DOMAIN: '{{.DOMAIN | default ""}}'
      SUBJECT: '{{.SUBJECT | default ""}}'
      TIER: '{{.TIER | default ""}}'
      OLDER: '{{.OLDER | default ""}}'
      NEWER: '{{.NEWER | default ""}}'
      LIMIT: '{{.LIMIT | default "0"}}'
      DRY: '{{.DRY | default "1"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        [ -n "{{.SENDER}}{{.DOMAIN}}{{.SUBJECT}}{{.TIER}}{{.OLDER}}{{.NEWER}}" ] || {
          echo "agents:mail:sweep: a selector is required (SENDER= DOMAIN= SUBJECT= TIER= OLDER= NEWER=)" >&2
          exit 2; }
        args=(--sender "{{.SENDER}}" --domain "{{.DOMAIN}}" --subject "{{.SUBJECT}}"
              --tier "{{.TIER}}" --limit "{{.LIMIT}}")
        [ -n "{{.OLDER}}" ] && args+=(--older "{{.OLDER}}")
        [ -n "{{.NEWER}}" ] && args+=(--newer "{{.NEWER}}")
        [ "{{.DRY}}" != "1" ] && args+=(--apply)
        case "{{.FORMAT}}" in
          text) python3 scripts/task/email-sweep.py "${args[@]}" ;;
          json) python3 scripts/task/email-sweep.py --json "${args[@]}" ;;
          *) python3 scripts/task/email-sweep.py --json "${args[@]}" | toon -e ;;
        esac

  agents:ci:drain:
    desc: "Close CI notices that are stale or superseded by a newer one (TOON; FORMAT=text for a person, FULL=1 for every id, DRY=1, DAYS=14)"
    summary: >
      The queue's drainer, also run as the triage unit's ExecStartPost. A notice
      older than DAYS is stale; within a repo+workflow group only the newest
      survives, because the earlier ones describe a replaced state. Output is a
      count plus five rows — a 237-id list is not a report.
    vars:
      DAYS: '{{.DAYS | default "14"}}'
      DRY: '{{.DRY | default "0"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
      FULL: '{{.FULL | default "0"}}'
    cmds:
      - |
        # The packaged binary is the deployed copy; the repo file is the same
        # commit and is what you have before a switch.
        drain=(email-archive-ci-drain)
        command -v "${drain[0]}" >/dev/null 2>&1 || drain=(python3 modules/services/email-ci-drain.py)
        args=(--days "{{.DAYS}}")
        [ "{{.DRY}}" = "1" ] && args+=(--dry-run)
        [ "{{.FULL}}" = "1" ] && args+=(--full)
        if [ "{{.FORMAT}}" = "text" ]; then
          "${drain[@]}" "${args[@]}"
        else
          "${drain[@]}" --json "${args[@]}" |
            { if [ "{{.FORMAT}}" = "json" ]; then cat; else toon -e; fi; }
        fi

  agents:mail:triage:
    desc: "Classify archived mail into tiers and owners; CLI_ARGS passes --report, --dry-run, --no-engine"
    cmds:
      - |
        if command -v email-archive-triage >/dev/null 2>&1; then
          email-archive-triage {{.CLI_ARGS}}
        else
          echo "email-archive-triage is not on PATH: the archive lives on delphi (ssh delphi, then this task)" >&2
          exit 1
        fi

  agents:mail:attention:
    desc: "What needs a person: person, action and review, unresolved, newest first (TOON; FORMAT=text for a table, LIM=20)"
    vars:
      LIM: '{{.LIM | default "20"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        rows="$(curl -fsS --max-time 20 "${EMAIL_ARCHIVE_API:-http://127.0.0.1:8080}/api/attention?lim={{.LIM}}")"
        case "{{.FORMAT}}" in
          text) printf '%s' "$rows" | jq -r '.[]? | "\(.sentAt[0:16])  \(.tier)  \(.subject[0:70])"' ;;
          json) printf '%s' "$rows" ;;
          *) printf '%s' "$rows" | toon -e ;;
        esac

  agents:mail:digest:
    desc: "The newsletter batch: digest-tier mail from the last DAYS days (TOON; FORMAT=text for a table, LIM=200)"
    vars:
      DAYS: '{{.DAYS | default "7"}}'
      LIM: '{{.LIM | default "200"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        rows="$(curl -fsS --max-time 20 "${EMAIL_ARCHIVE_API:-http://127.0.0.1:8080}/api/triage-digest?days={{.DAYS}}&lim={{.LIM}}")"
        case "{{.FORMAT}}" in
          text) printf '%s' "$rows" | jq -r '.[]? | "\(.sentAt[0:10])  \(.sender[0:40])  \(.subject[0:70])"' ;;
          json) printf '%s' "$rows" ;;
          *) printf '%s' "$rows" | toon -e ;;
        esac

  agents:ci:queue:
    desc: "Unresolved CI and robot mail an agent owns — the loop's own inbox (TOON; FORMAT=text for a table, LIM=50)"
    vars:
      LIM: '{{.LIM | default "50"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        rows="$(curl -fsS --max-time 20 "${EMAIL_ARCHIVE_API:-http://127.0.0.1:8080}/api/agent-queue?owner=agent&lim={{.LIM}}")"
        case "{{.FORMAT}}" in
          text) printf '%s' "$rows" | jq -r '.[]? | "\(.sentAt[0:16])  \(.owner)  \(.subject[0:60])  \(.messageId)"' ;;
          json) printf '%s' "$rows" ;;
          *) printf '%s' "$rows" | toon -e ;;
        esac

  agents:ci:fix:
    desc: "Launch a subagent on one failing CI run (RUN=12345, MESSAGE_ID optional; DRY=1 writes the prompt only)"
    vars:
      RUN: '{{.RUN | default ""}}'
      MESSAGE_ID: '{{.MESSAGE_ID | default ""}}'
      DRY: '{{.DRY | default "0"}}'
    cmds:
      - |
        args=(dispatch)
        [ -n "{{.RUN}}" ] && args+=(--run "{{.RUN}}")
        [ -n "{{.MESSAGE_ID}}" ] && args+=(--mail "{{.MESSAGE_ID}}")
        [ "{{.DRY}}" = "1" ] && args+=(--dry-run)
        bash scripts/task/ci-fix-dispatch.sh "${args[@]}"

  agents:ci:resolve:
    desc: "Mark the mail that reported a CI failure resolved, so it leaves the agent queue (MESSAGE_ID)"
    vars:
      MESSAGE_ID: '{{.MESSAGE_ID | default ""}}'
    cmds:
      - bash scripts/task/ci-fix-dispatch.sh resolve --mail "{{.MESSAGE_ID}}"

  # --- the job pipeline, in the same database as the mail that moves it -------
  # While the workflow's JSON is still the source of truth, FILE points at it
  # (`-` reads stdin, so `gh api … | base64 -d | task … FILE=-` works).
  agents:apps:import:
    desc: "Load applications.json into the archive DB and link it to mail (FILE=path or -, LINK=0 to skip)"
    vars:
      FILE: '{{.FILE | default ""}}'
      LINK: '{{.LINK | default "1"}}'
    cmds:
      - |
        [ -n "{{.FILE}}" ] || { echo "agents:apps:import: FILE is required (path, or - for stdin)" >&2; exit 2; }
        args=(--file "{{.FILE}}")
        [ "{{.LINK}}" = "1" ] && args+=(--link)
        appflow-sync "${args[@]}"

  agents:apps:pipeline:
    desc: "Pipeline by stage, plus applications whose mail nobody dealt with (TOON; FORMAT=text|json, the row set is the same)"
    vars:
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        case "{{.FORMAT}}" in
          text) appflow-sync --report ;;
          json) appflow-sync --report --json ;;
          *) appflow-sync --report --json | toon -e ;;
        esac

  agents:apps:set:
    desc: "Record a pipeline change from mail (ID=, STATUS=, NEXT=; the stage is derived where the sync derives it)"
    vars:
      ID: '{{.ID | default ""}}'
      STATUS: '{{.STATUS | default ""}}'
      NEXT: '{{.NEXT | default ""}}'
    cmds:
      - |
        [ -n "{{.ID}}" ] && [ -n "{{.STATUS}}" ] || { echo "agents:apps:set: ID and STATUS are required" >&2; exit 2; }
        appflow-sync --update "{{.ID}}" --status "{{.STATUS}}" --next "{{.NEXT}}"

  agents:hub:
    desc: "The mail hub: every plugin owner, how much of the archive waits for it, when it last acted (TOON; FORMAT=text for a table)"
    vars:
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        rows="$(curl -fsS --max-time 20 "${EMAIL_ARCHIVE_API:-http://127.0.0.1:8080}/api/plugins")"
        case "{{.FORMAT}}" in
          text) printf '%s' "$rows" | jq -r '.[]? | "\(.owner)  \(.kind)\topen \(.open)\tresolved \(.resolved)\tlast \(.lastDecision[0:16] // "-")"' | column -t -s$'\t' ;;
          json) printf '%s' "$rows" ;;
          *) printf '%s' "$rows" | toon -e ;;
        esac

  agents:apps:discovered:
    desc: "Applications the mail hub found on its own — not in the workflow's JSON (TOON; FORMAT=text, LIM=20)"
    vars:
      LIM: '{{.LIM | default "20"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        rows="$(curl -fsS --max-time 20 "${EMAIL_ARCHIVE_API:-http://127.0.0.1:8080}/api/applications-discovered?lim={{.LIM}}")"
        case "{{.FORMAT}}" in
          text) printf '%s' "$rows" | jq -r '.[]? | "\(.createdAt[0:10])  \(.company[0:32])  \(.status[0:40])"' ;;
          json) printf '%s' "$rows" ;;
          *) printf '%s' "$rows" | toon -e ;;
        esac

  agents:apps:packet:
    desc: "Build a packet through nix: a store path with the CV and letter PDFs (ID=, or EXAMPLE=1 for the fictional fixture; RESUME=, LETTER=, OUT=link)"
    vars:
      ID: '{{.ID | default ""}}'
      EXAMPLE: '{{.EXAMPLE | default "0"}}'
      OUT: '{{.OUT | default ""}}'
      RESUME: '{{.RESUME | default ""}}'
      LETTER: '{{.LETTER | default ""}}'
    cmds:
      - |
        args=()
        [ -n "{{.ID}}" ] && args+=(--id "{{.ID}}")
        [ "{{.EXAMPLE}}" = "1" ] && args+=(--example)
        [ -n "{{.OUT}}" ] && args+=(--out "{{.OUT}}")
        [ -n "{{.RESUME}}" ] && args+=(--resume "{{.RESUME}}")
        [ -n "{{.LETTER}}" ] && args+=(--letter "{{.LETTER}}")
        [ -n "{{.ID}}" ] || [ "{{.EXAMPLE}}" = "1" ] || {
          echo "agents:apps:packet: ID is required (or EXAMPLE=1)" >&2; exit 2; }
        bash scripts/task/appflow-packet.sh "${args[@]}"

  agents:apps:draft:
    desc: "Save a reply as a mailbox DRAFT — nothing is sent (ID=, BODY=file, ATTACH=file, TO=addr, DRY=1 to print only)"
    vars:
      ID: '{{.ID | default ""}}'
      BODY: '{{.BODY | default ""}}'
      ATTACH: '{{.ATTACH | default ""}}'
      TO: '{{.TO | default ""}}'
      DRY: '{{.DRY | default "0"}}'
    cmds:
      - |
        [ -n "{{.ID}}" ] && [ -n "{{.BODY}}" ] || {
          echo "agents:apps:draft: ID and BODY are required (BODY is prose a person signed; there is no template)" >&2; exit 2; }
        args=(--draft "{{.ID}}" --body "{{.BODY}}")
        [ -n "{{.TO}}" ] && args+=(--to "{{.TO}}")
        [ -n "{{.ATTACH}}" ] && args+=(--attach "{{.ATTACH}}")
        [ "{{.DRY}}" != "1" ] && args+=(--apply)
        appflow-sync "${args[@]}"

  agents:apps:drafts:
    desc: "What is sitting in the Drafts folder: subjects and dates, newest first (TOON; FORMAT=text)"
    vars:
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        case "{{.FORMAT}}" in
          text) appflow-sync --drafts ;;
          json) appflow-sync --drafts --json ;;
          *) appflow-sync --drafts --json | toon -e ;;
        esac

  agents:apps:export:
    desc: "Regenerate applications.json from the database, in the workflow's own shape (OUT=path or - for stdout)"
    vars:
      OUT: '{{.OUT | default "-"}}'
    cmds:
      - appflow-sync --export "{{.OUT}}"

  agents:apps:sync:
    desc: "Write the pipeline from ATS mail: status + next action per provable message, then close the mail (DRY=1 to preview)"
    vars:
      DRY: '{{.DRY | default "0"}}'
      LIM: '{{.LIM | default "50"}}'
    cmds:
      - |
        args=(--sync --sync-limit "{{.LIM}}")
        [ "{{.DRY}}" != "1" ] && args+=(--apply)
        appflow-sync "${args[@]}"

  agents:apps:queue:
    desc: "Application mail an agent owns — the pipeline's inbox (TOON; FORMAT=text for a table, LIM=20)"
    vars:
      LIM: '{{.LIM | default "20"}}'
      FORMAT: '{{.FORMAT | default "toon"}}'
    cmds:
      - |
        rows="$(curl -fsS --max-time 20 "${EMAIL_ARCHIVE_API:-http://127.0.0.1:8080}/api/agent-queue?owner=agent:apps&lim={{.LIM}}")"
        case "{{.FORMAT}}" in
          text) printf '%s' "$rows" | jq -r '.[]? | "\(.sentAt[0:10])  \(.subject[0:70])"' ;;
          json) printf '%s' "$rows" ;;
          *) printf '%s' "$rows" | toon -e ;;
        esac

  agents:ci:preflight:
    desc: "Run the two gates the CI docs-budget job runs, locally: no digest drift, no document over budget"
    cmds:
      - |
        bash scripts/task/docs-budget.sh
        nix eval --impure --raw "path:$(pwd)#checks.x86_64-linux.taskfile-digest-pin.outPath" \
          >/dev/null && echo "task graph pinned"
