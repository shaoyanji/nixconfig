[[deck.card]]
front = "obwohl"
back = "<b>Funktion:</b> Einräumung / Gegensatz: der Gegensatz besteht trotzdem.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, konjugiertes Verb am Ende. Der Hauptsatz kann davor oder dahinter stehen.<br><b>Beispiel:</b> <i>Obwohl der Kurs teuer war, hat er sich gelohnt.</i><br><b>Tipp:</b> Nach dem Nebensatz muss der Hauptsatz vollständig folgen: „Obwohl es regnete, gingen wir …“, nicht „…, wir gingen“."
tags = "konnektoren gegensatz subjunktion"

[[deck.card]]
front = "trotzdem"
back = "<b>Funktion:</b> Gegensatz zur vorherigen Aussage (Folge eines Zugeständnisses).<br><b>Satzstellung:</b> Adverb → Position 1 oder mitten im Satz; das Verb bleibt an Position 2.<br><b>Beispiel:</b> <i>Es regnete stark. Trotzdem machten wir einen Ausflug.</i><br><b>Tipp:</b> Nicht mit „trotz“ verwechseln: „trotz“ steht vor einem Nomen mit Genitiv (trotz des Regens)."
tags = "konnektoren gegensatz adverb"

[[deck.card]]
front = "dennoch"
back = "<b>Funktion:</b> wie „trotzdem“, aber schriftlich und gehoben.<br><b>Satzstellung:</b> Adverb → Position 1 oder nach dem Verb; Verb an Position 2.<br><b>Beispiel:</b> <i>Das Angebot war günstig. Dennoch habe ich abgelehnt.</i><br><b>Tipp:</b> In Beschwerdebriefen sehr passend; im Gespräch klingt „trotzdem“ natürlicher."
tags = "konnektoren gegensatz adverb schreiben"

[[deck.card]]
front = "zwar … aber"
back = "<b>Funktion:</b> Einräumung mit Gegensatz: erst zustimmen, dann einschränken.<br><b>Satzstellung:</b> „zwar“ eröffnet einen Hauptsatz (Verb an Position 2), „aber“ den zweiten.<br><b>Beispiel:</b> <i>Zwar ist die Wohnung klein, aber sie liegt sehr zentral.</i><br><b>Tipp:</b> Steht „zwar“ auf Position 1, rutscht das Verb direkt dahinter: „Zwar ist die Wohnung …“, nicht „Zwar die Wohnung ist …“."
tags = "konnektoren gegensatz zweiteilig"

[[deck.card]]
front = "zwar … dennoch"
back = "<b>Funktion:</b> Einräumung, im zweiten Teil formeller als „aber“.<br><b>Satzstellung:</b> zwar + Hauptsatz, dann dennoch + Hauptsatz (Verb an Position 2).<br><b>Beispiel:</b> <i>Zwar war die Prüfung schwer, dennoch haben alle bestanden.</i><br><b>Tipp:</b> Zwei Sätze statt einer Konstruktion — im Brief wirkt das ruhiger als ein langer Satz mit „aber“."
tags = "konnektoren gegensatz zweiteilig schreiben"

[[deck.card]]
front = "allerdings"
back = "<b>Funktion:</b> Einschränkung: „aber“ im Ton freundlicher, oft nach einer Zustimmung.<br><b>Satzstellung:</b> Adverb → meist nach dem Verb oder auf Position 1.<br><b>Beispiel:</b> <i>Das Hotel war sauber. Allerdings war das Zimmer sehr laut.</i><br><b>Tipp:</b> „allerdings“ allein heißt schon „aber“ — kein zusätzliches „aber“ im selben Satz."
tags = "konnektoren gegensatz adverb"

[[deck.card]]
front = "jedoch"
back = "<b>Funktion:</b> Gegensatz, schriftlich; steht oft mitten im Satz.<br><b>Satzstellung:</b> Adverb → Position 1 oder nach dem Bezugswort; Wortstellung bleibt sonst unverändert.<br><b>Beispiel:</b> <i>Die Lieferung kam pünktlich, die Verpackung jedoch war beschädigt.</i><br><b>Tipp:</b> Mitten im Satz ist „jedoch“ die eleganteste Variante im Brief."
tags = "konnektoren gegensatz adverb schreiben"

[[deck.card]]
front = "hingegen"
back = "<b>Funktion:</b> Gegenüberstellung zweier Aussagen oder Personen.<br><b>Satzstellung:</b> Adverb → Position 1 oder nach dem Bezugswort.<br><b>Beispiel:</b> <i>Im Sommer ist es hier heiß, im Winter hingegen sehr kalt.</i><br><b>Tipp:</b> Für Vergleiche; „dagegen“ ist die mündlichere Variante."
tags = "konnektoren gegensatz adverb"

[[deck.card]]
front = "dagegen"
back = "<b>Funktion:</b> Gegensatz (Adverb); als Präposition „gegen“ + Akkusativ.<br><b>Satzstellung:</b> Adverb → Position 1 oder nach dem Verb.<br><b>Beispiel:</b> <i>Ich trinke lieber Tee, mein Bruder trinkt dagegen Kaffee.</i><br><b>Tipp:</b> Präposition: „Ich habe nichts gegen den Plan.“"
tags = "konnektoren gegensatz adverb"

[[deck.card]]
front = "deshalb"
back = "<b>Funktion:</b> Folge: die zweite Aussage ist die Konsequenz der ersten.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Ich hatte keine Zeit, deshalb habe ich nicht geantwortet.</i><br><b>Tipp:</b> „deshalb“ nennt die FOLGE, nicht den Grund. Der Grund kommt mit „weil“ oder „denn“."
tags = "konnektoren folge adverb"

[[deck.card]]
front = "deswegen"
back = "<b>Funktion:</b> = deshalb (gleiche Bedeutung und Stellung).<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Der Zug fiel aus, deswegen kam ich zu spät.</i><br><b>Tipp:</b> Austauschbar mit „deshalb“; im Brief „deshalb“ oder „daher“ bevorzugen."
tags = "konnektoren folge adverb"

[[deck.card]]
front = "daher"
back = "<b>Funktion:</b> Folge, schriftlicher als „deshalb“.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Die Preise sind gestiegen; daher bleiben viele Kunden aus.</i><br><b>Tipp:</b> Sehr passend in der Argumentation eines Briefes oder Aufsatzes."
tags = "konnektoren folge adverb schreiben"

[[deck.card]]
front = "folglich"
back = "<b>Funktion:</b> logische Folge, formell.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Die Frist ist abgelaufen. Folglich ist die Bewerbung nicht mehr gültig.</i><br><b>Tipp:</b> Nur wenn die Folge wirklich zwingend ist; sonst klingt es übertrieben."
tags = "konnektoren folge adverb schreiben"

[[deck.card]]
front = "infolgedessen"
back = "<b>Funktion:</b> Folge im Amts- und Geschäftsstil.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Es gab keine Einwände; infolgedessen wurde der Plan angenommen.</i><br><b>Tipp:</b> Sehr formell — in einer Prüfung ein Plus, im Alltag selten."
tags = "konnektoren folge adverb schreiben"

[[deck.card]]
front = "weil"
back = "<b>Funktion:</b> Grund / Ursache.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Ich bleibe zu Hause, weil ich krank bin.</i><br><b>Tipp:</b> Vergleiche: „denn“ (Hauptsatz, Position 0) und „wegen“ (Präposition + Genitiv)."
tags = "konnektoren grund subjunktion"

[[deck.card]]
front = "denn"
back = "<b>Funktion:</b> Grund, aber als Hauptsatzkonjunktion.<br><b>Satzstellung:</b> Position 0: die Wortstellung bleibt wie im Hauptsatz (Subjekt + Verb).<br><b>Beispiel:</b> <i>Ich bleibe zu Hause, denn ich bin krank.</i><br><b>Tipp:</b> Nach „denn“ folgt keine Verbletztstellung — der häufigste Fehler bei diesem Wort."
tags = "konnektoren grund konjunktion"

[[deck.card]]
front = "wegen"
back = "<b>Funktion:</b> Grund, als Präposition vor einem Nomen.<br><b>Satzstellung:</b> Präposition mit Genitiv: wegen des schlechten Wetters.<br><b>Beispiel:</b> <i>Wegen des Streiks kam der Bus nicht.</i><br><b>Tipp:</b> „wegen dem Wetter“ hört man, ist aber umgangssprachlich — im Brief „wegen des Wetters“."
tags = "konnektoren grund präposition genitiv"

[[deck.card]]
front = "aufgrund"
back = "<b>Funktion:</b> Grund, formeller als „wegen“.<br><b>Satzstellung:</b> Präposition mit Genitiv: aufgrund der vielen Anfragen.<br><b>Beispiel:</b> <i>Aufgrund der vielen Anfragen müssen wir den Termin verschieben.</i><br><b>Tipp:</b> Feststehend: „aufgrund“ (ein Wort), nicht „auf Grund“."
tags = "konnektoren grund präposition genitiv schreiben"

[[deck.card]]
front = "trotz"
back = "<b>Funktion:</b> Gegensatz, als Präposition vor einem Nomen.<br><b>Satzstellung:</b> Präposition mit Genitiv: trotz des Regens.<br><b>Beispiel:</b> <i>Trotz des Regens fand das Fest im Garten statt.</i><br><b>Tipp:</b> Der Satz mit „trotz“ hat keinen Nebensatz — deshalb braucht er ein normales Hauptsatz-Verb."
tags = "konnektoren gegensatz präposition genitiv"

[[deck.card]]
front = "zumal"
back = "<b>Funktion:</b> zusätzlicher, verstärkender Grund (gehoben).<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Ich nehme den Zug, zumal ich dann während der Fahrt arbeiten kann.</i><br><b>Tipp:</b> Signalisiert: der Grund kommt obendrauf, es gibt schon einen anderen."
tags = "konnektoren grund subjunktion"

[[deck.card]]
front = "während (temporal)"
back = "<b>Funktion:</b> zwei Handlungen laufen gleichzeitig.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Während ich koche, hört er Musik.</i><br><b>Tipp:</b> Gleichzeitigkeit: beide Teile stehen normalerweise im gleichen Tempus."
tags = "konnektoren temporal subjunktion"

[[deck.card]]
front = "während (kontrastiv)"
back = "<b>Funktion:</b> Gegensatz zwischen zwei Aussagen (schriftlich).<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Während die einen sparen, geben die anderen immer mehr Geld aus.</i><br><b>Tipp:</b> In Aufsätzen die schönste Form des Gegensatzes; im Brief eher „hingegen“."
tags = "konnektoren gegensatz subjunktion schreiben"

[[deck.card]]
front = "nachdem"
back = "<b>Funktion:</b> Vorzeitigkeit: eine Handlung ist abgeschlossen, bevor die nächste beginnt.<br><b>Satzstellung:</b> Subjunktion → Nebensatz; Zeitfolge: Plusquamperfekt im Nebensatz, Präteritum/Perfekt im Hauptsatz.<br><b>Beispiel:</b> <i>Nachdem ich gegessen hatte, ging ich spazieren.</i><br><b>Tipp:</b> „Nachdem ich gegessen habe, ging ich“ ist falsch — die Zeiten müssen die Reihenfolge zeigen."
tags = "konnektoren temporal subjunktion"

[[deck.card]]
front = "bevor"
back = "<b>Funktion:</b> Nachzeitigkeit: die Handlung im Hauptsatz kommt zuerst.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Bevor ich gehe, räume ich die Küche auf.</i><br><b>Tipp:</b> Gleiche Zeitform in beiden Teilen ist normal (Gegenteil von „nachdem“)."
tags = "konnektoren temporal subjunktion"

[[deck.card]]
front = "seitdem"
back = "<b>Funktion:</b> Beginn in der Vergangenheit, Wirkung bis jetzt.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Seitdem ich in Berlin wohne, fahre ich fast täglich Rad.</i><br><b>Tipp:</b> Hauptsatz im Präsens, wenn die Wirkung bis heute gilt."
tags = "konnektoren temporal subjunktion"

[[deck.card]]
front = "solange"
back = "<b>Funktion:</b> Zeitraum, in dem etwas gilt.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Solange die Heizung nicht repariert ist, bleibt die Wohnung kalt.</i><br><b>Tipp:</b> Nicht mit „so lange“ (Dauer als Angabe) verwechseln."
tags = "konnektoren temporal subjunktion"

[[deck.card]]
front = "bis"
back = "<b>Funktion:</b> Endpunkt einer Handlung.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Warte bitte, bis ich fertig bin.</i><br><b>Tipp:</b> Nach „bis“ kein „dass“ und kein „wenn“."
tags = "konnektoren temporal subjunktion"

[[deck.card]]
front = "sobald"
back = "<b>Funktion:</b> unmittelbar nach einem Zeitpunkt; „so früh wie möglich“.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Sobald ich die Ergebnisse habe, schreibe ich Ihnen.</i><br><b>Tipp:</b> Im Brief die höfliche Alternative zu „wenn … dann“."
tags = "konnektoren temporal subjunktion schreiben"

[[deck.card]]
front = "als (einmalig)"
back = "<b>Funktion:</b> einmaliges Ereignis in der Vergangenheit.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende; Vergangenheit.<br><b>Beispiel:</b> <i>Als ich in Hamburg ankam, regnete es.</i><br><b>Tipp:</b> Einmalig → „als“; wiederholt oder Gegenwart → „wenn“."
tags = "konnektoren temporal subjunktion"

[[deck.card]]
front = "wenn (wiederholt / Gegenwart)"
back = "<b>Funktion:</b> wiederholtes Ereignis oder Bedingung in Gegenwart und Zukunft.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Wenn ich Zeit habe, komme ich vorbei.</i><br><b>Tipp:</b> Auch Bedingung: „Wenn die Ware morgen kommt, ist alles in Ordnung.“"
tags = "konnektoren temporal subjunktion bedingung"

[[deck.card]]
front = "falls"
back = "<b>Funktion:</b> Bedingung, deren Eintreten unsicher ist.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Falls Sie Fragen haben, rufen Sie mich bitte an.</i><br><b>Tipp:</b> Höflicher und vorsichtiger als „wenn“; im Brief sehr üblich."
tags = "konnektoren bedingung subjunktion schreiben"

[[deck.card]]
front = "sofern"
back = "<b>Funktion:</b> Bedingung, formell und geschäftlich.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Sofern die Ware bis Freitag eintrifft, halten wir den Termin.</i><br><b>Tipp:</b> Nur in formellen Texten; „falls“ ist die allgemeinere Wahl."
tags = "konnektoren bedingung subjunktion schreiben"

[[deck.card]]
front = "wenn … dann"
back = "<b>Funktion:</b> Bedingung mit Nachdruck auf der Folge.<br><b>Satzstellung:</b> Nebensatz mit „wenn“, danach „dann“ auf Position 1 des Hauptsatzes (Verb an Position 2).<br><b>Beispiel:</b> <i>Wenn die Lieferung nicht kommt, dann storniere ich die Bestellung.</i><br><b>Tipp:</b> „dann“ ist optional, macht die Folge aber klar — gut in Beschwerden."
tags = "konnektoren bedingung zweiteilig"

[[deck.card]]
front = "damit"
back = "<b>Funktion:</b> Ziel / Absicht, wenn die Subjekte verschieden sind.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Ich spreche langsam, damit du mich verstehst.</i><br><b>Tipp:</b> Gleiches Subjekt in beiden Teilen → besser „um … zu“."
tags = "konnektoren ziel subjunktion"

[[deck.card]]
front = "um … zu"
back = "<b>Funktion:</b> Ziel / Absicht bei gleichem Subjekt.<br><b>Satzstellung:</b> Infinitivkonstruktion: um + … + zu + Infinitiv am Satzende.<br><b>Beispiel:</b> <i>Ich lerne jeden Tag, um die Prüfung zu bestehen.</i><br><b>Tipp:</b> Kein eigenes Subjekt möglich: „um die Prüfung zu bestehen“ hat kein „ich“."
tags = "konnektoren ziel infinitiv"

[[deck.card]]
front = "sodass"
back = "<b>Funktion:</b> Folge einer Handlung oder eines Umstands.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Es regnete in Strömen, sodass das Fest ausfiel.</i><br><b>Tipp:</b> Wenn ein Adjektiv die Folge auslöst: „so … dass“ (so kalt, dass …)."
tags = "konnektoren folge subjunktion"

[[deck.card]]
front = "so … dass"
back = "<b>Funktion:</b> Folge mit Gradangabe (Adjektiv oder Adverb).<br><b>Satzstellung:</b> „so“ steht beim Adjektiv im Hauptsatz, „dass“ leitet den Nebensatz ein (Verb am Ende).<br><b>Beispiel:</b> <i>Es war so kalt, dass die Heizung ausfiel.</i><br><b>Tipp:</b> Nicht „so … sodass“ — entweder „so … dass“ oder „sodass“."
tags = "konnektoren folge subjunktion zweiteilig"

[[deck.card]]
front = "indem"
back = "<b>Funktion:</b> Mittel / Methode: auf welche Weise etwas geschieht.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Man lernt eine Sprache, indem man sie täglich benutzt.</i><br><b>Tipp:</b> Nicht für Ziele („damit“/„um zu“), sondern für das Wie."
tags = "konnektoren mittel subjunktion"

[[deck.card]]
front = "ohne dass / ohne … zu"
back = "<b>Funktion:</b> fehlende Begleitumstände.<br><b>Satzstellung:</b> „ohne dass“ + Nebensatz (Verb Ende) bei verschiedenem Subjekt; „ohne … zu“ + Infinitiv bei gleichem.<br><b>Beispiel:</b> <i>Er ging, ohne dass sie es merkte. / Er ging, ohne ein Wort zu sagen.</i><br><b>Tipp:</b> Häufiger Fehler: „ohne dass ich sage“ statt „ohne zu sagen“ bei gleichem Subjekt."
tags = "konnektoren infinitiv subjunktion"

[[deck.card]]
front = "anstatt dass / anstatt … zu"
back = "<b>Funktion:</b> Ersatz: das eine geschieht statt des anderen.<br><b>Satzstellung:</b> „anstatt dass“ + Nebensatz; „anstatt … zu“ + Infinitiv (gleiches Subjekt).<br><b>Beispiel:</b> <i>Er spielt, anstatt zu lernen.</i><br><b>Tipp:</b> Auch „statt“ möglich; im Schriftlichen „anstatt“."
tags = "konnektoren infinitiv subjunktion"

[[deck.card]]
front = "je … desto"
back = "<b>Funktion:</b> proportionale Steigerung: eins wächst mit dem anderen.<br><b>Satzstellung:</b> „je“ + Komparativ am Anfang des Nebensatzes (Verb am Ende), „desto“ + Komparativ auf Position 1 des Hauptsatzes (Verb an Position 2).<br><b>Beispiel:</b> <i>Je mehr ich übe, desto sicherer werde ich.</i><br><b>Tipp:</b> „desto“ und „umso“ sind austauschbar; nie „je … je“."
tags = "konnektoren steigerung zweiteilig"

[[deck.card]]
front = "einerseits … andererseits"
back = "<b>Funktion:</b> zwei Seiten einer Sache.<br><b>Satzstellung:</b> Zwei Hauptsätze; nach „einerseits“ und „andererseits“ steht das Verb an Position 2.<br><b>Beispiel:</b> <i>Einerseits ist der Job gut bezahlt, andererseits ist er sehr stressig.</i><br><b>Tipp:</b> Perfekt für die Argumentation im Aufsatz; im Brief eher „zum einen … zum anderen“."
tags = "konnektoren zweiteilig argumentation"

[[deck.card]]
front = "zum einen … zum anderen"
back = "<b>Funktion:</b> zwei Gesichtspunkte aufzählen.<br><b>Satzstellung:</b> Zwei Hauptsätze, Verb jeweils an Position 2.<br><b>Beispiel:</b> <i>Zum einen fehlt das Zertifikat, zum anderen war die Gruppe zu groß.</i><br><b>Tipp:</b> Im Brief die elegantere Variante von „einerseits … andererseits“."
tags = "konnektoren zweiteilig schreiben"

[[deck.card]]
front = "nicht nur … sondern auch"
back = "<b>Funktion:</b> Steigerung / Zusatz.<br><b>Satzstellung:</b> Zwei Hauptsätze oder zwei Satzteile; nach „sondern auch“ normale Wortstellung.<br><b>Beispiel:</b> <i>Ich brauche nicht nur das Zertifikat, sondern auch mehr Sicherheit beim Sprechen.</i><br><b>Tipp:</b> „sondern“ nur nach einer Verneinung oder Einschränkung (nicht nur …)."
tags = "konnektoren zweiteilig"

[[deck.card]]
front = "sowohl … als auch"
back = "<b>Funktion:</b> beides zusammen, ohne Steigerung.<br><b>Satzstellung:</b> Verbindet zwei gleichrangige Satzteile.<br><b>Beispiel:</b> <i>Sowohl die Lehrerin als auch die Gruppe waren gut.</i><br><b>Tipp:</b> Achtung Wortstellung: das Verb richtet sich nach dem zweiten Teil."
tags = "konnektoren zweiteilig"

[[deck.card]]
front = "entweder … oder"
back = "<b>Funktion:</b> Alternative: nur eins von beiden.<br><b>Satzstellung:</b> Zwei Hauptsätze oder Satzteile; Verb an Position 2.<br><b>Beispiel:</b> <i>Entweder wir treffen uns um acht, oder wir verschieben den Termin.</i><br><b>Tipp:</b> Nicht „entweder … oder aber“ — eins reicht."
tags = "konnektoren zweiteilig"

[[deck.card]]
front = "weder … noch"
back = "<b>Funktion:</b> beides verneint.<br><b>Satzstellung:</b> Verbindet zwei Satzteile; das Verb bleibt im Singular oder richtet sich nach dem letzten Teil.<br><b>Beispiel:</b> <i>Ich habe weder Zeit noch Geld.</i><br><b>Tipp:</b> Kein zusätzliches „nicht“ im Satz — „weder“ verneint schon."
tags = "konnektoren zweiteilig negation"

[[deck.card]]
front = "also (Folgerung)"
back = "<b>Funktion:</b> Folgerung / Zusammenfassung aus dem Gesagten.<br><b>Satzstellung:</b> Adverb → Position 1 oder mitten im Satz, Verb an Position 2.<br><b>Beispiel:</b> <i>Die Frist ist abgelaufen, also ist die Bewerbung nicht mehr gültig.</i><br><b>Tipp:</b> Nicht mit „also“ als Füllwort („also, ich meine …“) verwechseln — das gehört nicht in einen Brief."
tags = "konnektoren folge adverb"

[[deck.card]]
front = "außerdem"
back = "<b>Funktion:</b> Zusatz: noch ein Punkt kommt dazu.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Außerdem benötige ich eine Bestätigung für meinen Arbeitgeber.</i><br><b>Tipp:</b> Der Standard für den zweiten Punkt im Brief; nicht zweimal hintereinander verwenden."
tags = "konnektoren zusatz adverb schreiben"

[[deck.card]]
front = "darüber hinaus"
back = "<b>Funktion:</b> Zusatz, formeller als „außerdem“.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Darüber hinaus bitte ich um eine Bestätigung der Buchung.</i><br><b>Tipp:</b> Gut, um zwei formelle Punkte zu trennen."
tags = "konnektoren zusatz adverb schreiben"

[[deck.card]]
front = "des Weiteren"
back = "<b>Funktion:</b> Zusatz im Geschäftsstil.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Des Weiteren möchte ich wissen, ob die Kursgebühr das Material enthält.</i><br><b>Tipp:</b> Sehr formell; „des Weiteren“ wird getrennt geschrieben."
tags = "konnektoren zusatz adverb schreiben"

[[deck.card]]
front = "zunächst"
back = "<b>Funktion:</b> erster Punkt einer Aufzählung.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Zunächst möchte ich mich für Ihre schnelle Antwort bedanken.</i><br><b>Tipp:</b> Danach: „außerdem“, „darüber hinaus“, „schließlich“."
tags = "konnektoren reihenfolge adverb schreiben"

[[deck.card]]
front = "schließlich"
back = "<b>Funktion:</b> letzter Punkt oder abschließendes Argument.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Schließlich möchte ich Sie bitten, mir die Bestätigung zuzusenden.</i><br><b>Tipp:</b> Nicht „zum Schluss“ mit „schließlich“ (Bedeutung: am Ende / immerhin) verwechseln."
tags = "konnektoren reihenfolge adverb schreiben"

[[deck.card]]
front = "übrigens"
back = "<b>Funktion:</b> Nebenbemerkung, die nicht zum Hauptpunkt gehört.<br><b>Satzstellung:</b> Adverb → Position 1, Verb an Position 2.<br><b>Beispiel:</b> <i>Übrigens hat mir Ihre Kollegin bereits geholfen.</i><br><b>Tipp:</b> Im formellen Brief sparsam einsetzen — eher mündlich."
tags = "konnektoren zusatz adverb"

[[deck.card]]
front = "meiner Meinung nach"
back = "<b>Funktion:</b> eigene Meinung einleiten.<br><b>Satzstellung:</b> Position 1 → Verb an Position 2 (meiner Meinung nach IST das falsch).<br><b>Beispiel:</b> <i>Meiner Meinung nach ist die Kursgebühr zu hoch.</i><br><b>Tipp:</b> Nicht „meiner Meinung nach, dass …“ — danach folgt ein normaler Hauptsatz."
tags = "konnektoren meinung schreiben"

[[deck.card]]
front = "obgleich / obschon"
back = "<b>Funktion:</b> = obwohl, gehoben und schriftlich.<br><b>Satzstellung:</b> Subjunktion → Nebensatz, Verb am Ende.<br><b>Beispiel:</b> <i>Obgleich die Zeit knapp war, hat sie alle Punkte bearbeitet.</i><br><b>Tipp:</b> In Prüfungen ein Zeichen für Wortschatzbreite; Bedeutung identisch mit „obwohl“."
tags = "konnektoren gegensatz subjunktion schreiben"

