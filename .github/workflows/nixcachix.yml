name: nixcachix
on:
  push:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to build (or 'auto', 'all', or comma-separated names)"
        required: false
        default: "auto"
      shared_strategy:
        description: "Strategy when shared modules change (anchor=frieren, all=all active, none=host-only)"
        type: choice
        options:
          - anchor
          - all
          - none
        default: "anchor"

jobs:
  sops-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"
      - name: Check sops recipient drift
        continue-on-error: true
        run: bash scripts/task/sops-drift-check.sh --repo-only

  plan:
    runs-on: ubuntu-latest
    outputs:
      has_machines: ${{ steps.detect.outputs.has_machines }}
      affected_hosts: ${{ steps.detect.outputs.affected_hosts }}
      matrix: ${{ steps.detect.outputs.matrix }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Sync repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect affected hosts
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.host }}" != "auto" ]; then
            if [ "${{ inputs.host }}" = "all" ]; then
              python3 scripts/ci/detect-affected-hosts.py --ci --commit-msg "[ci all]"
            else
              python3 scripts/ci/detect-affected-hosts.py --ci --commit-msg "[ci ${{ inputs.host }}]"
            fi
          else
            python3 scripts/ci/detect-affected-hosts.py --ci \
              --shared-strategy "${{ inputs.shared_strategy || 'anchor' }}"
          fi

  build-machines:
    needs: plan
    if: needs.plan.outputs.has_machines == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Log Target
        run: echo "Building machine ${{ matrix.machine }} (reason: ${{ needs.plan.outputs.reason }})"

      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          overprovision-lvm: true
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /nix

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Sync repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          token: "${{ secrets.GH_PAT }}"

      - uses: cachix/cachix-action@v14
        with:
          name: shaoyanji
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false
          installCommand: nix profile install nixpkgs#cachix

      - run: nix build -L .?submodules=1#nixosConfigurations.${{ matrix.machine }}.config.system.build.toplevel
