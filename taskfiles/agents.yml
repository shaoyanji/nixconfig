version: "3"

tasks:
  agents:menu:
    desc: Interactive operator control plane menu (themed)
    cmds:
      - |
        choice=$(printf '%s\n' inventory "ssh & remotes" projects ops config browse help exit | gum choose --header "Operator control plane")
        case "$choice" in
          inventory) task dev:inventory:menu ;;
          "ssh & remotes") task agents:menu:ssh ;;
          projects) task agents:menu:projects ;;
          ops) task agents:menu:ops ;;
          config) task agents:menu:config ;;
          browse) task browse ;;
          help) task help ;;
          exit) exit 0 ;;
        esac

  agents:menu:ssh:
    desc: "Theme: SSH & remote hosts"
    cmds:
      - |
        choice=$(printf '%s\n' serv00 dragoncourt envs moto wishlist incus sudologinssh exit | gum choose --header "SSH & remote hosts")
        case "$choice" in
          serv00) task serv00:menu ;;
          dragoncourt) task dragoncourt:menu ;;
          envs) task envs:menu ;;
          moto) task moto:menu ;;
          wishlist|incus|sudologinssh) task "$choice" ;;
          exit) exit 0 ;;
        esac

  agents:menu:projects:
    desc: "Theme: apps & side projects"
    cmds:
      - |
        choice=$(printf '%s\n' apps bountystash exit | gum choose --header "Apps & projects")
        case "$choice" in
          apps) task apps:menu ;;
          bountystash) task bountystash:menu ;;
          exit) exit 0 ;;
        esac

  agents:menu:ops:
    desc: "Theme: system ops & maintenance"
    cmds:
      - |
        choice=$(printf '%s\n' rebuild check status deploy logs update load exit | gum choose --header "System ops")
        case "$choice" in
          load) task infra:load:menu ;;   # was a dead bare `load` entry
          rebuild|check|status|deploy|logs|update) task "$choice" ;;
          exit) exit 0 ;;
        esac

  agents:menu:config:
    desc: "Theme: configuration & secrets"
    cmds:
      - |
        choice=$(printf '%s\n' edit-config new exit | gum choose --header "Configuration & secrets")
        case "$choice" in
          edit-config|new) task "$choice" ;;
          exit) exit 0 ;;
        esac

  browse:
    desc: "[deprecated] Legacy browse menu - use direct commands"
    cmds:
      - |
        choice=$(printf '%s\n' browse-notes browse-internet browse-projects exit | gum choose)
        task "$choice"

  browse-notes:
    desc: Open quick notes
    cmds:
      - $EDITOR ~/Documents/Obsidian-Git-Sync/quicknote.md

  browse-internet:
    desc: Open browser search
    cmds:
      - zen https://duckduckgo.com

  browse-projects:
    desc: Open projects page
    cmds:
      - zen https://shaoyanji.github.io

  projects:
    desc: Alias for browse-projects
    cmds:
      - task browse-projects

  edit-config:
    desc: "[deprecated] Legacy edit-config menu - use infra:secrets:edit:* or direct file edits"
    cmds:
      - |
        choice=$(printf '%s\n' infra:secrets:edit:taskfile infra:secrets:edit:detaskfile infra:secrets:edit:apikeys infra:secrets:edit:secrets edit-global edit-sops edit-sops-config edit-home-manager edit-shell-config exit | gum choose)
        task "$choice"

  edit-global:
    desc: Edit global nix module
    cmds:
      - $EDITOR ./modules/global/global.nix

  edit-sops:
    desc: Edit .sops.yaml and update recipients
    cmds:
      - $EDITOR .sops.yaml
      - task infra:sops:update-keys

  edit-sops-config:
    desc: Edit sops Nix module config
    cmds:
      - $EDITOR ./modules/sops.nix

  edit-home-manager:
    desc: Edit canonical home role module
    cmds:
      - $EDITOR ./modules/roles/home.nix

  edit-shell-config:
    desc: Edit shell module defaults
    cmds:
      - $EDITOR ./modules/shell/default.nix

  update:
    desc: "[deprecated] Legacy update menu - use dev:git:* or dev:flake:* directly"
    cmds:
      - |
        choice=$(printf '%s\n' dev:git:ai-commit-push dev:git:quick-pull dev:flake:update-branch infra:sops:update-keys exit | gum choose)
        task "$choice"

  new:
    desc: "[deprecated] Legacy bootstrap menu - use infra:secrets:new:* directly"
    cmds:
      - |
        choice=$(printf '%s\n' infra:secrets:new:generate infra:secrets:new:copy-nas exit | gum choose)
        task "$choice"

  incus:
    desc: Launch and attach to a temporary NixOS Incus container
    cmds:
      - sudo incus launch "images:nixos/unstable" nixos -c security.nesting=true
      - sudo incus list
      - sudo incus console nixos

  sudologinssh:
    desc: Run a sudo-login command from encrypted server command list
    cmds:
      - ssh $(sops -d --extract '["server"]["commands"]' {{.SECRETS}}/{{.ENC_SECRETS}} | gum choose)

