# ==============================================================================
# closure-budgets.toml — DYNAMIC per-host closure budgets (HC-4)
# ==============================================================================
# WHAT IS BUDGETED: a host's total closure size — the sum of every path's nar
# size in `nix path-info --recursive /run/current-system`, i.e. exactly the value
# `task dev:closure:size HOST=<host>` prints. It is NOT on-disk size: hard links
# and shared store paths make real disk usage smaller than this sum.
#
# HOW THE BUDGET IS COMPUTED (dynamic):
#
#     budget = baseline_bytes * (1 + headroom_pct/100)
#
# `baseline_bytes` is measured, never typed. Adopt a host's current closure:
#
#     task dev:closure:budget:adopt HOST=<host>     # or HOST=local
#
# which rewrites the managed `# >>> baseline` block at the bottom of this file.
# That is the whole ratchet: debloat → deploy → adopt → the smaller closure is
# now the ceiling. No byte counts are hand-maintained, so a stale number cannot
# silently make the gate meaningless (measured 2026-10-17: a hand-written 34.9
# GiB ceiling sat 5.0 GiB above a 29.9 GiB closure).
#
# HOW IT IS ADJUSTED:
#   * `headroom_pct` — global in [defaults], per host under [hosts.<h>].
#     Convention: 1.0% absorbs package byte drift across a flake.lock bump while
#     still tripping on a new package of consequence.
#   * `bytes` — an absolute pin for a host that wins over baseline+headroom
#     (use when the ceiling is a policy decision, not a measurement).
#   * `HEADROOM_PCT=<n>` in the environment — one-off check at a different
#     headroom without touching the file:
#         HEADROOM_PCT=0 task checks:closure:budget HOST=frieren
#
# HOW IT IS CHECKED: `task checks:closure:budget` exits non-zero when a host's
# measured closure exceeds its budget. `HOST=<host>` checks one host, `ALL=1`
# checks every host with a baseline/pin. A host with no entry is reported NOT
# BUDGETED (never as a pass); an unreachable host is skipped with a notice.
#
# A budget is a RATCHET: adopt after every intentional cut, and raise it only
# deliberately, in its own commit.
# ==============================================================================
[defaults]
# Global headroom; per-host values under [hosts.<h>] override this.
headroom_pct = 1.0

[hosts.frieren]
# Central NAS + service host — the fleet's reference closure and the host the
# debloat work (docs/closure-reduction.md) is measured against.
# Policy only: the measurement lives in the managed baseline block below.
headroom_pct = 1.0
# Uncomment to pin an absolute ceiling instead of baseline+headroom:
# bytes = 33000000000

# >>> baseline (managed by `task dev:closure:budget:adopt` — do not edit)
[hosts.frieren.baseline]
bytes = 31873529880
measured_on = "2026-10-21"

# <<< baseline
