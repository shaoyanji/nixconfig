[[deck]]
id = 1700000003
name = "Deutsch::B2::Schreiben (telc)"
tags = ["telc-b2", "b2"]

[[deck.card]]
front = "Wie ist ein telc-B2-Brief aufgebaut? (5 Teile)"
back = "<b>1. Anrede:</b> Sehr geehrte Damen und Herren, / Sehr geehrte Frau …, / Sehr geehrter Herr …, (Komma, danach klein weiter)<br><b>2. Einleitung:</b> Bezug herstellen — Grund des Schreibens in einem Satz.<br><b>3. Hauptteil:</b> alle Punkte der Aufgabe, jeder in einem eigenen Absatz, mit Konnektoren verbunden.<br><b>4. Schluss:</b> Forderung, Bitte oder Ergebnis + Frist.<br><b>5. Grußformel:</b> Mit freundlichen Grüßen + Name (kein Komma nach der Grußformel).<br><br>Zeit im Examen: etwa 30 Minuten für 150–180 Wörter. Erst die fünf Punkte der Aufgabe als Stichworte notieren, dann schreiben."
tags = "schreiben aufbau pruefung"

[[deck.card]]
front = "Formelle Anrede und Grußformel — was ist richtig?"
back = "<b>Anrede:</b> „Sehr geehrte Damen und Herren,“ — wenn der Name unbekannt ist.<br>„Sehr geehrte Frau Berger,“ / „Sehr geehrter Herr Berger,“ — wenn der Name bekannt ist.<br>Nach der Anrede klein weiterschreiben, weil das Komma den Satz fortsetzt.<br><b>Gruß:</b> „Mit freundlichen Grüßen“ — danach kein Komma, dann der Name in der nächsten Zeile.<br>Nicht: „Hallo“, „Liebe Grüße“, „Bis bald“ — das ist privat, nicht formell.<br><b>Nie:</b> „Sehr geehrte Damen und Herren!“ mit Ausrufezeichen."
tags = "schreiben anrede redemittel"

[[deck.card]]
front = "Einleitung: Wie stellst du den Bezug her? (Redemittel)"
back = "„ich schreibe Ihnen bezüglich …“<br>„ich beziehe mich auf Ihre Anzeige / Ihre E-Mail vom …“<br>„vielen Dank für Ihre schnelle Antwort vom …“<br>„ich habe auf Ihrer Website gelesen, dass …“<br>„leider muss ich Ihnen mitteilen, dass …“ (Beschwerde)<br>„ich interessiere mich für … und hätte dazu einige Fragen.“ (Anfrage)"
tags = "schreiben redemittel einleitung"

[[deck.card]]
front = "Beschwerde: Redemittel für den Hauptteil"
back = "„Leider muss ich Ihnen mitteilen, dass …“<br>„Ich bin mit … nicht zufrieden.“<br>„Das entspricht nicht der Beschreibung / der Absprache.“<br>„Obwohl Sie … zugesagt hatten, …“<br>„Hinzu kommt, dass …“<br>„Außerdem war / fehlte / wurde …“<br>„Ich habe Sie bereits am … darauf hingewiesen.“"
tags = "schreiben redemittel beschwerde"

[[deck.card]]
front = "Anfrage: Redemittel für den Hauptteil"
back = "„Ich würde gern wissen, ob …“<br>„Könnten Sie mir bitte mitteilen, wie / wann / ob …“<br>„Außerdem interessiert mich, ob …“<br>„Darüber hinaus wäre wichtig zu wissen, ob …“<br>„Bitte senden Sie mir …“<br>„Für eine kurze Rückmeldung wäre ich dankbar.“"
tags = "schreiben redemittel anfrage"

[[deck.card]]
front = "Schluss: Forderung und Frist formulieren"
back = "„Ich erwarte daher, dass …“<br>„Ich bitte Sie, mir … zu erstatten / zuzusenden.“<br>„Ich bitte um eine Antwort bis zum …“<br>„Sollte ich bis dahin nichts hören, werde ich …“ (nur androhen, wenn es zur Situation passt)<br>„Ich hoffe, dass sich die Angelegenheit unkompliziert lösen lässt.“<br><br>Immer höflich bleiben: Konjunktiv II („ich würde“, „könnten Sie“) nimmt die Schärfe heraus."
tags = "schreiben redemittel schluss"

[[deck.card]]
front = "Höflichkeit: Konjunktiv II im Brief (Beispiele)"
back = "„Könnten Sie mir bitte … mitteilen?“ (nicht: „Können Sie …“)<br>„Ich würde mich über eine Antwort freuen.“<br>„Es wäre hilfreich, wenn Sie …“<br>„Ich hätte noch eine Frage.“<br>„Wäre es möglich, den Termin zu verschieben?“<br><br>Der Konjunktiv II macht aus einer Forderung eine Bitte — im Examen ein Plus."
tags = "schreiben grammatik konjunktiv"

[[deck.card]]
front = "Welche Konnektoren heben einen formellen Brief? (Ersatz für „und“, „aber“, „auch“)"
back = "„und“ → <i>außerdem, darüber hinaus, des Weiteren, zudem</i><br>„aber“ → <i>allerdings, jedoch, dennoch, hingegen</i><br>„weil“ → <i>da, zumal, aufgrund (des/der)</i><br>„deshalb“ → <i>daher, aus diesem Grund, folglich</i><br>„wenn“ → <i>falls, sofern</i><br>„zum Beispiel“ → <i>beispielsweise, etwa</i><br><br>Zwei bis drei solcher Wörter genügen; wer jedes „und“ ersetzt, schreibt unnatürlich."
tags = "schreiben konnektoren redemittel"

[[deck.card]]
front = "Typische Fehler im B2-Brief (3 Klassiker)"
back = "<b>1. Verbletztstellung nach „denn“/„deshalb“:</b> falsch „…, deshalb ich habe …“ — richtig „…, deshalb habe ich …“.<br><b>2. Umgangssprache:</b> „Hallo“, „Ich wollte mal fragen“ → „Sehr geehrte …“, „ich würde gern wissen“.<br><b>3. Punkt der Aufgabe vergessen:</b> Die Aufgabe nennt meist vier Inhaltspunkte. Wer einen auslässt, verliert Punkte — erst alle notieren, dann schreiben.<br><br>Prüfe am Ende drei Dinge: alle Punkte drin? Anrede und Grußformel formell? Verb an Position 2 nach Konnektoren?"
tags = "schreiben fehler pruefung"

[[deck.card]]
front = "Aufgabe (Beschwerde): Deutschkurs\nSie haben einen vierwöchigen Intensivkurs B2 gebucht und im Voraus bezahlt (680 €). Die Gruppe war viel größer als zugesagt, der Raum wurde zweimal gewechselt, die Lehrkraft dreimal, das Zertifikat fehlt. Schreiben Sie eine Beschwerde: nennen Sie die Probleme, sagen Sie, was Sie erwarten, setzen Sie eine Frist."
back = "Sehr geehrte Damen und Herren,<br><br>ich schreibe Ihnen bezüglich des Intensivkurses Deutsch B2, den ich am 5. Oktober bei Ihnen gebucht und vollständig bezahlt habe (Rechnung Nr. 4471, 680 €).<br><br>Leider muss ich Ihnen mitteilen, dass der Kurs nicht der Beschreibung entsprach. Obwohl Sie eine Gruppe von höchstens zehn Teilnehmern zugesagt hatten, saßen wir ab der zweiten Woche zu achtzehn im Raum. Außerdem wurde der Unterricht zweimal kurzfristig verlegt, sodass jeweils fast eine Stunde verloren ging. Darüber hinaus wechselte die Lehrkraft dreimal; da jede Person anders unterrichtete, fehlte uns der rote Faden. Hinzu kommt, dass das zugesagte Zertifikat bis heute nicht ausgestellt wurde.<br><br>Ich habe den Kurs zwar bis zum Ende besucht, bin mit dem Ergebnis jedoch nicht zufrieden. Ich erwarte daher eine Teilerstattung von mindestens 40 Prozent sowie die Zusendung des Zertifikats bis zum 30. November. Sollte ich bis dahin keine Antwort erhalten, werde ich mich an die Verbraucherzentrale wenden.<br><br>Mit freundlichen Grüßen<br>Matt Ji<br><br><i>Konnektoren im Text: obwohl, sodass, da, zwar … jedoch, daher, sowie. Alle vier Inhaltspunkte sind abgedeckt, die Frist steht im letzten Absatz.</i>"
tags = "schreiben modell beschwerde"

[[deck.card]]
front = "Aufgabe (Anfrage): Intensivkurs\nSie möchten im Januar einen Intensivkurs B2 in Berlin machen und danach die Prüfung telc B2 ablegen. Fragen Sie nach: Kursgebühr und Material, Unterrichtszeiten, Unterkunft, Prüfungsvorbereitung, Einstufungstest."
back = "Sehr geehrte Damen und Herren,<br><br>ich habe Ihre Anzeige für Intensivkurse Deutsch B2 auf Ihrer Website gelesen und interessiere mich für den Kurs im Januar.<br><br>Für meine Planung benötige ich noch einige Informationen. Zunächst würde ich gern wissen, wie hoch die Kursgebühr ist und ob die Lehrmaterialien darin enthalten sind. Außerdem interessiert mich, ob der Unterricht vormittags oder nachmittags stattfindet, da ich parallel halbtags arbeite. Darüber hinaus möchte ich erfahren, ob Sie Zimmer in einer Wohngemeinschaft vermitteln und mit welchen Kosten ich dabei rechnen muss. Da ich im März die Prüfung telc B2 ablegen möchte, wäre es wichtig zu wissen, ob der Kurs gezielt darauf vorbereitet. Schließlich bitte ich um Auskunft, ob ein Einstufungstest erforderlich ist und wann dieser stattfindet.<br><br>Ich würde mich über eine ausführliche Antwort bis Ende der Woche sehr freuen. Vielen Dank im Voraus.<br><br>Mit freundlichen Grüßen<br>Matt Ji<br><br><i>Konnektoren im Text: zunächst, außerdem, darüber hinaus, da, schließlich. Fünf Fragen, jede in einem eigenen Satz — so ist keine vergessen.</i>"
tags = "schreiben modell anfrage"

[[deck.card]]
front = "Aufgabe (halbformell): Heizung defekt\nSeit einer Woche funktioniert die Heizung in Ihrer Wohnung nicht, Ihr Vermieter reagiert nicht auf Anrufe. Schreiben Sie: das Problem, die Folgen, was Sie verlangen, eine Frist."
back = "Sehr geehrter Herr Berger,<br><br>ich schreibe Ihnen wegen der Heizung in meiner Wohnung (Kaiserstraße 14, 2. OG). Seit dem 28. Oktober bleibt sie kalt, obwohl ich Sie in dieser Woche dreimal angerufen und einmal per E-Mail informiert habe.<br><br>Da die Temperaturen nachts bereits unter fünf Grad liegen, ist die Wohnung morgens kaum zu beheizen; inzwischen bin ich erkältet und arbeite von zu Hause, was unter diesen Bedingungen schwierig ist. Ich habe einen Handwerker kommen lassen, der jedoch feststellte, dass der Fehler an der zentralen Anlage liegt und nicht von mir behoben werden kann.<br><br>Ich bitte Sie daher, die Reparatur bis zum 8. November zu veranlassen. Sollte bis dahin nichts geschehen, werde ich die Miete mindern und mir gegebenenfalls rechtlichen Rat holen. Ich hoffe jedoch, dass sich die Angelegenheit unkompliziert lösen lässt, und erwarte Ihre Rückmeldung bis Freitag.<br><br>Mit freundlichen Grüßen<br>Matt Ji<br><br><i>Halbformell: Anrede mit Namen, aber sachlich. „obwohl“, „da“, „jedoch“, „daher“ tragen die Argumentation; die Androhung steht im Konjunktiv-Umfeld („werde … holen“).</i>"
tags = "schreiben modell beschwerde"

[[deck.card]]
front = "Schreibübung 1 (Beschwerde): Reise\nSie haben eine Städtereise gebucht: Das Hotel lag außerhalb der Stadt, das Zimmer war nicht das gebuchte, der versprochene Stadtrundgang fiel aus. Schreiben Sie eine Beschwerde mit Forderung und Frist (150–180 Wörter)."
back = "<b>Erwartungshorizont:</b> formelle Anrede · Bezug (Buchungsnummer, Datum) · drei Probleme mit Konnektoren (obwohl, außerdem, hinzu kommt, sodass) · Forderung (Teilerstattung / Gutschein) · Frist · Grußformel.<br><b>Redemittel:</b> „Leider entsprach die Reise nicht der Beschreibung.“ / „Obwohl im Katalog ein zentrales Hotel stand, …“ / „Ich erwarte daher …“ / „Ich bitte um eine Antwort bis zum …“<br><b>Musteranfang:</b> „Sehr geehrte Damen und Herren, ich schreibe Ihnen bezüglich der Städtereise nach Prag vom 12. bis 15. Oktober (Buchung Nr. 88213). Leider muss ich Ihnen mitteilen, dass die Reise in mehreren Punkten nicht der Beschreibung entsprach.“"
tags = "schreiben uebung beschwerde"

[[deck.card]]
front = "Schreibübung 2 (Anfrage): Praktikum\nSie haben eine Anzeige für ein Praktikum im Marketing gelesen. Fragen Sie nach Dauer und Beginn, Aufgaben, Bezahlung, Arbeitszeiten und Bewerbungsunterlagen (150–180 Wörter)."
back = "<b>Erwartungshorizont:</b> Anrede · Bezug auf die Anzeige · fünf konkrete Fragen, jede mit eigenem Konnektor (zunächst, außerdem, darüber hinaus, des Weiteren, schließlich) · höflicher Schluss mit Rückmeldewunsch · Grußformel.<br><b>Redemittel:</b> „Ich habe Ihre Anzeige … gelesen und interessiere mich für …“ / „Könnten Sie mir bitte mitteilen, ob …“ / „Für eine kurze Rückmeldung wäre ich dankbar.“<br><b>Musteranfang:</b> „Sehr geehrte Frau Weber, ich habe Ihre Anzeige für ein Praktikum im Marketing auf Ihrer Website gelesen und interessiere mich sehr dafür. Da ich mein Studium im März abschließe, suche ich ein Praktikum ab April.“"
tags = "schreiben uebung anfrage"

[[deck.card]]
front = "Wie viele Wörter und wie viel Zeit im schriftlichen Teil?"
back = "telc B2, Schriftlicher Ausdruck: eine Aufgabe (Brief oder E-Mail), <b>ca. 150–180 Wörter</b> in <b>etwa 30 Minuten</b>.<br>Weniger als 120 Wörter wirken dünn; mehr als 200 kostet Zeit, die im Leseverstehen fehlt.<br><b>Ablauf:</b> 3 Minuten Stichworte zu jedem Aufgabenpunkt → 20 Minuten schreiben → 5 Minuten prüfen (Punkte, Verbstellung, Anrede/Gruß).<br>Zählen muss man nicht: 150 Wörter sind ungefähr eine handschriftliche Seite mit vier Absätzen."
tags = "schreiben pruefung plan"

[[deck.card]]
front = "7-Tage-Plan bis zur telc-B2-Prüfung (Schreiben)"
back = "<b>Tag 1–2:</b> Konnektoren-Deck, 20 neue Karten pro Tag. Zusätzlich je 10 Karten „Konnektoren üben“.<br><b>Tag 3:</b> Beschwerde-Modell abschreiben (von Hand), danach aus dem Gedächtnis die Struktur aufschreiben.<br><b>Tag 4:</b> Anfrage-Modell abschreiben; danach Schreibübung 1 in 30 Minuten ohne Vorlage.<br><b>Tag 5:</b> Schreibübung 2 in 30 Minuten; Fehler markieren und die betroffenen Konnektor-Karten wiederholen.<br><b>Tag 6:</b> Beide Modelle laut lesen, Konnektoren im Text unterstreichen; Konnektoren-Deck komplett.<br><b>Tag 7:</b> Eine neue Aufgabe aus dem Kopf schreiben, nur Stichworte und Redemittel als Hilfe."
tags = "schreiben plan pruefung"
